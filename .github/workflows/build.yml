name: Build BG7n GKI 5.10.237 + KernelSU + SUSFS v2.2.0

on:
  workflow_dispatch:
    inputs:
      susfs_ref:
        description: "Pinned SUSFS commit for gki-android12-5.10"
        required: false
        default: "be08face56c347e7ba9c4fb420c2463598a14f5d"

      make_jobs:
        description: "Kernel build jobs"
        required: false
        default: "4"

      boot_release_tag:
        description: "Release tag containing the stock BG7n boot.img.zip"
        required: false
        default: "stock-boot"

permissions:
  contents: read

concurrency:
  group: bg7n-${{ github.ref }}
  cancel-in-progress: true

env:
  # ==============================================================
  # DEVICE
  # ==============================================================

  DEVICE: BG7n
  ARCH: arm64

  # ==============================================================
  # GOOGLE GKI
  #
  # Android 12 / Linux 5.10
  # Google release:
  # android12-5.10-2025-06_r3
  # Linux 5.10.237
  # ==============================================================
  
  GKI_MANIFEST_BRANCH: common-android12-5.10-2025-06
  GKI_COMMON_TAG: android12-5.10-2025-06_r3
  GKI_VERSION: "5.10.237"
  GKI_SHA: d09ef2e980e0974a0d6dfe762e29fff118db7f46

  # ==============================================================
  # OFFICIAL KERNELSU
  #
  # This is the official KernelSU repository.
  #
  # The SUSFS v2.2.0 patch is synchronized with this KernelSU
  # development point.
  # ==============================================================

  KSU_REPO: https://github.com/tiann/KernelSU.git
  KSU_COMMIT: dbff91c2dde8893af950137828398d41dd6b7047

  # ==============================================================
  # SUSFS
  # ==============================================================

  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git

  # ==============================================================
  # STOCK BOOT
  # ==============================================================

  BOOT_REPO: whmyjda97-lab/tecno20c

jobs:

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # 01 - CHECKOUT BUILD KIT
      # ============================================================

      - name: 01 - Checkout build kit
        uses: actions/checkout@v4

      # ============================================================
      # 02 - HOST DEPENDENCIES
      # ============================================================

      - name: 02 - Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            curl \
            device-tree-compiler \
            dwarves \
            file \
            flex \
            gawk \
            gh \
            git \
            gnupg \
            gperf \
            jq \
            libdw-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5-dev \
            libssl-dev \
            libunwind-dev \
            lld \
            llvm \
            lz4 \
            openssl \
            pahole \
            pkg-config \
            python3 \
            rsync \
            unzip \
            zip \
            android-sdk-libsparse-utils

          echo "=========================================="
          echo "HOST TOOLCHAIN"
          echo "=========================================="

          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-nm --version
          python3 --version
          git --version
          gh --version

      # ============================================================
      # 03 - ANDROID NDK
      # ============================================================

      - name: 03 - Install Android NDK r25b
        shell: bash
        run: |
          set -euxo pipefail

          NDK_VERSION="25.2.9519653"
          NDK_ARCHIVE="android-ndk-r25b-linux.zip"

          SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          NDK_ROOT="${SDK_ROOT}/ndk/${NDK_VERSION}"

          rm -rf \
            "${SDK_ROOT}" \
            "${RUNNER_TEMP}/android-ndk"

          mkdir -p \
            "${SDK_ROOT}/ndk" \
            "${RUNNER_TEMP}/android-ndk"

          curl -fL \
            "https://dl.google.com/android/repository/${NDK_ARCHIVE}" \
            -o "${RUNNER_TEMP}/${NDK_ARCHIVE}"

          unzip -q \
            "${RUNNER_TEMP}/${NDK_ARCHIVE}" \
            -d "${RUNNER_TEMP}/android-ndk"

          test -d \
            "${RUNNER_TEMP}/android-ndk/android-ndk-r25b"

          mv \
            "${RUNNER_TEMP}/android-ndk/android-ndk-r25b" \
            "${NDK_ROOT}"

          test -x \
            "${NDK_ROOT}/ndk-build"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${NDK_ROOT}" >> "${GITHUB_ENV}"

          echo "${NDK_ROOT}" >> "${GITHUB_PATH}"

          "${NDK_ROOT}/ndk-build" --version

      # ============================================================
      # 04 - STOCK BOOT
      # ============================================================

      - name: 04 - Fetch exact stock BG7n boot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOT_RELEASE_TAG: ${{ inputs.boot_release_tag }}
        run: |
          set -euo pipefail

          rm -rf stock-release stock
          mkdir -p stock-release stock

          echo "=========================================="
          echo "STOCK BOOT RELEASE"
          echo "=========================================="

          gh release view \
            "${BOOT_RELEASE_TAG}" \
            --repo "${BOOT_REPO}" \
            --json tagName,name,assets \
            --jq '.tagName + " | " + .name + " | assets=" + ((.assets|length)|tostring)'

          gh release download \
            "${BOOT_RELEASE_TAG}" \
            --repo "${BOOT_REPO}" \
            --dir stock-release

          CANDIDATES=()

          while IFS= read -r -d '' z; do

            mapfile -t ENTRIES < <(
              unzip -Z1 "$z" 2>/dev/null |
              grep -Ei '(^|/)boot\.img$' ||
              true
            )

            if [ "${#ENTRIES[@]}" -eq 1 ]; then
              CANDIDATES+=("$z")

              echo "Boot candidate:"
              echo "  ZIP:    $z"
              echo "  MEMBER: ${ENTRIES[0]}"
            fi

          done < <(
            find stock-release \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              -print0
          )

          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ZIP containing exactly one boot.img."
            echo "Found: ${#CANDIDATES[@]}"

            printf '%s\n' \
              "${CANDIDATES[@]:-<none>}"

            exit 1
          fi

          BOOT_ASSET="${CANDIDATES[0]}"

          mapfile -t BOOT_ENTRIES < <(
            unzip -Z1 "${BOOT_ASSET}" |
            grep -Ei '(^|/)boot\.img$'
          )

          unzip -p \
            "${BOOT_ASSET}" \
            "${BOOT_ENTRIES[0]}" \
            > stock/boot.img

          test -s stock/boot.img

          echo
          echo "Stock boot:"
          file stock/boot.img

          echo
          echo "Stock boot SHA256:"
          sha256sum stock/boot.img | tee stock/boot.sha256

      # ============================================================
      # 05 - STOCK DEFCONFIG
      # ============================================================

      - name: 05 - Verify BG7n stock defconfig
        shell: bash
        run: |
          set -euxo pipefail

          test -s BG7n_stock_defconfig

          echo "=========================================="
          echo "STOCK DEFCONFIG SHA256"
          echo "=========================================="

          sha256sum BG7n_stock_defconfig

          echo
          echo "=========================================="
          echo "STOCK CONFIG FACTS"
          echo "=========================================="

          grep -E \
            '^CONFIG_(ARM64_4K_PAGES|ARM64_16K_PAGES|ARM64_64K_PAGES|ARM64_VA_BITS_[0-9]+|ARM64_PA_BITS_[0-9]+|LTO_NONE|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|CFI_CLANG|CFI_PERMISSIVE|CFI_CLANG_SHADOW|SHADOW_CALL_STACK|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS)=' \
            BG7n_stock_defconfig || true

      # ============================================================
      # 06 - REPO TOOL
      # ============================================================

      - name: 06 - Install repo tool
        shell: bash
        run: |
          set -euxo pipefail

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o repo

          chmod +x repo

          sudo install \
            -m 0755 \
            repo \
            /usr/local/bin/repo

          repo --version

      # ============================================================
      # 07 - GOOGLE GKI SOURCE
      # ============================================================

      - name: 07 - Sync Google GKI r3 source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf gki

          mkdir -p gki

          cd gki

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${GKI_MANIFEST_BRANCH}" \
            --depth=1

          repo sync \
            -c \
            -j2 \
            --no-tags \
            --no-clone-bundle

          test -d common
          test -f common/Makefile

          echo "=========================================="
          echo "FETCH EXACT COMMON TAG"
          echo "=========================================="

          git -C common fetch \
            --no-tags \
            https://android.googlesource.com/kernel/common.git \
            "refs/tags/${GKI_COMMON_TAG}:refs/tags/${GKI_COMMON_TAG}"

          git -C common checkout \
            --detach \
            "refs/tags/${GKI_COMMON_TAG}"

          COMMON_COMMIT="$(git -C common rev-parse HEAD)"

          echo "Expected:"
          echo "${GKI_SHA}"

          echo
          echo "Actual:"
          echo "${COMMON_COMMIT}"

          test "${COMMON_COMMIT}" = "${GKI_SHA}"

          echo
          echo "Kernel version:"

          test \
            "$(make -s -C common kernelversion)" = \
            "${GKI_VERSION}"

          repo manifest -r > manifest.lock.xml

          cat > ../gki_identity.txt <<EOF
          GKI_MANIFEST_BRANCH=${GKI_MANIFEST_BRANCH}
          GKI_COMMON_TAG=${GKI_COMMON_TAG}
          GKI_VERSION=${GKI_VERSION}
          GKI_SHA=${GKI_SHA}
          COMMON_COMMIT=${COMMON_COMMIT}
          EOF

      # ============================================================
      # 08 - GOOGLE LLVM
      # ============================================================

      - name: 08 - Select Google LLVM toolchain
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          CLANG_PREBUILT_BIN="$(
            awk -F= '
              /^CLANG_PREBUILT_BIN=/ {
                print $2
                exit
              }
            ' common/build.config.common
          )"

          test -n "${CLANG_PREBUILT_BIN}"

          GKI_CLANG_BIN="${PWD}/${CLANG_PREBUILT_BIN}"

          test -x "${GKI_CLANG_BIN}/clang"
          test -x "${GKI_CLANG_BIN}/ld.lld"
          test -x "${GKI_CLANG_BIN}/llvm-ar"
          test -x "${GKI_CLANG_BIN}/llvm-nm"

          echo "GKI_CLANG_BIN=${GKI_CLANG_BIN}" \
            >> "${GITHUB_ENV}"

          echo "LLVM=1" \
            >> "${GITHUB_ENV}"

          echo "LLVM_IAS=1" \
            >> "${GITHUB_ENV}"

          echo "${GKI_CLANG_BIN}" \
            >> "${GITHUB_PATH}"

          echo "=========================================="
          echo "GOOGLE CLANG"
          echo "=========================================="

          "${GKI_CLANG_BIN}/clang" --version
          "${GKI_CLANG_BIN}/ld.lld" --version
          "${GKI_CLANG_BIN}/llvm-ar" --version
          "${GKI_CLANG_BIN}/llvm-nm" --version

      # ============================================================
      # 09 - KERNELSU
      # ============================================================

      - name: 09 - Clone official KernelSU
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          rm -rf KernelSU

          git clone \
            --no-tags \
            --filter=blob:none \
            "${KSU_REPO}" \
            KernelSU

          git -C KernelSU fetch \
            --no-tags \
            origin \
            "${KSU_COMMIT}"

          git -C KernelSU checkout \
            --detach \
            "${KSU_COMMIT}"

          ACTUAL_KSU_COMMIT="$(
            git -C KernelSU rev-parse HEAD
          )"

          test \
            "${ACTUAL_KSU_COMMIT}" = \
            "${KSU_COMMIT}"

          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Kbuild

          echo "=========================================="
          echo "KERNELSU"
          echo "=========================================="

          git -C KernelSU log \
            -1 \
            --oneline \
            --decorate

          {
            echo "KERNELSU_REPO=${KSU_REPO}"
            echo "KERNELSU_COMMIT=${ACTUAL_KSU_COMMIT}"
          } | tee ../kernelsu_identity.txt

      # ============================================================
      # 10 - SUSFS
      # ============================================================

      - name: 10 - Clone and verify SUSFS
        shell: bash
        working-directory: gki
        env:
          SUSFS_REF: ${{ inputs.susfs_ref }}
        run: |
          set -euxo pipefail

          rm -rf susfs

          git clone \
            --no-tags \
            --filter=blob:none \
            "${SUSFS_REPO}" \
            susfs

          git -C susfs fetch \
            --no-tags \
            origin \
            "${SUSFS_REF}"

          git -C susfs checkout \
            --detach \
            "${SUSFS_REF}"

          SUSFS_COMMIT="$(
            git -C susfs rev-parse HEAD
          )"

          test \
            "${SUSFS_COMMIT}" = \
            "${SUSFS_REF}"

          test -f \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          test -f \
            susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          test -d \
            susfs/kernel_patches/fs

          test -d \
            susfs/kernel_patches/include/linux

          test -f \
            susfs/ksu_module_susfs/module.prop

          echo "=========================================="
          echo "SUSFS IDENTITY"
          echo "=========================================="

          git -C susfs log \
            -1 \
            --oneline \
            --decorate

          echo
          echo "module.prop:"

          cat \
            susfs/ksu_module_susfs/module.prop

          grep -Eq \
            '^version=v?2\.2\.0($|[.-])' \
            susfs/ksu_module_susfs/module.prop

          {
            echo "SUSFS_REPO=${SUSFS_REPO}"
            echo "SUSFS_COMMIT=${SUSFS_COMMIT}"
          } | tee ../susfs_identity.txt

      # ============================================================
      # 11 - APPLY SUSFS
      # ============================================================

      - name: 11 - Apply official SUSFS patches
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "COPY SUSFS PATCH FILES"
          echo "=========================================="

          cp \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            KernelSU/

          cp \
            susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            common/

          cp -a \
            susfs/kernel_patches/fs/. \
            common/fs/

          cp -a \
            susfs/kernel_patches/include/linux/. \
            common/include/linux/

          echo "=========================================="
          echo "PATCH KERNELSU"
          echo "=========================================="

          (
            cd KernelSU

            patch \
              --batch \
              --forward \
              -p1 \
              < 10_enable_susfs_for_ksu.patch
          )

          echo "=========================================="
          echo "PATCH GKI"
          echo "=========================================="

          (
            cd common

            patch \
              --batch \
              --forward \
              -p1 \
              < 50_add_susfs_in_gki-android12-5.10.patch
          )

          echo
          echo "KernelSU changes:"
          git -C KernelSU status --short

          echo
          echo "GKI changes:"
          git -C common status --short

      # ============================================================
      # 12 - KERNELSU INTEGRATION
      # ============================================================

      - name: 12 - Integrate KernelSU into drivers
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Kbuild

          rm -rf \
            common/drivers/kernelsu

          KSU_RELATIVE="$(
            realpath \
              --relative-to=common/drivers \
              KernelSU/kernel
          )"

          ln -s \
            "${KSU_RELATIVE}" \
            common/drivers/kernelsu

          test -L \
            common/drivers/kernelsu

          test -f \
            common/drivers/kernelsu/Kconfig

          test -f \
            common/drivers/kernelsu/Kbuild

          if ! grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            common/drivers/Makefile
          then
            printf '%s\n' \
              'obj-$(CONFIG_KSU) += kernelsu/' \
              >> common/drivers/Makefile
          fi

          if ! grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            common/drivers/Kconfig
          then

            python3 - <<'PY'
          from pathlib import Path

          p = Path("common/drivers/Kconfig")

          text = p.read_text()

          source = 'source "drivers/kernelsu/Kconfig"\n'

          if source not in text:
              pos = text.rfind("endmenu")

              if pos < 0:
                  raise SystemExit(
                      "ERROR: drivers/Kconfig has no endmenu"
                  )

              text = (
                  text[:pos]
                  + source
                  + "\n"
                  + text[pos:]
              )

              p.write_text(text)
          PY
          fi

          grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            common/drivers/Kconfig

          grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            common/drivers/Makefile

          grep -Rqs \
            '^config[[:space:]]\+KSU\([[:space:]]\|$\)' \
            common/drivers/kernelsu

          grep -Rqs \
            '^config[[:space:]]\+KSU_SUSFS\([[:space:]]\|$\)' \
            common/drivers/kernelsu

          echo
          echo "KernelSU integration PASSED."

      # ============================================================
      # 13 - CLEAN GENERATED CONFIG
      # ============================================================

      - name: 13 - Clean generated configuration
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          rm -f \
            .config \
            defconfig

          rm -rf \
            include/config \
            include/generated \
            arch/arm64/include/generated

          test ! -f .config
          test ! -f defconfig

      # ============================================================
      # 14 - CREATE DEVICE DEFCONFIG
      #
      # IMPORTANT:
      #
      # We DO NOT inherit build.config.gki.aarch64.
      #
      # That file enables Google's ABI/KMI certification machinery.
      # This custom kernel is not a certified GKI binary because
      # KernelSU/SUSFS modify the kernel.
      #
      # This directly avoids the abi.whitelist failure from the
      # previous workflow.
      # ============================================================

      - name: 14 - Generate BG7n KernelSU SUSFS defconfig
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          STOCK_CONFIG="${GITHUB_WORKSPACE}/BG7n_stock_defconfig"

          GKI_BASE_CONFIG="${PWD}/arch/arm64/configs/gki_defconfig"

          CONFIG_OUT="${RUNNER_TEMP}/bg7n-kconfig"

          test -s "${STOCK_CONFIG}"
          test -s "${GKI_BASE_CONFIG}"

          rm -rf "${CONFIG_OUT}"

          mkdir -p "${CONFIG_OUT}"

          # --------------------------------------------------------
          # Protected GKI symbols.
          # --------------------------------------------------------

          cat > \
            "${CONFIG_OUT}/protected.symbols" <<'EOF'
          CONFIG_LTO_NONE
          CONFIG_LTO_CLANG
          CONFIG_LTO_CLANG_FULL
          CONFIG_LTO_CLANG_THIN
          CONFIG_CFI_CLANG
          CONFIG_CFI_PERMISSIVE
          CONFIG_CFI_CLANG_SHADOW
          CONFIG_SHADOW_CALL_STACK
          CONFIG_KASAN
          CONFIG_KASAN_GENERIC
          CONFIG_KASAN_SW_TAGS
          CONFIG_KASAN_HW_TAGS
          CONFIG_ARM64_MTE
          CONFIG_ARM64_TAGGED_ADDR_ABI
          CONFIG_MODULES
          CONFIG_MODVERSIONS
          CONFIG_KALLSYMS
          CONFIG_KALLSYMS_ALL
          CONFIG_OVERLAY_FS
          CONFIG_GCOV_KERNEL
          CONFIG_FTRACE_MCOUNT_USE_RECORDMCOUNT
          EOF

          # --------------------------------------------------------
          # Filter vendor config.
          # --------------------------------------------------------

          python3 - \
            "${CONFIG_OUT}/protected.symbols" \
            "${STOCK_CONFIG}" \
            "${CONFIG_OUT}/bg7n_stock.filtered" \
            <<'PY'
          import re
          import sys
          from pathlib import Path

          protected = {
              x.strip()
              for x in Path(sys.argv[1]).read_text().splitlines()
              if x.strip()
          }

          stock = Path(sys.argv[2])
          output = Path(sys.argv[3])

          config_re = re.compile(
              r"^CONFIG_[A-Z0-9_]+="
          )

          unset_re = re.compile(
              r"^# CONFIG_[A-Z0-9_]+ is not set$"
          )

          kept = []

          for line in stock.read_text().splitlines():

              if config_re.match(line):

                  sym = line.split("=", 1)[0]

                  if sym in protected:
                      continue

              elif unset_re.match(line):

                  sym = (
                      line[2:]
                      .split(" is not set", 1)[0]
                  )

                  if sym in protected:
                      continue

              kept.append(line)

          output.write_text(
              "\n".join(kept) + "\n"
          )

          print(
              f"Filtered stock config: {len(kept)} lines"
          )
          PY

          # --------------------------------------------------------
          # Merge using Linux's official merge_config.sh.
          # --------------------------------------------------------

          cp \
            "${GKI_BASE_CONFIG}" \
            "${CONFIG_OUT}/base.config"

          KCONFIG_CONFIG="${CONFIG_OUT}/.config" \
            ./scripts/kconfig/merge_config.sh \
              -m \
              -r \
              "${CONFIG_OUT}/base.config" \
              "${CONFIG_OUT}/bg7n_stock.filtered"

          test -s \
            "${CONFIG_OUT}/.config"

          # --------------------------------------------------------
          # Enable KernelSU + SUSFS.
          # --------------------------------------------------------

          ./scripts/config \
            --file "${CONFIG_OUT}/.config" \
            -e KSU \
            -e KSU_SUSFS

          # --------------------------------------------------------
          # Resolve Kconfig.
          # --------------------------------------------------------

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            olddefconfig

          test -s \
            "${CONFIG_OUT}/.config"

          echo
          echo "=========================================="
          echo "RESOLVED CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_(CC_IS_CLANG|LD_IS_LLD|AS_IS_LLVM|KSU|KSU_SUSFS|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|KPROBES|EXT4_FS|THREAD_INFO_IN_TASK|LTO_NONE|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|CFI_CLANG|CFI_PERMISSIVE|SHADOW_CALL_STACK|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|OVERLAY_FS)=' \
            "${CONFIG_OUT}/.config" || true

          # --------------------------------------------------------
          # Mandatory checks.
          # --------------------------------------------------------

          for sym in \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_MODULES \
            CONFIG_MODVERSIONS \
            CONFIG_KALLSYMS \
            CONFIG_KALLSYMS_ALL \
            CONFIG_THREAD_INFO_IN_TASK
          do

            grep -q \
              "^${sym}=y$" \
              "${CONFIG_OUT}/.config" || {

              echo "::error::Missing ${sym}"
              exit 1
            }

          done

          # --------------------------------------------------------
          # Generate canonical minimal defconfig.
          # --------------------------------------------------------

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            savedefconfig

          cp \
            "${CONFIG_OUT}/defconfig" \
            arch/arm64/configs/bg7n_defconfig

          test -s \
            arch/arm64/configs/bg7n_defconfig

          echo
          echo "=========================================="
          echo "CANONICAL DEFCONFIG"
          echo "=========================================="

          sha256sum \
            arch/arm64/configs/bg7n_defconfig

          # --------------------------------------------------------
          # Re-expand canonical defconfig.
          # --------------------------------------------------------

          rm -f \
            "${CONFIG_OUT}/.config"

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            bg7n_defconfig

          cp \
            "${CONFIG_OUT}/.config" \
            "${CONFIG_OUT}/expanded.config"

          echo
          echo "=========================================="
          echo "EXPANDED CANONICAL CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_(KSU|KSU_SUSFS|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|THREAD_INFO_IN_TASK)=' \
            "${CONFIG_OUT}/expanded.config"

          for sym in \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_MODULES \
            CONFIG_MODVERSIONS \
            CONFIG_KALLSYMS \
            CONFIG_KALLSYMS_ALL \
            CONFIG_THREAD_INFO_IN_TASK
          do

            grep -q \
              "^${sym}=y$" \
              "${CONFIG_OUT}/expanded.config" || {

              echo "::error::Missing ${sym} after defconfig expansion"
              exit 1
            }

          done

          # --------------------------------------------------------
          # Stability test.
          # --------------------------------------------------------

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            savedefconfig

          cmp -s \
            "${CONFIG_OUT}/defconfig" \
            arch/arm64/configs/bg7n_defconfig || {

            echo "::error::Defconfig is not stable."

            diff -u \
              arch/arm64/configs/bg7n_defconfig \
              "${CONFIG_OUT}/defconfig" || true

            exit 1
          }

          echo
          echo "DEFCONFIG GENERATION PASSED."

      # ============================================================
      # 15 - SAVE DEFCONFIG
      # ============================================================

      - name: 15 - Save final defconfig
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          test -s \
            arch/arm64/configs/bg7n_defconfig

          cp \
            arch/arm64/configs/bg7n_defconfig \
            "${GITHUB_WORKSPACE}/BG7n_final_defconfig"

          sha256sum \
            "${GITHUB_WORKSPACE}/BG7n_final_defconfig"

      # ============================================================
      # 16 - CUSTOM BUILD CONFIG
      #
      # CRITICAL:
      #
      # Do NOT source build.config.gki.aarch64.
      #
      # We intentionally use:
      #   build.config.common
      #   build.config.aarch64
      #   build.config.gki
      #
      # and then disable all KMI/ABI certification variables.
      # ============================================================

      - name: 16 - Create custom BG7n build.config
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          cat > build.config.bg7n.ksu.susfs <<'EOF'
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.common
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.aarch64
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.gki

          # --------------------------------------------------------
          # Device defconfig
          # --------------------------------------------------------

          DEFCONFIG=bg7n_defconfig

          POST_DEFCONFIG_CMDS="check_defconfig"

          # --------------------------------------------------------
          # Custom kernel:
          # do NOT run Google GKI ABI/KMI certification.
          # --------------------------------------------------------

          TRIM_NONLISTED_KMI=
          KMI_SYMBOL_LIST=
          ADDITIONAL_KMI_SYMBOL_LISTS=
          KMI_SYMBOL_LIST_ADD_ONLY=
          KMI_SYMBOL_LIST_STRICT_MODE=
          KMI_ENFORCED=0

          unset ABI_DEFINITION
          unset KMI_SYMBOL_LIST
          unset ADDITIONAL_KMI_SYMBOL_LISTS

          BUILD_GKI_CERTIFICATION_TOOLS=0
          BUILD_GKI_ARTIFACTS=0

          # --------------------------------------------------------
          # Build outputs
          # --------------------------------------------------------

          MAKE_GOALS="
          Image
          Image.lz4
          modules
          "

          FILES="
          arch/arm64/boot/Image
          arch/arm64/boot/Image.lz4
          "
          EOF

          echo "=========================================="
          echo "CUSTOM BUILD CONFIG"
          echo "=========================================="

          cat build.config.bg7n.ksu.susfs

          # --------------------------------------------------------
          # Absolute guard against the previous ABI problem.
          # --------------------------------------------------------

          if grep -Eq \
            '^[[:space:]]*(ABI_DEFINITION|KMI_SYMBOL_LIST|ADDITIONAL_KMI_SYMBOL_LISTS|BUILD_GKI_CERTIFICATION_TOOLS)=' \
            build.config.bg7n.ksu.susfs
          then

            echo "::error::Unexpected ABI/KMI certification variable."
            exit 1

          fi

      # ============================================================
      # 17 - FINAL SOURCE TREE CHECK
      # ============================================================

      - name: 17 - Final source tree check
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          test ! -f .config
          test ! -f defconfig

          test ! -d include/config
          test ! -d include/generated
          test ! -d arch/arm64/include/generated

          test -L \
            drivers/kernelsu

          test -f \
            drivers/kernelsu/Kconfig

          test -f \
            drivers/kernelsu/Kbuild

          grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile

          test -s \
            arch/arm64/configs/bg7n_defconfig

          echo
          echo "=========================================="
          echo "NO STALE CONFIG"
          echo "NO STALE GENERATED HEADERS"
          echo "KSU LINK OK"
          echo "DEFCONFIG OK"
          echo "=========================================="

      # ============================================================
      # 18 - BUILD
      # ============================================================

      - name: 18 - Build BG7n kernel
        shell: bash
        working-directory: gki
        env:
          MAKE_JOBS: ${{ inputs.make_jobs }}
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-actions
        run: |
          set -euxo pipefail

          case "${MAKE_JOBS}" in
            ''|*[!0-9]*)
              echo "::error::make_jobs must be a positive integer"
              exit 1
              ;;
          esac

          test \
            "${MAKE_JOBS}" -ge 1

          export MAKEFLAGS="-j${MAKE_JOBS}"

          rm -rf \
            out/android12-5.10-2025-06

          test ! -f \
            common/.config

          test ! -f \
            common/defconfig

          echo
          echo "=========================================="
          echo "BUILD SETTINGS"
          echo "=========================================="

          grep -E \
            '^(DEFCONFIG|TRIM_NONLISTED_KMI|KMI_SYMBOL_LIST|KMI_SYMBOL_LIST_STRICT_MODE|KMI_ENFORCED|BUILD_GKI_CERTIFICATION_TOOLS|BUILD_GKI_ARTIFACTS)=' \
            common/build.config.bg7n.ksu.susfs || true

          echo
          echo "=========================================="
          echo "START GOOGLE build.sh"
          echo "=========================================="

          BUILD_CONFIG=common/build.config.bg7n.ksu.susfs \
            ./build/build.sh

      # ============================================================
      # 19 - VERIFY BUILD OUTPUT
      # ============================================================

      - name: 19 - Verify kernel output
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          mkdir -p \
            ../artifact/kernel \
            ../artifact/reports

          IMAGE_LZ4="$(
            find out \
              -type f \
              -path '*/dist/Image.lz4' |
            head -n1 || true
          )"

          IMAGE="$(
            find out \
              -type f \
              -path '*/dist/Image' |
            head -n1 || true
          )"

          test -n \
            "${IMAGE_LZ4}"

          cp \
            "${IMAGE_LZ4}" \
            ../artifact/kernel/Image.lz4

          if [ -n "${IMAGE}" ]; then

            cp \
              "${IMAGE}" \
              ../artifact/kernel/Image

          else

            lz4 \
              -d \
              -f \
              "${IMAGE_LZ4}" \
              ../artifact/kernel/Image

          fi

          test -s \
            ../artifact/kernel/Image

          test -s \
            ../artifact/kernel/Image.lz4

          CONFIG_FILE="$(
            find out \
              -type f \
              -name .config |
            head -n1 || true
          )"

          test -n \
            "${CONFIG_FILE}"

          cp \
            "${CONFIG_FILE}" \
            ../artifact/kernel/.config

          MODULE_SYMVERS="$(
            find out \
              -type f \
              -name Module.symvers |
            head -n1 || true
          )"

          if [ -n "${MODULE_SYMVERS}" ]; then

            cp \
              "${MODULE_SYMVERS}" \
              ../artifact/kernel/Module.symvers

          fi

          find out \
            -type f \
            -name System.map \
            -exec cp {} ../artifact/kernel/ \; \
            || true

          find out \
            -type f \
            -name modules.builtin \
            -exec cp {} ../artifact/kernel/ \; \
            || true

          find out \
            -type f \
            -name modules.builtin.modinfo \
            -exec cp {} ../artifact/kernel/ \; \
            || true

          echo
          echo "=========================================="
          echo "FINAL BUILD CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_(KSU|KSU_SUSFS|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|THREAD_INFO_IN_TASK)=' \
            ../artifact/kernel/.config

          for sym in \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_MODULES \
            CONFIG_MODVERSIONS \
            CONFIG_KALLSYMS \
            CONFIG_KALLSYMS_ALL \
            CONFIG_THREAD_INFO_IN_TASK
          do

            grep -q \
              "^${sym}=y$" \
              ../artifact/kernel/.config || {

              echo "::error::Missing ${sym} in actual build."
              exit 1
            }

          done

          echo
          echo "=========================================="
          echo "KERNEL VERSION"
          echo "=========================================="

          make \
            -s \
            -C common \
            kernelversion

          {
            echo "=== Kernel version ==="
            make -s -C common kernelversion

            echo
            echo "=== GKI commit ==="
            git -C common rev-parse HEAD

            echo
            echo "=== KernelSU commit ==="
            git -C KernelSU rev-parse HEAD

            echo
            echo "=== SUSFS commit ==="
            git -C susfs rev-parse HEAD

            echo
            echo "=== Critical config ==="
            grep -E \
              '^CONFIG_(KSU|KSU_SUSFS|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|THREAD_INFO_IN_TASK)=' \
              ../artifact/kernel/.config

            echo
            echo "=== Build mode ==="
            echo "CUSTOM_GKI_KERNEL=1"
            echo "KMI_ENFORCED=0"
            echo "TRIM_NONLISTED_KMI=0"
            echo "GKI_CERTIFICATION=0"
          } | tee \
            ../artifact/reports/kernel_verification.txt

          file \
            ../artifact/kernel/Image

          sha256sum \
            ../artifact/kernel/Image

          sha256sum \
            ../artifact/kernel/Image.lz4

      # ============================================================
      # 20 - BUILD SUSFS USERSPACE TOOL
      # ============================================================

      - name: 20 - Build SUSFS userspace tool and module
        shell: bash
        working-directory: gki/susfs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euxo pipefail

          export PATH="${ANDROID_NDK_HOME}:${PATH}"

          chmod +x \
            build_ksu_susfs_tool.sh \
            build_ksu_module.sh

          echo "=========================================="
          echo "BUILD SUSFS TOOL"
          echo "=========================================="

          ./build_ksu_susfs_tool.sh

          echo
          echo "=========================================="
          echo "BUILD SUSFS MODULE"
          echo "=========================================="

          ./build_ksu_module.sh

          test -d \
            ksu_module_susfs

          mkdir -p \
            ../../artifact/susfs

          cp -a \
            ksu_module_susfs \
            ../../artifact/susfs/susfs4ksu-module

          if [ -f ksu_module_susfs.zip ]; then

            cp \
              ksu_module_susfs.zip \
              ../../artifact/susfs/susfs4ksu.zip

          fi

      # ============================================================
      # 21 - PREPARE MAGISKBOOT
      # ============================================================

      - name: 21 - Prepare MagiskBoot
        shell: bash
        run: |
          set -euxo pipefail

          MAGISK_API="https://api.github.com/repos/topjohnwu/Magisk/releases/latest"

          MAGISK_URL="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "${MAGISK_API}" |
            jq -r '
              .assets[]
              | select(.name | startswith("Magisk-"))
              | select(.name | endswith(".apk"))
              | .browser_download_url
            ' |
            head -n1
          )"

          test -n \
            "${MAGISK_URL}"

          curl -fL \
            "${MAGISK_URL}" \
            -o magisk.apk

          unzip -j -o \
            magisk.apk \
            'lib/arm64-v8a/libmagiskboot.so' \
            -d work

          mv \
            work/libmagiskboot.so \
            work/magiskboot

          chmod +x \
            work/magiskboot

          test -x \
            work/magiskboot

          ./work/magiskboot --help \
            >/dev/null \
            2>&1 \
            || true

      # ============================================================
      # 22 - REPACK STOCK BOOT
      # ============================================================

      - name: 22 - Repack stock BG7n boot with custom kernel
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            work/boot \
            artifact/boot

          cp \
            stock/boot.img \
            work/boot/boot.img

          test -s \
            artifact/kernel/Image

          echo "=========================================="
          echo "UNPACK STOCK BOOT"
          echo "=========================================="

          (
            cd work/boot

            ../magiskboot unpack boot.img

            test -f kernel
            test -s kernel

            echo
            echo "Stock kernel identity:"

            strings kernel |
              grep -m1 \
                'Linux version' \
              || true
          )

          # --------------------------------------------------------
          # Confirm that the stock boot belongs to the expected
          # GKI generation.
          # --------------------------------------------------------

          if ! strings work/boot/kernel |
            grep -q \
              "Linux version ${GKI_VERSION}"
          then

            echo "::error::Stock boot kernel version does not match ${GKI_VERSION}."

            echo
            echo "Detected versions:"

            strings work/boot/kernel |
              grep \
                -m5 \
                'Linux version' \
              || true

            exit 1

          fi

          echo
          echo "Stock boot matches Linux ${GKI_VERSION}."

          # --------------------------------------------------------
          # Replace kernel only.
          # --------------------------------------------------------

          cp \
            artifact/kernel/Image \
            work/boot/kernel

          test -s \
            work/boot/kernel

          echo
          echo "=========================================="
          echo "REPACK"
          echo "=========================================="

          (
            cd work/boot

            ../magiskboot repack boot.img

            test -s new-boot.img
          )

          cp \
            work/boot/new-boot.img \
            artifact/boot/BG7n-KSU-SUSFS-boot.img

          test -s \
            artifact/boot/BG7n-KSU-SUSFS-boot.img

          file \
            artifact/boot/BG7n-KSU-SUSFS-boot.img

          sha256sum \
            artifact/boot/BG7n-KSU-SUSFS-boot.img \
            | tee \
              artifact/reports/generated_boot.sha256

      # ============================================================
      # 23 - FINAL BUILD MANIFEST
      # ============================================================

      - name: 23 - Create build manifest
        shell: bash
        run: |
          set -euxo pipefail

          SUSFS_COMMIT="$(
            git -C gki/susfs rev-parse HEAD
          )"

          KSU_ACTUAL_COMMIT="$(
            git -C gki/KernelSU rev-parse HEAD
          )"

          COMMON_COMMIT="$(
            git -C gki/common rev-parse HEAD
          )"

          STOCK_BOOT_SHA="$(
            cut \
              -d' ' \
              -f1 \
              stock/boot.sha256
          )"

          cat > artifact/BUILD_INFO.txt <<EOF
          DEVICE=${DEVICE}

          GOOGLE_GKI_MANIFEST_BRANCH=${GKI_MANIFEST_BRANCH}
          GOOGLE_GKI_COMMON_TAG=${GKI_COMMON_TAG}
          GOOGLE_GKI_VERSION=${GKI_VERSION}
          GOOGLE_GKI_SHA=${GKI_SHA}
          COMMON_COMMIT=${COMMON_COMMIT}

          KERNELSU_REPO=${KSU_REPO}
          KERNELSU_COMMIT=${KSU_ACTUAL_COMMIT}

          SUSFS_REPO=${SUSFS_REPO}
          SUSFS_REF=${{ inputs.susfs_ref }}
          SUSFS_COMMIT=${SUSFS_COMMIT}

          BOOT_RELEASE_REPO=${BOOT_REPO}
          BOOT_RELEASE_TAG=${{ inputs.boot_release_tag }}

          STOCK_BOOT_SHA256=${STOCK_BOOT_SHA}

          CUSTOM_GKI_KERNEL=1
          KMI_ENFORCED=0
          TRIM_NONLISTED_KMI=0
          KMI_SYMBOL_LIST_STRICT_MODE=0
          GKI_CERTIFICATION=0

          REQUIRED_CONFIG_KSU=y
          REQUIRED_CONFIG_KSU_SUSFS=y
          REQUIRED_CONFIG_MODULES=y
          REQUIRED_CONFIG_MODVERSIONS=y
          REQUIRED_CONFIG_KALLSYMS=y
          REQUIRED_CONFIG_KALLSYMS_ALL=y
          REQUIRED_CONFIG_THREAD_INFO_IN_TASK=y
          EOF

          cp \
            gki/manifest.lock.xml \
            artifact/manifest.lock.xml

          cp \
            stock/boot.sha256 \
            artifact/reports/stock_boot.sha256

          cp \
            BG7n_final_defconfig \
            artifact/kernel/bg7n_final_defconfig

          find artifact \
            -type f \
            ! -name SHA256SUMS.txt \
            -print0 |
            sort -z |
            xargs -0 sha256sum \
            > artifact/SHA256SUMS.txt

      # ============================================================
      # 24 - PACKAGE
      # ============================================================

      - name: 24 - Package artifacts
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf \
            artifact/package

          mkdir -p \
            artifact/package

          cp \
            artifact/BUILD_INFO.txt \
            artifact/package/

          cp \
            artifact/SHA256SUMS.txt \
            artifact/package/

          cp -a \
            artifact/kernel \
            artifact/package/kernel

          cp -a \
            artifact/susfs \
            artifact/package/susfs

          cp -a \
            artifact/reports \
            artifact/package/reports

          if [ -d artifact/boot ]; then

            cp -a \
              artifact/boot \
              artifact/package/boot

          fi

          cp \
            BG7n_stock_defconfig \
            artifact/package/

          cp \
            BG7n_final_defconfig \
            artifact/package/

          cat > \
            artifact/package/README.txt \
            <<EOF
          TECNO BG7n
          ================================

          Google GKI:
            ${GKI_COMMON_TAG}
            Linux ${GKI_VERSION}
            ${GKI_SHA}

          KernelSU:
            Official KernelSU
            ${KSU_COMMIT}

          SUSFS:
            SUSFS v2.2.0
            ${SUSFS_COMMIT}

          Kernel:
            CONFIG_KSU=y
            CONFIG_KSU_SUSFS=y
            CONFIG_MODULES=y
            CONFIG_MODVERSIONS=y
            CONFIG_KALLSYMS=y
            CONFIG_KALLSYMS_ALL=y
            CONFIG_THREAD_INFO_IN_TASK=y

          ABI/KMI:
            Custom KernelSU/SUSFS build
            KMI_ENFORCED=0
            TRIM_NONLISTED_KMI=0
            GKI_CERTIFICATION=0

          Important:
            This is NOT an unmodified Google-certified GKI image.

            The kernel contains KernelSU + SUSFS modifications.

            Keep the original stock boot image.

            Verify:
              reports/kernel_verification.txt
              reports/generated_boot.sha256
              SHA256SUMS.txt

            Flash only after confirming the stock boot belongs to
            the same GKI generation and security patch level.

          Recovery:
            Keep the untouched stock boot.img available.
          EOF

          (
            cd artifact/package

            zip \
              -r \
              ../../BG7n_GKI_r3_KSU_SUSFS_artifacts.zip \
              .
          )

          test -s \
            BG7n_GKI_r3_KSU_SUSFS_artifacts.zip

      # ============================================================
      # 25 - UPLOAD
      # ============================================================

      - name: 25 - Upload complete artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-GKI-r3-KSU-SUSFS
          path: |
            BG7n_GKI_r3_KSU_SUSFS_artifacts.zip
            artifact/
          if-no-files-found: error
          retention-days: 30

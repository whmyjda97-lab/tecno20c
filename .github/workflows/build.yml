name: "Build BG7n GKI r3 + KernelSU + SUSFS"

on:
  workflow_dispatch:
    inputs:
      susfs_ref:
        description: "Pinned SUSFS commit"
        required: false
        default: "be08face56c347e7ba9c4fb420c2463598a14f5d"

      make_jobs:
        description: "Kernel build jobs"
        required: false
        default: "4"

      boot_release_tag:
        description: "GitHub Release tag containing stock BG7n boot.img.zip"
        required: false
        default: "stock-boot"

permissions:
  contents: read

concurrency:
  group: bg7n-${{ github.ref }}
  cancel-in-progress: true

env:
  # ==============================================================
  # GOOGLE GKI
  # ==============================================================

  GKI_MANIFEST_BRANCH: common-android12-5.10-2025-06
  GKI_COMMON_TAG: android12-5.10-2025-06_r3
  GKI_VERSION: "5.10.237"
  GKI_SHA: d09ef2e980e0974a0d6dfe762e29fff118db7f46

  # ==============================================================
  # KERNELSU
  # ==============================================================

  KSU_REPO: https://github.com/5ec1cff/KernelSU.git
  KSU_COMMIT: 3be1013dbda6ebab14e7fcd231bcbae5ce6425ff

  # ==============================================================
  # SUSFS
  # ==============================================================

  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git

  # ==============================================================
  # DEVICE / BOOT
  # ==============================================================

  BOOT_REPO: whmyjda97-lab/tecno20c

  DEVICE: BG7n
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout build kit
        uses: actions/checkout@v4

      # ============================================================
      # HOST DEPENDENCIES
      # ============================================================

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            curl \
            device-tree-compiler \
            dwarves \
            file \
            flex \
            gawk \
            gh \
            git \
            gnupg \
            gperf \
            jq \
            libdw-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5-dev \
            libssl-dev \
            libunwind-dev \
            lld \
            llvm \
            lz4 \
            openssl \
            pahole \
            patchelf \
            pkg-config \
            python3 \
            rsync \
            unzip \
            zip \
            android-sdk-libsparse-utils

          echo "=== Host tools ==="

          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-nm --version
          python3 --version
          gh --version

      # ============================================================
      # ANDROID NDK
      # ============================================================

      - name: Install Android NDK r25b
        shell: bash
        run: |
          set -euxo pipefail

          NDK_VERSION="25.2.9519653"
          NDK_ARCHIVE="android-ndk-r25b-linux.zip"

          SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          NDK_ROOT="${SDK_ROOT}/ndk/${NDK_VERSION}"

          rm -rf \
            "${SDK_ROOT}" \
            "${RUNNER_TEMP}/android-ndk"

          mkdir -p \
            "${SDK_ROOT}/ndk" \
            "${RUNNER_TEMP}/android-ndk"

          curl -fL \
            "https://dl.google.com/android/repository/${NDK_ARCHIVE}" \
            -o "${RUNNER_TEMP}/${NDK_ARCHIVE}"

          unzip -q \
            "${RUNNER_TEMP}/${NDK_ARCHIVE}" \
            -d "${RUNNER_TEMP}/android-ndk"

          test -d \
            "${RUNNER_TEMP}/android-ndk/android-ndk-r25b"

          mv \
            "${RUNNER_TEMP}/android-ndk/android-ndk-r25b" \
            "${NDK_ROOT}"

          test -x \
            "${NDK_ROOT}/ndk-build"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${NDK_ROOT}" >> "${GITHUB_ENV}"

          echo "${NDK_ROOT}" >> "${GITHUB_PATH}"

          echo "=== Android NDK ==="

          "${NDK_ROOT}/ndk-build" --version

      # ============================================================
      # STOCK BOOT
      # ============================================================

      - name: Fetch exact stock BG7n boot image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOT_RELEASE_TAG: ${{ inputs.boot_release_tag }}
        run: |
          set -euo pipefail

          rm -rf \
            stock-release \
            stock

          mkdir -p \
            stock-release \
            stock

          gh release view \
            "${BOOT_RELEASE_TAG}" \
            --repo "${BOOT_REPO}" \
            --json tagName,name,assets \
            --jq '.tagName + " | " + .name + " | assets=" + ((.assets|length)|tostring)'

          gh release download \
            "${BOOT_RELEASE_TAG}" \
            --repo "${BOOT_REPO}" \
            --dir stock-release

          echo "=== Release assets ==="

          find stock-release \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort

          CANDIDATES=()

          while IFS= read -r -d '' z; do

            mapfile -t ENTRIES < <(
              unzip -Z1 "$z" 2>/dev/null |
              grep -Ei '(^|/)boot\.img$' ||
              true
            )

            if [ "${#ENTRIES[@]}" -eq 1 ]; then

              CANDIDATES+=("$z")

              echo "Boot candidate:"
              echo "  $z"
              echo "  ${ENTRIES[0]}"

            fi

          done < <(
            find stock-release \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              -print0
          )

          if [ "${#CANDIDATES[@]}" -ne 1 ]; then

            echo "::error::Expected exactly one release ZIP containing exactly one boot.img."
            echo "Candidates found: ${#CANDIDATES[@]}"

            printf '%s\n' \
              "${CANDIDATES[@]:-<none>}"

            exit 1

          fi

          BOOT_ASSET="${CANDIDATES[0]}"

          mapfile -t BOOT_ENTRIES < <(
            unzip -Z1 "${BOOT_ASSET}" |
            grep -Ei '(^|/)boot\.img$'
          )

          unzip -p \
            "${BOOT_ASSET}" \
            "${BOOT_ENTRIES[0]}" \
            > stock/boot.img

          test -s \
            stock/boot.img

          file \
            stock/boot.img

          sha256sum \
            stock/boot.img |
            tee stock/boot.sha256

      # ============================================================
      # INPUT CONFIG
      # ============================================================

      - name: Verify BG7n stock defconfig
        shell: bash
        run: |
          set -euxo pipefail

          test -s \
            BG7n_stock_defconfig

          grep -q \
            '^CONFIG_MODULES=y$' \
            BG7n_stock_defconfig

          grep -q \
            '^CONFIG_MODVERSIONS=y$' \
            BG7n_stock_defconfig

          echo "=== BG7n stock config SHA256 ==="

          sha256sum \
            BG7n_stock_defconfig

          echo "=== Stock KMI-sensitive settings ==="

          grep -E \
            '^CONFIG_(ARM64_4K_PAGES|ARM64_16K_PAGES|ARM64_64K_PAGES|ARM64_VA_BITS_36|ARM64_VA_BITS_39|ARM64_VA_BITS_42|ARM64_VA_BITS_47|ARM64_VA_BITS_48|ARM64_VA_BITS_52|ARM64_PA_BITS_48|ARM64_PA_BITS_52|COMPILE_TEST|LTO_NONE|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|CFI_CLANG|CFI_PERMISSIVE|CFI_CLANG_SHADOW|SHADOW_CALL_STACK|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|GCOV_KERNEL|FTRACE_MCOUNT_USE_RECORDMCOUNT|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS)=' \
            BG7n_stock_defconfig \
            || true

      # ============================================================
      # REPO
      # ============================================================

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o repo

          chmod +x \
            repo

          sudo install \
            -m 0755 \
            repo \
            /usr/local/bin/repo

          repo --version

      # ============================================================
      # GOOGLE GKI SOURCE
      # ============================================================

      - name: Sync exact Google GKI r3 source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf \
            gki

          mkdir -p \
            gki

          cd gki

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${GKI_MANIFEST_BRANCH}" \
            --depth=1

          repo sync \
            -c \
            -j2 \
            --no-tags \
            --no-clone-bundle

          test -d \
            common

          test -f \
            common/Makefile

          git -C common fetch \
            --no-tags \
            https://android.googlesource.com/kernel/common.git \
            "refs/tags/${GKI_COMMON_TAG}:refs/tags/${GKI_COMMON_TAG}"

          git -C common checkout \
            --detach \
            "refs/tags/${GKI_COMMON_TAG}"

          COMMON_COMMIT="$(
            git -C common rev-parse HEAD
          )"

          echo "COMMON_COMMIT=${COMMON_COMMIT}"

          test \
            "${COMMON_COMMIT}" = "${GKI_SHA}"

          test \
            "$(make -s -C common kernelversion)" = "${GKI_VERSION}"

          repo manifest -r > \
            manifest.lock.xml

          {
            echo "GKI_MANIFEST_BRANCH=${GKI_MANIFEST_BRANCH}"
            echo "GKI_COMMON_TAG=${GKI_COMMON_TAG}"
            echo "GKI_VERSION=${GKI_VERSION}"
            echo "GKI_SHA=${GKI_SHA}"
            echo "COMMON_COMMIT=${COMMON_COMMIT}"
          } | tee \
            ../gki_identity.txt

      # ============================================================
      # GOOGLE HERMETIC LLVM
      # ============================================================

      - name: Select exact Google GKI LLVM toolchain
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          CLANG_PREBUILT_BIN="$(
            awk -F= '
              /^CLANG_PREBUILT_BIN=/ {
                print $2
                exit
              }
            ' common/build.config.common
          )"

          test -n \
            "${CLANG_PREBUILT_BIN}"

          GKI_CLANG_BIN="${PWD}/${CLANG_PREBUILT_BIN}"

          test -d \
            "${GKI_CLANG_BIN}"

          for tool in \
            clang \
            clang++ \
            ld.lld \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-strip
          do

            test -x \
              "${GKI_CLANG_BIN}/${tool}"

          done

          # ========================================================
          # IMPORTANT:
          # Match Google's LLVM build environment for both Kconfig
          # and the final build.
          #
          # Google build.sh resets AS=clang whenever LLVM_IAS=1.
          # ========================================================

          echo "GKI_CLANG_BIN=${GKI_CLANG_BIN}" >> \
            "${GITHUB_ENV}"

          echo "LLVM=1" >> \
            "${GITHUB_ENV}"

          echo "LLVM_IAS=1" >> \
            "${GITHUB_ENV}"

          echo "CC=clang" >> \
            "${GITHUB_ENV}"

          echo "CXX=clang++" >> \
            "${GITHUB_ENV}"

          echo "LD=ld.lld" >> \
            "${GITHUB_ENV}"

          echo "AS=clang" >> \
            "${GITHUB_ENV}"

          echo "AR=llvm-ar" >> \
            "${GITHUB_ENV}"

          echo "NM=llvm-nm" >> \
            "${GITHUB_ENV}"

          echo "OBJCOPY=llvm-objcopy" >> \
            "${GITHUB_ENV}"

          echo "OBJDUMP=llvm-objdump" >> \
            "${GITHUB_ENV}"

          echo "READELF=llvm-readelf" >> \
            "${GITHUB_ENV}"

          echo "STRIP=llvm-strip" >> \
            "${GITHUB_ENV}"

          echo "${GKI_CLANG_BIN}" >> \
            "${GITHUB_PATH}"

          echo "=== Google LLVM ==="

          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-nm --version

          # ========================================================
          # ARM64 integrated assembler smoke tests.
          #
          # These directly test the capabilities used by Kconfig:
          #
          #   ARM64_AS_HAS_MTE
          #   AS_HAS_ARMV8_5
          #   AS_HAS_LSE_ATOMICS
          # ========================================================

          cat > \
            "${RUNNER_TEMP}/mte-test.S" <<'EOF'
          .arch armv8.5-a+memtag
          stgm xzr, [x0]
          EOF

          cat > \
            "${RUNNER_TEMP}/armv85-test.S" <<'EOF'
          .arch armv8.5-a
          nop
          EOF

          cat > \
            "${RUNNER_TEMP}/lse-test.S" <<'EOF'
          .arch_extension lse
          casal x0, x1, [x2]
          EOF

          clang \
            --target=aarch64-linux-gnu \
            -fintegrated-as \
            -c \
            -x assembler \
            "${RUNNER_TEMP}/mte-test.S" \
            -o "${RUNNER_TEMP}/mte-test.o"

          clang \
            --target=aarch64-linux-gnu \
            -fintegrated-as \
            -c \
            -x assembler \
            "${RUNNER_TEMP}/armv85-test.S" \
            -o "${RUNNER_TEMP}/armv85-test.o"

          clang \
            --target=aarch64-linux-gnu \
            -fintegrated-as \
            -c \
            -x assembler \
            "${RUNNER_TEMP}/lse-test.S" \
            -o "${RUNNER_TEMP}/lse-test.o"

          test -s \
            "${RUNNER_TEMP}/mte-test.o"

          test -s \
            "${RUNNER_TEMP}/armv85-test.o"

          test -s \
            "${RUNNER_TEMP}/lse-test.o"

          echo "=== ARM64 integrated assembler tests PASSED ==="

      # ============================================================
      # KERNELSU
      # ============================================================

      - name: Install exact KernelSU patch-base
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          rm -rf \
            KernelSU

          git clone \
            --no-tags \
            --filter=blob:none \
            "${KSU_REPO}" \
            KernelSU

          git -C KernelSU fetch \
            --no-tags \
            origin \
            "${KSU_COMMIT}"

          git -C KernelSU checkout \
            --detach \
            "${KSU_COMMIT}"

          ACTUAL_KSU_COMMIT="$(
            git -C KernelSU rev-parse HEAD
          )"

          test \
            "${ACTUAL_KSU_COMMIT}" = "${KSU_COMMIT}"

          test -d \
            KernelSU/kernel

          test -f \
            KernelSU/kernel/Kconfig

          test -f \
            KernelSU/kernel/Kbuild

          {
            echo "KERNELSU_REPO=${KSU_REPO}"
            echo "KERNELSU_COMMIT=${ACTUAL_KSU_COMMIT}"
          } | tee \
            ../kernelsu_identity.txt

      # ============================================================
      # SUSFS
      # ============================================================

      - name: Clone and verify pinned SUSFS
        shell: bash
        working-directory: gki
        env:
          SUSFS_REF: ${{ inputs.susfs_ref }}
        run: |
          set -euxo pipefail

          rm -rf \
            susfs

          git clone \
            --no-tags \
            --filter=blob:none \
            "${SUSFS_REPO}" \
            susfs

          git -C susfs fetch \
            --no-tags \
            origin \
            "${SUSFS_REF}"

          git -C susfs checkout \
            --detach \
            "${SUSFS_REF}"

          SUSFS_COMMIT="$(
            git -C susfs rev-parse HEAD
          )"

          test \
            "${SUSFS_COMMIT}" = "${SUSFS_REF}"

          test -f \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          test -f \
            susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          test -d \
            susfs/kernel_patches/fs

          test -d \
            susfs/kernel_patches/include/linux

          test -f \
            susfs/ksu_module_susfs/module.prop

          grep -Eq \
            '^version=v?2\.2\.0($|[.-])' \
            susfs/ksu_module_susfs/module.prop

          {
            echo "SUSFS_REPO=${SUSFS_REPO}"
            echo "SUSFS_COMMIT=${SUSFS_COMMIT}"
          } | tee \
            ../susfs_identity.txt

      # ============================================================
      # APPLY SUSFS
      # ============================================================

      - name: Apply SUSFS patches
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          cp \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            KernelSU/

          cp \
            susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            common/

          cp -a \
            susfs/kernel_patches/fs/. \
            common/fs/

          cp -a \
            susfs/kernel_patches/include/linux/. \
            common/include/linux/

          (
            cd KernelSU

            patch \
              --batch \
              --forward \
              -p1 \
              < 10_enable_susfs_for_ksu.patch
          )

          (
            cd common

            patch \
              --batch \
              --forward \
              -p1 \
              < 50_add_susfs_in_gki-android12-5.10.patch
          )

          echo "=== KernelSU changes ==="

          git -C KernelSU status --short

          echo "=== GKI changes ==="

          git -C common status --short

      # ============================================================
      # INTEGRATE KERNELSU
      # ============================================================

      - name: Integrate KernelSU
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          test -f \
            KernelSU/kernel/Kconfig

          test -f \
            KernelSU/kernel/Kbuild

          rm -rf \
            common/drivers/kernelsu

          KSU_RELATIVE="$(
            realpath \
              --relative-to=common/drivers \
              KernelSU/kernel
          )"

          ln -s \
            "${KSU_RELATIVE}" \
            common/drivers/kernelsu

          test -L \
            common/drivers/kernelsu

          test -f \
            common/drivers/kernelsu/Kconfig

          test -f \
            common/drivers/kernelsu/Kbuild

          if ! grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            common/drivers/Makefile
          then

            printf '%s\n' \
              'obj-$(CONFIG_KSU) += kernelsu/' \
              >> common/drivers/Makefile

          fi

          if ! grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            common/drivers/Kconfig
          then

            python3 - <<'PY'
from pathlib import Path

p = Path("common/drivers/Kconfig")
text = p.read_text()

source = 'source "drivers/kernelsu/Kconfig"\n'

if source not in text:

    pos = text.rfind("endmenu")

    if pos < 0:
        raise SystemExit(
            "ERROR: drivers/Kconfig has no endmenu"
        )

    text = (
        text[:pos]
        + source
        + "\n"
        + text[pos:]
    )

    p.write_text(text)
PY

          fi

          grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            common/drivers/Kconfig

          grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            common/drivers/Makefile

          grep -Rqs \
            '^config[[:space:]]\+KSU\([[:space:]]\|$\)' \
            common/drivers/kernelsu

          grep -Rqs \
            '^config[[:space:]]\+KSU_SUSFS\([[:space:]]\|$\)' \
            common/drivers/kernelsu

          echo "=== KernelSU integration passed ==="

      # ============================================================
      # CLEAN GENERATED CONFIG
      # ============================================================

      - name: Remove stale generated configuration
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          rm -f \
            .config \
            defconfig

          rm -rf \
            include/config \
            include/generated \
            arch/arm64/include/generated

          test ! -f \
            .config

          test ! -f \
            defconfig

          test ! -d \
            include/config

          test ! -d \
            include/generated

          test ! -d \
            arch/arm64/include/generated

      # ============================================================
      # GENERATE DEFCONFIG
      #
      # CORE FIX:
      #
      # - Use the exact Google LLVM already selected.
      # - Export AS=clang explicitly.
      # - Let Kconfig decide MTE/KASAN/LTO from real prerequisites.
      # - Do not bypass dependency resolution.
      # - Filter only vendor values that must not override GKI.
      # ============================================================

      - name: Generate BG7n GKI + KernelSU + SUSFS defconfig
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          STOCK_CONFIG="${GITHUB_WORKSPACE}/BG7n_stock_defconfig"
          GKI_BASE_CONFIG="${PWD}/arch/arm64/configs/gki_defconfig"
          CONFIG_OUT="${RUNNER_TEMP}/bg7n-kconfig"

          test -s \
            "${STOCK_CONFIG}"

          test -s \
            "${GKI_BASE_CONFIG}"

          rm -rf \
            "${CONFIG_OUT}"

          mkdir -p \
            "${CONFIG_OUT}"

          # ==========================================================
          # Exact Google LLVM environment.
          # ==========================================================

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export CXX=clang++
          export LD=ld.lld
          export AS=clang
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip

          echo "=== Kconfig toolchain ==="

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm

          clang --version
          ld.lld --version

          # ==========================================================
          # Protected symbols.
          #
          # These remain controlled by the Google GKI baseline.
          # ==========================================================

          cat > \
            "${CONFIG_OUT}/protected.symbols" <<'EOF'
CONFIG_ARM64_4K_PAGES
CONFIG_ARM64_16K_PAGES
CONFIG_ARM64_64K_PAGES

CONFIG_ARM64_VA_BITS_36
CONFIG_ARM64_VA_BITS_39
CONFIG_ARM64_VA_BITS_42
CONFIG_ARM64_VA_BITS_47
CONFIG_ARM64_VA_BITS_48
CONFIG_ARM64_VA_BITS_52

CONFIG_ARM64_PA_BITS_48
CONFIG_ARM64_PA_BITS_52

CONFIG_COMPILE_TEST

CONFIG_LTO_NONE
CONFIG_LTO_CLANG
CONFIG_LTO_CLANG_FULL
CONFIG_LTO_CLANG_THIN

CONFIG_CFI_CLANG
CONFIG_CFI_PERMISSIVE
CONFIG_CFI_CLANG_SHADOW

CONFIG_SHADOW_CALL_STACK

CONFIG_KASAN
CONFIG_KASAN_GENERIC
CONFIG_KASAN_SW_TAGS
CONFIG_KASAN_HW_TAGS

CONFIG_ARM64_TAGGED_ADDR_ABI
CONFIG_ARM64_MTE
CONFIG_ARM64_PAN
CONFIG_ARM64_LSE_ATOMICS

CONFIG_SLUB

CONFIG_MODULES
CONFIG_MODVERSIONS
CONFIG_KALLSYMS
CONFIG_KALLSYMS_ALL
CONFIG_OVERLAY_FS

CONFIG_GCOV_KERNEL
CONFIG_FTRACE_MCOUNT_USE_RECORDMCOUNT
EOF

          # ==========================================================
          # Filter the BG7n vendor fragment with Python.
          # ==========================================================

          python3 - \
            "${CONFIG_OUT}/protected.symbols" \
            "${STOCK_CONFIG}" \
            "${CONFIG_OUT}/bg7n_stock.filtered" <<'PY'
import re
import sys
from pathlib import Path

protected_file = Path(sys.argv[1])
stock_file = Path(sys.argv[2])
output_file = Path(sys.argv[3])

protected = {
    line.strip()
    for line in protected_file.read_text().splitlines()
    if line.strip()
}

set_re = re.compile(r"^CONFIG_[A-Z0-9_]+=")
unset_re = re.compile(r"^# CONFIG_[A-Z0-9_]+ is not set$")

out = []

for line in stock_file.read_text().splitlines():

    if set_re.match(line):
        symbol = line.split("=", 1)[0]

        if symbol in protected:
            continue

    elif unset_re.match(line):
        symbol = line[2:].split(" is not set", 1)[0]


name: Build BG7n SUSFS + KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      - name: تحميل ملفات المشروع
        uses: actions/checkout@v4

      - name: تثبيت أدوات البناء
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libssl-dev \
            libelf-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            curl \
            xz-utils \
            zstd \
            device-tree-compiler \
            file

      - name: تحميل مصدر النواة المطابق
        env:
          KERNEL_COMMIT: d09ef2e980e0974a0d6dfe762e29fff118db7f46
        run: |
          git init kernel
          cd kernel
          git remote add origin https://android.googlesource.com/kernel/common
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD

      - name: تجهيز مجلدات العمل
        run: |
          rm -rf out work tools bootwork
          mkdir -p out work tools bootwork

      - name: تجهيز KernelSU-Next و SUSFS
        run: |
          tar -xzf KernelSU-Next.tar.gz -C work
          tar -xzf susfs4ksu-gki-android12-5.10.tar.gz -C work

          KSU_DIR="$(find work -maxdepth 1 -type d -name 'KernelSU-Next-*' | head -1)"
          SUSFS_DIR="work/susfs4ksu-gki-android12-5.10"

          test -d "$KSU_DIR"
          test -d "$SUSFS_DIR"

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          echo "SUSFS_DIR=$SUSFS_DIR" >> "$GITHUB_ENV"

      - name: إضافة KernelSU-Next إلى النواة
        run: |
          cd kernel
          bash "$GITHUB_WORKSPACE/$KSU_DIR/kernel/setup.sh"
          test -d drivers/kernelsu

      - name: التحقق من تكامل SUSFS داخل KernelSU-Next
        run: |
          test -f "$GITHUB_WORKSPACE/$KSU_DIR/kernel/Kconfig"
          test -f "$GITHUB_WORKSPACE/$KSU_DIR/kernel/Kbuild"

          if grep -Rqs "CONFIG_KSU_SUSFS" "$GITHUB_WORKSPACE/$KSU_DIR/kernel"; then
            echo "SUSFS موجود داخل KernelSU-Next."
          else
            echo "CONFIG_KSU_SUSFS غير موجود."
            exit 1
          fi

          echo "سيتم تخطي patch 10_enable_susfs_for_ksu.patch."

      - name: تطبيق Patch الخاص بـ BG7n
        run: |
          cd kernel
          patch -p1 --fuzz=0 < "$GITHUB_WORKSPACE/patches-susfs-bg7n.patch"

      - name: تثبيت ملفات SUSFS
        run: |
          cp "$SUSFS_DIR/kernel_patches/fs/susfs.c" kernel/fs/susfs.c
          cp "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" kernel/include/linux/susfs.h
          cp "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" kernel/include/linux/susfs_def.h

          test -f kernel/fs/susfs.c
          test -f kernel/include/linux/susfs.h
          test -f kernel/include/linux/susfs_def.h

      - name: تجهيز أداة config
        run: |
          test -f kernel/scripts/config
          chmod +x kernel/scripts/config

      - name: تجهيز Kernel Config
        run: |
          cp stock.config out/.config
          test -s out/.config

          kernel/scripts/config --file out/.config --enable CONFIG_KSU
          kernel/scripts/config --file out/.config --enable CONFIG_KSU_SUSFS
          kernel/scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_PATH
          kernel/scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          kernel/scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_NATIVE_APP
          kernel/scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          kernel/scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT
          kernel/scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MAP
          kernel/scripts/config --file out/.config --disable CONFIG_TRIM_UNUSED_KSYMS || true
          kernel/scripts/config --file out/.config --disable CONFIG_UNUSED_KSYMS || true

          make -C kernel O="$GITHUB_WORKSPACE/out" ARCH=arm64 olddefconfig
          test -s out/.config

      - name: فحص إعدادات KSU و SUSFS
        run: |
          grep '^CONFIG_KSU=' out/.config || true
          grep '^CONFIG_KSU_SUSFS=' out/.config || true
          grep '^CONFIG_KSU_SUSFS_' out/.config || true

      - name: بناء Kernel Image
        id: kernel_build
        continue-on-error: true
        run: |
          set -o pipefail

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=frame-larger-than" \
            -j"$(nproc)" \
            Image 2>&1 | tee "$GITHUB_WORKSPACE/kernel-build.log"

          BUILD_STATUS=${PIPESTATUS[0]}
          echo "Kernel build status: $BUILD_STATUS"
          exit "$BUILD_STATUS"

      - name: رفع سجل بناء النواة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log-${{ github.run_number }}
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: التحقق من نجاح بناء Kernel Image
        if: steps.kernel_build.outcome == 'success'
        run: |
          test -s out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

      - name: إيقاف البناء إذا فشل Kernel
        if: steps.kernel_build.outcome != 'success'
        run: |
          echo "فشل بناء Kernel Image."
          exit 1

      - name: تحميل Magiskboot
        run: |
          set -e

          MAGISK_URL="$(
            python3 -c 'import json,sys,urllib.request; d=json.load(urllib.request.urlopen("https://api.github.com/repos/topjohnwu/Magisk/releases/latest")); a=[x["browser_download_url"] for x in d.get("assets",[]) if x["name"].lower().endswith(".apk")]; print(a[0] if a else (_ for _ in ()).throw(SystemExit("لم يتم العثور على Magisk APK")))'
          )"

          echo "$MAGISK_URL"

          wget -fL \
            --retry-connrefused \
            --tries=5 \
            --waitretry=3 \
            -O tools/Magisk.apk \
            "$MAGISK_URL"

          test -s tools/Magisk.apk

      - name: استخراج Magiskboot
        run: |
          set -e

          unzip -l tools/Magisk.apk | grep magiskboot

          unzip -p tools/Magisk.apk \
            lib/x86_64/libmagiskboot.so \
            > tools/magiskboot

          test -s tools/magiskboot
          chmod +x tools/magiskboot
          file tools/magiskboot
          tools/magiskboot --help

      - name: تحميل boot.img من Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: stock-boot
        run: |
          set -e

          rm -rf bootwork
          mkdir -p bootwork

          gh release download \
            "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --dir bootwork

          ZIP_FILE="$(find bootwork -maxdepth 1 -type f -name '*.zip' | head -1)"

          test -n "$ZIP_FILE"
          test -f "$ZIP_FILE"

          mkdir -p bootwork/extracted
          unzip -o "$ZIP_FILE" -d bootwork/extracted

          BOOT_FILE="$(find bootwork/extracted -type f -name 'boot.img' | head -1)"

          test -n "$BOOT_FILE"
          test -f "$BOOT_FILE"

          cp "$BOOT_FILE" bootwork/boot.img
          test -s bootwork/boot.img

      - name: فك boot.img الأصلي
        run: |
          cd bootwork
          "$GITHUB_WORKSPACE/tools/magiskboot" unpack boot.img
          test -s kernel
          file kernel
          ls -lh kernel

      - name: استبدال Kernel الأصلي
        run: |
          test -s out/arch/arm64/boot/Image

          cp \
            out/arch/arm64/boot/Image \
            bootwork/kernel

          test -s bootwork/kernel

      - name: إعادة بناء boot.img
        run: |
          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" repack boot.img

          test -s new-boot.img

          mv \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

          test -s "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

      - name: فحص boot النهائي
        run: |
          test -s boot-BG7n-SUSFS-KSU.img

          ls -lh boot-BG7n-SUSFS-KSU.img
          sha256sum boot-BG7n-SUSFS-KSU.img
          file boot-BG7n-SUSFS-KSU.img

      - name: تجهيز SUSFS Module
        run: |
          cd "$SUSFS_DIR"

          tar -czf \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz" \
            ksu_module_susfs

          test -s "$GITHUB_WORKSPACE/susfs-module-source.tar.gz"

      - name: التحقق من ملفات Artifact
        run: |
          test -s boot-BG7n-SUSFS-KSU.img
          test -s out/arch/arm64/boot/Image
          test -s out/.config
          test -s susfs-module-source.tar.gz
          test -s patches-susfs-bg7n.patch

          ls -lh \
            boot-BG7n-SUSFS-KSU.img \
            out/arch/arm64/boot/Image \
            out/.config \
            susfs-module-source.tar.gz \
            patches-susfs-bg7n.patch

      - name: رفع ملفات البناء النهائية
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-SUSFS-KSU-build-${{ github.run_number }}
          path: |
            boot-BG7n-SUSFS-KSU.img
            out/arch/arm64/boot/Image
            out/.config
            susfs-module-source.tar.gz
            patches-susfs-bg7n.patch
          if-no-files-found: error
          retention-days: 14

name: Build BG7n SUSFS + KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      - name: Step 1
        uses: actions/checkout@v4

      - name: Step 2
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libssl-dev \
            libelf-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            curl \
            xz-utils \
            zstd \
            device-tree-compiler \
            file

      - name: Step 3
        env:
          KERNEL_COMMIT: d09ef2e980e0974a0d6dfe762e29fff118db7f46
        run: |
          git init kernel

          cd kernel

          git remote add origin \
            https://android.googlesource.com/kernel/common

          git fetch --depth=1 origin "$KERNEL_COMMIT"

          git checkout --detach FETCH_HEAD

          echo "Kernel source commit:"
          git rev-parse HEAD

      - name: Step 4
        run: |
          rm -rf out
          rm -rf work
          rm -rf tools
          rm -rf bootwork

          mkdir -p out
          mkdir -p work
          mkdir -p tools
          mkdir -p bootwork

      - name: Step 5
        run: |
          tar -xzf \
            KernelSU-Next.tar.gz \
            -C work

          tar -xzf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            -C work

          KSU_DIR="$(find work \
            -maxdepth 1 \
            -type d \
            -name 'KernelSU-Next-*' \
            | head -1)"

          SUSFS_DIR="work/susfs4ksu-gki-android12-5.10"

          test -d "$KSU_DIR"
          test -d "$SUSFS_DIR"

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          echo "SUSFS_DIR=$SUSFS_DIR" >> "$GITHUB_ENV"

          echo "KernelSU directory:"
          echo "$KSU_DIR"

          echo "SUSFS directory:"
          echo "$SUSFS_DIR"

      - name: Step 6
        run: |
          cd kernel

          bash \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/setup.sh"

          test -d drivers/kernelsu

          echo "OK"

      - name: Step 7
        run: |
          test -f \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/Kconfig"

          test -f \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/Kbuild"

          if grep -Rqs "CONFIG_KSU_SUSFS" \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel"; then

            echo "OK"

          else

            echo "OK"
            exit 1

          fi

          echo "OK"

      - name: Step 8
        run: |
          cd kernel

          patch -p1 --fuzz=0 \
            < "$GITHUB_WORKSPACE/patches-susfs-bg7n.patch"

          echo "OK"

      - name: Step 9
        run: |
          cp \
            "$SUSFS_DIR/kernel_patches/fs/susfs.c" \
            kernel/fs/susfs.c

          cp \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" \
            kernel/include/linux/susfs.h

          cp \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" \
            kernel/include/linux/susfs_def.h

          test -f kernel/fs/susfs.c
          test -f kernel/include/linux/susfs.h
          test -f kernel/include/linux/susfs_def.h

          echo "OK"

      - name: Step 10
        run: |
          test -f kernel/scripts/config

          chmod +x kernel/scripts/config

          echo "OK"

      - name: Step 11
        run: |
          cp \
            stock.config \
            out/.config

          test -s out/.config

          echo "OK"

      - name: Step 12
        run: |
          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_THREAD_INFO_IN_TASK

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_PATH

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_NATIVE_APP

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_MAP

          kernel/scripts/config \
            --file out/.config \
            --disable CONFIG_TRIM_UNUSED_KSYMS \
            || true

          kernel/scripts/config \
            --file out/.config \
            --disable CONFIG_UNUSED_KSYMS \
            || true

          echo "OK"

      - name: Step 13
        run: |
          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            olddefconfig

          test -s out/.config

          echo "OK"

      - name: Step 14
        run: |
          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_THREAD_INFO_IN_TASK

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_PATH

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_NATIVE_APP

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_MAP

      - name: Step 15
        run: |
          set -e

          grep -qx 'CONFIG_THREAD_INFO_IN_TASK=y' out/.config
          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS_SUS_PATH=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS_SUS_MOUNT=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS_SUS_KSTAT=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS_SUS_MAP=y' out/.config

          echo "=============================="
          echo "KernelSU"
          echo "=============================="

          grep '^CONFIG_KSU=' \
            out/.config || true

          echo "=============================="
          echo "SUSFS"
          echo "=============================="

          grep '^CONFIG_KSU_SUSFS=' \
            out/.config || true

          echo "=============================="
          echo "SUSFS OPTIONS"
          echo "=============================="

          grep '^CONFIG_KSU_SUSFS_' \
            out/.config || true

      - name: Step 16
        id: kernel_build
        continue-on-error: true
        run: |
          set -o pipefail

          echo "=============================="
          echo "OK"
          echo "=============================="

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=frame-larger-than" \
            -j"$(nproc)" \
            Image \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/kernel-build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "=============================="
          echo "OK"
          echo "=============================="

          exit "$BUILD_STATUS"

      - name: Step 17
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log-${{ github.run_number }}
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Step 18
        if: steps.kernel_build.outcome == 'success'
        run: |
          test -s \
            out/arch/arm64/boot/Image

          file \
            out/arch/arm64/boot/Image

          ls -lh \
            out/arch/arm64/boot/Image

          echo "OK"

      - name: Step 19
        if: steps.kernel_build.outcome != 'success'
        run: |
          echo "OK"
          exit 1

      - name: Step 20
        run: |
          set -e

          MAGISK_VERSION="v30.7"

          MAGISK_URL="https://github.com/topjohnwu/Magisk/releases/download/${MAGISK_VERSION}/Magisk-${MAGISK_VERSION}.apk"

          echo "Magisk URL:"
          echo "$MAGISK_URL"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            -o tools/Magisk.apk \
            "$MAGISK_URL"

          test -s tools/Magisk.apk

          echo "OK"

      - name: Step 21
        run: |
          set -e

          unzip -l \
            tools/Magisk.apk \
            | grep 'libmagiskboot.so'

          unzip -p \
            tools/Magisk.apk \
            lib/x86_64/libmagiskboot.so \
            > tools/magiskboot

          test -s tools/magiskboot

          chmod +x tools/magiskboot

          file tools/magiskboot

          echo "OK"

      - name: Step 22
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: stock-boot
        run: |
          set -e

          rm -rf bootwork
          mkdir -p bootwork

          gh release download \
            "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --dir bootwork

          echo "OK"
          ls -lh bootwork

          ZIP_FILE="$(
            find bootwork \
              -maxdepth 1 \
              -type f \
              -name '*.zip' \
              | head -1
          )"

          test -n "$ZIP_FILE"
          test -f "$ZIP_FILE"

          echo "OK"
          echo "$ZIP_FILE"

          mkdir -p bootwork/extracted

          unzip -o \
            "$ZIP_FILE" \
            -d bootwork/extracted

          BOOT_FILE="$(
            find bootwork/extracted \
              -type f \
              -name 'boot.img' \
              | head -1
          )"

          test -n "$BOOT_FILE"
          test -f "$BOOT_FILE"

          cp \
            "$BOOT_FILE" \
            bootwork/boot.img

          test -s \
            bootwork/boot.img

          echo "OK"

      - name: Step 23
        run: |
          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            unpack boot.img

          test -s kernel

          echo "OK"

          file kernel

          ls -lh kernel

      - name: Step 24
        run: |
          test -s \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"

          cp \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" \
            "$GITHUB_WORKSPACE/bootwork/kernel"

          test -s \
            "$GITHUB_WORKSPACE/bootwork/kernel"

          echo "OK"

      - name: Step 25
        run: |
          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            repack boot.img

          test -s new-boot.img

          mv \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

          test -s \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

          echo "OK"

      - name: Step 26
        run: |
          test -s \
            boot-BG7n-SUSFS-KSU.img

          echo "=============================="
          echo "BOOT FINAL"
          echo "=============================="

          ls -lh \
            boot-BG7n-SUSFS-KSU.img

          sha256sum \
            boot-BG7n-SUSFS-KSU.img

          file \
            boot-BG7n-SUSFS-KSU.img

      - name: Step 27
        run: |
          cd "$SUSFS_DIR"

          tar -czf \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz" \
            ksu_module_susfs

          test -s \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz"

      - name: Step 28
        run: |
          set -e

          test -s \
            boot-BG7n-SUSFS-KSU.img

          test -s \
            out/arch/arm64/boot/Image

          test -s \
            out/.config

          test -s \
            susfs-module-source.tar.gz

          test -s \
            patches-susfs-bg7n.patch

          echo "OK"
          ls -lh \
            boot-BG7n-SUSFS-KSU.img \
            out/arch/arm64/boot/Image \
            out/.config \
            susfs-module-source.tar.gz \
            patches-susfs-bg7n.patch

      - name: Step 29
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-SUSFS-KSU-build-${{ github.run_number }}
          path: |
            boot-BG7n-SUSFS-KSU.img
            out/arch/arm64/boot/Image
            out/.config
            susfs-module-source.tar.gz
            patches-susfs-bg7n.patch
          if-no-files-found: error
          retention-days: 14

      - name: Step 30
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boot-BG7n-SUSFS-KSU-${{ github.run_number }}
          path: boot-BG7n-SUSFS-KSU.img
          if-no-files-found: error
          retention-days: 14

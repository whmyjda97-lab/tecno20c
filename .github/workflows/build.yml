name: "Build BG7n GKI r3 + KernelSU + SUSFS"

on:
  workflow_dispatch:
    inputs:
      susfs_ref:
        description: "Pinned SUSFS commit for android12-5.10"
        required: false
        default: "be08face56c347e7ba9c4fb420c2463598a14f5d"

      make_jobs:
        description: "Kernel build jobs"
        required: false
        default: "4"

      boot_release_tag:
        description: "GitHub Release tag containing stock BG7n boot.img.zip"
        required: false
        default: "stock-boot"

permissions:
  contents: read

concurrency:
  group: bg7n-${{ github.ref }}
  cancel-in-progress: true

env:
  # ==============================================================
  # GOOGLE GKI
  # ==============================================================

  GKI_MANIFEST_BRANCH: common-android12-5.10-2025-06
  GKI_COMMON_TAG: android12-5.10-2025-06_r3
  GKI_VERSION: "5.10.237"
  GKI_SHA: d09ef2e980e0974a0d6dfe762e29fff118db7f46

  # ==============================================================
  # KERNELSU
  # ==============================================================

  KSU_REPO: https://github.com/5ec1cff/KernelSU.git
  KSU_COMMIT: 3be1013dbda6ebab14e7fcd231bcbae5ce6425ff

  # ==============================================================
  # SUSFS
  # ==============================================================

  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git

  # ==============================================================
  # DEVICE
  # ==============================================================

  BOOT_REPO: whmyjda97-lab/tecno20c
  DEVICE: BG7n
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout build kit
        uses: actions/checkout@v4

      # ============================================================
      # HOST DEPENDENCIES
      # ============================================================

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            curl \
            device-tree-compiler \
            dwarves \
            file \
            flex \
            gawk \
            gh \
            git \
            gnupg \
            gperf \
            jq \
            libdw-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5-dev \
            libssl-dev \
            libunwind-dev \
            lld \
            llvm \
            lz4 \
            openssl \
            pahole \
            patchelf \
            pkg-config \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zip \
            android-sdk-libsparse-utils

          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-nm --version
          python3 --version
          gh --version

      # ============================================================
      # ANDROID NDK
      # ============================================================

      - name: Install Android NDK r25b
        shell: bash
        run: |
          set -euxo pipefail

          NDK_VERSION="25.2.9519653"
          NDK_ARCHIVE="android-ndk-r25b-linux.zip"

          SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          NDK_ROOT="${SDK_ROOT}/ndk/${NDK_VERSION}"

          rm -rf \
            "${SDK_ROOT}" \
            "${RUNNER_TEMP}/android-ndk"

          mkdir -p \
            "${SDK_ROOT}/ndk" \
            "${RUNNER_TEMP}/android-ndk"

          curl -fL \
            "https://dl.google.com/android/repository/${NDK_ARCHIVE}" \
            -o "${RUNNER_TEMP}/${NDK_ARCHIVE}"

          unzip -q \
            "${RUNNER_TEMP}/${NDK_ARCHIVE}" \
            -d "${RUNNER_TEMP}/android-ndk"

          test -d \
            "${RUNNER_TEMP}/android-ndk/android-ndk-r25b"

          mv \
            "${RUNNER_TEMP}/android-ndk/android-ndk-r25b" \
            "${NDK_ROOT}"

          test -x "${NDK_ROOT}/ndk-build"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${NDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${NDK_ROOT}" >> "${GITHUB_PATH}"

          "${NDK_ROOT}/ndk-build" --version

      # ============================================================
      # STOCK BOOT
      # ============================================================

      - name: Fetch exact stock BG7n boot image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOT_RELEASE_TAG: ${{ inputs.boot_release_tag }}
        run: |
          set -euo pipefail

          rm -rf stock-release stock
          mkdir -p stock-release stock

          gh release view \
            "${BOOT_RELEASE_TAG}" \
            --repo "${BOOT_REPO}" \
            --json tagName,name,assets \
            --jq '.tagName + " | " + .name + " | assets=" + ((.assets|length)|tostring)'

          gh release download \
            "${BOOT_RELEASE_TAG}" \
            --repo "${BOOT_REPO}" \
            --dir stock-release

          CANDIDATES=()

          while IFS= read -r -d '' z; do

            mapfile -t ENTRIES < <(
              unzip -Z1 "$z" 2>/dev/null |
              grep -Ei '(^|/)boot\.img$' ||
              true
            )

            if [ "${#ENTRIES[@]}" -eq 1 ]; then
              CANDIDATES+=("$z")
              echo "Boot candidate: $z"
              echo "Boot member:   ${ENTRIES[0]}"
            fi

          done < <(
            find stock-release \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              -print0
          )

          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release ZIP containing exactly one boot.img."
            echo "Candidates: ${#CANDIDATES[@]}"
            printf '%s\n' "${CANDIDATES[@]:-<none>}"
            exit 1
          fi

          BOOT_ASSET="${CANDIDATES[0]}"

          mapfile -t BOOT_ENTRIES < <(
            unzip -Z1 "${BOOT_ASSET}" |
            grep -Ei '(^|/)boot\.img$'
          )

          unzip -p \
            "${BOOT_ASSET}" \
            "${BOOT_ENTRIES[0]}" \
            > stock/boot.img

          test -s stock/boot.img

          file stock/boot.img

          sha256sum stock/boot.img \
            | tee stock/boot.sha256

      # ============================================================
      # STOCK DEFCONFIG
      # ============================================================

      - name: Verify BG7n stock defconfig
        shell: bash
        run: |
          set -euxo pipefail

          test -s BG7n_stock_defconfig

          echo "=== BG7n stock defconfig SHA256 ==="
          sha256sum BG7n_stock_defconfig

          echo "=== Stock config facts ==="

          grep -E \
            '^CONFIG_(ARM64_4K_PAGES|ARM64_16K_PAGES|ARM64_64K_PAGES|ARM64_VA_BITS_[0-9]+|ARM64_PA_BITS_[0-9]+|LTO_NONE|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|CFI_CLANG|CFI_PERMISSIVE|CFI_CLANG_SHADOW|SHADOW_CALL_STACK|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS|TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST)=' \
            BG7n_stock_defconfig || true

      # ============================================================
      # REPO
      # ============================================================

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o repo

          chmod +x repo

          sudo install \
            -m 0755 \
            repo \
            /usr/local/bin/repo

          repo --version

      # ============================================================
      # GOOGLE GKI
      # ============================================================

      - name: Sync exact Google GKI r3 source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf gki
          mkdir -p gki

          cd gki

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${GKI_MANIFEST_BRANCH}" \
            --depth=1

          repo sync \
            -c \
            -j2 \
            --no-tags \
            --no-clone-bundle

          test -d common
          test -f common/Makefile

          git -C common fetch \
            --no-tags \
            https://android.googlesource.com/kernel/common.git \
            "refs/tags/${GKI_COMMON_TAG}:refs/tags/${GKI_COMMON_TAG}"

          git -C common checkout \
            --detach \
            "refs/tags/${GKI_COMMON_TAG}"

          COMMON_COMMIT="$(git -C common rev-parse HEAD)"

          test "${COMMON_COMMIT}" = "${GKI_SHA}"

          test \
            "$(make -s -C common kernelversion)" = \
            "${GKI_VERSION}"

          repo manifest -r > manifest.lock.xml

          cat > ../gki_identity.txt <<EOF
          GKI_MANIFEST_BRANCH=${GKI_MANIFEST_BRANCH}
          GKI_COMMON_TAG=${GKI_COMMON_TAG}
          GKI_VERSION=${GKI_VERSION}
          GKI_SHA=${GKI_SHA}
          COMMON_COMMIT=${COMMON_COMMIT}
          EOF

      # ============================================================
      # GOOGLE LLVM
      # ============================================================

      - name: Select exact Google GKI LLVM
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          CLANG_PREBUILT_BIN="$(
            awk -F= '
              /^CLANG_PREBUILT_BIN=/ {
                print $2
                exit
              }
            ' common/build.config.common
          )"

          test -n "${CLANG_PREBUILT_BIN}"

          GKI_CLANG_BIN="${PWD}/${CLANG_PREBUILT_BIN}"

          test -x "${GKI_CLANG_BIN}/clang"
          test -x "${GKI_CLANG_BIN}/ld.lld"
          test -x "${GKI_CLANG_BIN}/llvm-ar"
          test -x "${GKI_CLANG_BIN}/llvm-nm"

          echo "GKI_CLANG_BIN=${GKI_CLANG_BIN}" >> "${GITHUB_ENV}"
          echo "LLVM=1" >> "${GITHUB_ENV}"
          echo "LLVM_IAS=1" >> "${GITHUB_ENV}"
          echo "${GKI_CLANG_BIN}" >> "${GITHUB_PATH}"

          "${GKI_CLANG_BIN}/clang" --version
          "${GKI_CLANG_BIN}/ld.lld" --version

      # ============================================================
      # KERNELSU
      # ============================================================

      - name: Install exact KernelSU
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          rm -rf KernelSU

          git clone \
            --no-tags \
            --filter=blob:none \
            "${KSU_REPO}" \
            KernelSU

          git -C KernelSU fetch \
            --no-tags \
            origin \
            "${KSU_COMMIT}"

          git -C KernelSU checkout \
            --detach \
            "${KSU_COMMIT}"

          ACTUAL_KSU_COMMIT="$(git -C KernelSU rev-parse HEAD)"

          test "${ACTUAL_KSU_COMMIT}" = "${KSU_COMMIT}"

          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Kbuild

          {
            echo "KERNELSU_REPO=${KSU_REPO}"
            echo "KERNELSU_COMMIT=${ACTUAL_KSU_COMMIT}"
          } | tee ../kernelsu_identity.txt

      # ============================================================
      # SUSFS
      # ============================================================

      - name: Clone and verify SUSFS
        shell: bash
        working-directory: gki
        env:
          SUSFS_REF: ${{ inputs.susfs_ref }}
        run: |
          set -euxo pipefail

          rm -rf susfs

          git clone \
            --no-tags \
            --filter=blob:none \
            "${SUSFS_REPO}" \
            susfs

          git -C susfs fetch \
            --no-tags \
            origin \
            "${SUSFS_REF}"

          git -C susfs checkout \
            --detach \
            "${SUSFS_REF}"

          SUSFS_COMMIT="$(git -C susfs rev-parse HEAD)"

          test "${SUSFS_COMMIT}" = "${SUSFS_REF}"

          test -f \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          test -f \
            susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          test -d susfs/kernel_patches/fs
          test -d susfs/kernel_patches/include/linux

          test -f \
            susfs/ksu_module_susfs/module.prop

          grep -Eq \
            '^version=v?2\.2\.0($|[.-])' \
            susfs/ksu_module_susfs/module.prop

          {
            echo "SUSFS_REPO=${SUSFS_REPO}"
            echo "SUSFS_COMMIT=${SUSFS_COMMIT}"
          } | tee ../susfs_identity.txt

      # ============================================================
      # APPLY SUSFS
      # ============================================================

      - name: Apply SUSFS patches
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          cp \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            KernelSU/

          cp \
            susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            common/

          cp -a \
            susfs/kernel_patches/fs/. \
            common/fs/

          cp -a \
            susfs/kernel_patches/include/linux/. \
            common/include/linux/

          (
            cd KernelSU
            patch --batch --forward -p1 \
              < 10_enable_susfs_for_ksu.patch
          )

          (
            cd common
            patch --batch --forward -p1 \
              < 50_add_susfs_in_gki-android12-5.10.patch
          )

      # ============================================================
      # INTEGRATE KSU
      # ============================================================

      - name: Integrate KernelSU
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          rm -rf common/drivers/kernelsu

          KSU_RELATIVE="$(
            realpath \
              --relative-to=common/drivers \
              KernelSU/kernel
          )"

          ln -s \
            "${KSU_RELATIVE}" \
            common/drivers/kernelsu

          test -L common/drivers/kernelsu
          test -f common/drivers/kernelsu/Kconfig
          test -f common/drivers/kernelsu/Kbuild

          if ! grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            common/drivers/Makefile
          then
            printf '%s\n' \
              'obj-$(CONFIG_KSU) += kernelsu/' \
              >> common/drivers/Makefile
          fi

          if ! grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            common/drivers/Kconfig
          then
            python3 - <<'PY'
          from pathlib import Path

          p = Path("common/drivers/Kconfig")
          text = p.read_text()
          source = 'source "drivers/kernelsu/Kconfig"\n'

          if source not in text:
              pos = text.rfind("endmenu")

              if pos < 0:
                  raise SystemExit(
                      "ERROR: drivers/Kconfig has no endmenu"
                  )

              text = (
                  text[:pos]
                  + source
                  + "\n"
                  + text[pos:]
              )

              p.write_text(text)
          PY
          fi

          grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            common/drivers/Kconfig

          grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            common/drivers/Makefile

          grep -Rqs \
            '^config[[:space:]]\+KSU\([[:space:]]\|$\)' \
            common/drivers/kernelsu

          grep -Rqs \
            '^config[[:space:]]\+KSU_SUSFS\([[:space:]]\|$\)' \
            common/drivers/kernelsu

          echo "KernelSU integration OK"

      # ============================================================
      # CLEAN GENERATED CONFIG
      # ============================================================

      - name: Remove stale generated configuration
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          rm -f .config defconfig

          rm -rf \
            include/config \
            include/generated \
            arch/arm64/include/generated

      # ============================================================
      # GENERATE BG7N DEFCONFIG
      # ============================================================

      - name: Generate BG7n KSU SUSFS defconfig
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          STOCK_CONFIG="${GITHUB_WORKSPACE}/BG7n_stock_defconfig"
          GKI_BASE_CONFIG="${PWD}/arch/arm64/configs/gki_defconfig"
          CONFIG_OUT="${RUNNER_TEMP}/bg7n-kconfig"

          test -s "${STOCK_CONFIG}"
          test -s "${GKI_BASE_CONFIG}"

          rm -rf "${CONFIG_OUT}"
          mkdir -p "${CONFIG_OUT}"

          # ----------------------------------------------------------
          # IMPORTANT:
          #
          # The stock/GKI configuration may contain:
          #
          # CONFIG_TRIM_UNUSED_KSYMS=y
          # CONFIG_UNUSED_KSYMS_WHITELIST="abi_symbol_list.raw"
          #
          # This is exactly what caused the error in the screenshot.
          #
          # We intentionally remove these options for the custom
          # KernelSU/SUSFS kernel.
          # ----------------------------------------------------------

          cat > "${CONFIG_OUT}/protected.symbols" <<'EOF'
          CONFIG_LTO_NONE
          CONFIG_LTO_CLANG
          CONFIG_LTO_CLANG_FULL
          CONFIG_LTO_CLANG_THIN
          CONFIG_CFI_CLANG
          CONFIG_CFI_PERMISSIVE
          CONFIG_CFI_CLANG_SHADOW
          CONFIG_SHADOW_CALL_STACK
          CONFIG_KASAN
          CONFIG_KASAN_GENERIC
          CONFIG_KASAN_SW_TAGS
          CONFIG_KASAN_HW_TAGS
          CONFIG_ARM64_MTE
          CONFIG_ARM64_TAGGED_ADDR_ABI
          CONFIG_MODULES
          CONFIG_MODVERSIONS
          CONFIG_KALLSYMS
          CONFIG_KALLSYMS_ALL
          CONFIG_OVERLAY_FS
          CONFIG_GCOV_KERNEL
          CONFIG_FTRACE_MCOUNT_USE_RECORDMCOUNT
          CONFIG_TRIM_UNUSED_KSYMS
          CONFIG_UNUSED_KSYMS_WHITELIST
          EOF

          python3 - \
            "${CONFIG_OUT}/protected.symbols" \
            "${STOCK_CONFIG}" \
            "${CONFIG_OUT}/bg7n_stock.filtered" <<'PY'
          import re
          import sys
          from pathlib import Path

          protected = {
              line.strip()
              for line in Path(sys.argv[1]).read_text().splitlines()
              if line.strip()
          }

          stock = Path(sys.argv[2])
          output = Path(sys.argv[3])

          config_re = re.compile(
              r"^CONFIG_[A-Z0-9_]+="
          )

          unset_re = re.compile(
              r"^# CONFIG_[A-Z0-9_]+ is not set$"
          )

          kept = []

          for line in stock.read_text().splitlines():

              if config_re.match(line):
                  sym = line.split("=", 1)[0]

                  if sym in protected:
                      continue

              elif unset_re.match(line):
                  sym = line[2:].split(
                      " is not set",
                      1
                  )[0]

                  if sym in protected:
                      continue

              kept.append(line)

          output.write_text(
              "\n".join(kept) + "\n"
          )

          print(
              f"Filtered stock config: "
              f"{len(kept)} lines"
          )
          PY

          cp \
            "${GKI_BASE_CONFIG}" \
            "${CONFIG_OUT}/gki_base.config"

          ./scripts/kconfig/merge_config.sh \
            -m \
            -r \
            -O "${CONFIG_OUT}" \
            "${CONFIG_OUT}/gki_base.config" \
            "${CONFIG_OUT}/bg7n_stock.filtered"

          test -s "${CONFIG_OUT}/.config"

          # ----------------------------------------------------------
          # Explicitly disable GKI symbol trimming.
          # ----------------------------------------------------------

          scripts/config \
            --file "${CONFIG_OUT}/.config" \
            -d TRIM_UNUSED_KSYMS \
            -d UNUSED_KSYMS_WHITELIST

          # ----------------------------------------------------------
          # Enable KernelSU / SUSFS.
          # ----------------------------------------------------------

          scripts/config \
            --file "${CONFIG_OUT}/.config" \
            -e KSU \
            -e KSU_SUSFS

          # ----------------------------------------------------------
          # Resolve configuration.
          # ----------------------------------------------------------

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            olddefconfig

          # ----------------------------------------------------------
          # Verify the actual resolved config.
          # ----------------------------------------------------------

          echo
          echo "=== RESOLVED CONFIG ==="

          grep -E \
            '^CONFIG_(KSU|KSU_SUSFS|TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|THREAD_INFO_IN_TASK|KPROBES|EXT4_FS)=' \
            "${CONFIG_OUT}/.config" || true

          grep -q \
            '^CONFIG_KSU=y$' \
            "${CONFIG_OUT}/.config"

          grep -q \
            '^CONFIG_KSU_SUSFS=y$' \
            "${CONFIG_OUT}/.config"

          grep -q \
            '^CONFIG_MODULES=y$' \
            "${CONFIG_OUT}/.config"

          grep -q \
            '^CONFIG_MODVERSIONS=y$' \
            "${CONFIG_OUT}/.config"

          grep -q \
            '^CONFIG_KALLSYMS=y$' \
            "${CONFIG_OUT}/.config"

          # ----------------------------------------------------------
          # CRITICAL FIX VERIFICATION
          # ----------------------------------------------------------

          if grep -q \
            '^CONFIG_TRIM_UNUSED_KSYMS=y$' \
            "${CONFIG_OUT}/.config"
          then
            echo "::error::CONFIG_TRIM_UNUSED_KSYMS is still enabled"
            exit 1
          fi

          if grep -q \
            '^CONFIG_UNUSED_KSYMS_WHITELIST=' \
            "${CONFIG_OUT}/.config"
          then
            echo "::error::CONFIG_UNUSED_KSYMS_WHITELIST is still set"
            exit 1
          fi

          echo
          echo "=== KSU/SUSFS CONFIGURATION OK ==="

          # ----------------------------------------------------------
          # Save minimal defconfig.
          # ----------------------------------------------------------

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            savedefconfig

          cp \
            "${CONFIG_OUT}/defconfig" \
            arch/arm64/configs/bg7n_defconfig

          test -s \
            arch/arm64/configs/bg7n_defconfig

          echo
          echo "=== FINAL MINIMAL DEFCONFIG ==="

          grep -E \
            '^CONFIG_(KSU|KSU_SUSFS|TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST)=' \
            arch/arm64/configs/bg7n_defconfig || true

          # ----------------------------------------------------------
          # Re-expand final defconfig.
          # ----------------------------------------------------------

          rm -f "${CONFIG_OUT}/.config"

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            bg7n_defconfig

          cp \
            "${CONFIG_OUT}/.config" \
            "${CONFIG_OUT}/expanded.config"

          grep -q \
            '^CONFIG_KSU=y$' \
            "${CONFIG_OUT}/expanded.config"

          grep -q \
            '^CONFIG_KSU_SUSFS=y$' \
            "${CONFIG_OUT}/expanded.config"

          grep -q \
            '^CONFIG_MODULES=y$' \
            "${CONFIG_OUT}/expanded.config"

          grep -q \
            '^CONFIG_MODVERSIONS=y$' \
            "${CONFIG_OUT}/expanded.config"

          grep -q \
            '^CONFIG_KALLSYMS=y$' \
            "${CONFIG_OUT}/expanded.config"

          if grep -q \
            '^CONFIG_TRIM_UNUSED_KSYMS=y$' \
            "${CONFIG_OUT}/expanded.config"
          then
            echo "::error::TRIM_UNUSED_KSYMS returned after defconfig expansion"
            exit 1
          fi

          if grep -q \
            '^CONFIG_UNUSED_KSYMS_WHITELIST=' \
            "${CONFIG_OUT}/expanded.config"
          then
            echo "::error::UNUSED_KSYMS_WHITELIST returned after expansion"
            exit 1
          fi

          echo
          echo "=== FINAL CONFIG PASSED ==="

      # ============================================================
      # SAVE DEFCONFIG
      # ============================================================

      - name: Save final BG7n defconfig
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          test -s \
            arch/arm64/configs/bg7n_defconfig

          cp \
            arch/arm64/configs/bg7n_defconfig \
            "${GITHUB_WORKSPACE}/BG7n_final_defconfig"

          sha256sum \
            "${GITHUB_WORKSPACE}/BG7n_final_defconfig"

      # ============================================================
      # BUILD CONFIG
      # ============================================================

      - name: Prepare BG7n build config
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          cat > build.config.bg7n.ksu.susfs <<'CFG'
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.gki.aarch64

          DEFCONFIG=bg7n_defconfig

          # ----------------------------------------------------------
          # CUSTOM KSU/SUSFS BUILD
          #
          # Do NOT use GKI KMI trimming.
          # This prevents build.sh from creating/using
          # abi_symbol_list.raw as CONFIG_UNUSED_KSYMS_WHITELIST.
          # ----------------------------------------------------------

          KMI_ENFORCED=0
          KMI_SYMBOL_LIST_STRICT_MODE=0
          TRIM_NONLISTED_KMI=0

          # Keep the ABI symbol list available for metadata, but do not
          # use it for symbol trimming.
          KMI_SYMBOL_LIST=android/abi_gki_aarch64

          # ----------------------------------------------------------
          # Force the actual kernel config after defconfig.
          # ----------------------------------------------------------

          POST_DEFCONFIG_CMDS="update_bg7n_config"

          function update_bg7n_config() {
              ${KERNEL_DIR}/scripts/config \
                  --file ${OUT_DIR}/.config \
                  -d TRIM_UNUSED_KSYMS \
                  -d UNUSED_KSYMS_WHITELIST \
                  -e KSU \
                  -e KSU_SUSFS

              (
                  cd ${OUT_DIR}
                  make O=${OUT_DIR} \
                      ${TOOL_ARGS} \
                      ${MAKE_ARGS} \
                      olddefconfig
              )

              echo "=== POST DEFCONFIG CONFIG ==="

              grep -E \
                  '^CONFIG_(KSU|KSU_SUSFS|TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL)=' \
                  ${OUT_DIR}/.config || true

              grep -q '^CONFIG_KSU=y$' \
                  ${OUT_DIR}/.config

              grep -q '^CONFIG_KSU_SUSFS=y$' \
                  ${OUT_DIR}/.config

              grep -q '^CONFIG_MODULES=y$' \
                  ${OUT_DIR}/.config

              grep -q '^CONFIG_MODVERSIONS=y$' \
                  ${OUT_DIR}/.config

              grep -q '^CONFIG_KALLSYMS=y$' \
                  ${OUT_DIR}/.config

              if grep -q '^CONFIG_TRIM_UNUSED_KSYMS=y$' \
                  ${OUT_DIR}/.config
              then
                  echo "::error::TRIM_UNUSED_KSYMS is enabled"
                  exit 1
              fi

              if grep -q '^CONFIG_UNUSED_KSYMS_WHITELIST=' \
                  ${OUT_DIR}/.config
              then
                  echo "::error::UNUSED_KSYMS_WHITELIST is configured"
                  exit 1
              fi
          }

          MAKE_GOALS="${MAKE_GOALS}
          Image.lz4
          modules
          "

          KMI_ENFORCED=0
          KMI_SYMBOL_LIST_STRICT_MODE=0
          TRIM_NONLISTED_KMI=0
          CFG

          cat build.config.bg7n.ksu.susfs

      # ============================================================
      # FINAL PRE-BUILD CHECK
      # ============================================================

      - name: Verify final configuration before build
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          CHECK_OUT="${RUNNER_TEMP}/bg7n-final-check"

          rm -rf "${CHECK_OUT}"
          mkdir -p "${CHECK_OUT}"

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CHECK_OUT}" \
            bg7n_defconfig

          scripts/config \
            --file "${CHECK_OUT}/.config" \
            -d TRIM_UNUSED_KSYMS \
            -d UNUSED_KSYMS_WHITELIST \
            -e KSU \
            -e KSU_SUSFS

          (
            cd "${CHECK_OUT}"

            make \
              O="${CHECK_OUT}" \
              LLVM=1 \
              LLVM_IAS=1 \
              AR="${GKI_CLANG_BIN}/llvm-ar" \
              NM="${GKI_CLANG_BIN}/llvm-nm" \
              olddefconfig
          )

          echo "=== FINAL PRE-BUILD CONFIG ==="

          grep -E \
            '^CONFIG_(KSU|KSU_SUSFS|TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|THREAD_INFO_IN_TASK)=' \
            "${CHECK_OUT}/.config" || true

          grep -q \
            '^CONFIG_KSU=y$' \
            "${CHECK_OUT}/.config"

          grep -q \
            '^CONFIG_KSU_SUSFS=y$' \
            "${CHECK_OUT}/.config"

          grep -q \
            '^CONFIG_MODULES=y$' \
            "${CHECK_OUT}/.config"

          grep -q \
            '^CONFIG_MODVERSIONS=y$' \
            "${CHECK_OUT}/.config"

          grep -q \
            '^CONFIG_KALLSYMS=y$' \
            "${CHECK_OUT}/.config"

          if grep -q \
            '^CONFIG_TRIM_UNUSED_KSYMS=y$' \
            "${CHECK_OUT}/.config"
          then
            echo "::error::TRIM_UNUSED_KSYMS still enabled"
            exit 1
          fi

          if grep -q \
            '^CONFIG_UNUSED_KSYMS_WHITELIST=' \
            "${CHECK_OUT}/.config"
          then
            echo "::error::UNUSED_KSYMS_WHITELIST still configured"
            exit 1
          fi

          echo "Pre-build configuration OK."

      # ============================================================
      # SOURCE TREE CHECK
      # ============================================================

      - name: Verify GKI source tree
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Kbuild

          grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile

          test -s \
            arch/arm64/configs/bg7n_defconfig

      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build BG7n kernel
        shell: bash
        working-directory: gki
        env:
          MAKE_JOBS: ${{ inputs.make_jobs }}
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-actions
        run: |
          set -euxo pipefail

          case "${MAKE_JOBS}" in
            ''|*[!0-9]*)
              echo "::error::make_jobs must be a positive integer"
              exit 1
              ;;
          esac

          test "${MAKE_JOBS}" -ge 1

          export MAKEFLAGS="-j${MAKE_JOBS}"

          rm -rf out/android12-5.10

          echo "=== Build configuration ==="

          grep -E \
            '^(DEFCONFIG|KMI_ENFORCED|KMI_SYMBOL_LIST_STRICT_MODE|TRIM_NONLISTED_KMI|KMI_SYMBOL_LIST)=' \
            common/build.config.bg7n.ksu.susfs

          echo
          echo "=== Starting kernel build ==="

          BUILD_CONFIG=common/build.config.bg7n.ksu.susfs \
            ./build/build.sh

      # ============================================================
      # VERIFY KERNEL
      # ============================================================

      - name: Verify kernel and collect evidence
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          mkdir -p \
            ../artifact/kernel \
            ../artifact/reports

          IMAGE_LZ4="$(
            find out \
              -type f \
              -path '*/dist/Image.lz4' |
            head -n1 || true
          )"

          IMAGE="$(
            find out \
              -type f \
              -path '*/dist/Image' |
            head -n1 || true
          )"

          test -n "${IMAGE_LZ4}"

          cp \
            "${IMAGE_LZ4}" \
            ../artifact/kernel/Image.lz4

          if [ -n "${IMAGE}" ]; then
            cp \
              "${IMAGE}" \
              ../artifact/kernel/Image
          else
            lz4 -d -f \
              "${IMAGE_LZ4}" \
              ../artifact/kernel/Image
          fi

          CONFIG_FILE="$(
            find out \
              -type f \
              -name .config |
            head -n1 || true
          )"

          test -n "${CONFIG_FILE}"

          cp \
            "${CONFIG_FILE}" \
            ../artifact/kernel/.config

          MODULE_SYMVERS="$(
            find out \
              -type f \
              -name Module.symvers |
            head -n1 || true
          )"

          if [ -n "${MODULE_SYMVERS}" ]; then
            cp \
              "${MODULE_SYMVERS}" \
              ../artifact/kernel/Module.symvers
          fi

          find out \
            -type f \
            -name System.map \
            -exec cp {} ../artifact/kernel/ \; \
            || true

          find out \
            -type f \
            -name modules.builtin \
            -exec cp {} ../artifact/kernel/ \; \
            || true

          find out \
            -type f \
            -name modules.builtin.modinfo \
            -exec cp {} ../artifact/kernel/ \; \
            || true

          echo "=== ACTUAL BUILD CONFIG ==="

          grep -E \
            '^CONFIG_(KSU|KSU_SUSFS|TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|KPROBES|EXT4_FS|THREAD_INFO_IN_TASK|LTO_NONE|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|CFI_CLANG|CFI_PERMISSIVE|SHADOW_CALL_STACK|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|OVERLAY_FS)=' \
            ../artifact/kernel/.config || true

          grep -q \
            '^CONFIG_KSU=y$' \
            ../artifact/kernel/.config

          grep -q \
            '^CONFIG_KSU_SUSFS=y$' \
            ../artifact/kernel/.config

          grep -q \
            '^CONFIG_MODULES=y$' \
            ../artifact/kernel/.config

          grep -q \
            '^CONFIG_MODVERSIONS=y$' \
            ../artifact/kernel/.config

          grep -q \
            '^CONFIG_KALLSYMS=y$' \
            ../artifact/kernel/.config

          if grep -q \
            '^CONFIG_TRIM_UNUSED_KSYMS=y$' \
            ../artifact/kernel/.config
          then
            echo "::error::TRIM_UNUSED_KSYMS unexpectedly enabled"
            exit 1
          fi

          if grep -q \
            '^CONFIG_UNUSED_KSYMS_WHITELIST=' \
            ../artifact/kernel/.config
          then
            echo "::error::UNUSED_KSYMS_WHITELIST unexpectedly configured"
            exit 1
          fi

          {
            echo "=== Kernel version ==="
            make -s -C common kernelversion

            echo
            echo "=== GKI commit ==="
            git -C common rev-parse HEAD

            echo
            echo "=== KernelSU commit ==="
            git -C KernelSU rev-parse HEAD

            echo
            echo "=== SUSFS commit ==="
            git -C susfs rev-parse HEAD

            echo
            echo "=== KMI ==="
            grep -E \
              '^(KMI_ENFORCED|KMI_SYMBOL_LIST_STRICT_MODE|TRIM_NONLISTED_KMI)=' \
              common/build.config.bg7n.ksu.susfs

            echo
            echo "=== Critical configuration ==="
            grep -E \
              '^CONFIG_(KSU|KSU_SUSFS|TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|KPROBES|EXT4_FS|THREAD_INFO_IN_TASK)=' \
              ../artifact/kernel/.config || true

          } | tee \
            ../artifact/reports/kernel_verification.txt

          file ../artifact/kernel/Image

          sha256sum \
            ../artifact/kernel/Image

          sha256sum \
            ../artifact/kernel/Image.lz4

      # ============================================================
      # SUSFS USERSPACE
      # ============================================================

      - name: Build SUSFS userspace helper and module
        shell: bash
        working-directory: gki/susfs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euxo pipefail

          export PATH="${ANDROID_NDK_HOME}:${PATH}"

          chmod +x \
            build_ksu_susfs_tool.sh \
            build_ksu_module.sh

          ./build_ksu_susfs_tool.sh
          ./build_ksu_module.sh

          test -d ksu_module_susfs

          mkdir -p \
            ../../artifact/susfs

          cp -a \
            ksu_module_susfs \
            ../../artifact/susfs/susfs4ksu-module

          if [ -f ksu_module_susfs.zip ]; then
            cp \
              ksu_module_susfs.zip \
              ../../artifact/susfs/susfs4ksu.zip
          fi

      # ============================================================
      # REPACK BOOT
      # ============================================================

      - name: Repack stock boot with built kernel
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            work/boot \
            artifact/boot

          cp \
            stock/boot.img \
            work/boot/boot.img

          MAGISK_API="https://api.github.com/repos/topjohnwu/Magisk/releases/latest"

          MAGISK_URL="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "${MAGISK_API}" |
            jq -r '
              .assets[]
              | select(.name | startswith("Magisk-"))
              | select(.name | endswith(".apk"))
              | .browser_download_url
            ' |
            head -n1
          )"

          test -n "${MAGISK_URL}"

          curl -fL \
            "${MAGISK_URL}" \
            -o magisk.apk

          unzip -j -o \
            magisk.apk \
            'lib/arm64-v8a/libmagiskboot.so' \
            -d work

          mv \
            work/libmagiskboot.so \
            work/magiskboot

          chmod +x \
            work/magiskboot

          (
            cd work/boot

            ../magiskboot unpack boot.img

            test -f kernel

            test -s \
              ../../artifact/kernel/Image

            cp \
              ../../artifact/kernel/Image \
              kernel

            ../magiskboot repack boot.img

            test -s new-boot.img
          )

          cp \
            work/boot/new-boot.img \
            artifact/boot/BG7n-KSU-SUSFS-boot.img

          file \
            artifact/boot/BG7n-KSU-SUSFS-boot.img

          sha256sum \
            artifact/boot/BG7n-KSU-SUSFS-boot.img \
            | tee artifact/reports/generated_boot.sha256

      # ============================================================
      # BUILD INFO
      # ============================================================

      - name: Create build manifest and hashes
        shell: bash
        run: |
          set -euxo pipefail

          SUSFS_COMMIT="$(
            git -C gki/susfs rev-parse HEAD
          )"

          KSU_ACTUAL_COMMIT="$(
            git -C gki/KernelSU rev-parse HEAD
          )"

          COMMON_COMMIT="$(
            git -C gki/common rev-parse HEAD
          )"

          cat > artifact/BUILD_INFO.txt <<EOF
          DEVICE=${DEVICE}

          GOOGLE_GKI_MANIFEST_BRANCH=${GKI_MANIFEST_BRANCH}
          GOOGLE_GKI_COMMON_TAG=${GKI_COMMON_TAG}
          GOOGLE_GKI_VERSION=${GKI_VERSION}
          GOOGLE_GKI_SHA=${GKI_SHA}
          COMMON_COMMIT=${COMMON_COMMIT}

          KERNELSU_REPO=${KSU_REPO}
          KERNELSU_COMMIT=${KSU_ACTUAL_COMMIT}

          SUSFS_REPO=${SUSFS_REPO}
          SUSFS_REF=${{ inputs.susfs_ref }}
          SUSFS_COMMIT=${SUSFS_COMMIT}

          BOOT_RELEASE_REPO=${BOOT_REPO}
          BOOT_RELEASE_TAG=${{ inputs.boot_release_tag }}

          STOCK_BOOT_SHA256=$(cut -d' ' -f1 stock/boot.sha256)

          KMI_ENFORCED=0
          KMI_SYMBOL_LIST_STRICT_MODE=0
          TRIM_NONLISTED_KMI=0

          CONFIG_TRIM_UNUSED_KSYMS=n
          CONFIG_UNUSED_KSYMS_WHITELIST=unset
          EOF

          cp \
            gki/manifest.lock.xml \
            artifact/manifest.lock.xml

          cp \
            stock/boot.sha256 \
            artifact/reports/stock_boot.sha256

          cp \
            BG7n_final_defconfig \
            artifact/kernel/bg7n_final_defconfig

          find artifact \
            -type f \
            ! -name SHA256SUMS.txt \
            -print0 |
            sort -z |
            xargs -0 sha256sum \
            > artifact/SHA256SUMS.txt

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package artifacts
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf artifact/package
          mkdir -p artifact/package

          cp \
            artifact/BUILD_INFO.txt \
            artifact/package/

          cp \
            artifact/SHA256SUMS.txt \
            artifact/package/

          cp -a \
            artifact/kernel \
            artifact/package/kernel

          cp -a \
            artifact/susfs \
            artifact/package/susfs

          cp -a \
            artifact/reports \
            artifact/package/reports

          if [ -d artifact/boot ]; then
            cp -a \
              artifact/boot \
              artifact/package/boot
          fi

          cp \
            BG7n_stock_defconfig \
            artifact/package/

          cp \
            BG7n_final_defconfig \
            artifact/package/

          cat > artifact/package/README.txt <<EOF
          TECNO BG7n
          =============================

          Google GKI:
            ${GKI_COMMON_TAG}
            Linux ${GKI_VERSION}
            Commit ${GKI_SHA}

          KernelSU:
            ${KSU_REPO}
            ${KSU_ACTUAL_COMMIT}

          SUSFS:
            ${SUSFS_REPO}
            ${{ inputs.susfs_ref }}

          Required:
            CONFIG_KSU=y
            CONFIG_KSU_SUSFS=y
            CONFIG_MODULES=y
            CONFIG_MODVERSIONS=y
            CONFIG_KALLSYMS=y

          KMI:
            KMI_ENFORCED=0
            KMI_SYMBOL_LIST_STRICT_MODE=0
            TRIM_NONLISTED_KMI=0

          Symbol trimming:
            CONFIG_TRIM_UNUSED_KSYMS=n
            CONFIG_UNUSED_KSYMS_WHITELIST=unset

          IMPORTANT:
            This is a custom KernelSU/SUSFS kernel.
            It is NOT an unmodified certified GKI kernel.

            Check:
              reports/kernel_verification.txt

            Keep the original stock boot.img
            before flashing the modified boot image.
          EOF

          (
            cd artifact/package

            zip -r \
              ../../BG7n_GKI_r3_KSU_SUSFS_artifacts.zip \
              .
          )

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload complete artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-GKI-r3-KSU-SUSFS
          path: |
            BG7n_GKI_r3_KSU_SUSFS_artifacts.zip
            artifact/
          if-no-files-found: error
          retention-days: 30

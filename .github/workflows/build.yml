name: Build BG7n SUSFS + KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache clang flex \
            gcc-aarch64-linux-gnu git libssl-dev libelf-dev \
            lld llvm python3 python3-pip rsync unzip wget curl \
            xz-utils zstd device-tree-compiler file cpio

      - name: Verify project files
        run: |
          set -euo pipefail

          required_files=(
            "KernelSU-Next.tar.gz"
            "susfs4ksu-gki-android12-5.10.tar.gz"
            "stock.config"
            "patches-susfs-bg7n-legacy-reference.patch"
            "50_add_susfs_in_gki-android12-5.10.patch"
          )

          for f in "${required_files[@]}"; do
            test -f "$f" || {
              echo "Missing required file: $f"
              exit 1
            }
          done

      - name: Verify archive integrity
        run: |
          set -euo pipefail
          mkdir -p verification

          tar -tzf KernelSU-Next.tar.gz > verification/kernelsu-list.txt
          tar -tzf susfs4ksu-gki-android12-5.10.tar.gz > verification/susfs-list.txt

          grep -Eq '/kernel/setup\.sh$' verification/kernelsu-list.txt
          grep -Eq '/kernel/Kconfig$' verification/kernelsu-list.txt
          grep -Eq '/kernel/Kbuild$' verification/kernelsu-list.txt

          grep -Eq '/kernel_patches/fs/susfs\.c$' verification/susfs-list.txt
          grep -Eq '/kernel_patches/include/linux/susfs\.h$' verification/susfs-list.txt
          grep -Eq '/kernel_patches/include/linux/susfs_def\.h$' verification/susfs-list.txt

      - name: Verify SUSFS v2.2.0 source
        run: |
          set -euo pipefail

          tar -xOf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            susfs4ksu-gki-android12-5.10/kernel_patches/include/linux/susfs.h \
            > verification/susfs.h

          grep -Fq \
            '#define SUSFS_VERSION "v2.2.0"' \
            verification/susfs.h

      - name: Prepare workspace
        run: |
          set -euo pipefail
          rm -rf kernel work out tools bootwork
          mkdir -p work out tools bootwork

      - name: Fetch exact Android common kernel
        env:
          KERNEL_COMMIT: d09ef2e980e0974a0d6dfe762e29fff118db7f46
        run: |
          set -euo pipefail

          git init kernel
          cd kernel
          git remote add origin https://android.googlesource.com/kernel/common
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/verification/kernel-commit.txt"

      - name: Extract bundled sources
        run: |
          set -euo pipefail

          tar -xzf KernelSU-Next.tar.gz -C work
          tar -xzf susfs4ksu-gki-android12-5.10.tar.gz -C work

          KSU_DIR="$(find work -maxdepth 1 -mindepth 1 -type d -name 'KernelSU-Next-*' -print -quit)"
          SUSFS_DIR="work/susfs4ksu-gki-android12-5.10"

          test -n "$KSU_DIR"
          test -d "$KSU_DIR"
          test -d "$SUSFS_DIR"

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          echo "SUSFS_DIR=$SUSFS_DIR" >> "$GITHUB_ENV"

      - name: Verify bundled KernelSU-Next
        run: |
          set -euo pipefail

          test -f "$KSU_DIR/kernel/setup.sh"
          test -f "$KSU_DIR/kernel/Kconfig"
          test -f "$KSU_DIR/kernel/Kbuild"

          echo "KernelSU-Next source structure verified."

      - name: Install bundled KernelSU-Next
        run: |
          set -euo pipefail

          cd kernel
          bash "$GITHUB_WORKSPACE/$KSU_DIR/kernel/setup.sh"

          test -d drivers/kernelsu

      - name: Verify BG7n patch applies cleanly
        run: |
          set -euo pipefail

          cd kernel

          patch --dry-run -p1 --fuzz=0 \
            < "$GITHUB_WORKSPACE/patches-susfs-bg7n-legacy-reference.patch" \
            > "$GITHUB_WORKSPACE/verification/bg7n-dry-run.txt" \
            2>&1

      - name: Apply BG7n patch
        run: |
          set -euo pipefail

          cd kernel

          patch --batch --forward -p1 --fuzz=0 \
            < "$GITHUB_WORKSPACE/patches-susfs-bg7n-legacy-reference.patch"

          if find . \( -name '*.rej' -o -name '*.orig' \) -print | grep -q .; then
            find . \( -name '*.rej' -o -name '*.orig' \) -print
            exit 1
          fi

      - name: Verify SUSFS files from BG7n patch
        run: |
          set -euo pipefail

          test -s kernel/fs/susfs.c
          test -s kernel/include/linux/susfs.h
          test -s kernel/include/linux/susfs_def.h

          grep -Fq \
            '#define SUSFS_VERSION "v2.2.0"' \
            kernel/include/linux/susfs.h

      - name: Compare SUSFS files with archive
        run: |
          set -euo pipefail

          tar -xOf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            susfs4ksu-gki-android12-5.10/kernel_patches/fs/susfs.c \
            > verification/archive-susfs.c

          tar -xOf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            susfs4ksu-gki-android12-5.10/kernel_patches/include/linux/susfs.h \
            > verification/archive-susfs.h

          tar -xOf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            susfs4ksu-gki-android12-5.10/kernel_patches/include/linux/susfs_def.h \
            > verification/archive-susfs_def.h

          cmp kernel/fs/susfs.c verification/archive-susfs.c
          cmp kernel/include/linux/susfs.h verification/archive-susfs.h
          cmp kernel/include/linux/susfs_def.h verification/archive-susfs_def.h

      - name: Verify SUSFS Makefile integration
        run: |
          set -euo pipefail

          grep -q \
            'obj-$(CONFIG_KSU_SUSFS) += susfs.o' \
            kernel/fs/Makefile

      - name: Prepare kernel config
        run: |
          set -euo pipefail

          test -f kernel/scripts/config
          chmod +x kernel/scripts/config

          cp stock.config out/.config

          C="$GITHUB_WORKSPACE/kernel/scripts/config"

          "$C" --file out/.config --enable CONFIG_THREAD_INFO_IN_TASK
          "$C" --file out/.config --enable CONFIG_KSU
          "$C" --file out/.config --enable CONFIG_KSU_SUSFS
          "$C" --file out/.config --enable CONFIG_KSU_SUSFS_SUS_PATH
          "$C" --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          "$C" --file out/.config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          "$C" --file out/.config --enable CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT
          "$C" --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MAP
          "$C" --file out/.config --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_NATIVE_APP || true
          "$C" --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME || true
          "$C" --file out/.config --enable CONFIG_KSU_SUSFS_ENABLE_LOG || true
          "$C" --file out/.config --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS || true
          "$C" --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG || true
          "$C" --file out/.config --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT || true
          "$C" --file out/.config --disable CONFIG_TRIM_UNUSED_KSYMS || true
          "$C" --file out/.config --disable CONFIG_UNUSED_KSYMS || true

      - name: Resolve final Kconfig
        run: |
          set -euo pipefail

          make -C kernel O="$GITHUB_WORKSPACE/out" ARCH=arm64 olddefconfig
          test -s out/.config

      - name: Verify final Kconfig
        run: |
          set -euo pipefail

          CFG="$GITHUB_WORKSPACE/out/.config"

          for symbol in \
            CONFIG_THREAD_INFO_IN_TASK \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_SUS_MAP; do

            grep -qx "${symbol}=y" "$CFG" || {
              echo "Required option is not enabled: $symbol"
              exit 1
            }
          done

          cp "$CFG" "$GITHUB_WORKSPACE/final.config"

      - name: Build arm64 Image
        id: kernel_build
        run: |
          set -o pipefail

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=frame-larger-than" \
            -j"$(nproc)" \
            Image \
            2>&1 | tee "$GITHUB_WORKSPACE/kernel-build.log"

          STATUS=${PIPESTATUS[0]}
          exit "$STATUS"

      - name: Verify built kernel and SUSFS
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -euo pipefail

          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"

          test -s "$IMAGE"
          test -s "$GITHUB_WORKSPACE/out/.config"
          test -s "$GITHUB_WORKSPACE/out/vmlinux"

          grep -qx 'CONFIG_KSU=y' "$GITHUB_WORKSPACE/out/.config"
          grep -qx 'CONFIG_KSU_SUSFS=y' "$GITHUB_WORKSPACE/out/.config"

          SUSFS_OBJECTS="$(
            find "$GITHUB_WORKSPACE/out" \
              -type f \
              -name 'susfs.o' \
              -size +0c \
              -print
          )"

          test -n "$SUSFS_OBJECTS"
          echo "$SUSFS_OBJECTS"

          SUSFS_SYMBOLS="$(
            llvm-nm "$GITHUB_WORKSPACE/out/vmlinux" 2>/dev/null \
            | grep -i susfs \
            || true
          )"

          test -n "$SUSFS_SYMBOLS"
          echo "$SUSFS_SYMBOLS" | head -100

          file "$IMAGE"
          ls -lh "$IMAGE"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log-${{ github.run_number }}
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop if kernel failed
        if: steps.kernel_build.outcome != 'success'
        run: |
          echo "Kernel build failed."
          exit 1

      - name: Download Magisk APK
        run: |
          set -euo pipefail

          MAGISK_URL="$(
            curl -fsSL https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); a=[x["browser_download_url"] for x in d.get("assets",[]) if x["name"].startswith("Magisk-") and x["name"].endswith(".apk") and "debug" not in x["name"].lower()]; print(a[0] if a else "")'
          )"

          curl -fL --retry 5 --retry-delay 3 \
            -o tools/Magisk.apk \
            "$MAGISK_URL"

          test -s tools/Magisk.apk

      - name: Extract magiskboot
        run: |
          set -euo pipefail

          unzip -p \
            tools/Magisk.apk \
            lib/x86_64/libmagiskboot.so \
            > tools/magiskboot

          test -s tools/magiskboot
          chmod +x tools/magiskboot

      - name: Download stock boot image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: stock-boot
        run: |
          set -euo pipefail

          rm -rf bootwork
          mkdir -p bootwork

          gh release download \
            "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "boot.img.zip" \
            --dir bootwork

          test -s bootwork/boot.img.zip

          unzip -o \
            bootwork/boot.img.zip \
            -d bootwork

          test -s bootwork/boot.img

      - name: Unpack stock boot
        run: |
          set -euo pipefail

          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            unpack boot.img

          test -s kernel

      - name: Replace kernel
        run: |
          set -euo pipefail

          cp \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" \
            bootwork/kernel

          test -s bootwork/kernel

      - name: Repack boot image
        run: |
          set -euo pipefail

          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            repack boot.img

          test -s new-boot.img

          mv \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

          test -s "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

      - name: Deep verify final boot
        run: |
          set -euo pipefail

          FINAL_BOOT="$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"
          BUILT_IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"

          test -s "$FINAL_BOOT"

          rm -rf verification/final-boot
          mkdir -p verification/final-boot

          cp "$FINAL_BOOT" verification/final-boot/boot.img

          cd verification/final-boot

          "$GITHUB_WORKSPACE/tools/magiskboot" unpack boot.img
          test -s kernel

          FINAL_KERNEL_SHA="$(sha256sum kernel | cut -d' ' -f1)"
          IMAGE_SHA="$(sha256sum "$BUILT_IMAGE" | cut -d' ' -f1)"

          test "$FINAL_KERNEL_SHA" = "$IMAGE_SHA"

          echo "Final boot contains the exact built kernel."

      - name: Package SUSFS module source
        run: |
          set -euo pipefail

          test -d "$SUSFS_DIR/ksu_module_susfs"

          tar -czf \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz" \
            -C "$SUSFS_DIR" \
            ksu_module_susfs

          test -s "$GITHUB_WORKSPACE/susfs-module-source.tar.gz"

      - name: Generate build manifest
        run: |
          set -euo pipefail

          {
            echo "BG7n SUSFS KernelSU-Next build"
            echo
            echo "Kernel commit:"
            git -C kernel rev-parse HEAD
            echo
            echo "KernelSU archive:"
            sha256sum KernelSU-Next.tar.gz
            echo
            echo "SUSFS archive:"
            sha256sum susfs4ksu-gki-android12-5.10.tar.gz
            echo
            echo "stock.config:"
            sha256sum stock.config
            echo
            echo "BG7n patch:"
            sha256sum patches-susfs-bg7n-legacy-reference.patch
            echo
            echo "Kernel Image:"
            sha256sum out/arch/arm64/boot/Image
            echo
            echo "Final boot:"
            sha256sum boot-BG7n-SUSFS-KSU.img
            echo
            echo "Final config:"
            sha256sum final.config
          } > BUILD_MANIFEST.txt

          test -s BUILD_MANIFEST.txt

      - name: Upload final verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_number }}
          path: |
            verification/
            final.config
            BUILD_MANIFEST.txt
            kernel-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-SUSFS-KSU-full-${{ github.run_number }}
          path: |
            boot-BG7n-SUSFS-KSU.img
            out/arch/arm64/boot/Image
            final.config
            susfs-module-source.tar.gz
            BUILD_MANIFEST.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload boot image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boot-BG7n-SUSFS-KSU-${{ github.run_number }}
          path: boot-BG7n-SUSFS-KSU.img
          if-no-files-found: error
          retention-days: 14

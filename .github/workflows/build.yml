name: Build BG7n SUSFS + KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            curl \
            xz-utils \
            zstd \
            file \
            device-tree-compiler

      - name: Verify project files
        run: |
          set -euo pipefail

          required_files=(
            "KernelSU-Next.tar.gz"
            "susfs4ksu-gki-android12-5.10.tar.gz"
            "stock.config"
            "patches-susfs-bg7n-legacy-reference.patch"
            "50_add_susfs_in_gki-android12-5.10.patch"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

          echo "Project files verified."

      - name: Verify archive integrity
        run: |
          set -euo pipefail

          mkdir -p verification

          tar -tzf \
            KernelSU-Next.tar.gz \
            > verification/kernelsu-archive.txt

          tar -tzf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            > verification/susfs-archive.txt

          grep -Eq \
            '/kernel/setup\.sh$' \
            verification/kernelsu-archive.txt

          grep -Eq \
            '/kernel/Kconfig$' \
            verification/kernelsu-archive.txt

          grep -Eq \
            '/kernel/Kbuild$' \
            verification/kernelsu-archive.txt

          grep -Eq \
            '/kernel_patches/fs/susfs\.c$' \
            verification/susfs-archive.txt

          grep -Eq \
            '/kernel_patches/include/linux/susfs\.h$' \
            verification/susfs-archive.txt

          grep -Eq \
            '/kernel_patches/include/linux/susfs_def\.h$' \
            verification/susfs-archive.txt

          echo "Archive integrity verified."

      - name: Verify SUSFS archive version
        run: |
          set -euo pipefail

          tar -xOf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            susfs4ksu-gki-android12-5.10/kernel_patches/include/linux/susfs.h \
            > verification/susfs.h

          grep -Fq \
            '#define SUSFS_VERSION "v2.2.0"' \
            verification/susfs.h

          echo "SUSFS v2.2.0 verified."

      - name: Verify official SUSFS archive patch
        run: |
          set -euo pipefail

          tar -xOf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            susfs4ksu-gki-android12-5.10/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            > verification/official-susfs.patch

          cmp \
            50_add_susfs_in_gki-android12-5.10.patch \
            verification/official-susfs.patch

          echo "Official SUSFS patch matches archive."

      - name: Verify exact Android common kernel
        env:
          KERNEL_COMMIT: d09ef2e980e0974a0d6dfe762e29fff118db7f46
        run: |
          set -euo pipefail

          rm -rf \
            kernel \
            work \
            out \
            tools \
            bootwork

          mkdir -p \
            work \
            out \
            tools \
            bootwork

          git init kernel

          cd kernel

          git remote add origin \
            https://android.googlesource.com/kernel/common

          git fetch \
            --depth=1 \
            origin \
            "$KERNEL_COMMIT"

          git checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(git rev-parse HEAD)"

          test "$ACTUAL" = "$KERNEL_COMMIT"

          echo "$ACTUAL" \
            > "$GITHUB_WORKSPACE/verification/kernel-commit.txt"

          echo "Kernel commit verified:"
          echo "$ACTUAL"

      - name: Extract bundled sources
        run: |
          set -euo pipefail

          tar -xzf \
            KernelSU-Next.tar.gz \
            -C work

          tar -xzf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            -C work

          KSU_DIR="$(
            find work \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -name 'KernelSU-Next-*' \
              -print -quit
          )"

          SUSFS_DIR="work/susfs4ksu-gki-android12-5.10"

          test -n "$KSU_DIR"
          test -d "$KSU_DIR"
          test -d "$SUSFS_DIR"

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          echo "SUSFS_DIR=$SUSFS_DIR" >> "$GITHUB_ENV"

          echo "KernelSU directory:"
          echo "$KSU_DIR"

      - name: Verify bundled KernelSU-Next structure
        run: |
          set -euo pipefail

          test -f \
            "$KSU_DIR/kernel/setup.sh"

          test -f \
            "$KSU_DIR/kernel/Kconfig"

          test -f \
            "$KSU_DIR/kernel/Kbuild"

          echo "KernelSU-Next source structure verified."

      - name: Verify KernelSU SUSFS definitions
        run: |
          set -euo pipefail

          KCONFIG="$KSU_DIR/kernel/Kconfig"

          symbols=(
            KSU_SUSFS
            KSU_SUSFS_SUS_PATH
            KSU_SUSFS_SUS_MOUNT
            KSU_SUSFS_SUS_KSTAT
            KSU_SUSFS_SPOOF_UNAME
            KSU_SUSFS_ENABLE_LOG
            KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            KSU_SUSFS_OPEN_REDIRECT
            KSU_SUSFS_SUS_MAP
          )

          for symbol in "${symbols[@]}"; do
            if grep -RqsE \
              --include='Kconfig' \
              --include='Kconfig.*' \
              "^[[:space:]]*config[[:space:]]+${symbol}([[:space:]]|$)" \
              "$KSU_DIR/kernel"; then

              echo "FOUND: $symbol"

            else

              echo "MISSING: $symbol"

              grep -R \
                -nE \
                --include='Kconfig' \
                --include='Kconfig.*' \
                "^[[:space:]]*config[[:space:]]+KSU_SUSFS" \
                "$KSU_DIR/kernel" \
                | head -100 \
                || true

              exit 1
            fi
          done

          echo "KernelSU SUSFS definitions verified."

      - name: Install bundled KernelSU-Next
        run: |
          set -euo pipefail

          cd kernel

          bash \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/setup.sh"

          test -d \
            drivers/kernelsu

          echo "KernelSU-Next installed."

      - name: Verify BG7n legacy patch
        run: |
          set -euo pipefail

          PATCH="$GITHUB_WORKSPACE/patches-susfs-bg7n-legacy-reference.patch"

          test -s "$PATCH"

          cd kernel

          patch \
            --dry-run \
            -p1 \
            --fuzz=0 \
            < "$PATCH" \
            > "$GITHUB_WORKSPACE/verification/bg7n-dry-run.txt" \
            2>&1

          echo "BG7n patch dry-run passed."

      - name: Apply BG7n legacy patch
        run: |
          set -euo pipefail

          PATCH="$GITHUB_WORKSPACE/patches-susfs-bg7n-legacy-reference.patch"

          cd kernel

          patch \
            --batch \
            --forward \
            -p1 \
            --fuzz=0 \
            < "$PATCH"

          if find . \
            \( -name '*.rej' -o -name '*.orig' \) \
            -print \
            | grep -q .; then

            echo "Patch collateral files detected:"
            find . \
              \( -name '*.rej' -o -name '*.orig' \) \
              -print

            exit 1
          fi

          echo "BG7n legacy patch applied."

      - name: Verify SUSFS files produced by BG7n patch
        run: |
          set -euo pipefail

          test -s \
            kernel/fs/susfs.c

          test -s \
            kernel/include/linux/susfs.h

          test -s \
            kernel/include/linux/susfs_def.h

          echo "SUSFS source files exist after BG7n patch."

      - name: Compare patched SUSFS files with v2.2.0 archive
        run: |
          set -euo pipefail

          tar -xOf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            susfs4ksu-gki-android12-5.10/kernel_patches/fs/susfs.c \
            > verification/archive-susfs.c

          tar -xOf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            susfs4ksu-gki-android12-5.10/kernel_patches/include/linux/susfs.h \
            > verification/archive-susfs.h

          tar -xOf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            susfs4ksu-gki-android12-5.10/kernel_patches/include/linux/susfs_def.h \
            > verification/archive-susfs_def.h

          cmp \
            kernel/fs/susfs.c \
            verification/archive-susfs.c

          cmp \
            kernel/include/linux/susfs.h \
            verification/archive-susfs.h

          cmp \
            kernel/include/linux/susfs_def.h \
            verification/archive-susfs_def.h

          echo "Patched SUSFS files exactly match v2.2.0 archive."

      - name: Verify SUSFS Makefile integration
        run: |
          set -euo pipefail

          grep -q \
            'obj-$(CONFIG_KSU_SUSFS) += susfs.o' \
            kernel/fs/Makefile

          echo "SUSFS Makefile integration verified."

      - name: Prepare kernel config
        run: |
          set -euo pipefail

          test -f \
            kernel/scripts/config

          chmod +x \
            kernel/scripts/config

          cp \
            stock.config \
            out/.config

          test -s \
            out/.config

          CONFIG_TOOL="$GITHUB_WORKSPACE/kernel/scripts/config"

          "$CONFIG_TOOL" \
            --file out/.config \
            --enable CONFIG_THREAD_INFO_IN_TASK

          "$CONFIG_TOOL" \
            --file out/.config \
            --enable CONFIG_KSU

          "$CONFIG_TOOL" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS

          "$CONFIG_TOOL" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_PATH

          "$CONFIG_TOOL" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT

          "$CONFIG_TOOL" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_NATIVE_APP \
            || true

          "$CONFIG_TOOL" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT

          "$CONFIG_TOOL" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT \
            || true

          "$CONFIG_TOOL" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SPOOF_UNAME \
            || true

          "$CONFIG_TOOL" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_ENABLE_LOG \
            || true

          "$CONFIG_TOOL" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            || true

          "$CONFIG_TOOL" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            || true

          "$CONFIG_TOOL" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            || true

          "$CONFIG_TOOL" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_MAP

          "$CONFIG_TOOL" \
            --file out/.config \
            --disable CONFIG_TRIM_UNUSED_KSYMS \
            || true

          "$CONFIG_TOOL" \
            --file out/.config \
            --disable CONFIG_UNUSED_KSYMS \
            || true

      - name: Resolve final Kconfig
        run: |
          set -euo pipefail

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            olddefconfig

          test -s \
            out/.config

      - name: Verify final Kconfig
        run: |
          set -euo pipefail

          CFG="$GITHUB_WORKSPACE/out/.config"

          required=(
            CONFIG_THREAD_INFO_IN_TASK
            CONFIG_KSU
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          for symbol in "${required[@]}"; do
            grep -qx \
              "${symbol}=y" \
              "$CFG" || {
                echo "Required option missing or disabled: $symbol"
                grep \
                  -E \
                  '^(CONFIG_THREAD_INFO_IN_TASK|CONFIG_KSU|CONFIG_KSU_SUSFS)' \
                  "$CFG" \
                  || true
                exit 1
              }
          done

          cp \
            "$CFG" \
            "$GITHUB_WORKSPACE/final.config"

          echo "Final Kconfig verified."

      - name: Build arm64 Image
        id: kernel_build
        continue-on-error: true
        run: |
          set -o pipefail

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=frame-larger-than" \
            -j"$(nproc)" \
            Image \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/kernel-build.log"

          STATUS=${PIPESTATUS[0]}

          echo "Kernel build status: $STATUS"

          exit "$STATUS"

      - name: Verify built kernel and SUSFS
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -euo pipefail

          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"

          test -s \
            "$IMAGE"

          test -s \
            "$GITHUB_WORKSPACE/out/.config"

          test -s \
            "$GITHUB_WORKSPACE/out/vmlinux"

          grep -qx \
            'CONFIG_KSU=y' \
            "$GITHUB_WORKSPACE/out/.config"

          grep -qx \
            'CONFIG_KSU_SUSFS=y' \
            "$GITHUB_WORKSPACE/out/.config"

          SUSFS_OBJECTS="$(
            find "$GITHUB_WORKSPACE/out" \
              -type f \
              -name 'susfs.o' \
              -size +0c \
              -print
          )"

          if [ -z "$SUSFS_OBJECTS" ]; then
            echo "ERROR: No built susfs.o found."
            exit 1
          fi

          echo "$SUSFS_OBJECTS"

          SUSFS_SYMBOLS="$(
            llvm-nm \
              "$GITHUB_WORKSPACE/out/vmlinux" \
              2>/dev/null \
              | grep -i susfs \
              || true
          )"

          if [ -z "$SUSFS_SYMBOLS" ]; then
            echo "ERROR: No SUSFS symbols found in vmlinux."
            exit 1
          fi

          echo "$SUSFS_SYMBOLS" | head -100

          file "$IMAGE"
          ls -lh "$IMAGE"

          echo "Kernel and SUSFS verification passed."

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log-${{ github.run_number }}
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop if kernel failed
        if: steps.kernel_build.outcome != 'success'
        run: |
          echo "Kernel build failed."
          exit 1

      - name: Download official Magisk APK
        run: |
          set -euo pipefail

          MAGISK_URL="$(
            curl \
              -fsSL \
              https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            | python3 -c '
import json
import sys

data = json.load(sys.stdin)

urls = [
    a["browser_download_url"]
    for a in data.get("assets", [])
    if a["name"].startswith("Magisk-")
    and a["name"].endswith(".apk")
    and "debug" not in a["name"].lower()
]

if not urls:
    raise SystemExit("No official Magisk APK found")

print(urls[0])
'
          )"

          test -n "$MAGISK_URL"

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            -o tools/Magisk.apk \
            "$MAGISK_URL"

          test -s \
            tools/Magisk.apk

      - name: Extract magiskboot
        run: |
          set -euo pipefail

          unzip -p \
            tools/Magisk.apk \
            lib/x86_64/libmagiskboot.so \
            > tools/magiskboot

          test -s \
            tools/magiskboot

          chmod +x \
            tools/magiskboot

          file \
            tools/magiskboot

      - name: Download stock boot image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: stock-boot
        run: |
          set -euo pipefail

          rm -rf bootwork

          mkdir -p bootwork

          gh release download \
            "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "boot.img.zip" \
            --dir bootwork

          test -s \
            bootwork/boot.img.zip

          unzip \
            -o \
            bootwork/boot.img.zip \
            -d bootwork

          test -s \
            bootwork/boot.img

      - name: Unpack stock boot
        run: |
          set -euo pipefail

          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            unpack boot.img

          test -s \
            kernel

          file kernel

      - name: Replace stock kernel
        run: |
          set -euo pipefail

          cp \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" \
            bootwork/kernel

          test -s \
            bootwork/kernel

      - name: Repack boot image
        run: |
          set -euo pipefail

          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            repack boot.img

          test -s \
            new-boot.img

          mv \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

          test -s \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

      - name: Deep verify final boot
        run: |
          set -euo pipefail

          FINAL_BOOT="$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"
          BUILT_IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"

          test -s "$FINAL_BOOT"

          mkdir -p \
            verification/final-boot

          cp \
            "$FINAL_BOOT" \
            verification/final-boot/boot.img

          cd \
            verification/final-boot

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            unpack boot.img

          test -s \
            kernel

          FINAL_KERNEL_SHA="$(
            sha256sum kernel \
            | cut -d' ' -f1
          )"

          IMAGE_SHA="$(
            sha256sum "$BUILT_IMAGE" \
            | cut -d' ' -f1
          )"

          echo "Final boot kernel SHA256:"
          echo "$FINAL_KERNEL_SHA"

          echo "Built Image SHA256:"
          echo "$IMAGE_SHA"

          test "$FINAL_KERNEL_SHA" = "$IMAGE_SHA"

          echo "Final boot contains the exact built kernel."

      - name: Package SUSFS module source
        run: |
          set -euo pipefail

          test -d \
            "$SUSFS_DIR/ksu_module_susfs"

          tar -czf \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz" \
            -C "$SUSFS_DIR" \
            ksu_module_susfs

          test -s \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz"

      - name: Generate build manifest
        run: |
          set -euo pipefail

          {
            echo "BG7n SUSFS KernelSU-Next build"
            echo
            echo "Kernel commit:"
            git -C kernel rev-parse HEAD
            echo
            echo "KernelSU archive:"
            sha256sum KernelSU-Next.tar.gz
            echo
            echo "SUSFS archive:"
            sha256sum susfs4ksu-gki-android12-5.10.tar.gz
            echo
            echo "stock.config:"
            sha256sum stock.config
            echo
            echo "Official SUSFS patch:"
            sha256sum 50_add_susfs_in_gki-android12-5.10.patch
            echo
            echo "BG7n patch:"
            sha256sum patches-susfs-bg7n-legacy-reference.patch
            echo
            echo "Kernel Image:"
            sha256sum out/arch/arm64/boot/Image
            echo
            echo "Final boot:"
            sha256sum boot-BG7n-SUSFS-KSU.img
            echo
            echo "Final config:"
            sha256sum final.config
          } > BUILD_MANIFEST.txt

          test -s \
            BUILD_MANIFEST.txt

      - name: Upload final verification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_number }}
          path: |
            verification/
            final.config
            kernel-build.log
            BUILD_MANIFEST.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-SUSFS-KSU-full-${{ github.run_number }}
          path: |
            boot-BG7n-SUSFS-KSU.img
            out/arch/arm64/boot/Image
            final.config
            susfs-module-source.tar.gz
            BUILD_MANIFEST.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload boot image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boot-BG7n-SUSFS-KSU-${{ github.run_number }}
          path: boot-BG7n-SUSFS-KSU.img
          if-no-files-found: error
          retention-days: 14

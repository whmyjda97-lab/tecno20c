            echo
            echo "=== GKI commit ==="
            git -C common rev-parse HEAD

            echo
            echo "=== KernelSU commit ==="
            git -C KernelSU rev-parse HEAD

            echo
            echo "=== SUSFS commit ==="
            git -C susfs rev-parse HEAD

            echo
            echo "=== Critical configuration ==="

            grep -E \
              '^CONFIG_(LTO_CLANG_FULL|CFI_CLANG|SHADOW_CALL_STACK|KASAN|KASAN_HW_TAGS|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS|KSU|KSU_SUSFS)=' \
              ../artifact/kernel/.config \
              || true

            echo
            echo "=== KMI configuration ==="

            grep -E \
              '^(KMI_ENFORCED|KMI_SYMBOL_LIST_STRICT_MODE|TRIM_NONLISTED_KMI)=' \
              common/build.config.bg7n.ksu.susfs

          } | tee \
            ../artifact/reports/kernel_verification.txt

      # ============================================================
      # BUILD SUSFS USERSPACE + MODULE
      # ============================================================

      - name: Build SUSFS userspace helper and KernelSU module
        shell: bash
        working-directory: gki/susfs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euxo pipefail

          export PATH="${ANDROID_NDK_HOME}:${PATH}"

          chmod +x \
            build_ksu_susfs_tool.sh \
            build_ksu_module.sh

          ./build_ksu_susfs_tool.sh
          ./build_ksu_module.sh

          test -d \
            ksu_module_susfs

          mkdir -p \
            ../../artifact/susfs

          cp -a \
            ksu_module_susfs \
            ../../artifact/susfs/susfs4ksu-module

          if [ -f \
            ksu_module_susfs.zip ]
          then

            cp \
              ksu_module_susfs.zip \
              ../../artifact/susfs/susfs4ksu.zip

          fi

      # ============================================================
      # REPACK BOOT
      # ============================================================

      - name: Repack stock boot with built kernel
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            work/boot \
            artifact/boot

          cp \
            stock/boot.img \
            work/boot/boot.img

          MAGISK_API="https://api.github.com/repos/topjohnwu/Magisk/releases/latest"

          MAGISK_URL="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "${MAGISK_API}" |
            jq -r '
              .assets[]
              | select(.name | startswith("Magisk-"))
              | select(.name | endswith(".apk"))
              | .browser_download_url
            ' |
            head -n1
          )"

          test -n \
            "${MAGISK_URL}"

          curl -fL \
            "${MAGISK_URL}" \
            -o magisk.apk

          unzip -j -o \
            magisk.apk \
            'lib/arm64-v8a/libmagiskboot.so' \
            -d work

          mv \
            work/libmagiskboot.so \
            work/magiskboot

          chmod +x \
            work/magiskboot

          (
            cd work/boot

            ../magiskboot unpack boot.img

            test -f \
              kernel

            test -f \
              ../../artifact/kernel/Image

            cp \
              ../../artifact/kernel/Image \
              kernel

            ../magiskboot repack boot.img

            test -s \
              new-boot.img

          )

          cp \
            work/boot/new-boot.img \
            artifact/boot/BG7n-KSU-SUSFS-boot.img

          file \
            artifact/boot/BG7n-KSU-SUSFS-boot.img

          sha256sum \
            artifact/boot/BG7n-KSU-SUSFS-boot.img |
            tee artifact/reports/generated_boot.sha256

      # ============================================================
      # BUILD MANIFEST
      # ============================================================

      - name: Create build manifest and hashes
        shell: bash
        run: |
          set -euxo pipefail

          SUSFS_COMMIT="$(
            git -C gki/susfs rev-parse HEAD
          )"

          KSU_ACTUAL_COMMIT="$(
            git -C gki/KernelSU rev-parse HEAD
          )"

          COMMON_COMMIT="$(
            git -C gki/common rev-parse HEAD
          )"

          cat > \
            artifact/BUILD_INFO.txt <<EOF
          DEVICE=${DEVICE}

          GOOGLE_GKI_MANIFEST_BRANCH=${GKI_MANIFEST_BRANCH}
          GOOGLE_GKI_COMMON_TAG=${GKI_COMMON_TAG}
          GOOGLE_GKI_VERSION=${GKI_VERSION}
          GOOGLE_GKI_SHA=${GKI_SHA}
          COMMON_COMMIT=${COMMON_COMMIT}

          KERNELSU_REPO=${KSU_REPO}
          KERNELSU_COMMIT=${KSU_ACTUAL_COMMIT}

          SUSFS_REPO=${SUSFS_REPO}
          SUSFS_REF=${{ inputs.susfs_ref }}
          SUSFS_COMMIT=${SUSFS_COMMIT}

          BOOT_RELEASE_REPO=${BOOT_REPO}
          BOOT_RELEASE_TAG=${{ inputs.boot_release_tag }}

          STOCK_BOOT_SHA256=$(cut -d' ' -f1 stock/boot.sha256)
          EOF

          cp \
            gki/manifest.lock.xml \
            artifact/manifest.lock.xml

          cp \
            stock/boot.sha256 \
            artifact/reports/stock_boot.sha256

          cp \
            BG7n_final_defconfig \
            artifact/kernel/bg7n_final_defconfig

          find artifact \
            -type f \
            ! -name SHA256SUMS.txt \
            -print0 |
            sort -z |
            xargs -0 sha256sum \
            > artifact/SHA256SUMS.txt

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package artifacts
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf \
            artifact/package

          mkdir -p \
            artifact/package

          cp \
            artifact/BUILD_INFO.txt \
            artifact/package/

          cp \
            artifact/SHA256SUMS.txt \
            artifact/package/

          cp -a \
            artifact/kernel \
            artifact/package/kernel

          cp -a \
            artifact/susfs \
            artifact/package/susfs

          cp -a \
            artifact/reports \
            artifact/package/reports

          if [ -d \
            artifact/boot ]
          then

            cp -a \
              artifact/boot \
              artifact/package/boot

          fi

          cp \
            BG7n_stock_defconfig \
            artifact/package/

          cp \
            BG7n_final_defconfig \
            artifact/package/

          cat > \
            artifact/package/README.txt <<EOF
          TECNO BG7n / MT6765

          Google GKI:
            manifest branch ${GKI_MANIFEST_BRANCH}
            common tag ${GKI_COMMON_TAG}
            Linux ${GKI_VERSION}
            Commit ${GKI_SHA}

          KernelSU:
            repository ${KSU_REPO}
            exact commit ${KSU_ACTUAL_COMMIT}

          SUSFS:
            repository ${SUSFS_REPO}
            pinned commit ${{ inputs.susfs_ref }}

          Required GKI state:
            CONFIG_LTO_CLANG_FULL=y
            CONFIG_CFI_CLANG=y
            CONFIG_SHADOW_CALL_STACK=y
            CONFIG_KASAN=y
            CONFIG_KASAN_HW_TAGS=y
            CONFIG_ARM64_TAGGED_ADDR_ABI=y
            CONFIG_ARM64_MTE=y
            CONFIG_ARM64_PAN=y
            CONFIG_ARM64_LSE_ATOMICS=y

          Forbidden:
            CONFIG_LTO_NONE
            CONFIG_LTO_CLANG_THIN
            CONFIG_KASAN_GENERIC
            CONFIG_KASAN_SW_TAGS
            CONFIG_CFI_PERMISSIVE

          KernelSU:
            CONFIG_KSU=y
            CONFIG_KSU_SUSFS=y

          Modules:
            CONFIG_MODULES=y
            CONFIG_MODVERSIONS=y

          KMI:
            KMI_ENFORCED=1
            KMI_SYMBOL_LIST_STRICT_MODE=1
            TRIM_NONLISTED_KMI=1

          IMPORTANT:
            Review kernel_verification.txt before flashing.

            Keep the original stock boot.img as recovery.
          EOF

          (
            cd artifact/package

            zip \
              -r \
              ../../BG7n_GKI_r3_KSU_SUSFS_artifacts.zip \
              .
          )

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload complete artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-GKI-r3-KSU-SUSFS
          path: |
            BG7n_GKI_r3_KSU_SUSFS_artifacts.zip
            artifact/
          if-no-files-found: error
          retention-days: 30

name: Build BG7n SUSFS + KernelSU-Next

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: تحميل ملفات المشروع
        uses: actions/checkout@v4

      - name: تثبيت أدوات البناء
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libssl-dev \
            libelf-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            curl \
            xz-utils \
            zstd \
            device-tree-compiler \
            file \
            zip

      - name: تحميل مصدر النواة المطابق
        env:
          KERNEL_COMMIT: d09ef2e980e0974a0d6dfe762e29fff118db7f46
        run: |
          git init kernel
          cd kernel
          git remote add origin https://android.googlesource.com/kernel/common
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach FETCH_HEAD
          echo "Kernel source commit:"
          git rev-parse HEAD

      - name: تجهيز مجلدات العمل
        run: |
          rm -rf out work tools bootwork ndk
          mkdir -p out work tools bootwork

      - name: تجهيز KernelSU-Next و SUSFS
        run: |
          tar -xzf KernelSU-Next.tar.gz -C work
          tar -xzf susfs4ksu-gki-android12-5.10.tar.gz -C work

          KSU_DIR="$(find work -maxdepth 1 -type d -name 'KernelSU-Next-*' | head -1)"
          SUSFS_DIR="work/susfs4ksu-gki-android12-5.10"

          test -d "$KSU_DIR"
          test -d "$SUSFS_DIR"

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          echo "SUSFS_DIR=$SUSFS_DIR" >> "$GITHUB_ENV"

      - name: التحقق من نسخة SUSFS والحالة المصدرية
        run: |
          grep -n '^#define SUSFS_VERSION' \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h"

          test -f \
            "$SUSFS_DIR/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"

          echo "KernelSU-Next Kconfig SUSFS:"
          grep '^config KSU_SUSFS' \
            "$KSU_DIR/kernel/Kconfig"

          echo "KernelSU-Next Kbuild SUSFS:"
          grep -n 'CONFIG_KSU_SUSFS' \
            "$KSU_DIR/kernel/Kbuild" | head -20

      - name: إضافة KernelSU-Next إلى النواة
        run: |
          cd kernel
          bash "$GITHUB_WORKSPACE/$KSU_DIR/kernel/setup.sh"
          test -d drivers/kernelsu

      - name: التحقق من أن KernelSU-Next مدمج مع SUSFS مسبقًا
        run: |
          test -f "$GITHUB_WORKSPACE/$KSU_DIR/kernel/Kconfig"
          test -f "$GITHUB_WORKSPACE/$KSU_DIR/kernel/Kbuild"

          grep -q '^menu "KernelSU - SUSFS"' \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/Kconfig"

          grep -q 'CONFIG_KSU_SUSFS' \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/Kbuild"

          grep -Rqs 'CONFIG_KSU_SUSFS_SPOOF_UNAME' \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel"

          grep -Rqs 'CONFIG_KSU_SUSFS_OPEN_REDIRECT' \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel"

          echo "تم التحقق من تكامل SUSFS داخل KernelSU-Next."
          echo "لن يتم تطبيق 10_enable_susfs_for_ksu.patch مرة ثانية."

      - name: تطبيق Patch الخاص بـ BG7n و SUSFS على النواة
        run: |
          cd kernel
          patch -p1 --fuzz=0 < "$GITHUB_WORKSPACE/patches-susfs-bg7n.patch"

          grep -q \
            'obj-$(CONFIG_KSU_SUSFS) += susfs.o' \
            fs/Makefile

          test -f fs/susfs.c

      - name: تثبيت ملفات SUSFS
        run: |
          cp "$SUSFS_DIR/kernel_patches/fs/susfs.c" kernel/fs/susfs.c
          cp "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" kernel/include/linux/susfs.h
          cp "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" kernel/include/linux/susfs_def.h

          test -f kernel/fs/susfs.c
          test -f kernel/include/linux/susfs.h
          test -f kernel/include/linux/susfs_def.h

          grep -q '^#define SUSFS_VERSION "v2.2.0"' \
            kernel/include/linux/susfs.h

      - name: تجهيز أداة config
        run: |
          test -f kernel/scripts/config
          chmod +x kernel/scripts/config

      - name: تجهيز Kernel Config الأصلي
        run: |
          cp stock.config out/.config
          test -s out/.config

      - name: تفعيل KernelSU و جميع خصائص SUSFS
        run: |
          set -e

          C=kernel/scripts/config
          CFG=out/.config

          "$C" --file "$CFG" --enable CONFIG_THREAD_INFO_IN_TASK
          "$C" --file "$CFG" --enable CONFIG_KSU
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS

          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_SUS_PATH
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_ENABLE_LOG
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_SUS_MAP

          "$C" --file "$CFG" --disable CONFIG_TRIM_UNUSED_KSYMS || true
          "$C" --file "$CFG" --disable CONFIG_UNUSED_KSYMS || true

          make -C kernel O="$GITHUB_WORKSPACE/out" ARCH=arm64 olddefconfig

          "$C" --file "$CFG" --enable CONFIG_THREAD_INFO_IN_TASK
          "$C" --file "$CFG" --enable CONFIG_KSU
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_SUS_PATH
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_ENABLE_LOG
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
          "$C" --file "$CFG" --enable CONFIG_KSU_SUSFS_SUS_MAP

      - name: التحقق الصارم من تفعيل جميع خصائص SUSFS
        run: |
          set -e

          CFG=out/.config

          grep -qx 'CONFIG_THREAD_INFO_IN_TASK=y' "$CFG"
          grep -qx 'CONFIG_KSU=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_SUS_PATH=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_SUS_MOUNT=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_SUS_KSTAT=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_ENABLE_LOG=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_SUS_MAP=y'

          cp "$CFG" "$GITHUB_WORKSPACE/final.config"
          echo "تم تفعيل جميع خيارات SUSFS v2.2.0 في final.config."

      - name: بناء Kernel Image
        id: kernel_build
        continue-on-error: true
        run: |
          set -o pipefail

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=frame-larger-than" \
            -j"$(nproc)" \
            Image \
            2>&1 | tee "$GITHUB_WORKSPACE/kernel-build.log"

          BUILD_STATUS=${PIPESTATUS[0]}
          exit "$BUILD_STATUS"

      - name: تحقق صارم من دمج SUSFS داخل Image
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -e

          test -s out/arch/arm64/boot/Image

          grep -Eq -- \
            '-- SUSFS_VERSION: v2\.2\.0' \
            kernel-build.log

          grep -Eq \
            'CC[[:space:]]+fs/susfs\.o' \
            kernel-build.log

          echo "SUSFS v2.2.0 تم تجميعه داخل النواة فعليًا."
          echo "CONFIG_KSU_SUSFS=y"
          echo "CC fs/susfs.o موجود في سجل البناء."

      - name: إيقاف البناء إذا لم يندمج SUSFS
        if: steps.kernel_build.outcome != 'success'
        run: |
          echo "فشل بناء Kernel أو لم يندمج SUSFS."
          exit 1

      - name: تحميل Magisk APK الرسمي
        run: |
          set -e

          MAGISK_VERSION="v30.7"
          MAGISK_URL="https://github.com/topjohnwu/Magisk/releases/download/${MAGISK_VERSION}/Magisk-${MAGISK_VERSION}.apk"

          curl -fL --retry 5 --retry-delay 3 \
            -o tools/Magisk.apk "$MAGISK_URL"

          test -s tools/Magisk.apk

      - name: استخراج Magiskboot
        run: |
          set -e

          unzip -l tools/Magisk.apk | grep 'libmagiskboot.so'

          unzip -p \
            tools/Magisk.apk \
            lib/x86_64/libmagiskboot.so \
            > tools/magiskboot

          test -s tools/magiskboot
          chmod +x tools/magiskboot
          file tools/magiskboot

      - name: تحميل boot.img من Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: stock-boot
        run: |
          set -e

          rm -rf bootwork
          mkdir -p bootwork

          gh release download \
            "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --dir bootwork

          ZIP_FILE="$(find bootwork -maxdepth 1 -type f -name '*.zip' | head -1)"
          test -n "$ZIP_FILE"
          test -f "$ZIP_FILE"

          mkdir -p bootwork/extracted
          unzip -o "$ZIP_FILE" -d bootwork/extracted

          BOOT_FILE="$(find bootwork/extracted -type f -name 'boot.img' | head -1)"
          test -n "$BOOT_FILE"
          test -f "$BOOT_FILE"

          cp "$BOOT_FILE" bootwork/boot.img
          test -s bootwork/boot.img

      - name: فك boot.img الأصلي
        run: |
          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" unpack boot.img

          test -s kernel

      - name: استبدال Kernel الأصلي
        run: |
          test -s out/arch/arm64/boot/Image
          cp out/arch/arm64/boot/Image bootwork/kernel
          test -s bootwork/kernel

      - name: إعادة بناء boot.img
        run: |
          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" repack boot.img

          test -s new-boot.img

          mv \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

          test -s "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

      - name: تجهيز Android NDK لبناء ksu_susfs
        run: |
          set -e

          NDK_ZIP=android-ndk-r27d-linux.zip
          NDK_URL=https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          NDK_SHA1=22105e410cf29afcf163760cc95522b9fb981121

          curl -fL --retry 5 --retry-delay 3 \
            -o "$NDK_ZIP" "$NDK_URL"

          echo "$NDK_SHA1  $NDK_ZIP" | sha1sum -c -

          unzip -q "$NDK_ZIP" -d ndk

          NDK_DIR="$(find ndk -maxdepth 1 -type d -name 'android-ndk-*' | head -1)"
          test -d "$NDK_DIR"

          echo "NDK_DIR=$GITHUB_WORKSPACE/$NDK_DIR" >> "$GITHUB_ENV"

      - name: بناء أداة ksu_susfs userspace
        run: |
          set -e

          cd "$SUSFS_DIR"

          export ANDROID_NDK_ROOT="$NDK_DIR"
          export PATH="$ANDROID_NDK_ROOT:$PATH"

          test -x "$ANDROID_NDK_ROOT/ndk-build"

          ./build_ksu_susfs_tool.sh

          test -s ksu_module_susfs/tools/ksu_susfs_arm64

      - name: تجهيز وحدة SUSFS النهائية
        run: |
          set -e

          cd "$SUSFS_DIR"

          ./build_ksu_module.sh

          test -s ksu_module_susfs.zip

          cp \
            ksu_module_susfs.zip \
            "$GITHUB_WORKSPACE/susfs4ksu-module-v2.2.0.zip"

      - name: فحص boot النهائي
        run: |
          test -s boot-BG7n-SUSFS-KSU.img

          ls -lh boot-BG7n-SUSFS-KSU.img
          sha256sum boot-BG7n-SUSFS-KSU.img
          file boot-BG7n-SUSFS-KSU.img

      - name: تجهيز ملفات الإصدار
        run: |
          set -e

          test -s boot-BG7n-SUSFS-KSU.img
          test -s out/arch/arm64/boot/Image
          test -s final.config
          test -s susfs4ksu-module-v2.2.0.zip
          test -s patches-susfs-bg7n.patch

          ls -lh \
            boot-BG7n-SUSFS-KSU.img \
            out/arch/arm64/boot/Image \
            final.config \
            susfs4ksu-module-v2.2.0.zip \
            patches-susfs-bg7n.patch

      - name: حفظ سجل البناء
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log-${{ github.run_number }}
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: حفظ البناء النهائي
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-SUSFS-KSU-full-${{ github.run_number }}
          path: |
            boot-BG7n-SUSFS-KSU.img
            out/arch/arm64/boot/Image
            final.config
            susfs4ksu-module-v2.2.0.zip
            patches-susfs-bg7n.patch
          if-no-files-found: error
          retention-days: 14

      - name: حفظ boot.img النهائي منفصلًا
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boot-BG7n-SUSFS-KSU-${{ github.run_number }}
          path: boot-BG7n-SUSFS-KSU.img
          if-no-files-found: error
          retention-days: 14

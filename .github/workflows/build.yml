name: Build BG7n SUSFS + KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      ARCH: arm64
      LLVM: "1"
      LLVM_IAS: "1"
      KERNEL_COMMIT: d09ef2e980e0974a0d6dfe762e29fff118db7f46

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            curl \
            xz-utils \
            zstd \
            file \
            cpio \
            device-tree-compiler

          clang --version
          ld.lld --version
          make --version
          git --version

      - name: Verify project files
        run: |
          set -euo pipefail

          required_files=(
            "KernelSU-Next.tar.gz"
            "susfs4ksu-gki-android12-5.10.tar.gz"
            "stock.config"
            "50_add_susfs_in_gki-android12-5.10.patch"
            "patches-susfs-bg7n-legacy-reference.patch"
          )

          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing required file: $f"
              exit 1
            fi
          done

          echo "All required project files exist."

      - name: Verify archive integrity
        run: |
          set -euo pipefail

          mkdir -p verification

          echo "Checking KernelSU-Next archive..."
          tar -tzf KernelSU-Next.tar.gz \
            > verification/kernelsu-archive.txt

          echo "Checking SUSFS archive..."
          tar -tzf susfs4ksu-gki-android12-5.10.tar.gz \
            > verification/susfs-archive.txt

          grep -Eq '/kernel/setup\.sh$' \
            verification/kernelsu-archive.txt

          grep -Eq '/kernel/Kconfig$' \
            verification/kernelsu-archive.txt

          grep -Eq '/kernel/Kbuild$' \
            verification/kernelsu-archive.txt

          grep -Eq '/kernel_patches/include/linux/' \
            verification/susfs-archive.txt

          grep -Eq '50_add_susfs_in_gki-android12-5\.10\.patch$' \
            verification/susfs-archive.txt

          echo "Archive structure verified."

      - name: Verify official SUSFS patch
        run: |
          set -euo pipefail

          mkdir -p verification/susfs-check

          tar -xOf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            susfs4ksu-gki-android12-5.10/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            > verification/susfs-check/official.patch

          cmp \
            50_add_susfs_in_gki-android12-5.10.patch \
            verification/susfs-check/official.patch

          echo "Official SUSFS patch matches bundled archive."

      - name: Fetch exact Android common kernel
        run: |
          set -euo pipefail

          rm -rf kernel out work verification/kernel

          mkdir -p \
            out \
            work \
            verification/kernel

          git init kernel

          cd kernel

          git remote add origin \
            https://android.googlesource.com/kernel/common

          git fetch \
            --depth=1 \
            origin \
            "$KERNEL_COMMIT"

          git checkout --detach FETCH_HEAD

          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          if [ "$ACTUAL_COMMIT" != "$KERNEL_COMMIT" ]; then
            echo "ERROR: Kernel commit mismatch."
            echo "Expected: $KERNEL_COMMIT"
            echo "Actual:   $ACTUAL_COMMIT"
            exit 1
          fi

          echo "$ACTUAL_COMMIT" \
            > "$GITHUB_WORKSPACE/verification/kernel/commit.txt"

          echo "Android common kernel verified:"
          git log -1 --oneline

      - name: Extract bundled sources
        run: |
          set -euo pipefail

          rm -rf work/KernelSU-Next-* \
                 work/susfs4ksu-gki-android12-5.10

          tar -xzf KernelSU-Next.tar.gz \
            -C work

          tar -xzf susfs4ksu-gki-android12-5.10.tar.gz \
            -C work

          KSU_DIR="$(find work \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -name 'KernelSU-Next-*' \
            -print -quit)"

          if [ -z "$KSU_DIR" ]; then
            echo "ERROR: KernelSU-Next directory was not found."
            find work -maxdepth 2 -type d
            exit 1
          fi

          SUSFS_DIR="work/susfs4ksu-gki-android12-5.10"

          if [ ! -d "$SUSFS_DIR" ]; then
            echo "ERROR: SUSFS directory was not found."
            exit 1
          fi

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          echo "SUSFS_DIR=$SUSFS_DIR" >> "$GITHUB_ENV"

          echo "KernelSU directory:"
          echo "$KSU_DIR"

          echo "SUSFS directory:"
          echo "$SUSFS_DIR"

      - name: Verify bundled KernelSU-Next structure
        run: |
          set -euo pipefail

          test -n "${KSU_DIR:-}"

          test -d "$KSU_DIR/kernel"
          test -f "$KSU_DIR/kernel/setup.sh"
          test -f "$KSU_DIR/kernel/Kconfig"
          test -f "$KSU_DIR/kernel/Kbuild"

          echo "KernelSU-Next bundled source structure is valid."

          echo "KernelSU-Next source identity:"
          if grep -Rqs \
            "26fded805206ae4542f4745e09cc465412994492" \
            "$KSU_DIR"; then
            echo "Expected commit identity found in bundled source."
          else
            echo "Commit text not embedded; continuing."
          fi

      - name: Verify SUSFS v2.2.0 source
        run: |
          set -euo pipefail

          test -n "${SUSFS_DIR:-}"

          SUSFS_HEADER="$SUSFS_DIR/kernel_patches/include/linux/susfs.h"

          test -f "$SUSFS_HEADER"

          grep -Fq \
            '#define SUSFS_VERSION "v2.2.0"' \
            "$SUSFS_HEADER"

          echo "SUSFS v2.2.0 verified."

      - name: Install bundled KernelSU-Next
        run: |
          set -euo pipefail

          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          KSU_ROOT="$GITHUB_WORKSPACE/$KSU_DIR"

          test -d "$KERNEL_ROOT/drivers"
          test -d "$KSU_ROOT/kernel"

          rm -rf "$KERNEL_ROOT/KernelSU"

          cp -a \
            "$KSU_ROOT/kernel" \
            "$KERNEL_ROOT/KernelSU"

          chmod -R u+rwX \
            "$KERNEL_ROOT/KernelSU"

          rm -f "$KERNEL_ROOT/drivers/kernelsu"

          ln -s \
            "../KernelSU" \
            "$KERNEL_ROOT/drivers/kernelsu"

          if [ ! -L "$KERNEL_ROOT/drivers/kernelsu" ]; then
            echo "ERROR: KernelSU symlink was not created."
            exit 1
          fi

          echo "KernelSU bundled source installed."

      - name: Integrate KernelSU into kernel build system
        run: |
          set -euo pipefail

          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"

          DRIVER_MAKEFILE="$KERNEL_ROOT/drivers/Makefile"
          DRIVER_KCONFIG="$KERNEL_ROOT/drivers/Kconfig"

          test -f "$DRIVER_MAKEFILE"
          test -f "$DRIVER_KCONFIG"

          if ! grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' \
            "$DRIVER_MAKEFILE"; then

            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' \
              >> "$DRIVER_MAKEFILE"
          fi

          if ! grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            "$DRIVER_KCONFIG"; then

            printf '\nsource "drivers/kernelsu/Kconfig"\n' \
              >> "$DRIVER_KCONFIG"
          fi

          grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            "$DRIVER_MAKEFILE"

          grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            "$DRIVER_KCONFIG"

          echo "KernelSU build-system integration verified."

      - name: Verify KernelSU before SUSFS
        run: |
          set -euo pipefail

          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"

          test -f "$KERNEL_ROOT/KernelSU/Kconfig"
          test -f "$KERNEL_ROOT/KernelSU/Kbuild"

          grep -Eq \
            '^[[:space:]]*(menuconfig|config)[[:space:]]+KSU([[:space:]]|$)' \
            "$KERNEL_ROOT/KernelSU/Kconfig"

          echo "Base KernelSU configuration is valid."

      - name: Install SUSFS source files
        run: |
          set -euo pipefail

          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"

          mkdir -p \
            "$KERNEL_ROOT/fs" \
            "$KERNEL_ROOT/include/linux"

          cp -a \
            "$SUSFS_DIR/kernel_patches/fs/." \
            "$KERNEL_ROOT/fs/"

          cp -a \
            "$SUSFS_DIR/kernel_patches/include/linux/." \
            "$KERNEL_ROOT/include/linux/"

          test -f \
            "$KERNEL_ROOT/include/linux/susfs.h"

          echo "SUSFS filesystem and header sources installed."

      - name: Select exact BG7n patch
        run: |
          set -euo pipefail

          PATCH=""

          if [ -f \
            "$GITHUB_WORKSPACE/patches-susfs-bg7n-legacy-reference.patch" ]; then

            PATCH="$GITHUB_WORKSPACE/patches-susfs-bg7n-legacy-reference.patch"

          elif [ -f \
            "$GITHUB_WORKSPACE/susfs-bg7n-5.10.237.patch" ]; then

            PATCH="$GITHUB_WORKSPACE/susfs-bg7n-5.10.237.patch"

          elif [ -f \
            "$GITHUB_WORKSPACE/patches-susfs-bg7n.patch" ]; then

            PATCH="$GITHUB_WORKSPACE/patches-susfs-bg7n.patch"
          fi

          if [ -z "$PATCH" ]; then
            echo "ERROR: No BG7n patch found."
            echo "Available patch files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -name '*.patch' \
              -print
            exit 1
          fi

          echo "BG7N_PATCH=$PATCH" >> "$GITHUB_ENV"

          echo "Selected BG7n patch:"
          echo "$PATCH"

      - name: Verify BG7n patch applies cleanly
        run: |
          set -euo pipefail

          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"

          cd "$KERNEL_ROOT"

          if patch --dry-run -p1 < "$BG7N_PATCH" \
            > "$GITHUB_WORKSPACE/verification/bg7n-dry-run.log" \
            2>&1; then

            echo "BG7n patch dry-run succeeded."

          else

            cat "$GITHUB_WORKSPACE/verification/bg7n-dry-run.log"

            echo "ERROR: BG7n patch does not apply cleanly."
            exit 1
          fi

      - name: Apply official SUSFS kernel patch
        run: |
          set -euo pipefail

          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"

          cd "$KERNEL_ROOT"

          patch \
            --batch \
            --forward \
            -p1 \
            < \
            50_add_susfs_in_gki-android12-5.10.patch

          echo "Official SUSFS kernel patch applied."

      - name: Apply BG7n kernel patch
        run: |
          set -euo pipefail

          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"

          cd "$KERNEL_ROOT"

          patch \
            --batch \
            --forward \
            -p1 \
            < "$BG7N_PATCH"

          echo "BG7n kernel patch applied."

      - name: Verify SUSFS integration
        run: |
          set -euo pipefail

          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"

          test -f \
            "$KERNEL_ROOT/include/linux/susfs.h"

          grep -Rqs \
            'SUSFS_VERSION' \
            "$KERNEL_ROOT/include/linux"

          grep -Rqs \
            'KSU_SUSFS' \
            "$KERNEL_ROOT/KernelSU"

          echo "SUSFS integration markers found."

      - name: Verify KernelSU SUSFS symbols after integration
        run: |
          set -euo pipefail

          KSU_KCONFIG="$GITHUB_WORKSPACE/kernel/KernelSU/Kconfig"

          test -f "$KSU_KCONFIG"

          symbols=(
            KSU_SUSFS
            KSU_SUSFS_SUS_PATH
            KSU_SUSFS_SUS_MOUNT
            KSU_SUSFS_SUS_KSTAT
            KSU_SUSFS_SPOOF_UNAME
            KSU_SUSFS_ENABLE_LOG
            KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            KSU_SUSFS_OPEN_REDIRECT
            KSU_SUSFS_SUS_MAP
          )

          missing=0

          for symbol in "${symbols[@]}"; do
            if grep -Eq \
              "^[[:space:]]*(menuconfig|config)[[:space:]]+${symbol}([[:space:]]|$)" \
              "$KSU_KCONFIG"; then

              echo "FOUND: $symbol"

            else

              echo "MISSING: $symbol"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo
            echo "Full SUSFS-related Kconfig entries:"
            grep -n \
              -E '^[[:space:]]*(menuconfig|config)[[:space:]]+KSU_SUSFS' \
              "$KSU_KCONFIG" \
              || true

            exit 1
          fi

          echo "Required KernelSU/SUSFS symbols verified."

      - name: Prepare kernel config
        run: |
          set -euo pipefail

          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          OUT="$GITHUB_WORKSPACE/out"

          mkdir -p "$OUT"

          cd "$KERNEL_ROOT"

          cp \
            "$GITHUB_WORKSPACE/stock.config" \
            "$OUT/.config"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            olddefconfig

          test -f "$OUT/.config"

          echo "Kernel config generated."

      - name: Enable KernelSU and SUSFS
        run: |
          set -euo pipefail

          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          OUT="$GITHUB_WORKSPACE/out"

          CONFIG_TOOL="$KERNEL_ROOT/scripts/config"

          if [ ! -x "$CONFIG_TOOL" ]; then
            chmod +x "$CONFIG_TOOL" || true
          fi

          if [ -x "$CONFIG_TOOL" ]; then

            "$CONFIG_TOOL" \
              --file "$OUT/.config" \
              --enable CONFIG_KSU

            "$CONFIG_TOOL" \
              --file "$OUT/.config" \
              --enable CONFIG_KSU_SUSFS

            while read -r symbol; do
              [ -n "$symbol" ] || continue

              "$CONFIG_TOOL" \
                --file "$OUT/.config" \
                --enable "$symbol" \
                || true

            done < <(
              grep -RhoE \
                '^[[:space:]]*(menuconfig|config)[[:space:]]+KSU_SUSFS_[A-Za-z0-9_]+' \
                "$KERNEL_ROOT/KernelSU" \
                | sed -E \
                  's/^[[:space:]]*(menuconfig|config)[[:space:]]+//g' \
                | sort -u \
                | sed 's/^/CONFIG_/'
            )

          else

            echo "scripts/config unavailable; using direct config entries."

            {
              echo "CONFIG_KSU=y"
              echo "CONFIG_KSU_SUSFS=y"
            } >> "$OUT/.config"

          fi

          cd "$KERNEL_ROOT"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            olddefconfig

          echo "Final configuration resolved."

      - name: Verify final kernel config
        run: |
          set -euo pipefail

          CONFIG="$GITHUB_WORKSPACE/out/.config"

          test -f "$CONFIG"

          grep -qx \
            'CONFIG_KSU=y' \
            "$CONFIG"

          grep -qx \
            'CONFIG_KSU_SUSFS=y' \
            "$CONFIG"

          echo "CONFIG_KSU=y"
          echo "CONFIG_KSU_SUSFS=y"

          echo
          echo "Enabled SUSFS configuration:"
          grep \
            -E '^CONFIG_KSU_SUSFS(_[A-Za-z0-9_]+)?=' \
            "$CONFIG" \
            || true

      - name: Build arm64 kernel Image
        run: |
          set -euo pipefail

          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          OUT="$GITHUB_WORKSPACE/out"

          cd "$KERNEL_ROOT"

          make \
            -j"$(nproc)" \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

      - name: Verify built kernel
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/out"

          IMAGE="$OUT/arch/arm64/boot/Image"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Kernel Image was not produced."

            find "$OUT/arch/arm64/boot" \
              -maxdepth 2 \
              -type f \
              -print \
              || true

            exit 1
          fi

          test -s "$IMAGE"

          file "$IMAGE"
          ls -lh "$IMAGE"

          echo "Kernel Image successfully built."

      - name: Verify kernel contains KernelSU and SUSFS objects
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/out"

          test -f "$OUT/.config"

          grep -qx \
            'CONFIG_KSU=y' \
            "$OUT/.config"

          grep -qx \
            'CONFIG_KSU_SUSFS=y' \
            "$OUT/.config"

          if [ ! -f \
            "$OUT/drivers/kernelsu/built-in.a" ]; then

            echo "ERROR: KernelSU built-in archive missing."
            find "$OUT/drivers" \
              -maxdepth 3 \
              -type f \
              -name 'built-in.a' \
              -print \
              || true
            exit 1
          fi

          echo "KernelSU build output verified."

      - name: Run final source consistency audit
        run: |
          set -euo pipefail

          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          OUT="$GITHUB_WORKSPACE/out"

          mkdir -p verification/final

          {
            echo "===== KERNEL COMMIT ====="
            git -C "$KERNEL_ROOT" rev-parse HEAD

            echo
            echo "===== KERNEL VERSION ====="
            make \
              -C "$KERNEL_ROOT" \
              O="$OUT" \
              ARCH="$ARCH" \
              kernelversion

            echo
            echo "===== KSU CONFIG ====="
            grep \
              -E '^CONFIG_KSU=' \
              "$OUT/.config" \
              || true

            echo
            echo "===== SUSFS CONFIG ====="
            grep \
              -E '^CONFIG_KSU_SUSFS(_[A-Za-z0-9_]+)?=' \
              "$OUT/.config" \
              || true

            echo
            echo "===== KERNELSU SOURCE ====="
            test -d "$KERNEL_ROOT/KernelSU"
            find "$KERNEL_ROOT/KernelSU" \
              -maxdepth 2 \
              -type f \
              | sort \
              | head -200

            echo
            echo "===== SUSFS HEADER ====="
            grep \
              -n \
              'SUSFS_VERSION' \
              "$KERNEL_ROOT/include/linux/susfs.h" \
              || true

          } | tee verification/final/audit.txt

      - name: Collect build artifacts
        if: success()
        run: |
          set -euo pipefail

          mkdir -p release

          cp \
            out/arch/arm64/boot/Image \
            release/Image

          cp \
            out/.config \
            release/kernel.config

          cp \
            verification/final/audit.txt \
            release/build-audit.txt

          cp \
            verification/kernel/commit.txt \
            release/kernel-commit.txt

          cp \
            "$BG7N_PATCH" \
            release/bg7n.patch

          cp \
            50_add_susfs_in_gki-android12-5.10.patch \
            release/susfs.patch

          tar -czf \
            release/kernel-source-verification.tar.gz \
            verification

          sha256sum \
            release/Image \
            release/kernel.config \
            release/build-audit.txt \
            > release/SHA256SUMS

          ls -lh release

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-SUSFS-KernelSU-Next
          path: release/
          if-no-files-found: error
          retention-days: 14

name: Build BG7n SUSFS + KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libssl-dev \
            libelf-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            curl \
            xz-utils \
            zstd \
            device-tree-compiler \
            file

      - name: Fetch exact Android common kernel
        env:
          KERNEL_COMMIT: d09ef2e980e0974a0d6dfe762e29fff118db7f46
        run: |
          set -e
          git init kernel
          cd kernel
          git remote add origin https://android.googlesource.com/kernel/common
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"
          echo "Kernel commit:"
          git rev-parse HEAD

      - name: Prepare workspace
        run: |
          set -e
          rm -rf out work tools bootwork
          mkdir -p out work tools bootwork

      - name: Extract bundled KernelSU-Next and SUSFS
        run: |
          set -e
          test -s KernelSU-Next.tar.gz
          test -s susfs4ksu-gki-android12-5.10.tar.gz

          tar -xzf KernelSU-Next.tar.gz -C work
          tar -xzf susfs4ksu-gki-android12-5.10.tar.gz -C work

          KSU_DIR="$(find work -maxdepth 1 -type d -name 'KernelSU-Next-*' | head -1)"
          SUSFS_DIR="work/susfs4ksu-gki-android12-5.10"

          test -d "$KSU_DIR"
          test -d "$SUSFS_DIR"

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          echo "SUSFS_DIR=$SUSFS_DIR" >> "$GITHUB_ENV"

      - name: Verify bundled KernelSU-Next source
        run: |
          set -e

          test -f "$KSU_DIR/kernel/setup.sh"
          test -f "$KSU_DIR/kernel/Kconfig"
          test -f "$KSU_DIR/kernel/Kbuild"

          test -f "$SUSFS_DIR/kernel_patches/fs/susfs.c"
          test -f "$SUSFS_DIR/kernel_patches/include/linux/susfs.h"
          test -f "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h"

          echo "Bundled KernelSU-Next source verified."
          echo "Bundled SUSFS source verified."

      - name: Install bundled KernelSU-Next
        run: |
          set -e
          cd kernel
          bash "$GITHUB_WORKSPACE/$KSU_DIR/kernel/setup.sh"
          test -d drivers/kernelsu

      - name: Apply BG7n kernel patch
        run: |
          set -e
          cd kernel

          patch -p1 --fuzz=0 \
            < "$GITHUB_WORKSPACE/patches-susfs-bg7n.patch"

          test -f fs/susfs.c
          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile

      - name: Install SUSFS source files
        run: |
          set -e

          cp "$SUSFS_DIR/kernel_patches/fs/susfs.c" kernel/fs/susfs.c
          cp "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" kernel/include/linux/susfs.h
          cp "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" kernel/include/linux/susfs_def.h

          test -s kernel/fs/susfs.c
          test -s kernel/include/linux/susfs.h
          test -s kernel/include/linux/susfs_def.h

      - name: Prepare kernel config
        run: |
          set -e

          test -f kernel/scripts/config
          chmod +x kernel/scripts/config

          cp stock.config kernel/.config
          test -s kernel/.config

          cd kernel
          C="$PWD/scripts/config"

          "$C" --enable CONFIG_THREAD_INFO_IN_TASK
          "$C" --enable CONFIG_KSU
          "$C" --enable CONFIG_KSU_SUSFS

          "$C" --enable CONFIG_KSU_SUSFS_SUS_PATH
          "$C" --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          "$C" --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_NATIVE_APP
          "$C" --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          "$C" --enable CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT
          "$C" --enable CONFIG_KSU_SUSFS_SUS_MAP

          "$C" --disable CONFIG_TRIM_UNUSED_KSYMS || true
          "$C" --disable CONFIG_UNUSED_KSYMS || true

      - name: Resolve final Kconfig
        run: |
          set -e

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            olddefconfig

          test -s out/.config

      - name: Verify final config
        run: |
          set -e

          CFG="$GITHUB_WORKSPACE/out/.config"

          grep -qx 'CONFIG_THREAD_INFO_IN_TASK=y' "$CFG"
          grep -qx 'CONFIG_KSU=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_SUS_PATH=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_SUS_MOUNT=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_SUS_KSTAT=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT=y'
          grep -qx 'CONFIG_KSU_SUSFS_SUS_MAP=y' "$CFG"

          cp "$CFG" "$GITHUB_WORKSPACE/final.config"

      - name: Build arm64 Image
        id: kernel_build
        continue-on-error: true
        run: |
          set -o pipefail

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=frame-larger-than" \
            -j"$(nproc)" \
            Image \
            2>&1 | tee "$GITHUB_WORKSPACE/kernel-build.log"

          STATUS=${PIPESTATUS[0]}
          exit "$STATUS"

      - name: Verify kernel and SUSFS
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -e

          test -s out/arch/arm64/boot/Image
          test -s out/.config
          test -s out/fs/susfs.o
          test -s out/vmlinux

          grep -qx 'CONFIG_KSU_SUSFS=y' out/.config

          llvm-nm out/vmlinux 2>/dev/null | grep -qi susfs

      - name: Stop if kernel failed
        if: steps.kernel_build.outcome != 'success'
        run: |
          echo "Kernel build failed."
          exit 1

      - name: Download Magisk APK
        run: |
          set -e

          MAGISK_VERSION="v30.7"
          MAGISK_URL="https://github.com/topjohnwu/Magisk/releases/download/${MAGISK_VERSION}/Magisk-${MAGISK_VERSION}.apk"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            -o tools/Magisk.apk \
            "$MAGISK_URL"

          test -s tools/Magisk.apk

      - name: Extract magiskboot
        run: |
          set -e

          unzip -p \
            tools/Magisk.apk \
            lib/x86_64/libmagiskboot.so \
            > tools/magiskboot

          test -s tools/magiskboot
          chmod +x tools/magiskboot
          file tools/magiskboot

      - name: Download stock boot image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: stock-boot
        run: |
          set -e

          rm -rf bootwork
          mkdir -p bootwork

          gh release download \
            "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --dir bootwork

          ZIP_FILE="$(find bootwork -maxdepth 1 -type f -name '*.zip' | head -1)"

          test -n "$ZIP_FILE"
          test -f "$ZIP_FILE"

          mkdir -p bootwork/extracted

          unzip -o "$ZIP_FILE" -d bootwork/extracted

          BOOT_FILE="$(find bootwork/extracted -type f -name 'boot.img' | head -1)"

          test -n "$BOOT_FILE"
          test -f "$BOOT_FILE"

          cp "$BOOT_FILE" bootwork/boot.img
          test -s bootwork/boot.img

      - name: Unpack stock boot
        run: |
          set -e

          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" unpack boot.img

          test -s kernel

      - name: Replace kernel
        run: |
          set -e

          cp \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" \
            bootwork/kernel

          test -s bootwork/kernel

      - name: Repack boot image
        run: |
          set -e

          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" repack boot.img

          test -s new-boot.img

          mv \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

          test -s \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

      - name: Package SUSFS source module
        run: |
          set -e

          cd "$SUSFS_DIR"

          tar -czf \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz" \
            ksu_module_susfs

          test -s \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz"

      - name: Verify final files
        run: |
          set -e

          test -s boot-BG7n-SUSFS-KSU.img
          test -s out/arch/arm64/boot/Image
          test -s final.config
          test -s susfs-module-source.tar.gz
          test -s patches-susfs-bg7n.patch

          ls -lh \
            boot-BG7n-SUSFS-KSU.img \
            out/arch/arm64/boot/Image \
            final.config \
            susfs-module-source.tar.gz \
            patches-susfs-bg7n.patch

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log-${{ github.run_number }}
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-SUSFS-KSU-full-${{ github.run_number }}
          path: |
            boot-BG7n-SUSFS-KSU.img
            out/arch/arm64/boot/Image
            final.config
            susfs-module-source.tar.gz
            patches-susfs-bg7n.patch
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload boot image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boot-BG7n-SUSFS-KSU-${{ github.run_number }}
          path: boot-BG7n-SUSFS-KSU.img
          if-no-files-found: error
          retention-days: 14

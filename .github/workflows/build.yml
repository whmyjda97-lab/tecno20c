name: Build BG7n SUSFS + KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Install dependencies
      # =========================================================
      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libssl-dev \
            libelf-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            curl \
            xz-utils \
            zstd \
            device-tree-compiler \
            file


      # =========================================================
      # 3. Verify project files
      # =========================================================
      - name: Verify project files
        run: |
          set -euo pipefail

          required_files=(
            "KernelSU-Next.tar.gz"
            "susfs4ksu-gki-android12-5.10.tar.gz"
            "stock.config"
            "50_add_susfs_in_gki-android12-5.10.patch"
            "patches-susfs-bg7n-legacy-reference.patch"
            ".github/workflows/build.yml"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "Missing file: $file"
              exit 1
            }
          done

          echo "Project files verified."


      # =========================================================
      # 4. Verify archive integrity
      # =========================================================
      - name: Verify archive integrity
        run: |
          set -euo pipefail

          mkdir -p verification

          tar -tzf \
            KernelSU-Next.tar.gz \
            > verification/kernelsu-tar-list.txt

          tar -tzf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            > verification/susfs-tar-list.txt

          grep -q \
            '/kernel/setup.sh$' \
            verification/kernelsu-tar-list.txt

          grep -q \
            '/kernel/Kconfig$' \
            verification/kernelsu-tar-list.txt

          grep -q \
            '/kernel/Kbuild$' \
            verification/kernelsu-tar-list.txt

          grep -q \
            '/kernel_patches/fs/susfs.c$' \
            verification/susfs-tar-list.txt

          grep -q \
            '/kernel_patches/include/linux/susfs.h$' \
            verification/susfs-tar-list.txt

          grep -q \
            '/kernel_patches/include/linux/susfs_def.h$' \
            verification/susfs-tar-list.txt

          echo "Archives verified."


      # =========================================================
      # 5. Verify official SUSFS patch archive match
      # =========================================================
      - name: Verify official SUSFS patch archive match
        run: |
          set -euo pipefail

          tar -xOf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            susfs4ksu-gki-android12-5.10/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            > verification/official-susfs.patch

          cmp \
            50_add_susfs_in_gki-android12-5.10.patch \
            verification/official-susfs.patch

          echo "Official SUSFS patch matches archive."


      # =========================================================
      # 6. Prepare workspace
      # =========================================================
      - name: Prepare workspace
        run: |
          set -euo pipefail

          rm -rf \
            kernel \
            work \
            out \
            tools \
            bootwork

          mkdir -p \
            work \
            out \
            tools \
            bootwork


      # =========================================================
      # 7. Fetch exact Android common kernel
      # =========================================================
      - name: Fetch exact Android common kernel
        env:
          KERNEL_COMMIT: d09ef2e980e0974a0d6dfe762e29fff118db7f46
        run: |
          set -euo pipefail

          git init kernel

          cd kernel

          git remote add origin \
            https://android.googlesource.com/kernel/common

          git fetch \
            --depth=1 \
            origin \
            "$KERNEL_COMMIT"

          git checkout \
            --detach \
            FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"

          git rev-parse HEAD \
            > "$GITHUB_WORKSPACE/verification/kernel-commit.txt"

          echo "Kernel commit verified."


      # =========================================================
      # 8. Extract bundled sources
      # =========================================================
      - name: Extract bundled sources
        run: |
          set -euo pipefail

          tar -xzf \
            KernelSU-Next.tar.gz \
            -C work

          tar -xzf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            -C work

          KSU_DIR="$(
            find work \
              -maxdepth 1 \
              -type d \
              -name 'KernelSU-Next-*' \
              | head -1
          )"

          SUSFS_DIR="work/susfs4ksu-gki-android12-5.10"

          test -n "$KSU_DIR"
          test -d "$KSU_DIR"

          test -d "$SUSFS_DIR"

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          echo "SUSFS_DIR=$SUSFS_DIR" >> "$GITHUB_ENV"

          echo "KernelSU source:"
          echo "$KSU_DIR"

          echo "SUSFS source:"
          echo "$SUSFS_DIR"


      # =========================================================
      # 9. Verify bundled KernelSU-Next
      # =========================================================
      - name: Verify bundled KernelSU-Next
        run: |
          set -euo pipefail

          test -f \
            "$KSU_DIR/kernel/setup.sh"

          test -f \
            "$KSU_DIR/kernel/Kconfig"

          test -f \
            "$KSU_DIR/kernel/Kbuild"

          symbols=(
            KSU_SUSFS
            KSU_SUSFS_SUS_PATH
            KSU_SUSFS_SUS_MOUNT
            KSU_SUSFS_SUS_KSTAT
            KSU_SUSFS_SUS_KSTAT_REDIRECT
            KSU_SUSFS_SUS_MAP
          )

          for symbol in "${symbols[@]}"; do
            if grep -Rqs \
              --include='Kconfig' \
              --include='Kconfig.*' \
              "^config[[:space:]]\+${symbol}([[:space:]]|$)" \
              "$KSU_DIR/kernel"; then

              echo "Found Kconfig symbol: $symbol"

            else

              echo "Missing Kconfig symbol: $symbol"

              grep -R \
                --include='Kconfig' \
                --include='Kconfig.*' \
                -n \
                "KSU_SUSFS" \
                "$KSU_DIR/kernel" \
                | head -100 \
                || true

              exit 1
            fi
          done

          grep -Rqs \
            'CONFIG_KSU_SUSFS' \
            "$KSU_DIR/kernel"

          echo "KernelSU-Next SUSFS integration verified."


      # =========================================================
      # 10. Verify SUSFS source
      # =========================================================
      - name: Verify SUSFS v2.2.0 source
        run: |
          set -euo pipefail

          test -f \
            "$SUSFS_DIR/kernel_patches/fs/susfs.c"

          test -f \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h"

          test -f \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h"

          grep -Eq \
            '^#define SUSFS_VERSION[[:space:]]+"v2\.2\.0"' \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h"

          echo "SUSFS v2.2.0 source verified."


      # =========================================================
      # 11. Install bundled KernelSU-Next
      # =========================================================
      - name: Install bundled KernelSU-Next
        run: |
          set -euo pipefail

          cd kernel

          bash \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/setup.sh"

          test -d \
            drivers/kernelsu

          echo "KernelSU-Next installed."


      # =========================================================
      # 12. Verify BG7n patch
      # =========================================================
      - name: Verify BG7n patch
        run: |
          set -euo pipefail

          PATCH_FILE="$GITHUB_WORKSPACE/patches-susfs-bg7n-legacy-reference.patch"

          test -s \
            "$PATCH_FILE"

          cd kernel

          patch \
            --dry-run \
            -p1 \
            --fuzz=0 \
            < "$PATCH_FILE"

          echo "BG7n patch dry-run passed."


      # =========================================================
      # 13. Apply BG7n patch
      # =========================================================
      - name: Apply BG7n patch
        run: |
          set -euo pipefail

          PATCH_FILE="$GITHUB_WORKSPACE/patches-susfs-bg7n-legacy-reference.patch"

          cd kernel

          patch \
            -p1 \
            --fuzz=0 \
            < "$PATCH_FILE"

          if find . \
            -name '*.rej' -o -name '*.orig' \
            -print \
            | grep -q .; then

            find . \
              -name '*.rej' -o -name '*.orig' \
              -print

            exit 1
          fi

          echo "BG7n patch applied."


      # =========================================================
      # 14. Install SUSFS source files
      # =========================================================
      - name: Install SUSFS source files
        run: |
          set -euo pipefail

          cp \
            "$SUSFS_DIR/kernel_patches/fs/susfs.c" \
            kernel/fs/susfs.c

          cp \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" \
            kernel/include/linux/susfs.h

          cp \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" \
            kernel/include/linux/susfs_def.h

          test -s \
            kernel/fs/susfs.c

          test -s \
            kernel/include/linux/susfs.h

          test -s \
            kernel/include/linux/susfs_def.h

          grep -Eq \
            '^#define SUSFS_VERSION[[:space:]]+"v2\.2\.0"' \
            kernel/include/linux/susfs.h

          echo "SUSFS source installed."


      # =========================================================
      # 15. Prepare kernel config
      # =========================================================
      - name: Prepare kernel config
        run: |
          set -euo pipefail

          test -f \
            kernel/scripts/config

          chmod +x \
            kernel/scripts/config

          cp \
            stock.config \
            out/.config

          test -s \
            out/.config

          C="$GITHUB_WORKSPACE/kernel/scripts/config"

          "$C" \
            --file out/.config \
            --enable CONFIG_THREAD_INFO_IN_TASK

          "$C" \
            --file out/.config \
            --enable CONFIG_KSU

          "$C" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS

          "$C" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_PATH

          "$C" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT

          "$C" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_NATIVE_APP

          "$C" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT

          "$C" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT

          "$C" \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_MAP

          "$C" \
            --file out/.config \
            --disable CONFIG_TRIM_UNUSED_KSYMS \
            || true

          "$C" \
            --file out/.config \
            --disable CONFIG_UNUSED_KSYMS \
            || true


      # =========================================================
      # 16. Resolve final Kconfig
      # =========================================================
      - name: Resolve final Kconfig
        run: |
          set -euo pipefail

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            olddefconfig

          test -s \
            out/.config

          echo "Final Kconfig generated."


      # =========================================================
      # 17. Verify final Kconfig
      # =========================================================
      - name: Verify final Kconfig
        run: |
          set -euo pipefail

          CFG="$GITHUB_WORKSPACE/out/.config"

          required=(
            CONFIG_THREAD_INFO_IN_TASK
            CONFIG_KSU
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          for symbol in "${required[@]}"; do
            grep -qx \
              "${symbol}=y" \
              "$CFG"
          done

          cp \
            "$CFG" \
            "$GITHUB_WORKSPACE/final.config"

          echo "Final Kconfig verified."


      # =========================================================
      # 18. Build arm64 Image
      # =========================================================
      - name: Build arm64 Image
        id: kernel_build
        continue-on-error: true
        run: |
          set -o pipefail

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=frame-larger-than" \
            -j"$(nproc)" \
            Image \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/kernel-build.log"

          STATUS=${PIPESTATUS[0]}

          echo "Kernel build status: $STATUS"

          exit "$STATUS"


      # =========================================================
      # 19. Verify kernel and SUSFS deeply
      # =========================================================
      - name: Verify kernel and SUSFS deeply
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -euo pipefail

          test -s \
            out/arch/arm64/boot/Image

          test -s \
            out/.config

          test -s \
            out/vmlinux

          grep -qx \
            'CONFIG_KSU=y' \
            out/.config

          grep -qx \
            'CONFIG_KSU_SUSFS=y' \
            out/.config

          SUSFS_OBJECTS="$(
            find out \
              -type f \
              -name 'susfs.o' \
              -size +0c \
              -print
          )"

          test -n \
            "$SUSFS_OBJECTS"

          echo "$SUSFS_OBJECTS"

          SUSFS_SYMBOLS="$(
            llvm-nm \
              out/vml

name: Build BG7n GKI 5.10.237 + KernelSU + SUSFS v2.2.0

on:
  workflow_dispatch:
    inputs:
      susfs_ref:
        description: "Pinned SUSFS commit for gki-android12-5.10"
        required: false
        default: "be08face56c347e7ba9c4fb420c2463598a14f5d"

      make_jobs:
        description: "Kernel build jobs"
        required: false
        default: "4"

      boot_release_tag:
        description: "Release tag containing the stock BG7n boot.img.zip"
        required: false
        default: "stock-boot"

permissions:
  contents: read

concurrency:
  group: bg7n-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE: BG7n
  ARCH: arm64

  # ==============================================================
  # GOOGLE GKI
  # ==============================================================

  GKI_MANIFEST_BRANCH: common-android12-5.10-2025-06
  GKI_COMMON_TAG: android12-5.10-2025-06_r3
  GKI_VERSION: "5.10.237"
  GKI_SHA: d09ef2e980e0974a0d6dfe762e29fff118db7f46

  # ==============================================================
  # OFFICIAL KERNELSU
  # ==============================================================

  KSU_REPO: https://github.com/tiann/KernelSU.git
  KSU_COMMIT: dbff91c2dde8893af950137828398d41dd6b7047

  # ==============================================================
  # SUSFS
  # ==============================================================

  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git

  # ==============================================================
  # STOCK DEVICE BOOT
  # ==============================================================

  BOOT_REPO: whmyjda97-lab/tecno20c

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # 01 - CHECKOUT
      # ============================================================

      - name: 01 - Checkout build kit
        uses: actions/checkout@v4

      # ============================================================
      # 02 - HOST DEPENDENCIES
      # ============================================================

      - name: 02 - Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            curl \
            device-tree-compiler \
            dwarves \
            file \
            flex \
            gawk \
            gh \
            git \
            gnupg \
            gperf \
            jq \
            libdw-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5-dev \
            libssl-dev \
            libunwind-dev \
            lld \
            llvm \
            lz4 \
            openssl \
            pahole \
            pkg-config \
            python3 \
            rsync \
            unzip \
            zip \
            android-sdk-libsparse-utils

          echo "=== HOST TOOLCHAIN ==="

          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-nm --version
          python3 --version
          git --version
          gh --version

      # ============================================================
      # 03 - ANDROID NDK
      # ============================================================

      - name: 03 - Install Android NDK r25b
        shell: bash
        run: |
          set -euxo pipefail

          NDK_VERSION="25.2.9519653"
          NDK_ARCHIVE="android-ndk-r25b-linux.zip"

          SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          NDK_ROOT="${SDK_ROOT}/ndk/${NDK_VERSION}"

          rm -rf \
            "${SDK_ROOT}" \
            "${RUNNER_TEMP}/android-ndk"

          mkdir -p \
            "${SDK_ROOT}/ndk" \
            "${RUNNER_TEMP}/android-ndk"

          curl -fL \
            "https://dl.google.com/android/repository/${NDK_ARCHIVE}" \
            -o "${RUNNER_TEMP}/${NDK_ARCHIVE}"

          unzip -q \
            "${RUNNER_TEMP}/${NDK_ARCHIVE}" \
            -d "${RUNNER_TEMP}/android-ndk"

          test -d \
            "${RUNNER_TEMP}/android-ndk/android-ndk-r25b"

          mv \
            "${RUNNER_TEMP}/android-ndk/android-ndk-r25b" \
            "${NDK_ROOT}"

          test -x \
            "${NDK_ROOT}/ndk-build"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${NDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${NDK_ROOT}" >> "${GITHUB_PATH}"

          "${NDK_ROOT}/ndk-build" --version

      # ============================================================
      # 04 - FETCH STOCK BOOT
      # ============================================================

      - name: 04 - Fetch exact stock BG7n boot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOT_RELEASE_TAG: ${{ inputs.boot_release_tag }}
        run: |
          set -euo pipefail

          rm -rf \
            stock-release \
            stock

          mkdir -p \
            stock-release \
            stock

          gh release view \
            "${BOOT_RELEASE_TAG}" \
            --repo "${BOOT_REPO}" \
            --json tagName,name,assets \
            --jq '.tagName + " | " + .name + " | assets=" + ((.assets|length)|tostring)'

          gh release download \
            "${BOOT_RELEASE_TAG}" \
            --repo "${BOOT_REPO}" \
            --dir stock-release

          CANDIDATES=()

          while IFS= read -r -d '' z; do

            mapfile -t ENTRIES < <(
              unzip -Z1 "$z" 2>/dev/null |
              grep -Ei '(^|/)boot\.img$' ||
              true
            )

            if [ "${#ENTRIES[@]}" -eq 1 ]; then
              CANDIDATES+=("$z")

              echo "BOOT CANDIDATE:"
              echo "  ZIP:    $z"
              echo "  MEMBER: ${ENTRIES[0]}"
            fi

          done < <(
            find stock-release \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              -print0
          )

          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release ZIP containing exactly one boot.img."
            echo "Candidates: ${#CANDIDATES[@]}"
            printf '%s\n' \
              "${CANDIDATES[@]:-<none>}"
            exit 1
          fi

          BOOT_ASSET="${CANDIDATES[0]}"

          mapfile -t BOOT_ENTRIES < <(
            unzip -Z1 "${BOOT_ASSET}" |
            grep -Ei '(^|/)boot\.img$'
          )

          unzip -p \
            "${BOOT_ASSET}" \
            "${BOOT_ENTRIES[0]}" \
            > stock/boot.img

          test -s stock/boot.img

          file stock/boot.img

          sha256sum \
            stock/boot.img |
            tee stock/boot.sha256

      # ============================================================
      # 05 - STOCK DEFCONFIG
      # ============================================================

      - name: 05 - Verify BG7n stock defconfig
        shell: bash
        run: |
          set -euxo pipefail

          test -s BG7n_stock_defconfig

          echo "=== BG7n stock defconfig SHA256 ==="

          sha256sum \
            BG7n_stock_defconfig

          echo
          echo "=== Stock configuration facts ==="

          grep -E \
            '^CONFIG_(ARM64_4K_PAGES|ARM64_16K_PAGES|ARM64_64K_PAGES|ARM64_VA_BITS_[0-9]+|ARM64_PA_BITS_[0-9]+|LTO_NONE|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|CFI_CLANG|CFI_PERMISSIVE|CFI_CLANG_SHADOW|SHADOW_CALL_STACK|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS)=' \
            BG7n_stock_defconfig \
            || true

      # ============================================================
      # 06 - REPO TOOL
      # ============================================================

      - name: 06 - Install repo tool
        shell: bash
        run: |
          set -euxo pipefail

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o repo

          chmod +x repo

          sudo install \
            -m 0755 \
            repo \
            /usr/local/bin/repo

          repo --version

      # ============================================================
      # 07 - GOOGLE GKI SOURCE
      # ============================================================

      - name: 07 - Sync exact Google GKI r3 source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf gki

          mkdir -p gki

          cd gki

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${GKI_MANIFEST_BRANCH}" \
            --depth=1

          repo sync \
            -c \
            -j2 \
            --no-tags \
            --no-clone-bundle

          test -d common
          test -f common/Makefile

          git -C common fetch \
            --no-tags \
            https://android.googlesource.com/kernel/common.git \
            "refs/tags/${GKI_COMMON_TAG}:refs/tags/${GKI_COMMON_TAG}"

          git -C common checkout \
            --detach \
            "refs/tags/${GKI_COMMON_TAG}"

          COMMON_COMMIT="$(
            git -C common rev-parse HEAD
          )"

          echo "EXPECTED:"
          echo "${GKI_SHA}"

          echo
          echo "ACTUAL:"
          echo "${COMMON_COMMIT}"

          test \
            "${COMMON_COMMIT}" = \
            "${GKI_SHA}"

          test \
            "$(make -s -C common kernelversion)" = \
            "${GKI_VERSION}"

          repo manifest -r > \
            manifest.lock.xml

          cat > ../gki_identity.txt <<EOF
          GKI_MANIFEST_BRANCH=${GKI_MANIFEST_BRANCH}
          GKI_COMMON_TAG=${GKI_COMMON_TAG}
          GKI_VERSION=${GKI_VERSION}
          GKI_SHA=${GKI_SHA}
          COMMON_COMMIT=${COMMON_COMMIT}
          EOF

      # ============================================================
      # 08 - GOOGLE TOOLCHAIN
      # ============================================================

      - name: 08 - Select exact Google GKI LLVM
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          CLANG_PREBUILT_BIN="$(
            awk -F= '
              /^CLANG_PREBUILT_BIN=/ {
                print $2
                exit
              }
            ' common/build.config.common
          )"

          test -n "${CLANG_PREBUILT_BIN}"

          GKI_CLANG_BIN="${PWD}/${CLANG_PREBUILT_BIN}"

          test -x \
            "${GKI_CLANG_BIN}/clang"

          test -x \
            "${GKI_CLANG_BIN}/ld.lld"

          test -x \
            "${GKI_CLANG_BIN}/llvm-ar"

          test -x \
            "${GKI_CLANG_BIN}/llvm-nm"

          echo "GKI_CLANG_BIN=${GKI_CLANG_BIN}" \
            >> "${GITHUB_ENV}"

          echo "LLVM=1" \
            >> "${GITHUB_ENV}"

          echo "LLVM_IAS=1" \
            >> "${GITHUB_ENV}"

          echo "${GKI_CLANG_BIN}" \
            >> "${GITHUB_PATH}"

          "${GKI_CLANG_BIN}/clang" --version
          "${GKI_CLANG_BIN}/ld.lld" --version
          "${GKI_CLANG_BIN}/llvm-ar" --version
          "${GKI_CLANG_BIN}/llvm-nm" --version

      # ============================================================
      # 09 - OFFICIAL KERNELSU
      # ============================================================

      - name: 09 - Clone exact KernelSU commit
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          rm -rf KernelSU

          git clone \
            --no-tags \
            --filter=blob:none \
            "${KSU_REPO}" \
            KernelSU

          git -C KernelSU fetch \
            --no-tags \
            origin \
            "${KSU_COMMIT}"

          git -C KernelSU checkout \
            --detach \
            "${KSU_COMMIT}"

          ACTUAL_KSU_COMMIT="$(
            git -C KernelSU rev-parse HEAD
          )"

          test \
            "${ACTUAL_KSU_COMMIT}" = \
            "${KSU_COMMIT}"

          test -f \
            KernelSU/kernel/Kconfig

          test -f \
            KernelSU/kernel/Kbuild

          echo "=== KernelSU ==="

          git -C KernelSU log \
            -1 \
            --oneline \
            --decorate

          {
            echo "KERNELSU_REPO=${KSU_REPO}"
            echo "KERNELSU_COMMIT=${ACTUAL_KSU_COMMIT}"
          } | tee ../kernelsu_identity.txt

      # ============================================================
      # 10 - SUSFS
      # ============================================================

      - name: 10 - Clone and verify pinned SUSFS
        shell: bash
        working-directory: gki
        env:
          SUSFS_REF: ${{ inputs.susfs_ref }}
        run: |
          set -euxo pipefail

          rm -rf susfs

          git clone \
            --no-tags \
            --filter=blob:none \
            "${SUSFS_REPO}" \
            susfs

          git -C susfs fetch \
            --no-tags \
            origin \
            "${SUSFS_REF}"

          git -C susfs checkout \
            --detach \
            "${SUSFS_REF}"

          SUSFS_COMMIT="$(
            git -C susfs rev-parse HEAD
          )"

          test \
            "${SUSFS_COMMIT}" = \
            "${SUSFS_REF}"

          test -f \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          test -f \
            susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          test -d \
            susfs/kernel_patches/fs

          test -d \
            susfs/kernel_patches/include/linux

          test -f \
            susfs/ksu_module_susfs/module.prop

          grep -Eq \
            '^version=v?2\.2\.0($|[.-])' \
            susfs/ksu_module_susfs/module.prop

          {
            echo "SUSFS_REPO=${SUSFS_REPO}"
            echo "SUSFS_COMMIT=${SUSFS_COMMIT}"
          } | tee ../susfs_identity.txt

      # ============================================================
      # 11 - APPLY SUSFS
      # ============================================================

      - name: 11 - Apply SUSFS kernel patches
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          cp \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            KernelSU/

          cp \
            susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            common/

          cp -a \
            susfs/kernel_patches/fs/. \
            common/fs/

          cp -a \
            susfs/kernel_patches/include/linux/. \
            common/include/linux/

          (
            cd KernelSU

            patch \
              --batch \
              --forward \
              -p1 \
              < 10_enable_susfs_for_ksu.patch
          )

          (
            cd common

            patch \
              --batch \
              --forward \
              -p1 \
              < 50_add_susfs_in_gki-android12-5.10.patch
          )

          echo "=== KernelSU changes ==="
          git -C KernelSU status --short

          echo
          echo "=== GKI changes ==="
          git -C common status --short

      # ============================================================
      # 12 - KERNELSU INTEGRATION
      # ============================================================

      - name: 12 - Integrate KernelSU
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          test -f \
            KernelSU/kernel/Kconfig

          test -f \
            KernelSU/kernel/Kbuild

          rm -rf \
            common/drivers/kernelsu

          KSU_RELATIVE="$(
            realpath \
              --relative-to=common/drivers \
              KernelSU/kernel
          )"

          ln -s \
            "${KSU_RELATIVE}" \
            common/drivers/kernelsu

          test -L \
            common/drivers/kernelsu

          test -f \
            common/drivers/kernelsu/Kconfig

          test -f \
            common/drivers/kernelsu/Kbuild

          if ! grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            common/drivers/Makefile
          then
            printf '%s\n' \
              'obj-$(CONFIG_KSU) += kernelsu/' \
              >> common/drivers/Makefile
          fi

          if ! grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            common/drivers/Kconfig
          then

            python3 - <<'PY'
          from pathlib import Path

          p = Path("common/drivers/Kconfig")
          text = p.read_text()
          source = 'source "drivers/kernelsu/Kconfig"\n'

          if source not in text:
              pos = text.rfind("endmenu")

              if pos < 0:
                  raise SystemExit(
                      "ERROR: drivers/Kconfig has no endmenu"
                  )

              text = (
                  text[:pos]
                  + source
                  + "\n"
                  + text[pos:]
              )

              p.write_text(text)
          PY

          fi

          grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            common/drivers/Kconfig

          grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            common/drivers/Makefile

          grep -Rqs \
            '^config[[:space:]]\+KSU\([[:space:]]\|$\)' \
            common/drivers/kernelsu

          grep -Rqs \
            '^config[[:space:]]\+KSU_SUSFS\([[:space:]]\|$\)' \
            common/drivers/kernelsu

          echo "KernelSU integration PASSED."

      # ============================================================
      # 13 - CLEAN GENERATED FILES
      # ============================================================

      - name: 13 - Clean generated configuration
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          rm -f \
            .config \
            defconfig

          rm -rf \
            include/config \
            include/generated \
            arch/arm64/include/generated

          test ! -f .config
          test ! -f defconfig

      # ============================================================
      # 14 - GENERATE DEFCONFIG
      # ============================================================

      - name: 14 - Generate BG7n KernelSU SUSFS defconfig
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          STOCK_CONFIG="${GITHUB_WORKSPACE}/BG7n_stock_defconfig"
          GKI_BASE_CONFIG="${PWD}/arch/arm64/configs/gki_defconfig"
          CONFIG_OUT="${RUNNER_TEMP}/bg7n-kconfig"

          test -s \
            "${STOCK_CONFIG}"

          test -s \
            "${GKI_BASE_CONFIG}"

          rm -rf \
            "${CONFIG_OUT}"

          mkdir -p \
            "${CONFIG_OUT}"

          # ----------------------------------------------------------
          # Protected symbols.
          # ----------------------------------------------------------

          cat > \
            "${CONFIG_OUT}/protected.symbols" <<'EOF'
          CONFIG_LTO_NONE
          CONFIG_LTO_CLANG
          CONFIG_LTO_CLANG_FULL
          CONFIG_LTO_CLANG_THIN
          CONFIG_CFI_CLANG
          CONFIG_CFI_PERMISSIVE
          CONFIG_CFI_CLANG_SHADOW
          CONFIG_SHADOW_CALL_STACK
          CONFIG_KASAN
          CONFIG_KASAN_GENERIC
          CONFIG_KASAN_SW_TAGS
          CONFIG_KASAN_HW_TAGS
          CONFIG_ARM64_MTE
          CONFIG_ARM64_TAGGED_ADDR_ABI
          CONFIG_MODULES
          CONFIG_MODVERSIONS
          CONFIG_KALLSYMS
          CONFIG_KALLSYMS_ALL
          CONFIG_OVERLAY_FS
          CONFIG_GCOV_KERNEL
          CONFIG_FTRACE_MCOUNT_USE_RECORDMCOUNT
          EOF

          # ----------------------------------------------------------
          # Filter stock fragment.
          # ----------------------------------------------------------

          python3 - \
            "${CONFIG_OUT}/protected.symbols" \
            "${STOCK_CONFIG}" \
            "${CONFIG_OUT}/bg7n_stock.filtered" \
            <<'PY'
          import re
          import sys
          from pathlib import Path

          protected = {
              x.strip()
              for x in Path(sys.argv[1]).read_text().splitlines()
              if x.strip()
          }

          stock = Path(sys.argv[2])
          output = Path(sys.argv[3])

          config_re = re.compile(
              r"^CONFIG_[A-Z0-9_]+="
          )

          unset_re = re.compile(
              r"^# CONFIG_[A-Z0-9_]+ is not set$"
          )

          kept = []

          for line in stock.read_text().splitlines():

              if config_re.match(line):

                  sym = line.split("=", 1)[0]

                  if sym in protected:
                      continue

              elif unset_re.match(line):

                  sym = (
                      line[2:]
                      .split(" is not set", 1)[0]
                  )

                  if sym in protected:
                      continue

              kept.append(line)

          output.write_text(
              "\n".join(kept) + "\n"
          )

          print(
              f"Filtered stock config: {len(kept)} lines"
          )
          PY

          # ----------------------------------------------------------
          # Merge official GKI base + device fragment.
          # ----------------------------------------------------------

          cp \
            "${GKI_BASE_CONFIG}" \
            "${CONFIG_OUT}/base.config"

          KCONFIG_CONFIG="${CONFIG_OUT}/.config" \
            ./scripts/kconfig/merge_config.sh \
              -m \
              -r \
              "${CONFIG_OUT}/base.config" \
              "${CONFIG_OUT}/bg7n_stock.filtered"

          test -s \
            "${CONFIG_OUT}/.config"

          # ----------------------------------------------------------
          # Enable KernelSU/SUSFS.
          # ----------------------------------------------------------

          ./scripts/config \
            --file "${CONFIG_OUT}/.config" \
            -e KSU \
            -e KSU_SUSFS

          # ----------------------------------------------------------
          # Resolve with exact Google LLVM.
          # ----------------------------------------------------------

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            olddefconfig

          echo
          echo "=== RESOLVED CONFIG ==="

          grep -E \
            '^CONFIG_(CC_IS_CLANG|LD_IS_LLD|AS_IS_LLVM|KSU|KSU_SUSFS|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|THREAD_INFO_IN_TASK|LTO_NONE|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|CFI_CLANG|CFI_PERMISSIVE|SHADOW_CALL_STACK|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|OVERLAY_FS)=' \
            "${CONFIG_OUT}/.config" \
            || true

          # ----------------------------------------------------------
          # Hard required KSU/SUSFS configuration.
          # ----------------------------------------------------------

          for sym in \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_MODULES \
            CONFIG_MODVERSIONS \
            CONFIG_KALLSYMS \
            CONFIG_KALLSYMS_ALL \
            CONFIG_THREAD_INFO_IN_TASK
          do

            grep -q \
              "^${sym}=y$" \
              "${CONFIG_OUT}/.config" || {

              echo "::error::Missing ${sym}"
              exit 1
            }

          done

          # ----------------------------------------------------------
          # Generate canonical minimal defconfig.
          # ----------------------------------------------------------

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            savedefconfig

          cp \
            "${CONFIG_OUT}/defconfig" \
            arch/arm64/configs/bg7n_defconfig

          test -s \
            arch/arm64/configs/bg7n_defconfig

          # ----------------------------------------------------------
          # Re-expand and prove that KSU/SUSFS survive.
          # ----------------------------------------------------------

          rm -f \
            "${CONFIG_OUT}/.config"

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            bg7n_defconfig

          cp \
            "${CONFIG_OUT}/.config" \
            "${CONFIG_OUT}/expanded.config"

          for sym in \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_MODULES \
            CONFIG_MODVERSIONS \
            CONFIG_KALLSYMS \
            CONFIG_KALLSYMS_ALL \
            CONFIG_THREAD_INFO_IN_TASK
          do

            grep -q \
              "^${sym}=y$" \
              "${CONFIG_OUT}/expanded.config" || {

              echo "::error::Missing ${sym} after defconfig expansion"
              exit 1
            }

          done

          # ----------------------------------------------------------
          # Canonical stability.
          # ----------------------------------------------------------

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            savedefconfig

          cmp -s \
            "${CONFIG_OUT}/defconfig" \
            arch/arm64/configs/bg7n_defconfig || {

            echo "::error::Defconfig is not stable."

            diff -u \
              arch/arm64/configs/bg7n_defconfig \
              "${CONFIG_OUT}/defconfig" \
              || true

            exit 1
          }

          echo "DEFCONFIG GENERATION PASSED."

      # ============================================================
      # 15 - SAVE DEFCONFIG
      # ============================================================

      - name: 15 - Save final defconfig
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          test -s \
            arch/arm64/configs/bg7n_defconfig

          cp \
            arch/arm64/configs/bg7n_defconfig \
            "${GITHUB_WORKSPACE}/BG7n_final_defconfig"

          sha256sum \
            "${GITHUB_WORKSPACE}/BG7n_final_defconfig"

      # ============================================================
      # 16 - CUSTOM BUILD CONFIG
      #
      # IMPORTANT:
      #
      # Source Google's normal Android 12 configs, but do NOT retain
      # GKI aarch64 ABI/KMI variables.
      #
      # build.sh only enters those paths when the effective variables
      # have non-empty values.
      # ============================================================

      - name: 16 - Create custom BG7n build.config
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          cat > \
            build.config.bg7n.ksu.susfs <<'EOF'
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.common
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.aarch64
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.gki

          # --------------------------------------------------------
          # Our canonical device defconfig.
          # --------------------------------------------------------

          DEFCONFIG=bg7n_defconfig

          # Keep Google's defconfig validation.
          POST_DEFCONFIG_CMDS="check_defconfig"

          # --------------------------------------------------------
          # IMPORTANT:
          #
          # This is a custom KernelSU/SUSFS kernel.
          #
          # Do not carry Google's GKI ABI/KMI certification settings.
          # --------------------------------------------------------

          unset ABI_DEFINITION
          unset TIDY_ABI

          unset KMI_SYMBOL_LIST
          unset ADDITIONAL_KMI_SYMBOL_LISTS
          unset KMI_SYMBOL_LIST_ADD_ONLY
          unset KMI_SYMBOL_LIST_STRICT_MODE

          unset TRIM_NONLISTED_KMI
          unset KMI_ENFORCED

          unset MODULES_ORDER

          # --------------------------------------------------------
          # Outputs.
          # --------------------------------------------------------

          MAKE_GOALS="
          Image
          Image.lz4
          modules
          "

          FILES="
          arch/arm64/boot/Image
          arch/arm64/boot/Image.lz4
          "
          EOF

          echo "=== build.config.bg7n.ksu.susfs ==="
          cat \
            build.config.bg7n.ksu.susfs

      # ============================================================
      # 17 - EFFECTIVE BUILD CONFIG VALIDATION
      #
      # THIS replaces the broken textual grep which caused the current
      # screenshot error.
      #
      # We source the config exactly as build.sh does and examine the
      # effective shell values.
      # ============================================================

      - name: 17 - Verify effective ABI/KMI configuration
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          echo "=== Loading build config exactly as build.sh ==="

          (
            export ROOT_DIR="${PWD}"
            export KERNEL_DIR="common"

            source \
              common/build.config.bg7n.ksu.susfs

            echo
            echo "=== EFFECTIVE ABI/KMI VARIABLES ==="

            printf 'ABI_DEFINITION=<%s>\n' \
              "${ABI_DEFINITION:-}"

            printf 'TIDY_ABI=<%s>\n' \
              "${TIDY_ABI:-}"

            printf 'KMI_SYMBOL_LIST=<%s>\n' \
              "${KMI_SYMBOL_LIST:-}"

            printf 'ADDITIONAL_KMI_SYMBOL_LISTS=<%s>\n' \
              "${ADDITIONAL_KMI_SYMBOL_LISTS:-}"

            printf 'KMI_SYMBOL_LIST_ADD_ONLY=<%s>\n' \
              "${KMI_SYMBOL_LIST_ADD_ONLY:-}"

            printf 'KMI_SYMBOL_LIST_STRICT_MODE=<%s>\n' \
              "${KMI_SYMBOL_LIST_STRICT_MODE:-}"

            printf 'TRIM_NONLISTED_KMI=<%s>\n' \
              "${TRIM_NONLISTED_KMI:-}"

            printf 'KMI_ENFORCED=<%s>\n' \
              "${KMI_ENFORCED:-}"

            printf 'MODULES_ORDER=<%s>\n' \
              "${MODULES_ORDER:-}"

            echo

            test -z \
              "${ABI_DEFINITION:-}"

            test -z \
              "${TIDY_ABI:-}"

            test -z \
              "${KMI_SYMBOL_LIST:-}"

            test -z \
              "${ADDITIONAL_KMI_SYMBOL_LISTS:-}"

            test -z \
              "${KMI_SYMBOL_LIST_ADD_ONLY:-}"

            test -z \
              "${KMI_SYMBOL_LIST_STRICT_MODE:-}"

            test -z \
              "${TRIM_NONLISTED_KMI:-}"

            test -z \
              "${KMI_ENFORCED:-}"

            test -z \
              "${MODULES_ORDER:-}"

            echo
            echo "=== ABI/KMI runtime configuration is CLEAN ==="
          )

      # ============================================================
      # 18 - FINAL SOURCE TREE CHECK
      # ============================================================

      - name: 18 - Verify final source tree
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          test ! -f \
            .config

          test ! -f \
            defconfig

          test ! -d \
            include/config

          test ! -d \
            include/generated

          test ! -d \
            arch/arm64/include/generated

          test -L \
            drivers/kernelsu

          test -f \
            drivers/kernelsu/Kconfig

          test -f \
            drivers/kernelsu/Kbuild

          grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile

          test -s \
            arch/arm64/configs/bg7n_defconfig

          echo "SOURCE TREE READY."

      # ============================================================
      # 19 - BUILD KERNEL
      # ============================================================

      - name: 19 - Build BG7n kernel
        shell: bash
        working-directory: gki
        env:
          MAKE_JOBS: ${{ inputs.make_jobs }}
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-actions
        run: |
          set -euxo pipefail

          case "${MAKE_JOBS}" in
            ''|*[!0-9]*)
              echo "::error::make_jobs must be a positive integer"
              exit 1
              ;;
          esac

          test \
            "${MAKE_JOBS}" -ge 1

          export MAKEFLAGS="-j${MAKE_JOBS}"

          rm -rf \
            out/android12-5.10

          test ! -f \
            common/.config

          test ! -f \
            common/defconfig

          echo
          echo "=========================================="
          echo "START GOOGLE build.sh"
          echo "=========================================="

          BUILD_CONFIG=common/build.config.bg7n.ksu.susfs \
            ./build/build.sh

      # ============================================================
      # 20 - VERIFY KERNEL
      # ============================================================

      - name: 20 - Verify kernel output
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          mkdir -p \
            ../artifact/kernel \
            ../artifact/reports

          IMAGE_LZ4="$(
            find out \
              -type f \
              -path '*/dist/Image.lz4' |
            head -n1 ||
            true
          )"

          IMAGE="$(
            find out \
              -type f \
              -path '*/dist/Image' |
            head -n1 ||
            true
          )"

          test -n \
            "${IMAGE_LZ4}"

          cp \
            "${IMAGE_LZ4}" \
            ../artifact/kernel/Image.lz4

          if [ -n "${IMAGE}" ]; then

            cp \
              "${IMAGE}" \
              ../artifact/kernel/Image

          else

            lz4 \
              -d \
              -f \
              "${IMAGE_LZ4}" \
              ../artifact/kernel/Image

          fi

          test -s \
            ../artifact/kernel/Image

          test -s \
            ../artifact/kernel/Image.lz4

          CONFIG_FILE="$(
            find out \
              -type f \
              -name .config |
            head -n1 ||
            true
          )"

          test -n \
            "${CONFIG_FILE}"

          cp \
            "${CONFIG_FILE}" \
            ../artifact/kernel/.config

          MODULE_SYMVERS="$(
            find out \
              -type f \
              -name Module.symvers |
            head -n1 ||
            true
          )"

          if [ -n "${MODULE_SYMVERS}" ]; then
            cp \
              "${MODULE_SYMVERS}" \
              ../artifact/kernel/Module.symvers
          fi

          find out \
            -type f \
            -name System.map \
            -exec cp {} ../artifact/kernel/ \; \
            || true

          find out \
            -type f \
            -name modules.builtin \
            -exec cp {} ../artifact/kernel/ \; \
            || true

          find out \
            -type f \
            -name modules.builtin.modinfo \
            -exec cp {} ../artifact/kernel/ \; \
            || true

          echo
          echo "=========================================="
          echo "FINAL KERNEL CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_(KSU|KSU_SUSFS|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|THREAD_INFO_IN_TASK|LTO_NONE|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|CFI_CLANG|CFI_PERMISSIVE|SHADOW_CALL_STACK|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|OVERLAY_FS)=' \
            ../artifact/kernel/.config \
            || true

          for sym in \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_MODULES \
            CONFIG_MODVERSIONS \
            CONFIG_KALLSYMS \
            CONFIG_KALLSYMS_ALL \
            CONFIG_THREAD_INFO_IN_TASK
          do

            grep -q \
              "^${sym}=y$" \
              ../artifact/kernel/.config || {

              echo "::error::Missing ${sym} in actual build."
              exit 1
            }

          done

          # ABI must not have been accidentally activated.
          DIST_DIR="$(
            dirname \
              "${IMAGE_LZ4}"
          )"

          if [ -f \
            "${DIST_DIR}/abi.xml" ]
          then
            echo "::error::abi.xml was generated unexpectedly."
            exit 1
          fi

          if [ -f \
            "${DIST_DIR}/abi_symbollist" ]
          then
            echo "::error::abi_symbollist was generated unexpectedly."
            exit 1
          fi

          echo
          echo "=== Kernel version ==="

          make \
            -s \
            -C common \
            kernelversion

          {
            echo "=== Kernel version ==="
            make -s -C common kernelversion

            echo
            echo "=== GKI commit ==="
            git -C common rev-parse HEAD

            echo
            echo "=== KernelSU commit ==="
            git -C KernelSU rev-parse HEAD

            echo
            echo "=== SUSFS commit ==="
            git -C susfs rev-parse HEAD

            echo
            echo "=== Required config ==="
            grep -E \
              '^CONFIG_(KSU|KSU_SUSFS|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|THREAD_INFO_IN_TASK)=' \
              ../artifact/kernel/.config

            echo
            echo "=== Custom build mode ==="
            echo "ABI_DEFINITION=UNSET"
            echo "KMI_SYMBOL_LIST=UNSET"
            echo "TRIM_NONLISTED_KMI=UNSET"
            echo "KMI_SYMBOL_LIST_STRICT_MODE=UNSET"
            echo "KMI_ENFORCED=UNSET"
          } | tee \
            ../artifact/reports/kernel_verification.txt

          file \
            ../artifact/kernel/Image

          sha256sum \
            ../artifact/kernel/Image

          sha256sum \
            ../artifact/kernel/Image.lz4

      # ============================================================
      # 21 - BUILD SUSFS USERSPACE + MODULE
      # ============================================================

      - name: 21 - Build SUSFS userspace tool and module
        shell: bash
        working-directory: gki/susfs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euxo pipefail

          export PATH="${ANDROID_NDK_HOME}:${PATH}"

          chmod +x \
            build_ksu_susfs_tool.sh \
            build_ksu_module.sh

          ./build_ksu_susfs_tool.sh
          ./build_ksu_module.sh

          test -d \
            ksu_module_susfs

          mkdir -p \
            ../../artifact/susfs

          cp -a \
            ksu_module_susfs \
            ../../artifact/susfs/susfs4ksu-module

          if [ -f ksu_module_susfs.zip ]; then

            cp \
              ksu_module_susfs.zip \
              ../../artifact/susfs/susfs4ksu.zip

          fi

      # ============================================================
      # 22 - MAGISKBOOT
      # ============================================================

      - name: 22 - Prepare MagiskBoot
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            work

          MAGISK_API="https://api.github.com/repos/topjohnwu/Magisk/releases/latest"

          MAGISK_URL="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "${MAGISK_API}" |
            jq -r '
              .assets[]
              | select(.name | startswith("Magisk-"))
              | select(.name | endswith(".apk"))
              | .browser_download_url
            ' |
            head -n1
          )"

          test -n \
            "${MAGISK_URL}"

          curl -fL \
            "${MAGISK_URL}" \
            -o magisk.apk

          unzip -j -o \
            magisk.apk \
            'lib/arm64-v8a/libmagiskboot.so' \
            -d work

          mv \
            work/libmagiskboot.so \
            work/magiskboot

          chmod +x \
            work/magiskboot

          test -x \
            work/magiskboot

      # ============================================================
      # 23 - REPACK STOCK BOOT
      # ============================================================

      - name: 23 - Repack stock BG7n boot
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            work/boot \
            artifact/boot

          cp \
            stock/boot.img \
            work/boot/boot.img

          test -s \
            artifact/kernel/Image

          (
            cd work/boot

            ../magiskboot unpack boot.img

            test -f \
              kernel

            test -s \
              kernel

            echo "=== Stock boot kernel ==="

            strings \
              kernel |
              grep \
                -m1 \
                'Linux version' \
              || true
          )

          if ! strings \
            work/boot/kernel |
            grep -q \
              "Linux version ${GKI_VERSION}"
          then

            echo "::error::Stock boot kernel does not match ${GKI_VERSION}."

            strings \
              work/boot/kernel |
              grep \
                -m5 \
                'Linux version' \
              || true

            exit 1
          fi

          cp \
            artifact/kernel/Image \
            work/boot/kernel

          test -s \
            work/boot/kernel

          (
            cd work/boot

            ../magiskboot repack boot.img

            test -s \
              new-boot.img
          )

          cp \
            work/boot/new-boot.img \
            artifact/boot/BG7n-KSU-SUSFS-boot.img

          test -s \
            artifact/boot/BG7n-KSU-SUSFS-boot.img

          file \
            artifact/boot/BG7n-KSU-SUSFS-boot.img

          sha256sum \
            artifact/boot/BG7n-KSU-SUSFS-boot.img |
            tee \
              artifact/reports/generated_boot.sha256

      # ============================================================
      # 24 - BUILD MANIFEST
      # ============================================================

      - name: 24 - Create build manifest
        shell: bash
        run: |
          set -euxo pipefail

          SUSFS_COMMIT="$(
            git -C gki/susfs \
              rev-parse HEAD
          )"

          KSU_ACTUAL_COMMIT="$(
            git -C gki/KernelSU \
              rev-parse HEAD
          )"

          COMMON_COMMIT="$(
            git -C gki/common \
              rev-parse HEAD
          )"

          STOCK_BOOT_SHA="$(
            cut \
              -d' ' \
              -f1 \
              stock/boot.sha256
          )"

          cat > \
            artifact/BUILD_INFO.txt \
            <<EOF
          DEVICE=${DEVICE}

          GOOGLE_GKI_MANIFEST_BRANCH=${GKI_MANIFEST_BRANCH}
          GOOGLE_GKI_COMMON_TAG=${GKI_COMMON_TAG}
          GOOGLE_GKI_VERSION=${GKI_VERSION}
          GOOGLE_GKI_SHA=${GKI_SHA}
          COMMON_COMMIT=${COMMON_COMMIT}

          KERNELSU_REPO=${KSU_REPO}
          KERNELSU_COMMIT=${KSU_ACTUAL_COMMIT}

          SUSFS_REPO=${SUSFS_REPO}
          SUSFS_REF=${{ inputs.susfs_ref }}
          SUSFS_COMMIT=${SUSFS_COMMIT}

          BOOT_RELEASE_REPO=${BOOT_REPO}
          BOOT_RELEASE_TAG=${{ inputs.boot_release_tag }}

          STOCK_BOOT_SHA256=${STOCK_BOOT_SHA}

          CUSTOM_GKI_KERNEL=1

          ABI_DEFINITION=UNSET
          KMI_SYMBOL_LIST=UNSET
          ADDITIONAL_KMI_SYMBOL_LISTS=UNSET
          TRIM_NONLISTED_KMI=UNSET
          KMI_SYMBOL_LIST_STRICT_MODE=UNSET
          KMI_ENFORCED=UNSET

          REQUIRED_CONFIG_KSU=y
          REQUIRED_CONFIG_KSU_SUSFS=y
          REQUIRED_CONFIG_MODULES=y
          REQUIRED_CONFIG_MODVERSIONS=y
          REQUIRED_CONFIG_KALLSYMS=y
          REQUIRED_CONFIG_KALLSYMS_ALL=y
          REQUIRED_CONFIG_THREAD_INFO_IN_TASK=y
          EOF

          cp \
            gki/manifest.lock.xml \
            artifact/manifest.lock.xml

          cp \
            stock/boot.sha256 \
            artifact/reports/stock_boot.sha256

          cp \
            BG7n_final_defconfig \
            artifact/kernel/bg7n_final_defconfig

          find artifact \
            -type f \
            ! -name SHA256SUMS.txt \
            -print0 |
            sort -z |
            xargs -0 sha256sum \
            > artifact/SHA256SUMS.txt

      # ============================================================
      # 25 - PACKAGE
      # ============================================================

      - name: 25 - Package artifacts
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf \
            artifact/package

          mkdir -p \
            artifact/package

          cp \
            artifact/BUILD_INFO.txt \
            artifact/package/

          cp \
            artifact/SHA256SUMS.txt \
            artifact/package/

          cp -a \
            artifact/kernel \
            artifact/package/kernel

          cp -a \
            artifact/susfs \
            artifact/package/susfs

          cp -a \
            artifact/reports \
            artifact/package/reports

          if [ -d \
            artifact/boot ]
          then
            cp -a \
              artifact/boot \
              artifact/package/boot
          fi

          cp \
            BG7n_stock_defconfig \
            artifact/package/

          cp \
            BG7n_final_defconfig \
            artifact/package/

          cat > \
            artifact/package/README.txt \
            <<EOF
          TECNO BG7n
          ========================================

          GOOGLE GKI:
            ${GKI_COMMON_TAG}
            Linux ${GKI_VERSION}
            ${GKI_SHA}

          KERNELSU:
            ${KSU_REPO}
            ${KSU_COMMIT}

          SUSFS:
            ${SUSFS_REPO}
            ${SUSFS_COMMIT}

          REQUIRED:
            CONFIG_KSU=y
            CONFIG_KSU_SUSFS=y
            CONFIG_MODULES=y
            CONFIG_MODVERSIONS=y
            CONFIG_KALLSYMS=y
            CONFIG_KALLSYMS_ALL=y
            CONFIG_THREAD_INFO_IN_TASK=y

          ABI/KMI:
            This is a custom KernelSU/SUSFS kernel.

            ABI_DEFINITION=UNSET
            KMI_SYMBOL_LIST=UNSET
            TRIM_NONLISTED_KMI=UNSET
            KMI_SYMBOL_LIST_STRICT_MODE=UNSET
            KMI_ENFORCED=UNSET

          IMPORTANT:
            This is not an unmodified Google-certified GKI image.

            Keep the original stock boot.img.

            Verify the generated kernel and generated boot image
            before flashing.

          Reports:
            kernel/kernel_verification.txt
            reports/generated_boot.sha256
            reports/stock_boot.sha256
            SHA256SUMS.txt
          EOF

          (
            cd artifact/package

            zip \
              -r \
              ../../BG7n_GKI_r3_KSU_SUSFS_artifacts.zip \
              .
          )

          test -s \
            BG7n_GKI_r3_KSU_SUSFS_artifacts.zip

      # ============================================================
      # 26 - UPLOAD
      # ============================================================

      - name: 26 - Upload complete artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-GKI-r3-KSU-SUSFS
          path: |
            BG7n_GKI_r3_KSU_SUSFS_artifacts.zip
            artifact/
          if-no-files-found: error
          retention-days: 30

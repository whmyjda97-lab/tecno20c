name: Build BG7n SUSFS + KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      # =========================================================
      # 1. تحميل ملفات المشروع
      # =========================================================
      - name: تحميل ملفات المشروع
        uses: actions/checkout@v4


      # =========================================================
      # 2. تثبيت أدوات البناء
      # =========================================================
      - name: تثبيت أدوات البناء
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libssl-dev \
            libelf-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            curl \
            xz-utils \
            zstd \
            device-tree-compiler \
            file


      # =========================================================
      # 3. تحميل مصدر النواة المطابق
      # =========================================================
      - name: تحميل مصدر النواة المطابق
        env:
          KERNEL_COMMIT: d09ef2e980e0974a0d6dfe762e29fff118db7f46
        run: |
          git init kernel
          cd kernel

          git remote add origin \
            https://android.googlesource.com/kernel/common

          git fetch --depth=1 origin "$KERNEL_COMMIT"

          git checkout --detach FETCH_HEAD

          echo "Kernel commit:"
          git rev-parse HEAD


      # =========================================================
      # 4. تجهيز مجلدات العمل
      # =========================================================
      - name: تجهيز مجلدات العمل
        run: |
          rm -rf out
          rm -rf work
          rm -rf tools
          rm -rf bootwork

          mkdir -p out
          mkdir -p work
          mkdir -p tools
          mkdir -p bootwork


      # =========================================================
      # 5. فك KernelSU-Next و SUSFS
      # =========================================================
      - name: تجهيز KernelSU-Next و SUSFS
        run: |
          tar -xzf KernelSU-Next.tar.gz -C work

          tar -xzf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            -C work

          KSU_DIR="$(find work \
            -maxdepth 1 \
            -type d \
            -name 'KernelSU-Next-*' \
            | head -1)"

          SUSFS_DIR="work/susfs4ksu-gki-android12-5.10"

          test -d "$KSU_DIR"
          test -d "$SUSFS_DIR"

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          echo "SUSFS_DIR=$SUSFS_DIR" >> "$GITHUB_ENV"

          echo "KSU_DIR=$KSU_DIR"
          echo "SUSFS_DIR=$SUSFS_DIR"


      # =========================================================
      # 6. إضافة KernelSU-Next
      # =========================================================
      - name: إضافة KernelSU-Next إلى النواة
        run: |
          cd kernel

          bash \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/setup.sh"

          test -d drivers/kernelsu

          echo "تم تثبيت KernelSU-Next."


      # =========================================================
      # 7. التحقق من SUSFS داخل KernelSU-Next
      # =========================================================
      - name: التحقق من تكامل SUSFS
        run: |
          test -f \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/Kconfig"

          test -f \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/Kbuild"

          if grep -Rqs "CONFIG_KSU_SUSFS" \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel"; then

            echo "SUSFS موجود داخل KernelSU-Next."

          else

            echo "CONFIG_KSU_SUSFS غير موجود."
            exit 1

          fi

          echo "لن يتم تطبيق 10_enable_susfs_for_ksu.patch."


      # =========================================================
      # 8. تطبيق Patch BG7n
      # =========================================================
      - name: تطبيق Patch الخاص بـ BG7n
        run: |
          cd kernel

          patch -p1 --fuzz=0 \
            < "$GITHUB_WORKSPACE/patches-susfs-bg7n.patch"

          echo "تم تطبيق Patch BG7n."


      # =========================================================
      # 9. نسخ ملفات SUSFS
      # =========================================================
      - name: تثبيت ملفات SUSFS
        run: |
          cp \
            "$SUSFS_DIR/kernel_patches/fs/susfs.c" \
            kernel/fs/susfs.c

          cp \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" \
            kernel/include/linux/susfs.h

          cp \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" \
            kernel/include/linux/susfs_def.h

          test -f kernel/fs/susfs.c
          test -f kernel/include/linux/susfs.h
          test -f kernel/include/linux/susfs_def.h


      # =========================================================
      # 10. إعداد Kernel Config
      # =========================================================
      - name: تجهيز Kernel Config
        run: |
          test -f kernel/scripts/config

          chmod +x kernel/scripts/config

          cp \
            stock.config \
            out/.config

          test -s out/.config

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS

          kernel/scripts/config \
            --enable CONFIG_KSU_SUSFS_SUS_PATH \
            --file out/.config

          kernel/scripts/config \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT \
            --file out/.config

          kernel/scripts/config \
            --enable \
            CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_NATIVE_APP \
            --file out/.config

          kernel/scripts/config \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT \
            --file out/.config

          kernel/scripts/config \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT \
            --file out/.config

          kernel/scripts/config \
            --enable CONFIG_KSU_SUSFS_SUS_MAP \
            --file out/.config

          kernel/scripts/config \
            --disable CONFIG_TRIM_UNUSED_KSYMS \
            --file out/.config \
            || true

          kernel/scripts/config \
            --disable CONFIG_UNUSED_KSYMS \
            --file out/.config \
            || true

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            olddefconfig

          test -s out/.config


      # =========================================================
      # 11. بناء Kernel Image
      # =========================================================
      - name: بناء Kernel Image
        id: kernel_build
        continue-on-error: true
        run: |
          set -o pipefail

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=frame-larger-than" \
            -j"$(nproc)" \
            Image \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/kernel-build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo "Kernel build status: $BUILD_STATUS"

          exit "$BUILD_STATUS"


      # =========================================================
      # 12. رفع سجل البناء دائمًا
      # =========================================================
      - name: رفع سجل البناء
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 7


      # =========================================================
      # 13. التحقق من Kernel
      # =========================================================
      - name: التحقق من Kernel Image
        if: steps.kernel_build.outcome == 'success'
        run: |
          test -s \
            out/arch/arm64/boot/Image

          file \
            out/arch/arm64/boot/Image

          ls -lh \
            out/arch/arm64/boot/Image


      # =========================================================
      # 14. إيقاف إذا فشل Kernel
      # =========================================================
      - name: إيقاف البناء إذا فشل Kernel
        if: steps.kernel_build.outcome != 'success'
        run: |
          echo "فشل بناء Kernel."
          exit 1


      # =========================================================
      # 15. تحميل Magiskboot
      # =========================================================
      - name: تحميل Magiskboot الرسمي
        run: |
          set -e

          MAGISK_URL="$(
            curl -fsSL \
              https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            | python3 -c '
import json,sys

data=json.load(sys.stdin)

apk=[
    x["browser_download_url"]
    for x in data.get("assets",[])
    if x["name"].lower().endswith(".apk")
]

if not apk:
    raise SystemExit("لم يتم العثور على APK")

print(apk[0])
'
          )"

          wget -fL \
            --retry-connrefused \
            --tries=5 \
            --waitretry=3 \
            -O tools/Magisk.apk \
            "$MAGISK_URL"

          test -s tools/Magisk.apk


      # =========================================================
      # 16. استخراج Magiskboot
      # =========================================================
      - name: استخراج Magiskboot
        run: |
          set -e

          unzip -l \
            tools/Magisk.apk \
            | grep magiskboot

          unzip -p \
            tools/Magisk.apk \
            lib/x86_64/libmagiskboot.so \
            > tools/magiskboot

          test -s tools/magiskboot

          chmod +x tools/magiskboot

          file tools/magiskboot

          tools/magiskboot --help


      # =========================================================
      # 17. تحميل boot.img.zip من Release
      # =========================================================
      - name: تحميل boot الأصلي
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: stock-boot
        run: |
          set -e

          rm -rf bootwork
          mkdir -p bootwork

          gh release download \
            "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --dir bootwork

          ZIP_FILE="$(
            find bootwork \
              -maxdepth 1 \
              -type f \
              -name "*.zip" \
              | head -1
          )"

          test -n "$ZIP_FILE"
          test -f "$ZIP_FILE"

          mkdir -p bootwork/extracted

          unzip -o \
            "$ZIP_FILE" \
            -d bootwork/extracted

          BOOT_FILE="$(
            find bootwork/extracted \
              -type f \
              -name "boot.img" \
              | head -1
          )"

          test -n "$BOOT_FILE"
          test -f "$BOOT_FILE"

          cp \
            "$BOOT_FILE" \
            bootwork/boot.img

          test -s \
            bootwork/boot.img

          echo "تم الحصول على boot.img."


      # =========================================================
      # 18. فك boot.img
      # =========================================================
      - name: فك boot.img
        run: |
          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            unpack boot.img

          test -s kernel

          echo "تم فك boot.img."


      # =========================================================
      # 19. استبدال Kernel
      # =========================================================
      - name: استبدال Kernel
        run: |
          test -s \
            out/arch/arm64/boot/Image

          cp \
            out/arch/arm64/boot/Image \
            bootwork/kernel

          test -s bootwork/kernel


      # =========================================================
      # 20. إعادة بناء boot.img
      # =========================================================
      - name: إعادة بناء boot.img
        run: |
          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            repack boot.img

          test -s new-boot.img

          mv \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

          test -s \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"


      # =========================================================
      # 21. فحص boot النهائي
      # =========================================================
      - name: فحص boot النهائي
        run: |
          test -s \
            boot-BG7n-SUSFS-KSU.img

          echo "تم إنشاء boot النهائي."

          ls -lh \
            boot-BG7n-SUSFS-KSU.img

          sha256sum \
            boot-BG7n-SUSFS-KSU.img

          file \
            boot-BG7n-SUSFS-KSU.img


      # =========================================================
      # 22. تجهيز وحدة SUSFS
      # =========================================================
      - name: تجهيز وحدة SUSFS
        run: |
          cd "$SUSFS_DIR"

          tar -czf \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz" \
            ksu_module_susfs

          test -s \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz"


      # =========================================================
      # 23. عرض الملفات التي سيتم رفعها
      # =========================================================
      - name: فحص ملفات Artifact
        run: |
          echo "=============================="
          echo "FILES TO UPLOAD"
          echo "=============================="

          test -s boot-BG7n-SUSFS-KSU.img
          test -s out/arch/arm64/boot/Image
          test -s out/.config
          test -s susfs-module-source.tar.gz
          test -s patches-susfs-bg7n.patch

          ls -lh \
            boot-BG7n-SUSFS-KSU.img \
            out/arch/arm64/boot/Image \
            out/.config \
            susfs-module-source.tar.gz \
            patches-susfs-bg7n.patch


      # =========================================================
      # 24. رفع Artifact النهائي
      # =========================================================
      - name: رفع Artifact النهائي
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-SUSFS-KSU-build-${{ github.run_number }}
          path: |
            boot-BG7n-SUSFS-KSU.img
            out/arch/arm64/boot/Image
            out/.config
            susfs-module-source.tar.gz
            patches-susfs-bg7n.patch
            kernel-build.log
          if-no-files-found: warn
          retention-days: 14

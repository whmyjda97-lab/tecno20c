name: Build BG7n SUSFS + KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      # =========================================================
      # 1. تحميل ملفات المشروع
      # =========================================================
      - name: تحميل ملفات المشروع
        uses: actions/checkout@v4


      # =========================================================
      # 2. تثبيت أدوات البناء
      # =========================================================
      - name: تثبيت أدوات البناء
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libssl-dev \
            libelf-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            curl \
            xz-utils \
            zstd \
            device-tree-compiler \
            file


      # =========================================================
      # 3. تحميل مصدر Android Common Kernel المطابق للهاتف
      # =========================================================
      - name: تحميل مصدر النواة المطابق
        env:
          KERNEL_COMMIT: d09ef2e980e0974a0d6dfe762e29fff118db7f46
        run: |
          git init kernel

          cd kernel

          git remote add origin \
            https://android.googlesource.com/kernel/common

          git fetch --depth=1 origin "$KERNEL_COMMIT"

          git checkout --detach FETCH_HEAD

          echo "Kernel source commit:"
          git rev-parse HEAD


      # =========================================================
      # 4. إنشاء مجلدات العمل
      # =========================================================
      - name: تجهيز مجلدات العمل
        run: |
          rm -rf out
          rm -rf work
          rm -rf tools
          rm -rf bootwork

          mkdir -p out
          mkdir -p work
          mkdir -p tools
          mkdir -p bootwork


      # =========================================================
      # 5. تجهيز KernelSU-Next و SUSFS
      # =========================================================
      - name: تجهيز KernelSU-Next و SUSFS
        run: |
          tar -xzf \
            KernelSU-Next.tar.gz \
            -C work

          tar -xzf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            -C work

          KSU_DIR="$(find work \
            -maxdepth 1 \
            -type d \
            -name 'KernelSU-Next-*' \
            | head -1)"

          SUSFS_DIR="work/susfs4ksu-gki-android12-5.10"

          test -d "$KSU_DIR"
          test -d "$SUSFS_DIR"

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          echo "SUSFS_DIR=$SUSFS_DIR" >> "$GITHUB_ENV"

          echo "KernelSU directory:"
          echo "$KSU_DIR"

          echo "SUSFS directory:"
          echo "$SUSFS_DIR"


      # =========================================================
      # 6. إضافة KernelSU-Next إلى النواة
      # =========================================================
      - name: إضافة KernelSU-Next إلى النواة
        run: |
          cd kernel

          bash \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/setup.sh"

          test -d drivers/kernelsu

          echo "تم تثبيت KernelSU-Next بنجاح."


      # =========================================================
      # 7. التحقق من تكامل SUSFS داخل KernelSU-Next
      # =========================================================
      - name: التحقق من تكامل SUSFS داخل KernelSU-Next
        run: |
          test -f \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/Kconfig"

          test -f \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/Kbuild"

          if grep -Rqs "CONFIG_KSU_SUSFS" \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel"; then

            echo "تم العثور على تكامل SUSFS داخل KernelSU-Next."

          else

            echo "لم يتم العثور على CONFIG_KSU_SUSFS داخل KernelSU-Next."
            exit 1

          fi

          echo "سيتم تخطي patch 10_enable_susfs_for_ksu.patch."


      # =========================================================
      # 8. تطبيق Patch الخاص بـ BG7n و SUSFS
      # =========================================================
      - name: تطبيق Patch الخاص بـ BG7n
        run: |
          cd kernel

          patch -p1 --fuzz=0 \
            < "$GITHUB_WORKSPACE/patches-susfs-bg7n.patch"

          echo "تم تطبيق Patch الخاص بـ BG7n."


      # =========================================================
      # 9. تثبيت ملفات SUSFS
      # =========================================================
      - name: تثبيت ملفات SUSFS
        run: |
          cp \
            "$SUSFS_DIR/kernel_patches/fs/susfs.c" \
            kernel/fs/susfs.c

          cp \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" \
            kernel/include/linux/susfs.h

          cp \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" \
            kernel/include/linux/susfs_def.h

          test -f kernel/fs/susfs.c
          test -f kernel/include/linux/susfs.h
          test -f kernel/include/linux/susfs_def.h

          echo "تم تثبيت ملفات SUSFS."


      # =========================================================
      # 10. تجهيز أداة config
      # =========================================================
      - name: تجهيز أداة config
        run: |
          test -f kernel/scripts/config

          chmod +x kernel/scripts/config

          echo "تم العثور على kernel/scripts/config."


      # =========================================================
      # 11. نسخ إعداد النواة الأصلي إلى مجلد الإخراج
      # =========================================================
      - name: تجهيز Kernel Config
        run: |
          cp \
            stock.config \
            out/.config

          test -s out/.config

          echo "تم نسخ stock.config إلى out/.config."


      # =========================================================
      # 12. تفعيل KernelSU و SUSFS
      #
      # المهم هنا:
      # CONFIG_KSU_SUSFS يعتمد على CONFIG_THREAD_INFO_IN_TASK
      # لذلك يجب تفعيله قبل olddefconfig.
      # =========================================================
      - name: تفعيل KernelSU و SUSFS
        run: |
          set -e

          C=kernel/scripts/config
          CFG=out/.config

          "$C" \
            --file "$CFG" \
            --enable CONFIG_THREAD_INFO_IN_TASK

          "$C" \
            --file "$CFG" \
            --enable CONFIG_KSU

          "$C" \
            --file "$CFG" \
            --enable CONFIG_KSU_SUSFS

          "$C" \
            --file "$CFG" \
            --enable CONFIG_KSU_SUSFS_SUS_PATH

          "$C" \
            --file "$CFG" \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT

          "$C" \
            --file "$CFG" \
            --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_NATIVE_APP

          "$C" \
            --file "$CFG" \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT

          "$C" \
            --file "$CFG" \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT

          "$C" \
            --file "$CFG" \
            --enable CONFIG_KSU_SUSFS_SUS_MAP

          "$C" \
            --disable CONFIG_TRIM_UNUSED_KSYMS \
            --file "$CFG" \
            || true

          "$C" \
            --disable CONFIG_UNUSED_KSYMS \
            --file "$CFG" \
            || true

          echo "تم تفعيل خيارات KernelSU و SUSFS."


      # =========================================================
      # 13. إنشاء الإعداد النهائي
      # =========================================================
      - name: إنشاء إعداد البناء النهائي
        run: |
          set -e

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            olddefconfig

          test -s out/.config

          echo "تم إنشاء الإعداد النهائي."


      # =========================================================
      # 14. فحص Config النهائي قبل البناء
      #
      # هذا الفحص هو الإصلاح الأساسي للمشكلة.
      # إذا ظهر undef هنا سيتوقف البناء فورًا بدل انتظار 20 دقيقة.
      # =========================================================
      - name: التحقق الصارم من Config SUSFS
        run: |
          set -e

          C=kernel/scripts/config
          CFG=out/.config

          echo "=============================="
          echo "CONFIGURATION CHECK"
          echo "=============================="

          check_y() {
            NAME="$1"

            STATE="$(
              "$C" \
                --file "$CFG" \
                --state "$NAME" \
                2>/dev/null || true
            )"

            echo "$NAME = [$STATE]"

            if [ "$STATE" != "y" ]; then
              echo ""
              echo "ERROR: $NAME ليس y"
              echo ""
              echo "محتوى الإعداد المرتبط:"
              grep -E \
                "^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_THREAD_INFO_IN_TASK)" \
                "$CFG" \
                || true
              exit 1
            fi
          }

          check_y CONFIG_THREAD_INFO_IN_TASK
          check_y CONFIG_KSU
          check_y CONFIG_KSU_SUSFS
          check_y CONFIG_KSU_SUSFS_SUS_PATH
          check_y CONFIG_KSU_SUSFS_SUS_MOUNT
          check_y CONFIG_KSU_SUSFS_SUS_KSTAT
          check_y CONFIG_KSU_SUSFS_SUS_MAP

          echo ""
          echo "=============================="
          echo "SUSFS CONFIG OK"
          echo "=============================="


      # =========================================================
      # 15. فحص خيارات KernelSU و SUSFS
      # =========================================================
      - name: فحص إعدادات KSU و SUSFS
        run: |
          echo "=============================="
          echo "KernelSU"
          echo "=============================="

          grep '^CONFIG_KSU=' \
            out/.config || true

          echo "=============================="
          echo "THREAD INFO"
          echo "=============================="

          grep '^CONFIG_THREAD_INFO_IN_TASK=' \
            out/.config || true

          echo "=============================="
          echo "SUSFS"
          echo "=============================="

          grep '^CONFIG_KSU_SUSFS=' \
            out/.config || true

          echo "=============================="
          echo "SUSFS OPTIONS"
          echo "=============================="

          grep '^CONFIG_KSU_SUSFS_' \
            out/.config || true


      # =========================================================
      # 16. بناء Kernel Image
      # =========================================================
      - name: بناء Kernel Image
        id: kernel_build
        continue-on-error: true
        run: |
          set -o pipefail

          echo "=============================="
          echo "بدء بناء Kernel Image"
          echo "=============================="

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=frame-larger-than" \
            -j"$(nproc)" \
            Image \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/kernel-build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "=============================="
          echo "رمز نتيجة البناء: $BUILD_STATUS"
          echo "=============================="

          exit "$BUILD_STATUS"


      # =========================================================
      # 17. حفظ سجل البناء دائمًا
      # =========================================================
      - name: رفع سجل بناء النواة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 7


      # =========================================================
      # 18. التأكد من نجاح Kernel Image
      # =========================================================
      - name: التحقق من نجاح بناء Kernel Image
        if: steps.kernel_build.outcome == 'success'
        run: |
          test -s \
            out/arch/arm64/boot/Image

          file \
            out/arch/arm64/boot/Image

          ls -lh \
            out/arch/arm64/boot/Image

          echo "تم بناء Kernel Image بنجاح."


      # =========================================================
      # 19. إيقاف البناء إذا فشل Kernel
      # =========================================================
      - name: إيقاف البناء إذا فشل Kernel
        if: steps.kernel_build.outcome != 'success'
        run: |
          echo "فشل بناء Kernel Image."
          echo "تم حفظ kernel-build.log كـArtifact."
          exit 1


      # =========================================================
      # 20. تحميل Magiskboot من GitHub الرسمي
      # =========================================================
      - name: تحميل Magiskboot
        run: |
          set -e

          echo "جلب أحدث إصدار رسمي من Magisk..."

          MAGISK_URL="$(
            curl -fsSL \
              https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            | python3 -c '
import json
import sys

data = json.load(sys.stdin)

assets = data.get("assets", [])

apk = [
    a["browser_download_url"]
    for a in assets
    if a["name"].lower().endswith(".apk")
]

if not apk:
    raise SystemExit("لم يتم العثور على Magisk APK")

print(apk[0])
'
          )"

          echo "Magisk URL:"
          echo "$MAGISK_URL"

          wget \
            -f \
            -L \
            --retry-connrefused \
            --tries=5 \
            --waitretry=3 \
            -O tools/Magisk.apk \
            "$MAGISK_URL"

          test -s tools/Magisk.apk

          echo "تم تحميل Magisk APK."


      # =========================================================
      # 21. استخراج Magiskboot
      # =========================================================
      - name: استخراج Magiskboot
        run: |
          set -e

          unzip -l \
            tools/Magisk.apk \
            | grep magiskboot

          unzip -p \
            tools/Magisk.apk \
            lib/x86_64/libmagiskboot.so \
            > tools/magiskboot

          test -s tools/magiskboot

          chmod +x tools/magiskboot

          file tools/magiskboot

          tools/magiskboot --help

          echo "تم تجهيز Magiskboot."


      # =========================================================
      # 22. تحميل boot.img من Release
      # =========================================================
      - name: تحميل boot.img من Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: stock-boot
        run: |
          set -e

          rm -rf bootwork
          mkdir -p bootwork

          gh release download \
            "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --dir bootwork

          echo "ملفات Release:"
          ls -lh bootwork

          ZIP_FILE="$(
            find bootwork \
              -maxdepth 1 \
              -type f \
              -name '*.zip' \
              | head -1
          )"

          test -n "$ZIP_FILE"
          test -f "$ZIP_FILE"

          echo "سيتم استخدام:"
          echo "$ZIP_FILE"

          mkdir -p bootwork/extracted

          unzip -o \
            "$ZIP_FILE" \
            -d bootwork/extracted

          BOOT_FILE="$(
            find bootwork/extracted \
              -type f \
              -name 'boot.img' \
              | head -1
          )"

          test -n "$BOOT_FILE"
          test -f "$BOOT_FILE"

          cp \
            "$BOOT_FILE" \
            bootwork/boot.img

          test -s \
            bootwork/boot.img

          echo "تم الحصول على boot.img."


      # =========================================================
      # 23. فك boot.img الأصلي
      # =========================================================
      - name: فك boot.img الأصلي
        run: |
          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            unpack boot.img

          test -s kernel

          echo "تم فك boot.img بنجاح."

          file kernel

          ls -lh kernel


      # =========================================================
      # 24. استبدال Kernel
      # =========================================================
      - name: استبدال Kernel الأصلي
        run: |
          test -s \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"

          cp \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" \
            "$GITHUB_WORKSPACE/bootwork/kernel"

          test -s \
            "$GITHUB_WORKSPACE/bootwork/kernel"

          echo "تم استبدال Kernel الأصلي."


      # =========================================================
      # 25. إعادة بناء boot.img
      # =========================================================
      - name: إعادة بناء boot.img
        run: |
          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            repack boot.img

          test -s new-boot.img

          mv \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

          test -s \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

          echo "تم إنشاء boot-BG7n-SUSFS-KSU.img."


      # =========================================================
      # 26. فحص boot النهائي
      # =========================================================
      - name: فحص boot النهائي
        run: |
          test -s \
            boot-BG7n-SUSFS-KSU.img

          echo "=============================="
          echo "BOOT FINAL"
          echo "=============================="

          ls -lh \
            boot-BG7n-SUSFS-KSU.img

          sha256sum \
            boot-BG7n-SUSFS-KSU.img

          file \
            boot-BG7n-SUSFS-KSU.img


      # =========================================================
      # 27. تجهيز SUSFS Module
      # =========================================================
      - name: تجهيز SUSFS Module
        run: |
          cd "$SUSFS_DIR"

          tar -czf \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz" \
            ksu_module_susfs

          test -s \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz"


      # =========================================================
      # 28. رفع ملفات البناء النهائية
      # =========================================================
      - name: رفع ملفات البناء النهائية
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-SUSFS-KSU-build

          path: |
            boot-BG7n-SUSFS-KSU.img
            out/arch/arm64/boot/Image
            out/.config
            susfs-module-source.tar.gz
            patches-susfs-bg7n.patch

          if-no-files-found: error

          retention-days: 14

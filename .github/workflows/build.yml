name: Build BG7n SUSFS + KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      # =========================================================
      # 1. جلب ملفات المشروع
      # =========================================================
      - name: جلب ملفات المشروع
        uses: actions/checkout@v4

      # =========================================================
      # 2. تثبيت أدوات البناء
      # =========================================================
      - name: تثبيت أدوات البناء
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libssl-dev \
            libelf-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            curl \
            xz-utils \
            zstd \
            device-tree-compiler \
            file

      # =========================================================
      # 3. تحميل مصدر Android Common Kernel
      # =========================================================
      - name: تحميل مصدر النواة المطابق
        env:
          KERNEL_COMMIT: d09ef2e980e0974a0d6dfe762e29fff118db7f46
        run: |
          git init kernel
          cd kernel

          git remote add origin \
            https://android.googlesource.com/kernel/common

          git fetch --depth=1 origin "$KERNEL_COMMIT"

          git checkout --detach FETCH_HEAD

          echo "Kernel source:"
          git rev-parse HEAD

      # =========================================================
      # 4. تنظيف أي ملفات بناء قديمة
      # =========================================================
      - name: تنظيف مصدر النواة
        run: |
          rm -rf out
          mkdir -p out
          mkdir -p work
          mkdir -p tools
          mkdir -p bootwork

      # =========================================================
      # 5. فك KernelSU-Next و SUSFS
      # =========================================================
      - name: تجهيز KernelSU-Next و SUSFS
        run: |
          tar -xzf KernelSU-Next.tar.gz -C work
          tar -xzf susfs4ksu-gki-android12-5.10.tar.gz -C work

          KSU_DIR="$(find work -maxdepth 1 -type d -name 'KernelSU-Next-*' | head -1)"

          SUSFS_DIR="work/susfs4ksu-gki-android12-5.10"

          test -d "$KSU_DIR"
          test -d "$SUSFS_DIR"

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          echo "SUSFS_DIR=$SUSFS_DIR" >> "$GITHUB_ENV"

          echo "KernelSU directory:"
          echo "$KSU_DIR"

          echo "SUSFS directory:"
          echo "$SUSFS_DIR"

      # =========================================================
      # 6. إضافة KernelSU-Next إلى النواة
      # =========================================================
      - name: إضافة KernelSU-Next إلى النواة
        run: |
          cd kernel

          bash "$GITHUB_WORKSPACE/$KSU_DIR/kernel/setup.sh"

          test -d drivers/kernelsu

          echo "KernelSU-Next تم تثبيته بنجاح."

      # =========================================================
      # 7. تطبيق تكامل SUSFS مع KernelSU
      # =========================================================
      - name: تطبيق تكامل SUSFS مع KernelSU
        run: |
          cd "$KSU_DIR"

          patch -p1 --fuzz=0 \
            < "$GITHUB_WORKSPACE/$SUSFS_DIR/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

      # =========================================================
      # 8. تطبيق Patch الخاص بـ BG7n
      # =========================================================
      - name: تطبيق Patch الخاص بـ BG7n
        run: |
          cd kernel

          patch -p1 --fuzz=0 \
            < "$GITHUB_WORKSPACE/patches-susfs-bg7n.patch"

      # =========================================================
      # 9. نسخ ملفات SUSFS
      # =========================================================
      - name: تثبيت ملفات SUSFS
        run: |
          cp \
            "$SUSFS_DIR/kernel_patches/fs/susfs.c" \
            kernel/fs/susfs.c

          cp \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" \
            kernel/include/linux/susfs.h

          cp \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" \
            kernel/include/linux/susfs_def.h

          test -f kernel/fs/susfs.c
          test -f kernel/include/linux/susfs.h
          test -f kernel/include/linux/susfs_def.h

      # =========================================================
      # 10. إزالة Git من مصدر النواة لمنع خطأ
      # "The source tree is not clean"
      # =========================================================
      - name: منع مشكلة مصدر النواة غير النظيف
        run: |
          rm -rf kernel/.git

          echo "تم تنظيف حالة Git من مصدر النواة."

      # =========================================================
      # 11. إعداد Kernel Config
      # =========================================================
      - name: إعداد Kernel Config
        run: |
          cd kernel

          cp "$GITHUB_WORKSPACE/stock.config" .config

          test -f .config

          chmod +x scripts/config

          scripts/config --enable CONFIG_KSU
          scripts/config --enable CONFIG_KSU_SUSFS

          scripts/config --enable CONFIG_KSU_SUSFS_SUS_PATH
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_MOUNT

          scripts/config --enable \
            CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_NATIVE_APP

          scripts/config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_MAP

          scripts/config --disable CONFIG_TRIM_UNUSED_KSYMS || true
          scripts/config --disable CONFIG_UNUSED_KSYMS || true

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            olddefconfig

          echo "Kernel config جاهز."

      # =========================================================
      # 12. فحص Config
      # =========================================================
      - name: فحص إعدادات KSU و SUSFS
        run: |
          test -f out/.config

          grep -E \
            'CONFIG_KSU=|CONFIG_KSU_SUSFS=' \
            out/.config || true

      # =========================================================
      # 13. بناء Kernel Image
      # =========================================================
      - name: بناء Kernel Image
        run: |
          mkdir -p out

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" \
            Image

      # =========================================================
      # 14. التأكد من نجاح بناء Kernel
      # =========================================================
      - name: التحقق من Kernel Image
        run: |
          test -s out/arch/arm64/boot/Image

          echo "Kernel Image تم بناؤه بنجاح."

          ls -lh \
            out/arch/arm64/boot/Image

          file \
            out/arch/arm64/boot/Image

      # =========================================================
      # 15. تحميل Magisk v30.7 الرسمي
      # =========================================================
      - name: تحميل Magiskboot الرسمي
        run: |
          set -e

          MAGISK_VERSION="v30.7"

          curl -L --fail \
            --retry 5 \
            --retry-delay 3 \
            -o tools/Magisk.apk \
            "https://github.com/topjohnwu/Magisk/releases/download/${MAGISK_VERSION}/Magisk-${MAGISK_VERSION}.apk"

          test -s tools/Magisk.apk

          echo "حجم Magisk APK:"
          ls -lh tools/Magisk.apk

          unzip -l tools/Magisk.apk | grep magiskboot

          unzip -p \
            tools/Magisk.apk \
            lib/x86_64/libmagiskboot.so \
            > tools/magiskboot

          test -s tools/magiskboot

          chmod +x tools/magiskboot

          file tools/magiskboot

          tools/magiskboot --help

      # =========================================================
      # 16. تحميل boot من Release
      #
      # يقبل:
      # boot.zip
      # boot.img.zip
      # =========================================================
      - name: تحميل boot الأصلي من Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: stock-boot
        run: |
          set -e

          rm -rf bootwork
          mkdir -p bootwork

          gh release download \
            "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --dir bootwork

          echo "ملفات Release:"
          ls -lh bootwork

          ZIP_FILE="$(find bootwork -maxdepth 1 -type f -name '*.zip' | head -1)"

          test -n "$ZIP_FILE"
          test -f "$ZIP_FILE"

          echo "تم العثور على:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d bootwork/extracted

          BOOT_FILE="$(find bootwork/extracted -type f -name 'boot.img' | head -1)"

          test -n "$BOOT_FILE"
          test -f "$BOOT_FILE"

          cp "$BOOT_FILE" bootwork/boot.img

          test -s bootwork/boot.img

          echo "boot.img الأصلي:"
          ls -lh bootwork/boot.img

      # =========================================================
      # 17. فحص boot.img الأصلي
      # =========================================================
      - name: فحص boot.img الأصلي
        run: |
          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" --help >/dev/null

          "$GITHUB_WORKSPACE/tools/magiskboot" unpack boot.img

          test -s kernel

          echo "Kernel داخل boot.img:"
          file kernel

          ls -lh kernel

      # =========================================================
      # 18. استبدال Kernel الأصلي بالـ Kernel الجديد
      # =========================================================
      - name: استبدال Kernel الأصلي
        run: |
          set -e

          test -s \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"

          test -s \
            "$GITHUB_WORKSPACE/bootwork/kernel"

          cp \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" \
            "$GITHUB_WORKSPACE/bootwork/kernel"

          echo "تم استبدال Kernel الأصلي."

          ls -lh \
            "$GITHUB_WORKSPACE/bootwork/kernel"

      # =========================================================
      # 19. إعادة بناء boot.img
      # =========================================================
      - name: إعادة بناء boot.img
        run: |
          set -e

          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" repack boot.img

          test -s new-boot.img

          mv \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

          test -s \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

      # =========================================================
      # 20. فحص boot النهائي
      # =========================================================
      - name: التحقق من boot النهائي
        run: |
          test -s boot-BG7n-SUSFS-KSU.img

          echo "تم إنشاء boot النهائي بنجاح."

          ls -lh \
            boot-BG7n-SUSFS-KSU.img

          sha256sum \
            boot-BG7n-SUSFS-KSU.img

      # =========================================================
      # 21. تجهيز SUSFS Module
      # =========================================================
      - name: تجهيز SUSFS Module
        run: |
          cd "$SUSFS_DIR"

          tar -czf \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz" \
            ksu_module_susfs

          test -s \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz"

      # =========================================================
      # 22. رفع النتائج كـ Artifacts
      # =========================================================
      - name: رفع ملفات البناء
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-SUSFS-KSU-build
          path: |
            boot-BG7n-SUSFS-KSU.img
            out/arch/arm64/boot/Image
            out/.config
            susfs-module-source.tar.gz
            patches-susfs-bg7n.patch
          if-no-files-found: error
          retention-days: 14

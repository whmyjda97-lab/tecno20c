name: Build BG7n SUSFS + KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            curl \
            xz-utils \
            zstd \
            file \
            device-tree-compiler

      - name: Verify project files
        run: |
          set -euo pipefail
          for f in \
            KernelSU-Next.tar.gz \
            susfs4ksu-gki-android12-5.10.tar.gz \
            stock.config \
            patches-susfs-bg7n-legacy-reference.patch; do
            test -s "$f" || {
              echo "Missing required file: $f"
              exit 1
            }
          done

      - name: Prepare workspace
        run: |
          set -euo pipefail
          rm -rf kernel work out tools bootwork verification
          mkdir -p work out tools bootwork verification

      - name: Fetch exact Android common kernel
        env:
          KERNEL_COMMIT: d09ef2e980e0974a0d6dfe762e29fff118db7f46
        run: |
          set -euo pipefail
          git init kernel
          cd kernel
          git remote add origin https://android.googlesource.com/kernel/common
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/verification/kernel-commit.txt"

      - name: Extract bundled sources
        run: |
          set -euo pipefail
          tar -xzf KernelSU-Next.tar.gz -C work
          tar -xzf susfs4ksu-gki-android12-5.10.tar.gz -C work

          KSU_DIR="$(find work -maxdepth 1 -mindepth 1 -type d -name 'KernelSU-Next-*' -print -quit)"
          SUSFS_DIR="work/susfs4ksu-gki-android12-5.10"

          test -n "$KSU_DIR"
          test -d "$SUSFS_DIR"

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          echo "SUSFS_DIR=$SUSFS_DIR" >> "$GITHUB_ENV"

      - name: Verify bundled KernelSU-Next
        run: |
          set -euo pipefail

          test -f "$KSU_DIR/kernel/setup.sh"
          test -f "$KSU_DIR/kernel/Kconfig"
          test -f "$KSU_DIR/kernel/Kbuild"

          for symbol in \
            KSU_SUSFS \
            KSU_SUSFS_SUS_PATH \
            KSU_SUSFS_SUS_MOUNT \
            KSU_SUSFS_SUS_KSTAT \
            KSU_SUSFS_SUS_KSTAT_REDIRECT \
            KSU_SUSFS_SUS_MAP; do

            if grep -RqsE \
              --include='Kconfig' \
              --include='Kconfig.*' \
              "^[[:space:]]*config[[:space:]]+${symbol}([[:space:]]|$)" \
              "$KSU_DIR/kernel"; then
              echo "FOUND: $symbol"
            else
              echo "Missing Kconfig symbol: $symbol"
              exit 1
            fi
          done

      - name: Verify SUSFS source
        run: |
          set -euo pipefail

          test -f "$SUSFS_DIR/kernel_patches/fs/susfs.c"
          test -f "$SUSFS_DIR/kernel_patches/include/linux/susfs.h"
          test -f "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h"

          grep -Fq \
            '#define SUSFS_VERSION "v2.2.0"' \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h"

      - name: Install bundled KernelSU-Next
        run: |
          set -euo pipefail

          cd kernel
          bash "$GITHUB_WORKSPACE/$KSU_DIR/kernel/setup.sh"
          test -d drivers/kernelsu

      - name: Prepare clean BG7n patch
        run: |
          set -euo pipefail

          python3 - \
            "$GITHUB_WORKSPACE/patches-susfs-bg7n-legacy-reference.patch" \
            "$GITHUB_WORKSPACE/verification/bg7n-clean.patch" <<'PY'
          import sys

          src = sys.argv[1]
          dst = sys.argv[2]

          with open(src, "r", encoding="utf-8", errors="replace") as fh:
              lines = fh.readlines()

          out = []
          removed = 0
          i = 0

          def header_path(line):
              if not (line.startswith("--- ") or line.startswith("+++ ")):
                  return None
              value = line[4:].strip()
              value = value.split("\t", 1)[0]
              value = value.split(" ", 1)[0]
              if value.startswith("a/") or value.startswith("b/"):
                  value = value[2:]
              return value

          while i < len(lines):
              if lines[i].startswith("diff --git "):
                  start = i
                  j = i + 1
                  old_path = None
                  new_path = None

                  while j < len(lines) and not lines[j].startswith("diff --git "):
                      if lines[j].startswith("--- "):
                          old_path = header_path(lines[j])
                      elif lines[j].startswith("+++ "):
                          new_path = header_path(lines[j])
                      j += 1

                  if (
                      (old_path and old_path.endswith(".orig"))
                      or
                      (new_path and new_path.endswith(".orig"))
                  ):
                      removed += 1
                  else:
                      out.extend(lines[start:j])

                  i = j
                  continue

              out.append(lines[i])
              i += 1

          if removed == 0:
              raise SystemExit("No .orig patch sections found")

          with open(dst, "w", encoding="utf-8") as fh:
              fh.writelines(out)

          print(f"Removed {removed} .orig patch sections")
          PY

          test -s "$GITHUB_WORKSPACE/verification/bg7n-clean.patch"

      - name: Verify clean BG7n patch
        run: |
          set -euo pipefail

          cd kernel

          patch \
            --dry-run \
            --batch \
            --forward \
            --no-backup-if-mismatch \
            -p1 \
            < "$GITHUB_WORKSPACE/verification/bg7n-clean.patch" \
            > "$GITHUB_WORKSPACE/verification/bg7n-dry-run.log" \
            2>&1

          if grep -Eq \
            'Hunk #[0-9]+ FAILED|Reversed|FAILED|ignored' \
            "$GITHUB_WORKSPACE/verification/bg7n-dry-run.log"; then
            cat "$GITHUB_WORKSPACE/verification/bg7n-dry-run.log"
            exit 1
          fi

      - name: Apply clean BG7n patch
        run: |
          set -euo pipefail

          cd kernel

          patch \
            --batch \
            --forward \
            --no-backup-if-mismatch \
            -p1 \
            < "$GITHUB_WORKSPACE/verification/bg7n-clean.patch"

          if find . \
            \( -name '*.rej' -o -name '*.orig' \) \
            -print -quit \
            | grep -q .; then

            find . \
              \( -name '*.rej' -o -name '*.orig' \) \
              -print

            exit 1
          fi

      - name: Verify SUSFS files after patch
        run: |
          set -euo pipefail

          test -s kernel/fs/susfs.c
          test -s kernel/include/linux/susfs.h
          test -s kernel/include/linux/susfs_def.h

          grep -Fq \
            '#define SUSFS_VERSION "v2.2.0"' \
            kernel/include/linux/susfs.h

      - name: Compare SUSFS files with archive
        run: |
          set -euo pipefail

          tar -xOf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            susfs4ksu-gki-android12-5.10/kernel_patches/fs/susfs.c \
            > verification/archive-susfs.c

          tar -xOf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            susfs4ksu-gki-android12-5.10/kernel_patches/include/linux/susfs.h \
            > verification/archive-susfs.h

          tar -xOf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            susfs4ksu-gki-android12-5.10/kernel_patches/include/linux/susfs_def.h \
            > verification/archive-susfs_def.h

          cmp kernel/fs/susfs.c verification/archive-susfs.c
          cmp kernel/include/linux/susfs.h verification/archive-susfs.h
          cmp kernel/include/linux/susfs_def.h verification/archive-susfs_def.h

      - name: Verify SUSFS Makefile integration
        run: |
          set -euo pipefail

          grep -q \
            'obj-$(CONFIG_KSU_SUSFS) += susfs.o' \
            kernel/fs/Makefile

      - name: Prepare kernel config
        run: |
          set -euo pipefail

          chmod +x kernel/scripts/config
          cp stock.config out/.config

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_THREAD_INFO_IN_TASK

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_PATH

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_MAP

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT \
            || true

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_NATIVE_APP \
            || true

          kernel/scripts/config \
            --disable CONFIG_TRIM_UNUSED_KSYMS \
            || true

          kernel/scripts/config \
            --disable CONFIG_UNUSED_KSYMS \
            || true

      - name: Resolve final Kconfig
        run: |
          set -euo pipefail

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            olddefconfig

          test -s out/.config

      - name: Verify final Kconfig
        run: |
          set -euo pipefail

          for symbol in \
            CONFIG_THREAD_INFO_IN_TASK \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_SUS_MAP; do

            grep -qx \
              "${symbol}=y" \
              out/.config
          done

          cp out/.config final.config

      - name: Build arm64 Image
        id: kernel_build
        run: |
          set -o pipefail

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=frame-larger-than" \
            -j"$(nproc)" \
            Image \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/kernel-build.log"

          test "${PIPESTATUS[0]}" -eq 0
          test -s out/arch/arm64/boot/Image

      - name: Verify kernel and SUSFS
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -euo pipefail

          test -s out/arch/arm64/boot/Image
          test -s out/vmlinux
          test -s out/fs/susfs.o

          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS=y' out/.config

          llvm-nm \
            out/vmlinux \
            2>/dev/null \
            | grep -qi susfs

      - name: Upload kernel build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log-${{ github.run_number }}
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Download Magisk APK
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -euo pipefail

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            -o tools/Magisk.apk \
            "https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk"

          test -s tools/Magisk.apk

      - name: Extract magiskboot
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -euo pipefail

          unzip -p \
            tools/Magisk.apk \
            lib/x86_64/libmagiskboot.so \
            > tools/magiskboot

          test -s tools/magiskboot
          chmod +x tools/magiskboot

      - name: Download stock boot image
        if: steps.kernel_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf bootwork
          mkdir -p bootwork

          gh release download stock-boot \
            --repo "${{ github.repository }}" \
            --pattern "boot.img.zip" \
            --dir bootwork

          test -s bootwork/boot.img.zip

          unzip -o \
            bootwork/boot.img.zip \
            -d bootwork

          test -s bootwork/boot.img

      - name: Unpack stock boot
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -euo pipefail

          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            unpack boot.img

          test -s kernel

      - name: Replace kernel
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -euo pipefail

          cp \
            out/arch/arm64/boot/Image \
            bootwork/kernel

          test -s bootwork/kernel

      - name: Repack boot image
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -euo pipefail

          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            repack boot.img

          test -s new-boot.img

          mv \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

          test -s \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

      - name: Verify final boot
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -euo pipefail

          test -s boot-BG7n-SUSFS-KSU.img

          rm -rf verification/final-boot
          mkdir -p verification/final-boot

          cp \
            boot-BG7n-SUSFS-KSU.img \
            verification/final-boot/boot.img

          cd verification/final-boot

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            unpack boot.img

          test -s kernel

          FINAL_SHA="$(
            sha256sum kernel \
            | cut -d' ' -f1
          )"

          IMAGE_SHA="$(
            sha256sum "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" \
            | cut -d' ' -f1
          )"

          test "$FINAL_SHA" = "$IMAGE_SHA"

      - name: Package SUSFS module source
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -euo pipefail

          test -d "$SUSFS_DIR/ksu_module_susfs"

          tar -czf \
            susfs-module-source.tar.gz \
            -C "$SUSFS_DIR" \
            ksu_module_susfs

          test -s susfs-module-source.tar.gz

      - name: Generate build manifest
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -euo pipefail

          {
            echo "Kernel commit:"
            git -C kernel rev-parse HEAD
            echo
            echo "KernelSU archive:"
            sha256sum KernelSU-Next.tar.gz
            echo
            echo "SUSFS archive:"
            sha256sum susfs4ksu-gki-android12-5.10.tar.gz
            echo
            echo "stock.config:"
            sha256sum stock.config
            echo
            echo "BG7n patch:"
            sha256sum patches-susfs-bg7n-legacy-reference.patch
            echo
            echo "Clean BG7n patch:"
            sha256sum verification/bg7n-clean.patch
            echo
            echo "Kernel Image:"
            sha256sum out/arch/arm64/boot/Image
            echo
            echo "Final boot:"
            sha256sum boot-BG7n-SUSFS-KSU.img
            echo
            echo "Final config:"
            sha256sum final.config
          } > BUILD_MANIFEST.txt

          test -s BUILD_MANIFEST.txt

      - name: Upload verification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_number }}
          path: |
            verification/
            final.config
            BUILD_MANIFEST.txt
            kernel-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final build
        if: steps.kernel_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-SUSFS-KSU-full-${{ github.run_number }}
          path: |
            boot-BG7n-SUSFS-KSU.img
            out/arch/arm64/boot/Image
            final.config
            susfs-module-source.tar.gz
            BUILD_MANIFEST.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload boot image
        if: steps.kernel_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: boot-BG7n-SUSFS-KSU-${{ github.run_number }}
          path: boot-BG7n-SUSFS-KSU.img
          if-no-files-found: error
          retention-days: 14

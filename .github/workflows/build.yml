name: Build BG7n SUSFS + KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            curl \
            xz-utils \
            zstd \
            file \
            device-tree-compiler

      - name: Verify project files
        run: |
          set -euo pipefail

          required_files=(
            "KernelSU-Next.tar.gz"
            "susfs4ksu-gki-android12-5.10.tar.gz"
            "stock.config"
            "50_add_susfs_in_gki-android12-5.10.patch"
            "patches-susfs-bg7n-legacy-reference.patch"
            ".github/workflows/build.yml"
          )

          for f in "${required_files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "Missing or empty file: $f"
              exit 1
            fi
          done

          echo "Project files OK."

      - name: Prepare workspace
        run: |
          set -euo pipefail

          rm -rf \
            kernel \
            work \
            out \
            tools \
            bootwork \
            verification

          mkdir -p \
            work \
            out \
            tools \
            bootwork \
            verification

      - name: Verify source archives
        run: |
          set -euo pipefail

          tar -tzf KernelSU-Next.tar.gz \
            > verification/kernelsu-files.txt

          tar -tzf susfs4ksu-gki-android12-5.10.tar.gz \
            > verification/susfs-files.txt

          grep -q '/kernel/setup.sh$' \
            verification/kernelsu-files.txt

          grep -q '/kernel/Kconfig$' \
            verification/kernelsu-files.txt

          grep -q '/kernel/Kbuild$' \
            verification/kernelsu-files.txt

          grep -q \
            'kernel_patches/fs/susfs.c$' \
            verification/susfs-files.txt

          grep -q \
            'kernel_patches/include/linux/susfs.h$' \
            verification/susfs-files.txt

          echo "Archives are structurally valid."

      - name: Verify official SUSFS patch archive match
        run: |
          set -euo pipefail

          tar -xOf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            susfs4ksu-gki-android12-5.10/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            > verification/archive-susfs.patch

          cmp \
            50_add_susfs_in_gki-android12-5.10.patch \
            verification/archive-susfs.patch

          echo "Official SUSFS patch matches archive."

      - name: Fetch exact Android common kernel
        env:
          KERNEL_COMMIT: d09ef2e980e0974a0d6dfe762e29fff118db7f46
        run: |
          set -euo pipefail

          git init kernel

          cd kernel

          git remote add origin \
            https://android.googlesource.com/kernel/common

          git fetch \
            --depth=1 \
            origin \
            "$KERNEL_COMMIT"

          git checkout --detach FETCH_HEAD

          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          if [ "$ACTUAL_COMMIT" != "$KERNEL_COMMIT" ]; then
            echo "Kernel commit mismatch."
            echo "Expected: $KERNEL_COMMIT"
            echo "Actual:   $ACTUAL_COMMIT"
            exit 1
          fi

          cd ..

          echo "$ACTUAL_COMMIT" \
            > verification/kernel-commit.txt

      - name: Extract bundled sources
        run: |
          set -euo pipefail

          tar -xzf \
            KernelSU-Next.tar.gz \
            -C work

          tar -xzf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            -C work

          KSU_DIR="$(
            find work \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -name 'KernelSU-Next-*' \
              -print -quit
          )"

          SUSFS_DIR="work/susfs4ksu-gki-android12-5.10"

          if [ -z "$KSU_DIR" ]; then
            echo "KernelSU-Next directory not found."
            find work -maxdepth 2 -type d
            exit 1
          fi

          if [ ! -d "$SUSFS_DIR" ]; then
            echo "SUSFS directory not found."
            exit 1
          fi

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          echo "SUSFS_DIR=$SUSFS_DIR" >> "$GITHUB_ENV"

          echo "KernelSU directory: $KSU_DIR"
          echo "SUSFS directory:   $SUSFS_DIR"

      - name: Verify bundled KernelSU-Next
        run: |
          set -euo pipefail

          test -f "$KSU_DIR/kernel/setup.sh"
          test -f "$KSU_DIR/kernel/Kconfig"
          test -f "$KSU_DIR/kernel/Kbuild"

          echo "KernelSU-Next files found."

          required_ksu_symbols=(
            KSU_SUSFS
            KSU_SUSFS_SUS_PATH
            KSU_SUSFS_SUS_MOUNT
            KSU_SUSFS_SUS_KSTAT
          )

          for symbol in "${required_ksu_symbols[@]}"; do
            if grep -qE \
              "^[[:space:]]*config[[:space:]]+$symbol([[:space:]]|$)" \
              "$KSU_DIR/kernel/Kconfig"; then
              echo "FOUND: $symbol"
            else
              echo "Missing required Kconfig symbol: $symbol"
              exit 1
            fi
          done

          optional_symbols=(
            KSU_SUSFS_SPOOF_UNAME
            KSU_SUSFS_ENABLE_LOG
            KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            KSU_SUSFS_OPEN_REDIRECT
            KSU_SUSFS_SUS_MAP
          )

          for symbol in "${optional_symbols[@]}"; do
            if grep -qE \
              "^[[:space:]]*config[[:space:]]+$symbol([[:space:]]|$)" \
              "$KSU_DIR/kernel/Kconfig"; then
              echo "OPTIONAL FOUND: $symbol"
            else
              echo "OPTIONAL NOT PRESENT: $symbol"
            fi
          done

          if grep -q \
            'KSU_SUSFS_SUS_KSTAT_REDIRECT' \
            "$KSU_DIR/kernel/Kconfig"; then
            echo "WARNING: unexpected legacy SUS_KSTAT_REDIRECT symbol found."
          else
            echo "Confirmed: SUS_KSTAT_REDIRECT is not required."
          fi

      - name: Verify SUSFS source
        run: |
          set -euo pipefail

          test -f \
            "$SUSFS_DIR/kernel_patches/fs/susfs.c"

          test -f \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h"

          test -f \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h"

          grep -Fq \
            '#define SUSFS_VERSION "v2.2.0"' \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h"

          echo "SUSFS v2.2.0 verified."

      - name: Install bundled KernelSU-Next
        run: |
          set -euo pipefail

          cd kernel

          bash \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/setup.sh"

          test -d drivers/kernelsu

          echo "KernelSU-Next installed."

      - name: Verify KernelSU installation
        run: |
          set -euo pipefail

          test -f kernel/drivers/kernelsu/Kconfig \
            || test -f drivers/kernelsu/Kconfig

          if [ -d drivers/kernelsu ]; then
            KSU_KERNEL_DIR="drivers/kernelsu"
          else
            KSU_KERNEL_DIR="kernel/drivers/kernelsu"
          fi

          echo "KSU kernel directory: $KSU_KERNEL_DIR"

      - name: Select BG7n patch
        run: |
          set -euo pipefail

          PATCH="patches-susfs-bg7n-legacy-reference.patch"

          if [ ! -s "$PATCH" ]; then
            echo "BG7n patch is missing."
            exit 1
          fi

          cp \
            "$PATCH" \
            verification/bg7n-original.patch

          echo "BG7N_PATCH=$GITHUB_WORKSPACE/$PATCH" \
            >> "$GITHUB_ENV"

      - name: Build clean BG7n patch
        run: |
          set -euo pipefail

          python3 - \
            "$GITHUB_WORKSPACE/verification/bg7n-original.patch" \
            "$GITHUB_WORKSPACE/verification/bg7n-clean.patch" <<'PY'
          import sys

          src = sys.argv[1]
          dst = sys.argv[2]

          with open(src, "r", encoding="utf-8", errors="replace") as f:
              lines = f.readlines()

          output = []
          removed_sections = 0
          i = 0

          while i < len(lines):
              if lines[i].startswith("diff --git "):
                  start = i
                  j = i + 1

                  old_path = None
                  new_path = None

                  while j < len(lines):
                      if lines[j].startswith("diff --git "):
                          break

                      if lines[j].startswith("--- "):
                          old_path = lines[j][4:].strip()
                          old_path = old_path.split("\t", 1)[0]
                          old_path = old_path.split(" ", 1)[0]

                      if lines[j].startswith("+++ "):
                          new_path = lines[j][4:].strip()
                          new_path = new_path.split("\t", 1)[0]
                          new_path = new_path.split(" ", 1)[0]

                      j += 1

                  old_clean = (old_path or "").removeprefix("a/")
                  new_clean = (new_path or "").removeprefix("b/")

                  if (
                      old_clean.endswith(".orig")
                      or new_clean.endswith(".orig")
                  ):
                      removed_sections += 1
                  else:
                      output.extend(lines[start:j])

                  i = j
                  continue

              output.append(lines[i])
              i += 1

          if not output:
              raise SystemExit("Cleaned patch is empty.")

          with open(dst, "w", encoding="utf-8") as f:
              f.writelines(output)

          print(
              "Removed .orig sections:",
              removed_sections
          )
          print(
              "Clean patch lines:",
              len(output)
          )
          PY

          test -s verification/bg7n-clean.patch

      - name: Verify BG7n patch applies cleanly
        run: |
          set -euo pipefail

          cd kernel

          patch \
            --dry-run \
            --batch \
            --forward \
            --no-backup-if-mismatch \
            -p1 \
            < "$GITHUB_WORKSPACE/verification/bg7n-clean.patch" \
            > "$GITHUB_WORKSPACE/verification/bg7n-dry-run.log" \
            2>&1

          cat \
            "$GITHUB_WORKSPACE/verification/bg7n-dry-run.log"

          if grep -Eq \
            'FAILED|Reversed|Skipping patch|ignored|Assume -R' \
            "$GITHUB_WORKSPACE/verification/bg7n-dry-run.log"; then
            echo "BG7n patch did not apply cleanly."
            exit 1
          fi

          echo "BG7n patch dry-run succeeded."

      - name: Apply BG7n patch
        run: |
          set -euo pipefail

          cd kernel

          patch \
            --batch \
            --forward \
            --no-backup-if-mismatch \
            -p1 \
            < "$GITHUB_WORKSPACE/verification/bg7n-clean.patch"

          if find . \
            \( \
              -name '*.rej' \
              -o -name '*.orig' \
            \) \
            -print -quit \
            | grep -q .; then

            echo "Patch created reject or backup files:"
            find . \
              \( \
                -name '*.rej' \
                -o -name '*.orig' \
              \) \
              -print

            exit 1
          fi

          echo "BG7n patch applied."

      - name: Install SUSFS source files
        run: |
          set -euo pipefail

          cp \
            "$SUSFS_DIR/kernel_patches/fs/susfs.c" \
            kernel/fs/susfs.c

          cp \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" \
            kernel/include/linux/susfs.h

          cp \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" \
            kernel/include/linux/susfs_def.h

          test -s kernel/fs/susfs.c
          test -s kernel/include/linux/susfs.h
          test -s kernel/include/linux/susfs_def.h

      - name: Verify SUSFS integration
        run: |
          set -euo pipefail

          grep -Fq \
            'obj-$(CONFIG_KSU_SUSFS) += susfs.o' \
            kernel/fs/Makefile

          grep -Fq \
            'SUSFS_VERSION "v2.2.0"' \
            kernel/include/linux/susfs.h

          echo "SUSFS integration verified."

      - name: Verify final source tree
        run: |
          set -euo pipefail

          test -s kernel/fs/susfs.c
          test -s kernel/include/linux/susfs.h
          test -s kernel/include/linux/susfs_def.h
          test -d kernel/drivers/kernelsu

          if find kernel \
            \( \
              -name '*.rej' \
              -o -name '*.orig' \
            \) \
            -print -quit \
            | grep -q .; then

            echo "Unexpected patch residue:"
            find kernel \
              \( \
                -name '*.rej' \
                -o -name '*.orig' \
              \) \
              -print

            exit 1
          fi

          echo "Final source tree is clean."

      - name: Prepare kernel config
        run: |
          set -euo pipefail

          test -s stock.config

          cp \
            stock.config \
            out/.config

          test -x kernel/scripts/config \
            || chmod +x kernel/scripts/config

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_PATH

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT

          kernel/scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT

          optional_configs=(
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          for config in "${optional_configs[@]}"; do
            if grep -qE \
              "^[[:space:]]*config[[:space:]]+${config#CONFIG_}([[:space:]]|$)" \
              "$KSU_DIR/kernel/Kconfig"; then

              kernel/scripts/config \
                --file out/.config \
                --enable "$config" \
                || true
            fi
          done

          kernel/scripts/config \
            --file out/.config \
            --disable CONFIG_TRIM_UNUSED_KSYMS \
            || true

          kernel/scripts/config \
            --file out/.config \
            --disable CONFIG_UNUSED_KSYMS \
            || true

          echo "Kernel configuration prepared."

      - name: Resolve final Kconfig
        run: |
          set -euo pipefail

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            olddefconfig

          test -s out/.config

      - name: Verify final Kconfig
        run: |
          set -euo pipefail

          required_config=(
            CONFIG_KSU
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
          )

          for config in "${required_config[@]}"; do
            if ! grep -qx "${config}=y" out/.config; then
              echo "Required config is not enabled: $config"
              grep "^${config}" out/.config || true
              exit 1
            fi
          done

          if grep -q \
            '^CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT=y' \
            out/.config; then

            echo "Unexpected obsolete SUS_KSTAT_REDIRECT detected."
            exit 1
          fi

          cp \
            out/.config \
            final.config

          echo "Final Kconfig verified."

      - name: Build arm64 Image
        id: kernel_build
        run: |
          set -o pipefail

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=frame-larger-than" \
            -j"$(nproc)" \
            Image \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/kernel-build.log"

          build_status="${PIPESTATUS[0]}"

          if [ "$build_status" -ne 0 ]; then
            echo "Kernel build failed with status $build_status."
            exit "$build_status"
          fi

          test -s \
            out/arch/arm64/boot/Image

      - name: Verify built kernel
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -euo pipefail

          test -s \
            out/arch/arm64/boot/Image

          test -s \
            out/vmlinux

          test -s \
            out/.config

          grep -qx \
            'CONFIG_KSU=y' \
            out/.config

          grep -qx \
            'CONFIG_KSU_SUSFS=y' \
            out/.config

          echo "Kernel Image built successfully."

      - name: Verify SUSFS object
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -euo pipefail

          if [ -s out/fs/susfs.o ]; then
            echo "SUSFS object found."
          elif [ -s out/fs/built-in.a ]; then
            echo "SUSFS is built into fs/built-in.a."
          else
            echo "SUSFS build object not found."
            exit 1
          fi

      - name: Generate build manifest
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -euo pipefail

          {
            echo "=== BUILD MANIFEST ==="
            echo
            echo "Kernel commit:"
            git -C kernel rev-parse HEAD
            echo
            echo "KernelSU archive:"
            sha256sum KernelSU-Next.tar.gz
            echo
            echo "SUSFS archive:"
            sha256sum susfs4ksu-gki-android12-5.10.tar.gz
            echo
            echo "Stock config:"
            sha256sum stock.config
            echo
            echo "BG7n original patch:"
            sha256sum patches-susfs-bg7n-legacy-reference.patch
            echo
            echo "BG7n cleaned patch:"
            sha256sum verification/bg7n-clean.patch
            echo
            echo "Kernel Image:"
            sha256sum out/arch/arm64/boot/Image
            echo
            echo "Final config:"
            sha256sum final.config
          } > BUILD_MANIFEST.txt

          test -s BUILD_MANIFEST.txt

      - name: Upload kernel build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log-${{ github.run_number }}
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_number }}
          path: |
            verification/
            final.config
            BUILD_MANIFEST.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload successful kernel
        if: steps.kernel_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-SUSFS-KSU-kernel-${{ github.run_number }}
          path: |
            out/arch/arm64/boot/Image
            out/vmlinux
            final.config
            BUILD_MANIFEST.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

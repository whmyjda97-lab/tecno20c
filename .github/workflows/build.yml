name: "Build BG7n GKI r3 + KernelSU + SUSFS"

on:
  workflow_dispatch:
    inputs:
      susfs_ref:
        description: "Pinned SUSFS commit"
        required: false
        default: "be08face56c347e7ba9c4fb420c2463598a14f5d"

      make_jobs:
        description: "Kernel build jobs"
        required: false
        default: "4"

      boot_release_tag:
        description: "GitHub Release tag containing stock BG7n boot.img.zip"
        required: false
        default: "stock-boot"

permissions:
  contents: read

concurrency:
  group: bg7n-${{ github.ref }}
  cancel-in-progress: true

env:
  # ==============================================================
  # GOOGLE GKI
  # ==============================================================

  GKI_MANIFEST_BRANCH: common-android12-5.10-2025-06
  GKI_COMMON_TAG: android12-5.10-2025-06_r3
  GKI_VERSION: "5.10.237"
  GKI_SHA: d09ef2e980e0974a0d6dfe762e29fff118db7f46

  # ==============================================================
  # KERNELSU
  # ==============================================================

  KSU_REPO: https://github.com/5ec1cff/KernelSU.git
  KSU_COMMIT: 3be1013dbda6ebab14e7fcd231bcbae5ce6425ff

  # ==============================================================
  # SUSFS
  # ==============================================================

  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git

  # ==============================================================
  # DEVICE / BOOT
  # ==============================================================

  BOOT_REPO: whmyjda97-lab/tecno20c

  DEVICE: BG7n
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout build kit
        uses: actions/checkout@v4

      # ============================================================
      # HOST DEPENDENCIES
      # ============================================================

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            curl \
            device-tree-compiler \
            dwarves \
            file \
            flex \
            gawk \
            gh \
            git \
            gnupg \
            gperf \
            jq \
            libdw-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5-dev \
            libssl-dev \
            libunwind-dev \
            lld \
            llvm \
            lz4 \
            openssl \
            pahole \
            patchelf \
            pkg-config \
            python3 \
            rsync \
            unzip \
            zip \
            android-sdk-libsparse-utils

          echo "=== Host tool versions ==="

          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-nm --version
          python3 --version
          gh --version

      # ============================================================
      # ANDROID NDK
      # ============================================================

      - name: Install Android NDK r25b
        shell: bash
        run: |
          set -euxo pipefail

          NDK_VERSION="25.2.9519653"
          NDK_ARCHIVE="android-ndk-r25b-linux.zip"

          SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          NDK_ROOT="${SDK_ROOT}/ndk/${NDK_VERSION}"

          rm -rf \
            "${SDK_ROOT}" \
            "${RUNNER_TEMP}/android-ndk"

          mkdir -p \
            "${SDK_ROOT}/ndk" \
            "${RUNNER_TEMP}/android-ndk"

          curl -fL \
            "https://dl.google.com/android/repository/${NDK_ARCHIVE}" \
            -o "${RUNNER_TEMP}/${NDK_ARCHIVE}"

          unzip -q \
            "${RUNNER_TEMP}/${NDK_ARCHIVE}" \
            -d "${RUNNER_TEMP}/android-ndk"

          test -d \
            "${RUNNER_TEMP}/android-ndk/android-ndk-r25b"

          mv \
            "${RUNNER_TEMP}/android-ndk/android-ndk-r25b" \
            "${NDK_ROOT}"

          test -x \
            "${NDK_ROOT}/ndk-build"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${NDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${NDK_ROOT}" >> "${GITHUB_PATH}"

          echo "=== Android NDK ==="
          "${NDK_ROOT}/ndk-build" --version

      # ============================================================
      # STOCK BOOT
      # ============================================================

      - name: Fetch exact stock BG7n boot image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOT_RELEASE_TAG: ${{ inputs.boot_release_tag }}
        run: |
          set -euo pipefail

          rm -rf \
            stock-release \
            stock

          mkdir -p \
            stock-release \
            stock

          gh release view \
            "${BOOT_RELEASE_TAG}" \
            --repo "${BOOT_REPO}" \
            --json tagName,name,assets \
            --jq '.tagName + " | " + .name + " | assets=" + ((.assets|length)|tostring)'

          gh release download \
            "${BOOT_RELEASE_TAG}" \
            --repo "${BOOT_REPO}" \
            --dir stock-release

          echo "=== Release assets ==="

          find stock-release \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort

          CANDIDATES=()

          while IFS= read -r -d '' z; do

            mapfile -t ENTRIES < <(
              unzip -Z1 "$z" 2>/dev/null |
              grep -Ei '(^|/)boot\.img$' ||
              true
            )

            if [ "${#ENTRIES[@]}" -eq 1 ]; then

              CANDIDATES+=("$z")

              echo "Boot candidate:"
              echo "  archive: $z"
              echo "  entry:   ${ENTRIES[0]}"

            fi

          done < <(
            find stock-release \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              -print0
          )

          if [ "${#CANDIDATES[@]}" -ne 1 ]; then

            echo "::error::Expected exactly one release ZIP containing exactly one boot.img."

            echo "Candidates found: ${#CANDIDATES[@]}"

            printf '%s\n' \
              "${CANDIDATES[@]:-<none>}"

            exit 1

          fi

          BOOT_ASSET="${CANDIDATES[0]}"

          mapfile -t BOOT_ENTRIES < <(
            unzip -Z1 "${BOOT_ASSET}" |
            grep -Ei '(^|/)boot\.img$'
          )

          unzip -p \
            "${BOOT_ASSET}" \
            "${BOOT_ENTRIES[0]}" \
            > stock/boot.img

          test -s \
            stock/boot.img

          file \
            stock/boot.img

          sha256sum \
            stock/boot.img |
            tee stock/boot.sha256

      # ============================================================
      # INPUT CONFIG
      # ============================================================

      - name: Verify BG7n stock defconfig
        shell: bash
        run: |
          set -euxo pipefail

          test -s \
            BG7n_stock_defconfig

          grep -q \
            '^CONFIG_MODULES=y$' \
            BG7n_stock_defconfig

          grep -q \
            '^CONFIG_MODVERSIONS=y$' \
            BG7n_stock_defconfig

          echo "=== BG7n stock config SHA256 ==="

          sha256sum \
            BG7n_stock_defconfig

          echo
          echo "=== Stock KMI-sensitive entries ==="

          grep -E \
            '^CONFIG_(ARM64_4K_PAGES|ARM64_16K_PAGES|ARM64_64K_PAGES|ARM64_VA_BITS_36|ARM64_VA_BITS_39|ARM64_VA_BITS_42|ARM64_VA_BITS_47|ARM64_VA_BITS_48|ARM64_VA_BITS_52|ARM64_PA_BITS_48|ARM64_PA_BITS_52|COMPILE_TEST|LTO_NONE|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|CFI_CLANG|CFI_PERMISSIVE|CFI_CLANG_SHADOW|SHADOW_CALL_STACK|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|GCOV_KERNEL|FTRACE_MCOUNT_USE_RECORDMCOUNT|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS)=' \
            BG7n_stock_defconfig ||
            true

      # ============================================================
      # REPO
      # ============================================================

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o repo

          chmod +x \
            repo

          sudo install \
            -m 0755 \
            repo \
            /usr/local/bin/repo

          repo --version

      # ============================================================
      # GOOGLE GKI SOURCE
      # ============================================================

      - name: Sync exact Google GKI r3 source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf \
            gki

          mkdir -p \
            gki

          cd gki

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${GKI_MANIFEST_BRANCH}" \
            --depth=1

          repo sync \
            -c \
            -j2 \
            --no-tags \
            --no-clone-bundle

          test -d \
            common

          test -f \
            common/Makefile

          git -C common fetch \
            --no-tags \
            https://android.googlesource.com/kernel/common.git \
            "refs/tags/${GKI_COMMON_TAG}:refs/tags/${GKI_COMMON_TAG}"

          git -C common checkout \
            --detach \
            "refs/tags/${GKI_COMMON_TAG}"

          COMMON_COMMIT="$(
            git -C common rev-parse HEAD
          )"

          echo "COMMON_COMMIT=${COMMON_COMMIT}"

          test \
            "${COMMON_COMMIT}" = "${GKI_SHA}"

          test \
            "$(make -s -C common kernelversion)" = \
            "${GKI_VERSION}"

          repo manifest -r > \
            manifest.lock.xml

          {
            echo "GKI_MANIFEST_BRANCH=${GKI_MANIFEST_BRANCH}"
            echo "GKI_COMMON_TAG=${GKI_COMMON_TAG}"
            echo "GKI_VERSION=${GKI_VERSION}"
            echo "GKI_SHA=${GKI_SHA}"
            echo "COMMON_COMMIT=${COMMON_COMMIT}"
          } | tee \
            ../gki_identity.txt

      # ============================================================
      # GOOGLE HERMETIC LLVM
      # ============================================================

      - name: Select exact Google GKI LLVM toolchain
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          CLANG_PREBUILT_BIN="$(
            awk -F= '
              /^CLANG_PREBUILT_BIN=/ {
                print $2
                exit
              }
            ' common/build.config.common
          )"

          test -n \
            "${CLANG_PREBUILT_BIN}"

          GKI_CLANG_BIN="${PWD}/${CLANG_PREBUILT_BIN}"

          test -d \
            "${GKI_CLANG_BIN}"

          test -x \
            "${GKI_CLANG_BIN}/clang"

          test -x \
            "${GKI_CLANG_BIN}/ld.lld"

          test -x \
            "${GKI_CLANG_BIN}/llvm-ar"

          test -x \
            "${GKI_CLANG_BIN}/llvm-nm"

          echo "GKI_CLANG_BIN=${GKI_CLANG_BIN}" >> \
            "${GITHUB_ENV}"

          echo "LLVM=1" >> \
            "${GITHUB_ENV}"

          echo "LLVM_IAS=1" >> \
            "${GITHUB_ENV}"

          echo "${GKI_CLANG_BIN}" >> \
            "${GITHUB_PATH}"

          echo "=== Google LLVM ==="

          "${GKI_CLANG_BIN}/clang" --version
          "${GKI_CLANG_BIN}/ld.lld" --version
          "${GKI_CLANG_BIN}/llvm-ar" --version
          "${GKI_CLANG_BIN}/llvm-nm" --version

      # ============================================================
      # KERNELSU
      # ============================================================

      - name: Install exact KernelSU patch-base
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          rm -rf \
            KernelSU

          git clone \
            --no-tags \
            --filter=blob:none \
            "${KSU_REPO}" \
            KernelSU

          git -C KernelSU fetch \
            --no-tags \
            origin \
            "${KSU_COMMIT}"

          git -C KernelSU checkout \
            --detach \
            "${KSU_COMMIT}"

          ACTUAL_KSU_COMMIT="$(
            git -C KernelSU rev-parse HEAD
          )"

          test \
            "${ACTUAL_KSU_COMMIT}" = "${KSU_COMMIT}"

          test -d \
            KernelSU/kernel

          test -f \
            KernelSU/kernel/Kconfig

          test -f \
            KernelSU/kernel/Kbuild

          {
            echo "KERNELSU_REPO=${KSU_REPO}"
            echo "KERNELSU_COMMIT=${ACTUAL_KSU_COMMIT}"
          } | tee \
            ../kernelsu_identity.txt

          echo "=== KernelSU ==="

          git -C KernelSU log \
            -1 \
            --oneline

      # ============================================================
      # SUSFS
      # ============================================================

      - name: Clone and verify pinned SUSFS
        shell: bash
        working-directory: gki
        env:
          SUSFS_REF: ${{ inputs.susfs_ref }}
        run: |
          set -euxo pipefail

          rm -rf \
            susfs

          git clone \
            --no-tags \
            --filter=blob:none \
            "${SUSFS_REPO}" \
            susfs

          git -C susfs fetch \
            --no-tags \
            origin \
            "${SUSFS_REF}"

          git -C susfs checkout \
            --detach \
            "${SUSFS_REF}"

          SUSFS_COMMIT="$(
            git -C susfs rev-parse HEAD
          )"

          test \
            "${SUSFS_COMMIT}" = "${SUSFS_REF}"

          test -f \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          test -f \
            susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          test -d \
            susfs/kernel_patches/fs

          test -d \
            susfs/kernel_patches/include/linux

          test -f \
            susfs/ksu_module_susfs/module.prop

          grep -Eq \
            '^version=v?2\.2\.0($|[.-])' \
            susfs/ksu_module_susfs/module.prop

          {
            echo "SUSFS_REPO=${SUSFS_REPO}"
            echo "SUSFS_COMMIT=${SUSFS_COMMIT}"
          } | tee \
            ../susfs_identity.txt

          echo "=== SUSFS module.prop ==="

          cat \
            susfs/ksu_module_susfs/module.prop

      # ============================================================
      # APPLY SUSFS
      # ============================================================

      - name: Apply SUSFS patches
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          cp \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            KernelSU/

          cp \
            susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            common/

          cp -a \
            susfs/kernel_patches/fs/. \
            common/fs/

          cp -a \
            susfs/kernel_patches/include/linux/. \
            common/include/linux/

          echo "=== Applying KernelSU SUSFS patch ==="

          (
            cd KernelSU

            patch \
              --batch \
              --forward \
              -p1 \
              < 10_enable_susfs_for_ksu.patch
          )

          echo "=== Applying GKI SUSFS patch ==="

          (
            cd common

            patch \
              --batch \
              --forward \
              -p1 \
              < 50_add_susfs_in_gki-android12-5.10.patch
          )

          echo "=== KernelSU changes ==="

          git -C KernelSU status --short

          echo
          echo "=== GKI changes ==="

          git -C common status --short

      # ============================================================
      # INTEGRATE KERNELSU
      # ============================================================

      - name: Integrate KernelSU
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          test -f \
            KernelSU/kernel/Kconfig

          test -f \
            KernelSU/kernel/Kbuild

          rm -rf \
            common/drivers/kernelsu

          KSU_RELATIVE="$(
            realpath \
              --relative-to=common/drivers \
              KernelSU/kernel
          )"

          ln -s \
            "${KSU_RELATIVE}" \
            common/drivers/kernelsu

          test -L \
            common/drivers/kernelsu

          test -f \
            common/drivers/kernelsu/Kconfig

          test -f \
            common/drivers/kernelsu/Kbuild

          if ! grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            common/drivers/Makefile
          then

            printf '%s\n' \
              'obj-$(CONFIG_KSU) += kernelsu/' \
              >> common/drivers/Makefile

          fi

          if ! grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            common/drivers/Kconfig
          then

            python3 - <<'PY'
          from pathlib import Path

          path = Path("common/drivers/Kconfig")
          text = path.read_text()

          needle = 'source "drivers/kernelsu/Kconfig"'

          if needle not in text:

              pos = text.rfind("endmenu")

              if pos < 0:
                  raise SystemExit(
                      "ERROR: drivers/Kconfig has no endmenu"
                  )

              text = (
                  text[:pos]
                  + needle
                  + "\n\n"
                  + text[pos:]
              )

              path.write_text(text)
          PY

          fi

          grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            common/drivers/Kconfig

          grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            common/drivers/Makefile

          grep -Rqs \
            '^config[[:space:]]\+KSU\([[:space:]]\|$\)' \
            common/drivers/kernelsu

          grep -Rqs \
            '^config[[:space:]]\+KSU_SUSFS\([[:space:]]\|$\)' \
            common/drivers/kernelsu

          echo "=== KernelSU integration passed ==="

      # ============================================================
      # CLEAN GENERATED CONFIGURATION
      # ============================================================

      - name: Remove stale generated configuration
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          rm -f \
            .config \
            defconfig

          rm -rf \
            include/config \
            include/generated \
            arch/arm64/include/generated

          test ! -f .config
          test ! -f defconfig
          test ! -d include/config
          test ! -d include/generated
          test ! -d arch/arm64/include/generated

      # ============================================================
      # GENERATE DEFCONFIG
      #
      # Important:
      #
      #   We do not attempt to make HAS_LTO_CLANG directly.
      #
      #   Kconfig derives HAS_LTO_CLANG from its dependencies.
      #
      #   The resolution is done in two phases:
      #
      #   PHASE A:
      #     ARM64_MTE
      #     KASAN_HW_TAGS
      #
      #   PHASE B:
      #     LTO_CLANG_FULL
      #
      #   Each phase is followed by olddefconfig.
      #
      # This is important because the previous build showed:
      #
      #   LTO_NONE=y
      #   KASAN_GENERIC=y
      #
      # after olddefconfig.
      # ============================================================

      - name: Generate BG7n GKI + KernelSU + SUSFS defconfig
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          STOCK_CONFIG="${GITHUB_WORKSPACE}/BG7n_stock_defconfig"
          GKI_BASE_CONFIG="${PWD}/arch/arm64/configs/gki_defconfig"
          CONFIG_OUT="${RUNNER_TEMP}/bg7n-kconfig"

          test -s \
            "${STOCK_CONFIG}"

          test -s \
            "${GKI_BASE_CONFIG}"

          rm -rf \
            "${CONFIG_OUT}"

          mkdir -p \
            "${CONFIG_OUT}"

          echo "============================================================"
          echo "GKI baseline"
          echo "============================================================"

          sha256sum \
            "${GKI_BASE_CONFIG}"

          echo
          echo "=== Official GKI baseline KASAN/LTO state ==="

          grep -E \
            '^CONFIG_(KASAN|KASAN_HW_TAGS|KASAN_GENERIC|KASAN_SW_TAGS|LTO_NONE|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|CFI_CLANG|SHADOW_CALL_STACK|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB)=' \
            "${GKI_BASE_CONFIG}" \
            || true

          # ----------------------------------------------------------
          # Filter vendor settings which directly conflict with the
          # Google GKI choice/ABI configuration.
          # ----------------------------------------------------------

          cat > \
            "${CONFIG_OUT}/protected.symbols" <<'EOF'
          CONFIG_ARM64_4K_PAGES
          CONFIG_ARM64_16K_PAGES
          CONFIG_ARM64_64K_PAGES

          CONFIG_ARM64_VA_BITS_36
          CONFIG_ARM64_VA_BITS_39
          CONFIG_ARM64_VA_BITS_42
          CONFIG_ARM64_VA_BITS_47
          CONFIG_ARM64_VA_BITS_48
          CONFIG_ARM64_VA_BITS_52

          CONFIG_ARM64_PA_BITS_48
          CONFIG_ARM64_PA_BITS_52

          CONFIG_COMPILE_TEST

          CONFIG_LTO
          CONFIG_LTO_NONE
          CONFIG_LTO_CLANG
          CONFIG_LTO_CLANG_FULL
          CONFIG_LTO_CLANG_THIN

          CONFIG_CFI_CLANG
          CONFIG_CFI_PERMISSIVE
          CONFIG_CFI_CLANG_SHADOW

          CONFIG_SHADOW_CALL_STACK

          CONFIG_KASAN
          CONFIG_KASAN_GENERIC
          CONFIG_KASAN_SW_TAGS
          CONFIG_KASAN_HW_TAGS

          CONFIG_ARM64_TAGGED_ADDR_ABI
          CONFIG_ARM64_MTE
          CONFIG_ARM64_PAN
          CONFIG_ARM64_LSE_ATOMICS

          CONFIG_SLUB

          CONFIG_MODULES
          CONFIG_MODVERSIONS
          CONFIG_KALLSYMS
          CONFIG_KALLSYMS_ALL
          CONFIG_OVERLAY_FS

          CONFIG_GCOV_KERNEL
          CONFIG_FTRACE_MCOUNT_USE_RECORDMCOUNT
          EOF

          FILTERED_STOCK="${CONFIG_OUT}/bg7n_stock.filtered"

          python3 - \
            "${CONFIG_OUT}/protected.symbols" \
            "${STOCK_CONFIG}" \
            "${FILTERED_STOCK}" <<'PY'
          import re
          import sys
          from pathlib import Path

          protected_path = Path(sys.argv[1])
          source_path = Path(sys.argv[2])
          output_path = Path(sys.argv[3])

          protected = {
              line.strip()
              for line in protected_path.read_text().splitlines()
              if line.strip()
          }

          set_re = re.compile(r"^CONFIG_[A-Z0-9_]+=")
          unset_re = re.compile(
              r"^# CONFIG_[A-Z0-9_]+ is not set$"
          )

          output = []

          for line in source_path.read_text().splitlines():

              if set_re.match(line):

                  symbol = line.split("=", 1)[0]

                  if symbol in protected:
                      continue

              elif unset_re.match(line):

                  symbol = line[2:].split(
                      " is not set",
                      1
                  )[0]

                  if symbol in protected:
                      continue

              output.append(line)

          output_path.write_text(
              "\n".join(output) + "\n"
          )

          print(
              f"Protected symbols: {len(protected)}"
          )

          print(
              f"Original lines: "
              f"{len(source_path.read_text().splitlines())}"
          )

          print(
              f"Filtered lines: {len(output)}"
          )
          PY

          test -s \
            "${FILTERED_STOCK}"

          # ----------------------------------------------------------
          # Start from official Google GKI.
          # ----------------------------------------------------------

          cp \
            "${GKI_BASE_CONFIG}" \
            "${CONFIG_OUT}/gki_base.config"

          cp \
            "${GKI_BASE_CONFIG}" \
            "${CONFIG_OUT}/.config"

          # ----------------------------------------------------------
          # Merge device-specific configuration.
          # ----------------------------------------------------------

          ./scripts/kconfig/merge_config.sh \
            -m \
            -r \
            -O "${CONFIG_OUT}" \
            "${CONFIG_OUT}/gki_base.config" \
            "${FILTERED_STOCK}"

          test -s \
            "${CONFIG_OUT}/.config"

          # ----------------------------------------------------------
          # PHASE A
          #
          # Resolve ARM64/MTE/KASAN first.
          #
          # KASAN_HW_TAGS is only meaningful when the architecture
          # has the required MTE support.
          # ----------------------------------------------------------

          echo
          echo "============================================================"
          echo "PHASE A - ARM64 MTE + KASAN HW_TAGS"
          echo "============================================================"

          ./scripts/config \
            --file "${CONFIG_OUT}/.config" \
            \
            -e CONFIG_ARM64_TAGGED_ADDR_ABI \
            -e CONFIG_ARM64_PAN \
            -e CONFIG_ARM64_LSE_ATOMICS \
            -e CONFIG_ARM64_MTE \
            \
            -e CONFIG_KASAN \
            -d CONFIG_KASAN_GENERIC \
            -d CONFIG_KASAN_SW_TAGS \
            -e CONFIG_KASAN_HW_TAGS \
            \
            -e CONFIG_SLUB \
            \
            -d CONFIG_GCOV_KERNEL \
            -d CONFIG_FTRACE_MCOUNT_USE_RECORDMCOUNT

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            olddefconfig

          echo "=== After PHASE A ==="

          grep -E \
            '^CONFIG_(CC_IS_CLANG|CLANG_VERSION|LD_IS_LLD|AS_IS_LLVM|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|HAVE_ARCH_KASAN_HW_TAGS|SLUB|GCOV_KERNEL|FTRACE_MCOUNT_USE_RECORDMCOUNT|LTO_NONE|LTO_CLANG_FULL)=' \
            "${CONFIG_OUT}/.config" \
            || true

          # ----------------------------------------------------------
          # ARM64 MTE is mandatory for HW_TAGS.
          # ----------------------------------------------------------

          grep -q \
            '^CONFIG_ARM64_MTE=y$' \
            "${CONFIG_OUT}/.config" || {

            echo "::error::ARM64_MTE did not survive Kconfig."

            echo
            echo "=== ARM64 diagnostics ==="

            grep -E \
              '^CONFIG_(ARM64_|HAVE_ARCH_KASAN|HAVE_ARCH_KASAN_HW_TAGS|KASAN|SLUB)=' \
              "${CONFIG_OUT}/.config" \
              || true

            exit 1
          }

          grep -q \
            '^CONFIG_HAVE_ARCH_KASAN_HW_TAGS=y$' \
            "${CONFIG_OUT}/.config" || {

            echo "::error::HAVE_ARCH_KASAN_HW_TAGS is unavailable."

            grep -E \
              '^CONFIG_(ARM64_MTE|ARM64_TAGGED_ADDR_ABI|ARM64_PAN|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|HAVE_ARCH_KASAN_HW_TAGS)=' \
              "${CONFIG_OUT}/.config" \
              || true

            exit 1
          }

          grep -q \
            '^CONFIG_KASAN=y$' \
            "${CONFIG_OUT}/.config"

          grep -q \
            '^CONFIG_KASAN_HW_TAGS=y$' \
            "${CONFIG_OUT}/.config"

          if grep -q \
            '^CONFIG_KASAN_GENERIC=y$' \
            "${CONFIG_OUT}/.config"
          then

            echo "::error::KASAN_GENERIC remained enabled after PHASE A."

            exit 1

          fi

          if grep -q \
            '^CONFIG_KASAN_SW_TAGS=y$' \
            "${CONFIG_OUT}/.config"
          then

            echo "::error::KASAN_SW_TAGS remained enabled after PHASE A."

            exit 1

          fi

          # ----------------------------------------------------------
          # PHASE B
          #
          # Now that KASAN is in HW_TAGS mode, resolve LTO.
          # ----------------------------------------------------------

          echo
          echo "============================================================"
          echo "PHASE B - Full Clang LTO"
          echo "============================================================"

          ./scripts/config \
            --file "${CONFIG_OUT}/.config" \
            \
            -d CONFIG_LTO_NONE \
            -d CONFIG_LTO_CLANG_THIN \
            -d CONFIG_LTO_CLANG \
            -e CONFIG_LTO_CLANG_FULL \
            \
            -e CONFIG_CFI_CLANG \
            -d CONFIG_CFI_PERMISSIVE \
            \
            -e CONFIG_SHADOW_CALL_STACK

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            olddefconfig

          echo "=== After PHASE B ==="

          grep -E \
            '^CONFIG_(CC_IS_CLANG|CLANG_VERSION|LD_IS_LLD|AS_IS_LLVM|ARCH_SUPPORTS_LTO_CLANG|ARCH_SUPPORTS_LTO_CLANG_THIN|HAS_LTO_CLANG|LTO|LTO_NONE|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|CFI_CLANG|CFI_PERMISSIVE|SHADOW_CALL_STACK|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|ARM64_MTE|ARM64_TAGGED_ADDR_ABI|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|GCOV_KERNEL|FTRACE_MCOUNT_USE_RECORDMCOUNT)=' \
            "${CONFIG_OUT}/.config" \
            || true

          # ----------------------------------------------------------
          # IMPORTANT:
          #
          # HAS_LTO_CLANG is a hidden/derived symbol and may not be
          # represented as a literal CONFIG_HAS_LTO_CLANG=y line in
          # .config.
          #
          # Therefore the actual user-visible choice we require is:
          #
          #     CONFIG_LTO_CLANG_FULL=y
          #
          # which itself depends on HAS_LTO_CLANG.
          # ----------------------------------------------------------

          grep -q \
            '^CONFIG_LTO_CLANG_FULL=y$' \
            "${CONFIG_OUT}/.config" || {

            echo "::error::CONFIG_LTO_CLANG_FULL was rejected by Kconfig."

            echo
            echo "=== LTO diagnostics ==="

            grep -E \
              '^CONFIG_(CC_IS_CLANG|CLANG_VERSION|LD_IS_LLD|AS_IS_LLVM|ARCH_SUPPORTS_LTO_CLANG|ARCH_SUPPORTS_LTO_CLANG_THIN|HAS_LTO_CLANG|LTO|LTO_NONE|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|ARM64_MTE|GCOV_KERNEL|FTRACE_MCOUNT_USE_RECORDMCOUNT)=' \
              "${CONFIG_OUT}/.config" \
              || true

            exit 1
          }

          # ----------------------------------------------------------
          # Confirm no conflicting LTO choice survived.
          # ----------------------------------------------------------

          if grep -q \
            '^CONFIG_LTO_NONE=y$' \
            "${CONFIG_OUT}/.config"
          then

            echo "::error::CONFIG_LTO_NONE=y still selected."

            exit 1

          fi

          if grep -q \
            '^CONFIG_LTO_CLANG_THIN=y$' \
            "${CONFIG_OUT}/.config"
          then

            echo "::error::CONFIG_LTO_CLANG_THIN=y still selected."

            exit 1

          fi

          if grep -q \
            '^CONFIG_GCOV_KERNEL=y$' \
            "${CONFIG_OUT}/.config"
          then

            echo "::error::CONFIG_GCOV_KERNEL=y conflicts with HAS_LTO_CLANG."

            exit 1

          fi

          if grep -q \
            '^CONFIG_FTRACE_MCOUNT_USE_RECORDMCOUNT=y$' \
            "${CONFIG_OUT}/.config"
          then

            echo "::error::FTRACE_MCOUNT_USE_RECORDMCOUNT=y conflicts with HAS_LTO_CLANG."

            exit 1

          fi

          # ----------------------------------------------------------
          # CFI.
          # ----------------------------------------------------------

          grep -q \
            '^CONFIG_CFI_CLANG=y$' \
            "${CONFIG_OUT}/.config"

          if grep -q \
            '^CONFIG_CFI_PERMISSIVE=y$' \
            "${CONFIG_OUT}/.config"
          then

            echo "::error::CFI_PERMISSIVE=y is not allowed."

            exit 1

          fi

          grep -q \
            '^CONFIG_SHADOW_CALL_STACK=y$' \
            "${CONFIG_OUT}/.config"

          # ----------------------------------------------------------
          # KernelSU/SUSFS.
          # ----------------------------------------------------------

          ./scripts/config \
            --file "${CONFIG_OUT}/.config" \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS

          # ----------------------------------------------------------
          # Discover additional SUSFS Kconfig symbols.
          # ----------------------------------------------------------

          SUSFS_EXTRA="${CONFIG_OUT}/susfs_extra.conf"

          : > \
            "${SUSFS_EXTRA}"

          while read -r sym; do

            case "${sym}" in

              KSU_SUSFS)
                continue
                ;;

              KSU_SUSFS_*)
                printf 'CONFIG_%s=y\n' \
                  "${sym}" \
                  >> "${SUSFS_EXTRA}"
                ;;

            esac

          done < <(
            grep -RhoE \
              '^config[[:space:]]+KSU_SUSFS[A-Z0-9_]*' \
              drivers/kernelsu \
              2>/dev/null |
            awk '{print $2}' |
            sort -u
          )

          if [ -s \
            "${SUSFS_EXTRA}" ]
          then

            cat \
              "${SUSFS_EXTRA}" \
              >> "${CONFIG_OUT}/.config"

          fi

          # ----------------------------------------------------------
          # Final dependency resolution.
          # ----------------------------------------------------------

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            olddefconfig

          echo
          echo "============================================================"
          echo "FINAL RESOLVED KCONFIG"
          echo "============================================================"

          grep -E \
            '^CONFIG_(CC_IS_CLANG|CLANG_VERSION|LD_IS_LLD|AS_IS_LLVM|ARCH_SUPPORTS_LTO_CLANG|ARCH_SUPPORTS_LTO_CLANG_THIN|HAS_LTO_CLANG|LTO|LTO_NONE|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|CFI_CLANG|CFI_PERMISSIVE|CFI_CLANG_SHADOW|SHADOW_CALL_STACK|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|HAVE_ARCH_KASAN_HW_TAGS|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS|KSU|KSU_SUSFS)=' \
            "${CONFIG_OUT}/.config" \
            || true

          # ----------------------------------------------------------
          # Final required settings.
          # ----------------------------------------------------------

          REQUIRED=(
            CONFIG_CC_IS_CLANG
            CONFIG_LD_IS_LLD
            CONFIG_AS_IS_LLVM
            CONFIG_ARCH_SUPPORTS_LTO_CLANG

            CONFIG_LTO_CLANG_FULL

            CONFIG_CFI_CLANG
            CONFIG_SHADOW_CALL_STACK

            CONFIG_KASAN
            CONFIG_KASAN_HW_TAGS

            CONFIG_ARM64_TAGGED_ADDR_ABI
            CONFIG_ARM64_MTE
            CONFIG_ARM64_PAN
            CONFIG_ARM64_LSE_ATOMICS

            CONFIG_SLUB

            CONFIG_MODULES
            CONFIG_MODVERSIONS
            CONFIG_KALLSYMS
            CONFIG_KALLSYMS_ALL
            CONFIG_OVERLAY_FS

            CONFIG_KSU
            CONFIG_KSU_SUSFS
          )

          for sym in "${REQUIRED[@]}"; do

            grep -q \
              "^${sym}=y$" \
              "${CONFIG_OUT}/.config" || {

              echo "::error::Missing ${sym}"

              exit 1

            }

          done

          # ----------------------------------------------------------
          # Forbidden settings.
          # ----------------------------------------------------------

          FORBIDDEN=(
            CONFIG_LTO_NONE
            CONFIG_LTO_CLANG_THIN
            CONFIG_KASAN_GENERIC
            CONFIG_KASAN_SW_TAGS
            CONFIG_CFI_PERMISSIVE
            CONFIG_GCOV_KERNEL
            CONFIG_FTRACE_MCOUNT_USE_RECORDMCOUNT
          )

          for sym in "${FORBIDDEN[@]}"; do

            if grep -q \
              "^${sym}=y$" \
              "${CONFIG_OUT}/.config"
            then

              echo "::error::Forbidden ${sym}=y"

              exit 1

            fi

          done

          # ----------------------------------------------------------
          # Canonical savedefconfig.
          # ----------------------------------------------------------

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            savedefconfig

          test -s \
            "${CONFIG_OUT}/defconfig"

          mkdir -p \
            arch/arm64/configs

          cp \
            "${CONFIG_OUT}/defconfig" \
            arch/arm64/configs/bg7n_defconfig

          echo
          echo "============================================================"
          echo "CANONICAL BG7n DEFCONFIG"
          echo "============================================================"

          grep -E \
            '^CONFIG_(LTO_CLANG_FULL|LTO_NONE|LTO_CLANG_THIN|CFI_CLANG|CFI_PERMISSIVE|SHADOW_CALL_STACK|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS|KSU|KSU_SUSFS)=' \
            arch/arm64/configs/bg7n_defconfig \
            || true

          # ----------------------------------------------------------
          # Re-expand canonical config.
          # ----------------------------------------------------------

          rm -f \
            "${CONFIG_OUT}/.config"

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            bg7n_defconfig

          cp \
            "${CONFIG_OUT}/.config" \
            "${CONFIG_OUT}/expanded.config"

          # ----------------------------------------------------------
          # Canonical stability.
          # ----------------------------------------------------------

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            savedefconfig

          cmp -s \
            "${CONFIG_OUT}/defconfig" \
            arch/arm64/configs/bg7n_defconfig || {

            echo "::error::Canonical savedefconfig is not stable."

            diff -u \
              arch/arm64/configs/bg7n_defconfig \
              "${CONFIG_OUT}/defconfig" \
              || true

            exit 1

          }

          # ----------------------------------------------------------
          # Final expanded verification.
          # ----------------------------------------------------------

          REQUIRED_FINAL=(
            CONFIG_ARM64
            CONFIG_LTO_CLANG_FULL
            CONFIG_CFI_CLANG
            CONFIG_SHADOW_CALL_STACK
            CONFIG_KASAN
            CONFIG_KASAN_HW_TAGS
            CONFIG_ARM64_TAGGED_ADDR_ABI
            CONFIG_ARM64_MTE
            CONFIG_ARM64_PAN
            CONFIG_ARM64_LSE_ATOMICS
            CONFIG_SLUB
            CONFIG_MODULES
            CONFIG_MODVERSIONS
            CONFIG_KALLSYMS
            CONFIG_KALLSYMS_ALL
            CONFIG_OVERLAY_FS
            CONFIG_KSU
            CONFIG_KSU_SUSFS
          )

          for sym in "${REQUIRED_FINAL[@]}"; do

            grep -q \
              "^${sym}=y$" \
              "${CONFIG_OUT}/expanded.config" || {

              echo "::error::Missing ${sym} after canonical expansion."

              exit 1

            }

          done

          for sym in \
            CONFIG_LTO_NONE \
            CONFIG_LTO_CLANG_THIN \
            CONFIG_KASAN_GENERIC \
            CONFIG_KASAN_SW_TAGS \
            CONFIG_CFI_PERMISSIVE \
            CONFIG_GCOV_KERNEL \
            CONFIG_FTRACE_MCOUNT_USE_RECORDMCOUNT
          do

            if grep -q \
              "^${sym}=y$" \
              "${CONFIG_OUT}/expanded.config"
            then

              echo "::error::Forbidden ${sym}=y appeared after canonical expansion."

              exit 1

            fi

          done

          echo
          echo "============================================================"
          echo "DEFCONFIG GENERATION SUCCESS"
          echo "============================================================"

      # ============================================================
      # SAVE FINAL DEFCONFIG
      # ============================================================

      - name: Save final BG7n defconfig
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          test -f \
            arch/arm64/configs/bg7n_defconfig

          cp \
            arch/arm64/configs/bg7n_defconfig \
            "${GITHUB_WORKSPACE}/BG7n_final_defconfig"

          sha256sum \
            "${GITHUB_WORKSPACE}/BG7n_final_defconfig"

      # ============================================================
      # BUILD CONFIG
      # ============================================================

      - name: Prepare GKI build config
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          cat > \
            build.config.bg7n.ksu.susfs <<'CFG'
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.gki.aarch64

          DEFCONFIG=bg7n_defconfig

          KMI_ENFORCED=1
          KMI_SYMBOL_LIST_STRICT_MODE=1
          TRIM_NONLISTED_KMI=1

          MAKE_GOALS="${MAKE_GOALS}
          modules
          "
          CFG

          echo "=== build.config.bg7n.ksu.susfs ==="

          cat \
            build.config.bg7n.ksu.susfs

      # ============================================================
      # PRE-BUILD CONFIG CHECK
      # ============================================================

      - name: Verify final GKI KMI configuration
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          CONFIG="arch/arm64/configs/bg7n_defconfig"

          test -s \
            "${CONFIG}"

          echo "=== Final defconfig ==="

          grep -E \
            '^CONFIG_(LTO_CLANG_FULL|LTO_NONE|LTO_CLANG_THIN|CFI_CLANG|CFI_PERMISSIVE|SHADOW_CALL_STACK|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS|KSU|KSU_SUSFS)=' \
            "${CONFIG}" \
            || true

          grep -q \
            '^CONFIG_LTO_CLANG_FULL=y$' \
            "${CONFIG}"

          grep -q \
            '^CONFIG_CFI_CLANG=y$' \
            "${CONFIG}"

          grep -q \
            '^CONFIG_SHADOW_CALL_STACK=y$' \
            "${CONFIG}"

          grep -q \
            '^CONFIG_KASAN=y$' \
            "${CONFIG}"

          grep -q \
            '^CONFIG_KASAN_HW_TAGS=y$' \
            "${CONFIG}"

          grep -q \
            '^CONFIG_ARM64_TAGGED_ADDR_ABI=y$' \
            "${CONFIG}"

          grep -q \
            '^CONFIG_ARM64_MTE=y$' \
            "${CONFIG}"

          grep -q \
            '^CONFIG_ARM64_PAN=y$' \
            "${CONFIG}"

          grep -q \
            '^CONFIG_ARM64_LSE_ATOMICS=y$' \
            "${CONFIG}"

          grep -q \
            '^CONFIG_KSU=y$' \
            "${CONFIG}"

          grep -q \
            '^CONFIG_KSU_SUSFS=y$' \
            "${CONFIG}"

          if grep -q \
            '^CONFIG_LTO_NONE=y$' \
            "${CONFIG}"
          then
            echo "::error::LTO_NONE is enabled."
            exit 1
          fi

          if grep -q \
            '^CONFIG_LTO_CLANG_THIN=y$' \
            "${CONFIG}"
          then
            echo "::error::LTO_CLANG_THIN is enabled."
            exit 1
          fi

          if grep -q \
            '^CONFIG_KASAN_GENERIC=y$' \
            "${CONFIG}"
          then
            echo "::error::KASAN_GENERIC is enabled."
            exit 1
          fi

          if grep -q \
            '^CONFIG_KASAN_SW_TAGS=y$' \
            "${CONFIG}"
          then
            echo "::error::KASAN_SW_TAGS is enabled."
            exit 1
          fi

          if grep -q \
            '^CONFIG_CFI_PERMISSIVE=y$' \
            "${CONFIG}"
          then
            echo "::error::CFI_PERMISSIVE is enabled."
            exit 1
          fi

          echo "=== Final GKI configuration valid ==="

      # ============================================================
      # SOURCE TREE CHECK
      # ============================================================

      - name: Verify GKI source tree
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          test ! -f \
            .config

          test ! -f \
            defconfig

          test ! -d \
            include/config

          test ! -d \
            include/generated

          test ! -d \
            arch/arm64/include/generated

          test -L \
            drivers/kernelsu

          test -f \
            drivers/kernelsu/Kconfig

          test -f \
            drivers/kernelsu/Kbuild

          grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile

          test -f \
            arch/arm64/configs/bg7n_defconfig

          echo "=== GKI source tree ready ==="

      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build kernel with official GKI KMI enforcement
        shell: bash
        working-directory: gki
        env:
          MAKE_JOBS: ${{ inputs.make_jobs }}
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-actions
        run: |
          set -euxo pipefail

          export MAKEFLAGS="-j${MAKE_JOBS}"

          rm -rf \
            out/android12-5.10

          test ! -f \
            common/.config

          test ! -f \
            common/defconfig

          test ! -d \
            common/include/config

          test ! -d \
            common/include/generated

          test ! -d \
            common/arch/arm64/include/generated

          echo "=== Build defconfig ==="

          grep -E \
            '^CONFIG_(LTO_CLANG_FULL|CFI_CLANG|SHADOW_CALL_STACK|KASAN|KASAN_HW_TAGS|ARM64_MTE|ARM64_TAGGED_ADDR_ABI|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|KSU|KSU_SUSFS)=' \
            common/arch/arm64/configs/bg7n_defconfig ||
            true

          echo
          echo "=== Starting official Google GKI build ==="

          BUILD_CONFIG=common/build.config.bg7n.ksu.susfs \
            LTO=full \
            ./build/build.sh

      # ============================================================
      # VERIFY KERNEL / KMI
      # ============================================================

      - name: Verify kernel and collect KMI evidence
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          mkdir -p \
            ../artifact/kernel \
            ../artifact/reports

          IMAGE_LZ4="$(
            find out \
              -type f \
              -path '*/dist/Image.lz4' |
            head -n1 ||
            true
          )"

          IMAGE="$(
            find out \
              -type f \
              -path '*/dist/Image' |
            head -n1 ||
            true
          )"

          test -n \
            "${IMAGE_LZ4}" || {

            echo "::error::Image.lz4 missing."

            exit 1
          }

          cp \
            "${IMAGE_LZ4}" \
            ../artifact/kernel/Image.lz4

          if [ -n "${IMAGE}" ]; then

            cp \
              "${IMAGE}" \
              ../artifact/kernel/Image

          else

            lz4 \
              -d \
              -f \
              "${IMAGE_LZ4}" \
              ../artifact/kernel/Image

          fi

          CONFIG_FILE="$(
            find out \
              -type f \
              -name .config |
            head -n1 ||
            true
          )"

          test -n \
            "${CONFIG_FILE}"

          cp \
            "${CONFIG_FILE}" \
            ../artifact/kernel/.config

          MODULE_SYMVERS="$(
            find out \
              -type f \
              -name Module.symvers |
            head -n1 ||
            true
          )"

          if [ -n "${MODULE_SYMVERS}" ]; then

            cp \
              "${MODULE_SYMVERS}" \
              ../artifact/kernel/Module.symvers

          fi

          find out \
            -type f \
            -name System.map \
            -exec cp {} ../artifact/kernel/ \; ||
            true

          find out \
            -type f \
            -name modules.builtin \
            -exec cp {} ../artifact/kernel/ \; ||
            true

          find out \
            -type f \
            -name modules.builtin.modinfo \
            -exec cp {} ../artifact/kernel/ \; ||
            true

          echo "=== Final kernel configuration ==="

          grep -E \
            '^CONFIG_(LTO_CLANG_FULL|LTO_NONE|LTO_CLANG_THIN|CFI_CLANG|CFI_PERMISSIVE|SHADOW_CALL_STACK|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|ARM64_MTE|ARM64_TAGGED_ADDR_ABI|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS|KSU|KSU_SUSFS)=' \
            ../artifact/kernel/.config ||
            true

          REQUIRED_KERNEL=(
            CONFIG_LTO_CLANG_FULL
            CONFIG_CFI_CLANG
            CONFIG_SHADOW_CALL_STACK
            CONFIG_KASAN
            CONFIG_KASAN_HW_TAGS
            CONFIG_ARM64_MTE
            CONFIG_ARM64_TAGGED_ADDR_ABI
            CONFIG_ARM64_PAN
            CONFIG_ARM64_LSE_ATOMICS
            CONFIG_KSU
            CONFIG_KSU_SUSFS
            CONFIG_MODULES
            CONFIG_MODVERSIONS
          )

          for sym in "${REQUIRED_KERNEL[@]}"; do

            grep -q \
              "^${sym}=y$" \
              ../artifact/kernel/.config || {

              echo "::error::Missing ${sym} in final kernel."

              exit 1

            }

          done

          FORBIDDEN_KERNEL=(
            CONFIG_LTO_NONE
            CONFIG_LTO_CLANG_THIN
            CONFIG_KASAN_GENERIC
            CONFIG_KASAN_SW_TAGS
            CONFIG_CFI_PERMISSIVE
          )

          for sym in "${FORBIDDEN_KERNEL[@]}"; do

            if grep -q \
              "^${sym}=y$" \
              ../artifact/kernel/.config
            then

              echo "::error::Forbidden ${sym}=y in final kernel."

              exit 1

            fi

          done

          echo
          echo "=== KMI symbols of interest ==="

          if [ -f \
            ../artifact/kernel/Module.symvers ]
          then

            grep -E \
              '(^|[[:space:]])(__cfi_slowpath|kasan_flag_enabled)([[:space:]]|$)' \
              ../artifact/kernel/Module.symvers ||
              true

          fi

          {
            echo "=== Kernel version ==="

            make -s \
              -C common \
              kernelversion

            echo
            echo "=== GKI commit ==="

            git -C common \
              rev-parse HEAD

            echo
            echo "=== KernelSU commit ==="

            git -C KernelSU \
              rev-parse HEAD

            echo
            echo "=== SUSFS commit ==="

            git -C susfs \
              rev-parse HEAD

            echo
            echo "=== Critical configuration ==="

            grep -E \
              '^CONFIG_(LTO_CLANG_FULL|CFI_CLANG|SHADOW_CALL_STACK|KASAN|KASAN_HW_TAGS|ARM64_MTE|ARM64_TAGGED_ADDR_ABI|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS|KSU|KSU_SUSFS)=' \
              ../artifact/kernel/.config ||
              true

            echo
            echo "=== KMI configuration ==="

            grep -E \
              '^(KMI_ENFORCED|KMI_SYMBOL_LIST_STRICT_MODE|TRIM_NONLISTED_KMI)=' \
              common/build.config.bg7n.ksu.susfs

            echo
            echo "=== KMI symbols ==="

            if [ -f \
              ../artifact/kernel/Module.symvers ]
            then

              grep -E \
                '(^|[[:space:]])(__cfi_slowpath|kasan_flag_enabled)([[:space:]]|$)' \
                ../artifact/kernel/Module.symvers ||
                true

            fi

          } | tee \
            ../artifact/reports/kernel_verification.txt

      # ============================================================
      # BUILD SUSFS USERSPACE + MODULE
      # ============================================================

      - name: Build SUSFS userspace helper and KernelSU module
        shell: bash
        working-directory: gki/susfs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euxo pipefail

          export PATH="${ANDROID_NDK_HOME}:${PATH}"

          chmod +x \
            build_ksu_susfs_tool.sh \
            build_ksu_module.sh

          ./build_ksu_susfs_tool.sh
          ./build_ksu_module.sh

          test -d \
            ksu_module_susfs

          mkdir -p \
            ../../artifact/susfs

          cp -a \
            ksu_module_susfs \
            ../../artifact/susfs/susfs4ksu-module

          if [ -f \
            ksu_module_susfs.zip ]
          then

            cp \
              ksu_module_susfs.zip \
              ../../artifact/susfs/susfs4ksu.zip

          fi

      # ============================================================
      # REPACK BOOT
      # ============================================================

      - name: Repack stock boot with built kernel
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            work/boot \
            artifact/boot

          cp \
            stock/boot.img \
            work/boot/boot.img

          MAGISK_API="https://api.github.com/repos/topjohnwu/Magisk/releases/latest"

          MAGISK_URL="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "${MAGISK_API}" |
            jq -r '
              .assets[]
              | select(.name | startswith("Magisk-"))
              | select(.name | endswith(".apk"))
              | .browser_download_url
            ' |
            head -n1
          )"

          test -n \
            "${MAGISK_URL}"

          curl -fL \
            "${MAGISK_URL}" \
            -o magisk.apk

          unzip -j -o \
            magisk.apk \
            'lib/arm64-v8a/libmagiskboot.so' \
            -d work

          mv \
            work/libmagiskboot.so \
            work/magiskboot

          chmod +x \
            work/magiskboot

          (
            cd work/boot

            ../magiskboot unpack boot.img

            test -f \
              kernel

            test -f \
              ../../artifact/kernel/Image

            cp \
              ../../artifact/kernel/Image \
              kernel

            ../magiskboot repack boot.img

            test -s \
              new-boot.img
          )

          cp \
            work/boot/new-boot.img \
            artifact/boot/BG7n-KSU-SUSFS-boot.img

          file \
            artifact/boot/BG7n-KSU-SUSFS-boot.img

          sha256sum \
            artifact/boot/BG7n-KSU-SUSFS-boot.img |
            tee \
            artifact/reports/generated_boot.sha256

      # ============================================================
      # BUILD MANIFEST
      # ============================================================

      - name: Create build manifest and hashes
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            artifact

          SUSFS_COMMIT="$(
            git -C gki/susfs \
              rev-parse HEAD
          )"

          KSU_ACTUAL_COMMIT="$(
            git -C gki/KernelSU \
              rev-parse HEAD
          )"

          COMMON_COMMIT="$(
            git -C gki/common \
              rev-parse HEAD
          )"

          cat > \
            artifact/BUILD_INFO.txt <<EOF
          DEVICE=${DEVICE}

          GOOGLE_GKI_MANIFEST_BRANCH=${GKI_MANIFEST_BRANCH}
          GOOGLE_GKI_COMMON_TAG=${GKI_COMMON_TAG}
          GOOGLE_GKI_VERSION=${GKI_VERSION}
          GOOGLE_GKI_SHA=${GKI_SHA}
          COMMON_COMMIT=${COMMON_COMMIT}

          KERNELSU_REPO=${KSU_REPO}
          KERNELSU_COMMIT=${KSU_ACTUAL_COMMIT}

          SUSFS_REPO=${SUSFS_REPO}
          SUSFS_REF=${{ inputs.susfs_ref }}
          SUSFS_COMMIT=${SUSFS_COMMIT}

          BOOT_RELEASE_REPO=${BOOT_REPO}
          BOOT_RELEASE_TAG=${{ inputs.boot_release_tag }}

          STOCK_BOOT_SHA256=$(cut -d' ' -f1 stock/boot.sha256)
          EOF

          cp \
            gki/manifest.lock.xml \
            artifact/manifest.lock.xml

          cp \
            stock/boot.sha256 \
            artifact/reports/stock_boot.sha256

          cp \
            BG7n_final_defconfig \
            artifact/kernel/bg7n_final_defconfig

          find artifact \
            -type f \
            ! -name SHA256SUMS.txt \
            -print0 |
            sort -z |
            xargs -0 sha256sum \
            > artifact/SHA256SUMS.txt

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package artifacts
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf \
            artifact/package

          mkdir -p \
            artifact/package

          cp \
            artifact/BUILD_INFO.txt \
            artifact/package/

          cp \
            artifact/SHA256SUMS.txt \
            artifact/package/

          cp -a \
            artifact/kernel \
            artifact/package/kernel

          cp -a \
            artifact/susfs \
            artifact/package/susfs

          cp -a \
            artifact/reports \
            artifact/package/reports

          if [ -d \
            artifact/boot ]
          then

            cp -a \
              artifact/boot \
              artifact/package/boot

          fi

          cp \
            BG7n_stock_defconfig \
            artifact/package/

          cp \
            BG7n_final_defconfig \
            artifact/package/

          cat > \
            artifact/package/README.txt <<EOF
          TECNO BG7n

          Google GKI:
            Manifest branch:
              ${GKI_MANIFEST_BRANCH}

            Common tag:
              ${GKI_COMMON_TAG}

            Linux:
              ${GKI_VERSION}

            Commit:
              ${GKI_SHA}

          KernelSU:
            Repository:
              ${KSU_REPO}

            Commit:
              ${KSU_ACTUAL_COMMIT}

          SUSFS:
            Repository:
              ${SUSFS_REPO}

            Commit:
              ${{ inputs.susfs_ref }}

          GKI:
            CONFIG_LTO_CLANG_FULL=y
            CONFIG_CFI_CLANG=y
            CONFIG_SHADOW_CALL_STACK=y

            CONFIG_KASAN=y
            CONFIG_KASAN_HW_TAGS=y

            CONFIG_ARM64_TAGGED_ADDR_ABI=y
            CONFIG_ARM64_MTE=y
            CONFIG_ARM64_PAN=y
            CONFIG_ARM64_LSE_ATOMICS=y

          KernelSU:
            CONFIG_KSU=y
            CONFIG_KSU_SUSFS=y

          Modules:
            CONFIG_MODULES=y
            CONFIG_MODVERSIONS=y

          Forbidden:
            CONFIG_LTO_NONE
            CONFIG_LTO_CLANG_THIN
            CONFIG_KASAN_GENERIC
            CONFIG_KASAN_SW_TAGS
            CONFIG_CFI_PERMISSIVE

          KMI:
            KMI_ENFORCED=1
            KMI_SYMBOL_LIST_STRICT_MODE=1
            TRIM_NONLISTED_KMI=1

          IMPORTANT:
            The official GKI KMI comparison is not bypassed.

            Keep the original stock boot.img as the recovery path.
          EOF

          (
            cd artifact/package

            zip \
              -r \
              ../../BG7n_GKI_r3_KSU_SUSFS_artifacts.zip \
              .
          )

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload complete artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-GKI-r3-KSU-SUSFS
          path: |
            BG7n_GKI_r3_KSU_SUSFS_artifacts.zip
            artifact/
          if-no-files-found: error
          retention-days: 30

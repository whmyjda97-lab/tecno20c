name: "Build BG7n GKI r3 + KernelSU + SUSFS"

on:
  workflow_dispatch:
    inputs:
      susfs_ref:
        description: "Pinned SUSFS commit (v2.2.0)"
        required: false
        default: "be08face56c347e7ba9c4fb420c2463598a14f5d"

      make_jobs:
        description: "Kernel build jobs"
        required: false
        default: "4"

      boot_release_tag:
        description: "GitHub Release tag containing stock BG7n boot.img.zip"
        required: false
        default: "stock-boot"

permissions:
  contents: read

concurrency:
  group: bg7n-${{ github.ref }}
  cancel-in-progress: true

env:
  # ==============================================================
  # GOOGLE GKI
  # ==============================================================

  GKI_MANIFEST_BRANCH: common-android12-5.10-2025-06
  GKI_COMMON_TAG: android12-5.10-2025-06_r3
  GKI_VERSION: "5.10.237"
  GKI_SHA: d09ef2e980e0974a0d6dfe762e29fff118db7f46

  # ==============================================================
  # KERNELSU
  # ==============================================================

  KSU_REPO: https://github.com/5ec1cff/KernelSU.git
  KSU_COMMIT: 3be1013dbda6ebab14e7fcd231bcbae5ce6425ff

  # ==============================================================
  # SUSFS
  # ==============================================================

  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git

  # ==============================================================
  # STOCK BOOT
  # ==============================================================

  BOOT_REPO: whmyjda97-lab/tecno20c

  DEVICE: BG7n
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout build kit
        uses: actions/checkout@v4

      # ============================================================
      # HOST DEPENDENCIES
      # ============================================================

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            curl \
            device-tree-compiler \
            dwarves \
            file \
            flex \
            gawk \
            gh \
            git \
            gnupg \
            gperf \
            jq \
            libdw-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5-dev \
            libssl-dev \
            libunwind-dev \
            lld \
            llvm \
            lz4 \
            openssl \
            pahole \
            patchelf \
            pkg-config \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zip \
            android-sdk-libsparse-utils

          clang --version
          ld.lld --version
          python3 --version
          gh --version

      # ============================================================
      # ANDROID NDK
      # ============================================================

      - name: Install Android NDK for SUSFS userspace helper
        shell: bash
        run: |
          set -euxo pipefail

          NDK_VERSION="25.2.9519653"
          NDK_ARCHIVE="android-ndk-r25b-linux.zip"

          SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          NDK_ROOT="${SDK_ROOT}/ndk/${NDK_VERSION}"

          rm -rf "${SDK_ROOT}"
          rm -rf "${RUNNER_TEMP}/android-ndk"

          mkdir -p "${SDK_ROOT}"
          mkdir -p "${RUNNER_TEMP}/android-ndk"

          curl -fL \
            "https://dl.google.com/android/repository/${NDK_ARCHIVE}" \
            -o "${RUNNER_TEMP}/${NDK_ARCHIVE}"

          unzip -q \
            "${RUNNER_TEMP}/${NDK_ARCHIVE}" \
            -d "${RUNNER_TEMP}/android-ndk"

          mkdir -p "${SDK_ROOT}/ndk"

          test -d \
            "${RUNNER_TEMP}/android-ndk/android-ndk-r25b"

          mv \
            "${RUNNER_TEMP}/android-ndk/android-ndk-r25b" \
            "${NDK_ROOT}"

          test -x "${NDK_ROOT}/ndk-build"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${NDK_ROOT}" >> "${GITHUB_ENV}"

          echo "${NDK_ROOT}" >> "${GITHUB_PATH}"

          echo "=== Android NDK ==="
          echo "ANDROID_NDK_HOME=${NDK_ROOT}"

          "${NDK_ROOT}/ndk-build" --version

      # ============================================================
      # STOCK BOOT
      # ============================================================

      - name: Fetch exact stock BG7n boot.img from Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOT_RELEASE_TAG: ${{ inputs.boot_release_tag }}
        run: |
          set -euo pipefail

          rm -rf stock-release
          rm -rf stock

          mkdir -p stock-release
          mkdir -p stock

          gh release view \
            "${BOOT_RELEASE_TAG}" \
            --repo "${BOOT_REPO}" \
            --json tagName,name,assets \
            --jq '.tagName + " | " + .name + " | assets=" + ((.assets|length)|tostring)'

          gh release download \
            "${BOOT_RELEASE_TAG}" \
            --repo "${BOOT_REPO}" \
            --dir stock-release

          echo "=== Downloaded release assets ==="

          find stock-release \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort

          CANDIDATES=()

          while IFS= read -r -d '' z; do

            mapfile -t ENTRIES < <(
              unzip -Z1 "$z" 2>/dev/null |
              awk 'tolower($0) ~ /(^|\/)boot\.img$/ {print}'
            )

            if [ "${#ENTRIES[@]}" -eq 1 ]; then
              CANDIDATES+=("$z")

              echo "Boot candidate:"
              echo "  $z"
              echo "  ${ENTRIES[0]}"
            fi

          done < <(
            find stock-release \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              -print0
          )

          test "${#CANDIDATES[@]}" -eq 1 || {
            echo "::error::Expected exactly one release ZIP containing exactly one boot.img."
            echo "Candidates found: ${#CANDIDATES[@]}"
            printf '%s\n' "${CANDIDATES[@]:-<none>}"
            exit 1
          }

          BOOT_ASSET="${CANDIDATES[0]}"

          mapfile -t BOOT_ENTRIES < <(
            unzip -Z1 "${BOOT_ASSET}" |
            awk 'tolower($0) ~ /(^|\/)boot\.img$/ {print}'
          )

          unzip -p \
            "${BOOT_ASSET}" \
            "${BOOT_ENTRIES[0]}" \
            > stock/boot.img

          test -s stock/boot.img

          file stock/boot.img

          sha256sum stock/boot.img |
            tee stock/boot.sha256

      # ============================================================
      # INPUT CONFIG
      # ==============================================================

      - name: Verify BG7n stock config
        shell: bash
        run: |
          set -euxo pipefail

          test -s BG7n_stock_defconfig

          grep -q '^CONFIG_MODULES=y$' \
            BG7n_stock_defconfig

          grep -q '^CONFIG_MODVERSIONS=y$' \
            BG7n_stock_defconfig

          echo "=== Stock BG7n config SHA256 ==="

          sha256sum BG7n_stock_defconfig

          echo "=== Stock BG7n KMI-critical settings ==="

          grep -E \
            '^CONFIG_(CFI_CLANG|CFI_PERMISSIVE|LTO_CLANG_FULL|SHADOW_CALL_STACK|KASAN|KASAN_HW_TAGS)=' \
            BG7n_stock_defconfig \
            || true

      # ============================================================
      # REPO TOOL
      # ============================================================

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o repo

          chmod +x repo

          sudo install \
            -m 0755 \
            repo \
            /usr/local/bin/repo

          repo --version

      # ============================================================
      # GOOGLE GKI SOURCE
      # ============================================================

      - name: Sync exact Google GKI r3 source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf gki

          mkdir -p gki
          cd gki

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${GKI_MANIFEST_BRANCH}" \
            --depth=1

          repo sync \
            -c \
            -j2 \
            --no-tags \
            --no-clone-bundle

          test -d common
          test -f common/Makefile

          echo "=== manifest-managed common remotes ==="

          git -C common remote -v || true

          git -C common fetch \
            --no-tags \
            https://android.googlesource.com/kernel/common.git \
            "refs/tags/${GKI_COMMON_TAG}:refs/tags/${GKI_COMMON_TAG}"

          git -C common checkout \
            --detach \
            "refs/tags/${GKI_COMMON_TAG}"

          COMMON_COMMIT="$(
            git -C common rev-parse HEAD
          )"

          echo "COMMON_COMMIT=${COMMON_COMMIT}"

          test "${COMMON_COMMIT}" = "${GKI_SHA}"

          test \
            "$(make -s -C common kernelversion)" \
            = "${GKI_VERSION}"

          repo manifest -r > manifest.lock.xml

          {
            echo "GKI_MANIFEST_BRANCH=${GKI_MANIFEST_BRANCH}"
            echo "GKI_COMMON_TAG=${GKI_COMMON_TAG}"
            echo "GKI_VERSION=${GKI_VERSION}"
            echo "GKI_SHA=${GKI_SHA}"
            echo "COMMON_COMMIT=${COMMON_COMMIT}"
          } | tee ../gki_identity.txt

      # ============================================================
      # KERNELSU
      # ============================================================

      - name: Install exact KernelSU patch-base tree
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          rm -rf KernelSU

          git clone \
            --no-tags \
            --filter=blob:none \
            "${KSU_REPO}" \
            KernelSU

          git -C KernelSU fetch \
            --no-tags \
            origin \
            "${KSU_COMMIT}"

          git -C KernelSU checkout \
            --detach \
            "${KSU_COMMIT}"

          ACTUAL_KSU_COMMIT="$(
            git -C KernelSU rev-parse HEAD
          )"

          test "${ACTUAL_KSU_COMMIT}" = "${KSU_COMMIT}"

          echo "KERNELSU_REPO=${KSU_REPO}" |
            tee ../kernelsu_identity.txt

          echo "KERNELSU_COMMIT=${ACTUAL_KSU_COMMIT}" |
            tee -a ../kernelsu_identity.txt

          test -d KernelSU/kernel
          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Kbuild

          test \
            "$(git -C KernelSU hash-object kernel/Kbuild | cut -c1-8)" \
            = "cc3610a8"

          test \
            "$(git -C KernelSU hash-object kernel/Kconfig | cut -c1-8)" \
            = "88e22811"

          test \
            "$(git -C KernelSU hash-object kernel/core/init.c | cut -c1-8)" \
            = "09b290a9"

          echo "Exact KernelSU/SUSFS patch-base verified."

      # ============================================================
      # SUSFS
      # ============================================================

      - name: Clone and verify pinned SUSFS
        shell: bash
        working-directory: gki
        env:
          SUSFS_REF: ${{ inputs.susfs_ref }}
        run: |
          set -euxo pipefail

          rm -rf susfs

          git clone \
            --no-tags \
            --filter=blob:none \
            "${SUSFS_REPO}" \
            susfs

          git -C susfs fetch \
            --no-tags \
            origin \
            "${SUSFS_REF}"

          git -C susfs checkout \
            --detach \
            "${SUSFS_REF}"

          SUSFS_COMMIT="$(
            git -C susfs rev-parse HEAD
          )"

          test "${SUSFS_COMMIT}" = "${SUSFS_REF}"

          echo "SUSFS_COMMIT=${SUSFS_COMMIT}" |
            tee ../susfs_identity.txt

          test -f \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          test -f \
            susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          test -d \
            susfs/kernel_patches/fs

          test -d \
            susfs/kernel_patches/include/linux

          test -f \
            susfs/ksu_module_susfs/module.prop

          cat \
            susfs/ksu_module_susfs/module.prop

          grep -Eq \
            '^version=v?2\.2\.0($|[.-])' \
            susfs/ksu_module_susfs/module.prop || {
              echo "::error::Pinned SUSFS ref is not v2.2.0."
              exit 1
            }

      # ============================================================
      # APPLY SUSFS PATCHES
      # ============================================================

      - name: Apply SUSFS patches on exact matching base
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          cp \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            KernelSU/

          cp \
            susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            common/

          cp -a \
            susfs/kernel_patches/fs/. \
            common/fs/

          cp -a \
            susfs/kernel_patches/include/linux/. \
            common/include/linux/

          echo "=== KernelSU SUSFS patch ==="

          (
            cd KernelSU

            patch \
              --batch \
              --forward \
              -p1 \
              < 10_enable_susfs_for_ksu.patch
          )

          test -z "$(
            git -C KernelSU status --porcelain |
            grep '^UU ' ||
            true
          )"

          echo "=== GKI SUSFS patch ==="

          (
            cd common

            patch \
              --batch \
              --forward \
              -p1 \
              < 50_add_susfs_in_gki-android12-5.10.patch
          )

          test -z "$(
            git -C common status --porcelain |
            grep '^UU ' ||
            true
          )"

          echo "=== KernelSU changed files ==="
          git -C KernelSU status --short

          echo "=== GKI changed files ==="
          git -C common status --short

      # ============================================================
      # INTEGRATE KERNELSU
      # ============================================================

      - name: Integrate KernelSU into GKI Kconfig and build tree
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          test -d KernelSU/kernel
          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Kbuild

          rm -rf common/drivers/kernelsu

          KSU_RELATIVE="$(
            realpath \
              --relative-to=common/drivers \
              KernelSU/kernel
          )"

          ln -s \
            "${KSU_RELATIVE}" \
            common/drivers/kernelsu

          test -L common/drivers/kernelsu
          test -f common/drivers/kernelsu/Kconfig
          test -f common/drivers/kernelsu/Kbuild

          # ----------------------------------------------------------
          # KernelSU build hook
          # ----------------------------------------------------------

          if ! grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            common/drivers/Makefile
          then
            printf '%s\n' \
              'obj-$(CONFIG_KSU) += kernelsu/' \
              >> common/drivers/Makefile
          fi

          # ----------------------------------------------------------
          # KernelSU Kconfig hook
          # ----------------------------------------------------------

          if ! grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            common/drivers/Kconfig
          then

            awk '
              {
                lines[NR] = $0
              }

              END {
                last_endmenu = 0

                for (i = 1; i <= NR; i++) {
                  if (lines[i] == "endmenu") {
                    last_endmenu = i
                  }
                }

                if (last_endmenu == 0) {
                  print "ERROR: final endmenu not found" > "/dev/stderr"
                  exit 1
                }

                for (i = 1; i <= NR; i++) {
                  if (i == last_endmenu) {
                    print "source \"drivers/kernelsu/Kconfig\""
                    print ""
                  }

                  print lines[i]
                }
              }
            ' common/drivers/Kconfig \
              > common/drivers/Kconfig.new

            mv \
              common/drivers/Kconfig.new \
              common/drivers/Kconfig
          fi

          # ----------------------------------------------------------
          # Validation
          # ----------------------------------------------------------

          test -L \
            common/drivers/kernelsu

          test -f \
            common/drivers/kernelsu/Kconfig

          test -f \
            common/drivers/kernelsu/Kbuild

          grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            common/drivers/Kconfig

          grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            common/drivers/Makefile

          grep -Rqs \
            '^config[[:space:]]\+KSU\([[:space:]]\|$\)' \
            common/drivers/kernelsu

          grep -Rqs \
            '^config[[:space:]]\+KSU_SUSFS\([[:space:]]\|$\)' \
            common/drivers/kernelsu

          echo "=== KernelSU integration passed ==="

      # ============================================================
      # VALIDATE KSU/SUSFS KCONFIG
      # ============================================================

      - name: Validate KernelSU and SUSFS Kconfig visibility
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          test -f \
            drivers/kernelsu/Kconfig

          test -f \
            drivers/kernelsu/Kbuild

          echo "=== KSU symbols ==="

          grep -Rns \
            -E '^config[[:space:]]+KSU($|_)' \
            drivers/kernelsu \
            || true

          echo "=== SUSFS symbols ==="

          grep -Rns \
            -E '^config[[:space:]]+KSU_SUSFS($|_)' \
            drivers/kernelsu \
            || true

          grep -Rqs \
            '^config[[:space:]]\+KSU\([[:space:]]\|$\)' \
            drivers/kernelsu

          grep -Rqs \
            '^config[[:space:]]\+KSU_SUSFS\([[:space:]]\|$\)' \
            drivers/kernelsu

      # ============================================================
      # REMOVE OLD GENERATED FILES
      # ============================================================

      - name: Remove stale generated source-tree files
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          rm -f .config
          rm -f defconfig

          rm -rf include/config
          rm -rf include/generated
          rm -rf arch/arm64/include/generated

          test ! -f .config
          test ! -f defconfig
          test ! -d include/config
          test ! -d include/generated
          test ! -d arch/arm64/include/generated

          echo "Source tree generated artifacts removed."

      # ============================================================
      # GENERATE BG7n DEFCONFIG
      #
      # IMPORTANT:
      # Start from Google's GKI defconfig, not only the vendor stock
      # config. This preserves GKI ABI/KMI baseline.
      # ==============================================================

      - name: Generate BG7n GKI + KernelSU + SUSFS defconfig
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          STOCK_CONFIG="${GITHUB_WORKSPACE}/BG7n_stock_defconfig"
          GKI_BASE_CONFIG="arch/arm64/configs/gki_defconfig"
          CONFIG_OUT="${RUNNER_TEMP}/bg7n-kconfig"

          test -s "${STOCK_CONFIG}"
          test -s "${GKI_BASE_CONFIG}"

          rm -rf "${CONFIG_OUT}"
          mkdir -p "${CONFIG_OUT}"

          echo "=== Google GKI base ==="

          sha256sum \
            "${GKI_BASE_CONFIG}"

          echo "=== BG7n stock config ==="

          sha256sum \
            "${STOCK_CONFIG}"

          # ----------------------------------------------------------
          # Stage 1:
          # Generate a clean Google GKI baseline out-of-tree.
          # ----------------------------------------------------------

          cp \
            "${GKI_BASE_CONFIG}" \
            "${CONFIG_OUT}/gki_base.config"

          cp \
            "${CONFIG_OUT}/gki_base.config" \
            "${CONFIG_OUT}/.config"

          make \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            olddefconfig

          # ----------------------------------------------------------
          # Stage 2:
          # Merge BG7n stock configuration ON TOP of GKI baseline.
          #
          # The stock config provides device-specific choices.
          # Critical GKI security/KMI options are restored below.
          # ----------------------------------------------------------

          cp \
            "${STOCK_CONFIG}" \
            "${CONFIG_OUT}/bg7n_stock.fragment"

          ./scripts/kconfig/merge_config.sh \
            -m \
            -r \
            -O "${CONFIG_OUT}" \
            "${CONFIG_OUT}/gki_base.config" \
            "${CONFIG_OUT}/bg7n_stock.fragment"

          # ----------------------------------------------------------
          # KMI-critical Google GKI options.
          #
          # These are part of the official GKI baseline. The exact
          # Google gki_defconfig contains:
          #
          #   LTO_CLANG_FULL
          #   CFI_CLANG
          #   SHADOW_CALL_STACK
          #   KASAN
          #   KASAN_HW_TAGS
          #
          # They are restored explicitly because a vendor config can
          # disable them.
          # ----------------------------------------------------------

          cat >> "${CONFIG_OUT}/.config" <<'CFG'

          # =========================================================
          # Google GKI KMI baseline
          # =========================================================

          CONFIG_LTO_CLANG_FULL=y
          CONFIG_CFI_CLANG=y
          # CONFIG_CFI_PERMISSIVE is not set
          CONFIG_SHADOW_CALL_STACK=y

          CONFIG_KASAN=y
          CONFIG_KASAN_HW_TAGS=y

          CONFIG_MODULES=y
          CONFIG_MODVERSIONS=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_OVERLAY_FS=y

          # =========================================================
          # KernelSU / SUSFS
          # =========================================================

          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CFG

          # ----------------------------------------------------------
          # Resolve Kconfig.
          # ----------------------------------------------------------

          make \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            olddefconfig

          echo "=== Final critical GKI config ==="

          grep -E \
            '^CONFIG_(LTO_CLANG_FULL|CFI_CLANG|CFI_PERMISSIVE|SHADOW_CALL_STACK|KASAN|KASAN_HW_TAGS|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS)=' \
            "${CONFIG_OUT}/.config" \
            || true

          echo "=== Final KSU config ==="

          grep '^CONFIG_KSU' \
            "${CONFIG_OUT}/.config" \
            || true

          # ----------------------------------------------------------
          # Hard KMI config checks.
          # ----------------------------------------------------------

          grep -q \
            '^CONFIG_LTO_CLANG_FULL=y$' \
            "${CONFIG_OUT}/.config"

          grep -q \
            '^CONFIG_CFI_CLANG=y$' \
            "${CONFIG_OUT}/.config"

          if grep -q \
            '^CONFIG_CFI_PERMISSIVE=y$' \
            "${CONFIG_OUT}/.config"
          then
            echo "::error::CONFIG_CFI_PERMISSIVE must be disabled for the expected __cfi_slowpath symbol."
            exit 1
          fi

          grep -q \
            '^CONFIG_SHADOW_CALL_STACK=y$' \
            "${CONFIG_OUT}/.config"

          grep -q \
            '^CONFIG_KASAN=y$' \
            "${CONFIG_OUT}/.config"

          grep -q \
            '^CONFIG_KASAN_HW_TAGS=y$' \
            "${CONFIG_OUT}/.config"

          grep -q \
            '^CONFIG_MODULES=y$' \
            "${CONFIG_OUT}/.config"

          grep -q \
            '^CONFIG_MODVERSIONS=y$' \
            "${CONFIG_OUT}/.config"

          grep -q \
            '^CONFIG_KSU=y$' \
            "${CONFIG_OUT}/.config"

          grep -q \
            '^CONFIG_KSU_SUSFS=y$' \
            "${CONFIG_OUT}/.config"

          # ----------------------------------------------------------
          # Enable discovered SUSFS options.
          # ----------------------------------------------------------

          : > "${CONFIG_OUT}/susfs_extra.conf"

          while read -r sym; do

            case "${sym}" in
              KSU_SUSFS)
                continue
                ;;

              KSU_SUSFS_*)
                echo "CONFIG_${sym}=y" \
                  >> "${CONFIG_OUT}/susfs_extra.conf"
                ;;
            esac

          done < <(
            grep -RhoE \
              '^config[[:space:]]+KSU_SUSFS[A-Z0-9_]*' \
              drivers/kernelsu \
              2>/dev/null |
            awk '{print $2}' |
            sort -u
          )

          if [ -s \
            "${CONFIG_OUT}/susfs_extra.conf"
          ]; then

            cat \
              "${CONFIG_OUT}/susfs_extra.conf" \
              >> "${CONFIG_OUT}/.config"

            make \
              ARCH=arm64 \
              O="${CONFIG_OUT}" \
              olddefconfig

          fi

          # Recheck critical symbols after dependency resolution.

          grep -q \
            '^CONFIG_CFI_CLANG=y$' \
            "${CONFIG_OUT}/.config"

          grep -q \
            '^CONFIG_KASAN=y$' \
            "${CONFIG_OUT}/.config"

          grep -q \
            '^CONFIG_KASAN_HW_TAGS=y$' \
            "${CONFIG_OUT}/.config"

          grep -q \
            '^CONFIG_KSU=y$' \
            "${CONFIG_OUT}/.config"

          grep -q \
            '^CONFIG_KSU_SUSFS=y$' \
            "${CONFIG_OUT}/.config"

          # ----------------------------------------------------------
          # Save canonical defconfig OUTSIDE source tree.
          # ----------------------------------------------------------

          make \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            savedefconfig

          mkdir -p \
            arch/arm64/configs

          cp \
            "${CONFIG_OUT}/defconfig" \
            arch/arm64/configs/bg7n_defconfig

          echo "=== Final bg7n_defconfig ==="

          grep -E \
            '^CONFIG_(LTO_CLANG_FULL|CFI_CLANG|SHADOW_CALL_STACK|KASAN|KASAN_HW_TAGS|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS|KSU|KSU_SUSFS)=' \
            arch/arm64/configs/bg7n_defconfig \
            || true

          # ----------------------------------------------------------
          # Re-expand canonical defconfig and verify stability.
          # ----------------------------------------------------------

          rm -f \
            "${CONFIG_OUT}/.config"

          make \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            bg7n_defconfig

          cp \
            "${CONFIG_OUT}/.config" \
            "${CONFIG_OUT}/expanded.config"

          make \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            savedefconfig

          cmp -s \
            "${CONFIG_OUT}/defconfig" \
            arch/arm64/configs/bg7n_defconfig || {

            echo "::error::Canonical savedefconfig is not stable."

            diff -u \
              arch/arm64/configs/bg7n_defconfig \
              "${CONFIG_OUT}/defconfig" \
              || true

            exit 1
          }

          # ----------------------------------------------------------
          # Final mandatory config validation.
          # ----------------------------------------------------------

          for sym in \
            CONFIG_LTO_CLANG_FULL \
            CONFIG_CFI_CLANG \
            CONFIG_SHADOW_CALL_STACK \
            CONFIG_KASAN \
            CONFIG_KASAN_HW_TAGS \
            CONFIG_ARM64 \
            CONFIG_MODULES \
            CONFIG_MODVERSIONS \
            CONFIG_KALLSYMS \
            CONFIG_KALLSYMS_ALL \
            CONFIG_OVERLAY_FS \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS
          do

            grep -q \
              "^${sym}=y$" \
              "${CONFIG_OUT}/expanded.config" || {

              echo "::error::Missing ${sym} after final defconfig expansion."
              exit 1
            }

          done

          echo "=== Defconfig generation passed ==="

      # ============================================================
      # SAVE FINAL DEFCONFIG
      # ============================================================

      - name: Save final BG7n defconfig
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          test -f \
            arch/arm64/configs/bg7n_defconfig

          cp \
            arch/arm64/configs/bg7n_defconfig \
            "${GITHUB_WORKSPACE}/BG7n_final_defconfig"

          echo "=== Final defconfig SHA256 ==="

          sha256sum \
            "${GITHUB_WORKSPACE}/BG7n_final_defconfig"

      # ============================================================
      # GKI BUILD CONFIG
      # ==============================================================

      - name: Prepare GKI build config
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          cat > build.config.bg7n.ksu.susfs <<'CFG'
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.gki.aarch64

          DEFCONFIG=bg7n_defconfig

          KMI_ENFORCED=1
          KMI_SYMBOL_LIST_STRICT_MODE=1
          TRIM_NONLISTED_KMI=1

          MAKE_GOALS="${MAKE_GOALS}
          modules
          "
          CFG

          echo "=== build.config.bg7n.ksu.susfs ==="

          cat \
            build.config.bg7n.ksu.susfs

      # ============================================================
      # KMI PREFLIGHT
      # ==============================================================

      - name: Preflight GKI KMI baseline
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          echo "=== GKI KMI symbols of interest ==="

          for sym in \
            __cfi_slowpath \
            kasan_flag_enabled
          do

            echo "--- ${sym} ---"

            grep -Rhs \
              -E "^${sym}$" \
              common/android/abi_gki_aarch64 \
              common/android/abi_gki_aarch64_transsion \
              common/android/abi_gki_aarch64_generic \
              2>/dev/null |
              sort -u ||
              true

          done

          echo
          echo "=== Final defconfig KMI-critical settings ==="

          grep -E \
            '^CONFIG_(LTO_CLANG_FULL|CFI_CLANG|CFI_PERMISSIVE|SHADOW_CALL_STACK|KASAN|KASAN_HW_TAGS)=' \
            common/arch/arm64/configs/bg7n_defconfig \
            || true

          test ! -d common/include/config
          test ! -d common/include/generated
          test ! -d common/arch/arm64/include/generated
          test ! -f common/.config

          echo "=== KMI preflight passed ==="

      # ============================================================
      # SOURCE TREE CLEAN CHECK
      # ============================================================

      - name: Verify GKI source tree is clean before build
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          test ! -f .config
          test ! -f defconfig
          test ! -d include/config
          test ! -d include/generated
          test ! -d arch/arm64/include/generated

          test -L \
            drivers/kernelsu

          test -f \
            drivers/kernelsu/Kconfig

          test -f \
            drivers/kernelsu/Kbuild

          grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile

          test -f \
            arch/arm64/configs/bg7n_defconfig

          echo "=== Source tree clean ==="

      # ============================================================
      # BUILD KERNEL
      # ==============================================================

      - name: Build kernel with GKI KMI enforcement
        shell: bash
        working-directory: gki
        env:
          MAKE_JOBS: ${{ inputs.make_jobs }}
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-actions
        run: |
          set -euxo pipefail

          export MAKEFLAGS="-j${MAKE_JOBS}"

          # Fresh Google GKI output.
          rm -rf \
            out/android12-5.10

          # Final source tree checks.
          test ! -f common/.config
          test ! -f common/defconfig
          test ! -d common/include/config
          test ! -d common/include/generated
          test ! -d common/arch/arm64/include/generated

          echo "=== Starting GKI build ==="

          BUILD_CONFIG=common/build.config.bg7n.ksu.susfs \
            LTO=full \
            ./build/build.sh

      # ============================================================
      # VERIFY KERNEL/KMI
      # ============================================================

      - name: Verify kernel and collect ABI/KMI evidence
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          mkdir -p \
            ../artifact/kernel \
            ../artifact/reports

          IMAGE_LZ4="$(
            find out \
              -type f \
              -path '*/dist/Image.lz4' |
            head -n1 ||
            true
          )"

          IMAGE="$(
            find out \
              -type f \
              -path '*/dist/Image' |
            head -n1 ||
            true
          )"

          test -n "${IMAGE_LZ4}" || {
            echo "::error::Image.lz4 missing."
            exit 1
          }

          cp \
            "${IMAGE_LZ4}" \
            ../artifact/kernel/Image.lz4

          if [ -n "${IMAGE}" ]; then

            cp \
              "${IMAGE}" \
              ../artifact/kernel/Image

          else

            lz4 \
              -d \
              -f \
              "${IMAGE_LZ4}" \
              ../artifact/kernel/Image

          fi

          CONFIG_FILE="$(
            find out \
              -type f \
              -name .config |
            head -n1 ||
            true
          )"

          test -n "${CONFIG_FILE}"

          cp \
            "${CONFIG_FILE}" \
            ../artifact/kernel/.config

          MODULE_SYMVERS="$(
            find out \
              -type f \
              -name Module.symvers |
            head -n1 ||
            true
          )"

          if [ -n "${MODULE_SYMVERS}" ]; then
            cp \
              "${MODULE_SYMVERS}" \
              ../artifact/kernel/Module.symvers
          fi

          find out \
            -type f \
            -name System.map \
            -exec cp {} ../artifact/kernel/ \; \
            || true

          find out \
            -type f \
            -name modules.builtin \
            -exec cp {} ../artifact/kernel/ \; \
            || true

          find out \
            -type f \
            -name modules.builtin.modinfo \
            -exec cp {} ../artifact/kernel/ \; \
            || true

          echo "=== Final kernel configuration ==="

          grep -E \
            '^CONFIG_(LTO_CLANG_FULL|CFI_CLANG|CFI_PERMISSIVE|SHADOW_CALL_STACK|KASAN|KASAN_HW_TAGS|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS|KSU|KSU_SUSFS)=' \
            ../artifact/kernel/.config \
            || true

          echo "=== KMI symbols in Module.symvers ==="

          if [ -f ../artifact/kernel/Module.symvers ]; then

            grep \
              -E \
              '(^|[[:space:]])(__cfi_slowpath|kasan_flag_enabled)([[:space:]]|$)' \
              ../artifact/kernel/Module.symvers \
              || true

          fi

          {
            echo "=== Kernel version ==="

            make -s \
              -C common \
              kernelversion

            echo

            echo "=== GKI commit ==="

            git -C common rev-parse HEAD

            echo

            echo "=== KernelSU commit ==="

            git -C KernelSU rev-parse HEAD

            echo

            echo "=== SUSFS commit ==="

            git -C susfs rev-parse HEAD

            echo

            echo "=== Critical config ==="

            grep -E \
              '^CONFIG_(LTO_CLANG_FULL|CFI_CLANG|CFI_PERMISSIVE|SHADOW_CALL_STACK|KASAN|KASAN_HW_TAGS|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS|KSU|KSU_SUSFS)=' \
              ../artifact/kernel/.config \
              || true

            echo

            echo "=== KMI settings ==="

            grep -E \
              '^(KMI_ENFORCED|KMI_SYMBOL_LIST_STRICT_MODE|TRIM_NONLISTED_KMI)=' \
              common/build.config.bg7n.ksu.susfs \
              || true

            echo

            echo "=== Module.symvers symbol check ==="

            if [ -f ../artifact/kernel/Module.symvers ]; then

              grep \
                -E \
                '(^|[[:space:]])(__cfi_slowpath|kasan_flag_enabled)([[:space:]]|$)' \
                ../artifact/kernel/Module.symvers \
                || true

            fi

          } | tee \
            ../artifact/reports/kernel_verification.txt

          # ----------------------------------------------------------
          # Final hard checks.
          # ----------------------------------------------------------

          grep -q \
            '^CONFIG_CFI_CLANG=y$' \
            ../artifact/kernel/.config

          grep -q \
            '^CONFIG_KASAN=y$' \
            ../artifact/kernel/.config

          grep -q \
            '^CONFIG_KASAN_HW_TAGS=y$' \
            ../artifact/kernel/.config

          grep -q \
            '^CONFIG_KSU=y$' \
            ../artifact/kernel/.config

          grep -q \
            '^CONFIG_KSU_SUSFS=y$' \
            ../artifact/kernel/.config

          grep -q \
            '^CONFIG_MODULES=y$' \
            ../artifact/kernel/.config

          grep -q \
            '^CONFIG_MODVERSIONS=y$' \
            ../artifact/kernel/.config

      # ============================================================
      # SUSFS USERSPACE + MODULE
      # ============================================================

      - name: Build SUSFS userspace helper and KernelSU module
        shell: bash
        working-directory: gki/susfs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euxo pipefail

          export PATH="${ANDROID_NDK_HOME}:${PATH}"

          chmod +x \
            build_ksu_susfs_tool.sh \
            build_ksu_module.sh

          ./build_ksu_susfs_tool.sh

          ./build_ksu_module.sh

          test -d \
            ksu_module_susfs

          mkdir -p \
            ../../artifact/susfs

          cp -a \
            ksu_module_susfs \
            ../../artifact/susfs/susfs4ksu-module

          if [ -f ksu_module_susfs.zip ]; then

            cp \
              ksu_module_susfs.zip \
              ../../artifact/susfs/susfs4ksu.zip

          fi

      # ============================================================
      # REPACK BOOT
      # ============================================================

      - name: Repack stock boot.img with built kernel
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            work/boot \
            artifact/boot

          cp \
            stock/boot.img \
            work/boot/boot.img

          MAGISK_API="https://api.github.com/repos/topjohnwu/Magisk/releases/latest"

          MAGISK_URL="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "${MAGISK_API}" |
            jq -r '
              .assets[]
              | select(.name | startswith("Magisk-"))
              | select(.name | endswith(".apk"))
              | .browser_download_url
            ' |
            head -n1
          )"

          test -n "${MAGISK_URL}"

          curl -fL \
            "${MAGISK_URL}" \
            -o magisk.apk

          unzip -j -o \
            magisk.apk \
            'lib/arm64-v8a/libmagiskboot.so' \
            -d work

          mv \
            work/libmagiskboot.so \
            work/magiskboot

          chmod +x \
            work/magiskboot

          (
            cd work/boot

            ../magiskboot unpack boot.img

            test -f kernel

            test -f \
              ../../artifact/kernel/Image

            cp \
              ../../artifact/kernel/Image \
              kernel

            ../magiskboot repack boot.img

            test -s new-boot.img
          )

          cp \
            work/boot/new-boot.img \
            artifact/boot/BG7n-KSU-SUSFS-boot.img

          file \
            artifact/boot/BG7n-KSU-SUSFS-boot.img

          sha256sum \
            artifact/boot/BG7n-KSU-SUSFS-boot.img |
            tee artifact/reports/generated_boot.sha256

      # ============================================================
      # BUILD MANIFEST
      # ============================================================

      - name: Create build manifest and hashes
        shell: bash
        run: |
          set -euxo pipefail

          SUSFS_COMMIT="$(
            git -C gki/susfs rev-parse HEAD
          )"

          KSU_ACTUAL_COMMIT="$(
            git -C gki/KernelSU rev-parse HEAD
          )"

          COMMON_COMMIT="$(
            git -C gki/common rev-parse HEAD
          )"

          cat > artifact/BUILD_INFO.txt <<EOF
          DEVICE=${DEVICE}

          GOOGLE_GKI_MANIFEST_BRANCH=${GKI_MANIFEST_BRANCH}
          GOOGLE_GKI_COMMON_TAG=${GKI_COMMON_TAG}
          GOOGLE_GKI_VERSION=${GKI_VERSION}
          GOOGLE_GKI_SHA=${GKI_SHA}
          COMMON_COMMIT=${COMMON_COMMIT}

          KERNELSU_REPO=${KSU_REPO}
          KERNELSU_COMMIT=${KSU_ACTUAL_COMMIT}

          SUSFS_REPO=${SUSFS_REPO}
          SUSFS_REF=${{ inputs.susfs_ref }}
          SUSFS_COMMIT=${SUSFS_COMMIT}

          BOOT_RELEASE_REPO=${BOOT_REPO}
          BOOT_RELEASE_TAG=${{ inputs.boot_release_tag }}

          STOCK_BOOT_SHA256=$(cut -d' ' -f1 stock/boot.sha256)
          EOF

          cp \
            gki/manifest.lock.xml \
            artifact/manifest.lock.xml

          cp \
            stock/boot.sha256 \
            artifact/reports/stock_boot.sha256

          if [ -f BG7n_final_defconfig ]; then
            cp \
              BG7n_final_defconfig \
              artifact/kernel/bg7n_final_defconfig
          fi

          find artifact \
            -type f \
            ! -name SHA256SUMS.txt \
            -print0 |
            sort -z |
            xargs -0 sha256sum \
            > artifact/SHA256SUMS.txt

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package artifacts
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf \
            artifact/package

          mkdir -p \
            artifact/package

          cp \
            artifact/BUILD_INFO.txt \
            artifact/package/

          cp \
            artifact/SHA256SUMS.txt \
            artifact/package/

          cp -a \
            artifact/kernel \
            artifact/package/kernel

          cp -a \
            artifact/susfs \
            artifact/package/susfs

          cp -a \
            artifact/reports \
            artifact/package/reports

          if [ -d artifact/boot ]; then
            cp -a \
              artifact/boot \
              artifact/package/boot
          fi

          cp \
            BG7n_stock_defconfig \
            artifact/package/

          if [ -f BG7n_final_defconfig ]; then
            cp \
              BG7n_final_defconfig \
              artifact/package/
          fi

          cat > artifact/package/README.txt <<EOF
          TECNO BG7n / MT6765

          Google GKI:
            manifest branch ${GKI_MANIFEST_BRANCH}
            common tag ${GKI_COMMON_TAG}
            Linux ${GKI_VERSION}
            Commit ${GKI_SHA}

          KernelSU:
            repository ${KSU_REPO}
            exact commit ${KSU_ACTUAL_COMMIT}

          SUSFS:
            repository ${SUSFS_REPO}
            pinned commit ${{ inputs.susfs_ref }}

          Stock boot:
            ${BOOT_REPO}
            Release tag ${{ inputs.boot_release_tag }}

          Kernel KMI baseline:
            CONFIG_LTO_CLANG_FULL=y
            CONFIG_CFI_CLANG=y
            CONFIG_SHADOW_CALL_STACK=y
            CONFIG_KASAN=y
            CONFIG_KASAN_HW_TAGS=y

          KernelSU:
            CONFIG_KSU=y
            CONFIG_KSU_SUSFS=y

          Modules:
            CONFIG_MODULES=y
            CONFIG_MODVERSIONS=y

          KMI:
            KMI_ENFORCED=1
            KMI_SYMBOL_LIST_STRICT_MODE=1
            TRIM_NONLISTED_KMI=1

          IMPORTANT:
            Review kernel_verification.txt before flashing.

            Keep the original stock boot.img as the recovery path.
          EOF

          (
            cd artifact/package

            zip \
              -r \
              ../../BG7n_GKI_r3_KSU_SUSFS_artifacts.zip \
              .
          )

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload complete artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-GKI-r3-KSU-SUSFS
          path: |
            BG7n_GKI_r3_KSU_SUSFS_artifacts.zip
            artifact/
          if-no-files-found: error
          retention-days: 30

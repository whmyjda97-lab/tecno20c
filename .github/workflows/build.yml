name: بناء BG7n مع SUSFS و KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      - name: تحميل ملفات المشروع
        uses: actions/checkout@v4


      - name: تثبيت أدوات البناء
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libssl-dev \
            libelf-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            device-tree-compiler


      - name: تحميل مصدر النواة المطابق
        env:
          KERNEL_COMMIT: d09ef2e980e0974a0d6dfe762e29fff118db7f46
        run: |
          git init kernel

          cd kernel

          git remote add origin \
            https://android.googlesource.com/kernel/common

          git fetch --depth=1 origin "$KERNEL_COMMIT"

          git checkout --detach FETCH_HEAD

          echo "تم تحميل مصدر النواة."


      - name: تنظيف مصدر النواة قبل التعديل
        run: |
          make \
            -C kernel \
            ARCH=arm64 \
            mrproper

          rm -rf out

          mkdir -p out

          echo "تم تنظيف مصدر النواة ومجلد البناء."


      - name: تجهيز KernelSU-Next و SUSFS
        run: |
          mkdir -p work

          tar -xzf \
            KernelSU-Next.tar.gz \
            -C work

          tar -xzf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            -C work

          KSU_DIR="$(find work \
            -maxdepth 1 \
            -type d \
            -name 'KernelSU-Next-*' \
            | head -1)"

          SUSFS_DIR="work/susfs4ksu-gki-android12-5.10"

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"

          echo "SUSFS_DIR=$SUSFS_DIR" >> "$GITHUB_ENV"

          echo "KSU_DIR=$KSU_DIR"
          echo "SUSFS_DIR=$SUSFS_DIR"


      - name: إضافة KernelSU-Next إلى النواة
        run: |
          cd kernel

          bash \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/setup.sh"

          test -d drivers/kernelsu

          echo "تم تثبيت KernelSU-Next بنجاح."


      - name: التحقق من تكامل SUSFS داخل KernelSU-Next
        run: |
          test -f \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/Kconfig"

          grep -q \
            'menu "KernelSU - SUSFS"' \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/Kconfig"

          grep -q \
            'CONFIG_KSU_SUSFS' \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/Kbuild"

          echo "تم التحقق من تكامل SUSFS."

          echo "لن يتم تطبيق patch تكامل KernelSU القديم."


      - name: تطبيق Patch الخاص بـ BG7n و SUSFS
        run: |
          cd kernel

          patch -p1 --fuzz=0 \
            < "$GITHUB_WORKSPACE/patches-susfs-bg7n.patch"

          echo "تم تطبيق Patch الخاص بـ BG7n."


      - name: تثبيت ملفات SUSFS
        run: |
          cp \
            "$SUSFS_DIR/kernel_patches/fs/susfs.c" \
            kernel/fs/susfs.c

          cp \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" \
            kernel/include/linux/susfs.h

          cp \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" \
            kernel/include/linux/susfs_def.h

          echo "تم تثبيت ملفات SUSFS."


      - name: نسخ إعداد النواة إلى مجلد البناء
        run: |
          cp \
            stock.config \
            out/.config

          test -s out/.config

          echo "تم وضع stock.config داخل out/.config."


      - name: تفعيل KernelSU و SUSFS
        run: |
          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_PATH

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_NATIVE_APP

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS_SUS_MAP

          scripts/config \
            --file out/.config \
            --disable CONFIG_TRIM_UNUSED_KSYMS \
            || true

          scripts/config \
            --file out/.config \
            --disable CONFIG_UNUSED_KSYMS \
            || true

          echo "تم تفعيل خيارات KernelSU و SUSFS."


      - name: إنشاء إعداد البناء النهائي
        run: |
          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            olddefconfig

          test -s out/.config

          echo "تم إنشاء الإعداد النهائي."


      - name: بناء Kernel Image
        run: |
          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" \
            Image


      - name: التحقق من Kernel Image
        run: |
          test -s \
            out/arch/arm64/boot/Image

          file \
            out/arch/arm64/boot/Image

          ls -lh \
            out/arch/arm64/boot/Image

          echo "تم بناء Kernel Image بنجاح."


      - name: تحميل أداة Magiskboot
        run: |
          mkdir -p tools

          wget -q -O \
            tools/magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.apk

          unzip -p \
            tools/magisk.apk \
            lib/x86_64/libmagiskboot.so \
            > tools/magiskboot

          chmod +x tools/magiskboot

          tools/magiskboot --help >/dev/null

          echo "تم تجهيز Magiskboot."


      - name: تحميل boot.img الأصلي
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: stock-boot
        run: |
          mkdir -p bootwork

          gh release download \
            "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "boot.img.zip" \
            --dir bootwork

          test -s \
            bootwork/boot.img.zip

          echo "تم تحميل boot.img.zip."


      - name: فك ضغط boot.img
        run: |
          unzip -o \
            bootwork/boot.img.zip \
            -d bootwork

          test -s \
            bootwork/boot.img

          echo "تم استخراج boot.img."


      - name: فك boot.img الأصلي
        run: |
          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            unpack boot.img

          test -s kernel

          echo "تم فك boot.img."


      - name: استبدال Kernel الأصلي
        run: |
          cp \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" \
            bootwork/kernel

          test -s \
            bootwork/kernel

          echo "تم استبدال Kernel الأصلي بالـKernel الجديد."


      - name: إعادة بناء boot.img
        run: |
          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            repack boot.img

          test -s new-boot.img

          mv \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

          echo "تم إنشاء boot-BG7n-SUSFS-KSU.img."


      - name: التحقق النهائي من boot.img
        run: |
          test -s \
            boot-BG7n-SUSFS-KSU.img

          ls -lh \
            boot-BG7n-SUSFS-KSU.img

          sha256sum \
            boot-BG7n-SUSFS-KSU.img


      - name: تجهيز مصدر وحدة SUSFS
        run: |
          cd "$SUSFS_DIR"

          tar -czf \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz" \
            ksu_module_susfs


      - name: رفع الملفات الناتجة
        uses: actions/upload-artifact@v4

        with:
          name: BG7n-SUSFS-KSU-build

          path: |
            boot-BG7n-SUSFS-KSU.img
            out/arch/arm64/boot/Image
            out/.config
            susfs-module-source.tar.gz
            patches-susfs-bg7n.patch

          if-no-files-found: error

          retention-days: 14

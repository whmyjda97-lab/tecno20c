name: "Build BG7n GKI r3 + KernelSU + SUSFS"

on:
  workflow_dispatch:
    inputs:
      susfs_ref:
        description: "Pinned SUSFS commit for android12-5.10"
        required: false
        default: "be08face56c347e7ba9c4fb420c2463598a14f5d"

      make_jobs:
        description: "Kernel build jobs"
        required: false
        default: "4"

      boot_release_tag:
        description: "GitHub Release tag containing stock BG7n boot.img.zip"
        required: false
        default: "stock-boot"

permissions:
  contents: read

concurrency:
  group: bg7n-${{ github.ref }}
  cancel-in-progress: true

env:
  # ==============================================================
  # GOOGLE GKI
  # ==============================================================

  GKI_MANIFEST_BRANCH: common-android12-5.10-2025-06
  GKI_COMMON_TAG: android12-5.10-2025-06_r3
  GKI_VERSION: "5.10.237"
  GKI_SHA: d09ef2e980e0974a0d6dfe762e29fff118db7f46

  # ==============================================================
  # KERNELSU
  # ==============================================================

  KSU_REPO: https://github.com/5ec1cff/KernelSU.git
  KSU_COMMIT: 3be1013dbda6ebab14e7fcd231bcbae5ce6425ff

  # ==============================================================
  # SUSFS
  # ==============================================================

  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git

  # ==============================================================
  # DEVICE
  # ==============================================================

  BOOT_REPO: whmyjda97-lab/tecno20c
  DEVICE: BG7n
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # 01 - CHECKOUT
      # ============================================================

      - name: 01 - Checkout build kit
        uses: actions/checkout@v4

      # ============================================================
      # 02 - HOST DEPENDENCIES
      # ============================================================

      - name: 02 - Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            curl \
            device-tree-compiler \
            dwarves \
            file \
            flex \
            gawk \
            gh \
            git \
            gnupg \
            gperf \
            jq \
            libdw-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5-dev \
            libssl-dev \
            libunwind-dev \
            lld \
            llvm \
            lz4 \
            openssl \
            pahole \
            patchelf \
            pkg-config \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zip \
            android-sdk-libsparse-utils

          echo "=== HOST ARCHITECTURE ==="
          uname -m
          dpkg --print-architecture

          echo "=== TOOLCHAIN ==="
          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-nm --version

          echo "=== TOOLS ==="
          python3 --version
          git --version
          gh --version

      # ============================================================
      # 03 - ANDROID NDK
      # ============================================================

      - name: 03 - Install Android NDK r25b
        shell: bash
        run: |
          set -euxo pipefail

          NDK_VERSION="25.2.9519653"
          NDK_ARCHIVE="android-ndk-r25b-linux.zip"

          SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          NDK_ROOT="${SDK_ROOT}/ndk/${NDK_VERSION}"

          rm -rf \
            "${SDK_ROOT}" \
            "${RUNNER_TEMP}/android-ndk"

          mkdir -p \
            "${SDK_ROOT}/ndk" \
            "${RUNNER_TEMP}/android-ndk"

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "https://dl.google.com/android/repository/${NDK_ARCHIVE}" \
            -o "${RUNNER_TEMP}/${NDK_ARCHIVE}"

          unzip -q \
            "${RUNNER_TEMP}/${NDK_ARCHIVE}" \
            -d "${RUNNER_TEMP}/android-ndk"

          test -d \
            "${RUNNER_TEMP}/android-ndk/android-ndk-r25b"

          mv \
            "${RUNNER_TEMP}/android-ndk/android-ndk-r25b" \
            "${NDK_ROOT}"

          test -x \
            "${NDK_ROOT}/ndk-build"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${NDK_ROOT}" >> "${GITHUB_ENV}"

          echo "${NDK_ROOT}" >> "${GITHUB_PATH}"

          "${NDK_ROOT}/ndk-build" --version

      # ============================================================
      # 04 - FETCH STOCK BOOT
      # ============================================================

      - name: 04 - Fetch exact stock BG7n boot image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOT_RELEASE_TAG: ${{ inputs.boot_release_tag }}
        run: |
          set -euo pipefail

          rm -rf \
            stock-release \
            stock

          mkdir -p \
            stock-release \
            stock

          echo "=== RELEASE ==="

          gh release view \
            "${BOOT_RELEASE_TAG}" \
            --repo "${BOOT_REPO}" \
            --json tagName,name,assets \
            --jq '.tagName + " | " + .name + " | assets=" + ((.assets|length)|tostring)'

          gh release download \
            "${BOOT_RELEASE_TAG}" \
            --repo "${BOOT_REPO}" \
            --dir stock-release

          CANDIDATES=()

          while IFS= read -r -d '' z; do

            mapfile -t ENTRIES < <(
              unzip -Z1 "$z" 2>/dev/null |
              grep -Ei '(^|/)boot\.img$' ||
              true
            )

            if [ "${#ENTRIES[@]}" -eq 1 ]; then
              CANDIDATES+=("$z")

              echo "Boot candidate:"
              echo "  ZIP:    $z"
              echo "  MEMBER: ${ENTRIES[0]}"
            fi

          done < <(
            find stock-release \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              -print0
          )

          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ZIP containing exactly one boot.img."

            echo "Candidates:"
            printf '%s\n' \
              "${CANDIDATES[@]:-<none>}"

            exit 1
          fi

          BOOT_ASSET="${CANDIDATES[0]}"

          mapfile -t BOOT_ENTRIES < <(
            unzip -Z1 "${BOOT_ASSET}" |
            grep -Ei '(^|/)boot\.img$'
          )

          unzip -p \
            "${BOOT_ASSET}" \
            "${BOOT_ENTRIES[0]}" \
            > stock/boot.img

          test -s \
            stock/boot.img

          echo "=== STOCK BOOT ==="

          file \
            stock/boot.img

          sha256sum \
            stock/boot.img |
            tee \
              stock/boot.sha256

      # ============================================================
      # 05 - STOCK DEFCONFIG
      # ============================================================

      - name: 05 - Verify BG7n stock defconfig
        shell: bash
        run: |
          set -euxo pipefail

          test -s \
            BG7n_stock_defconfig

          echo "=== BG7n stock defconfig SHA256 ==="

          sha256sum \
            BG7n_stock_defconfig

          echo
          echo "=== Stock config facts ==="

          grep -E \
            '^CONFIG_(ARM64_4K_PAGES|ARM64_16K_PAGES|ARM64_64K_PAGES|ARM64_VA_BITS_[0-9]+|ARM64_PA_BITS_[0-9]+|LTO_NONE|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|CFI_CLANG|CFI_PERMISSIVE|CFI_CLANG_SHADOW|SHADOW_CALL_STACK|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS|TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST)=' \
            BG7n_stock_defconfig \
            || true

      # ============================================================
      # 06 - REPO
      # ============================================================

      - name: 06 - Install repo tool
        shell: bash
        run: |
          set -euxo pipefail

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o repo

          chmod +x \
            repo

          sudo install \
            -m 0755 \
            repo \
            /usr/local/bin/repo

          repo --version

      # ============================================================
      # 07 - GOOGLE GKI
      # ============================================================

      - name: 07 - Sync exact Google GKI r3 source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf \
            gki

          mkdir -p \
            gki

          cd \
            gki

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${GKI_MANIFEST_BRANCH}" \
            --depth=1

          repo sync \
            -c \
            -j2 \
            --no-tags \
            --no-clone-bundle

          test -d \
            common

          test -f \
            common/Makefile

          git -C common fetch \
            --no-tags \
            https://android.googlesource.com/kernel/common.git \
            "refs/tags/${GKI_COMMON_TAG}:refs/tags/${GKI_COMMON_TAG}"

          git -C common checkout \
            --detach \
            "refs/tags/${GKI_COMMON_TAG}"

          COMMON_COMMIT="$(
            git -C common rev-parse HEAD
          )"

          echo "EXPECTED:"
          echo "${GKI_SHA}"

          echo
          echo "ACTUAL:"
          echo "${COMMON_COMMIT}"

          test \
            "${COMMON_COMMIT}" = \
            "${GKI_SHA}"

          test \
            "$(make -s -C common kernelversion)" = \
            "${GKI_VERSION}"

          repo manifest -r \
            > manifest.lock.xml

          cat > \
            ../gki_identity.txt \
            <<EOF
          GKI_MANIFEST_BRANCH=${GKI_MANIFEST_BRANCH}
          GKI_COMMON_TAG=${GKI_COMMON_TAG}
          GKI_VERSION=${GKI_VERSION}
          GKI_SHA=${GKI_SHA}
          COMMON_COMMIT=${COMMON_COMMIT}
          EOF

      # ============================================================
      # 08 - GOOGLE LLVM
      # ============================================================

      - name: 08 - Select exact Google GKI LLVM
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          CLANG_PREBUILT_BIN="$(
            awk -F= '
              /^CLANG_PREBUILT_BIN=/ {
                print $2
                exit
              }
            ' common/build.config.common
          )"

          test -n \
            "${CLANG_PREBUILT_BIN}"

          GKI_CLANG_BIN="${PWD}/${CLANG_PREBUILT_BIN}"

          test -x \
            "${GKI_CLANG_BIN}/clang"

          test -x \
            "${GKI_CLANG_BIN}/ld.lld"

          test -x \
            "${GKI_CLANG_BIN}/llvm-ar"

          test -x \
            "${GKI_CLANG_BIN}/llvm-nm"

          echo "GKI_CLANG_BIN=${GKI_CLANG_BIN}" \
            >> "${GITHUB_ENV}"

          echo "LLVM=1" \
            >> "${GITHUB_ENV}"

          echo "LLVM_IAS=1" \
            >> "${GITHUB_ENV}"

          echo "${GKI_CLANG_BIN}" \
            >> "${GITHUB_PATH}"

          echo "=== GOOGLE LLVM ==="

          "${GKI_CLANG_BIN}/clang" --version
          "${GKI_CLANG_BIN}/ld.lld" --version
          "${GKI_CLANG_BIN}/llvm-ar" --version
          "${GKI_CLANG_BIN}/llvm-nm" --version

      # ============================================================
      # 09 - KERNELSU
      # ============================================================

      - name: 09 - Install exact KernelSU
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          rm -rf \
            KernelSU

          git clone \
            --no-tags \
            --filter=blob:none \
            "${KSU_REPO}" \
            KernelSU

          git -C KernelSU fetch \
            --no-tags \
            origin \
            "${KSU_COMMIT}"

          git -C KernelSU checkout \
            --detach \
            "${KSU_COMMIT}"

          ACTUAL_KSU_COMMIT="$(
            git -C KernelSU rev-parse HEAD
          )"

          test \
            "${ACTUAL_KSU_COMMIT}" = \
            "${KSU_COMMIT}"

          test -f \
            KernelSU/kernel/Kconfig

          test -f \
            KernelSU/kernel/Kbuild

          echo "=== KernelSU ==="

          git -C KernelSU log \
            -1 \
            --oneline \
            --decorate

          {
            echo "KERNELSU_REPO=${KSU_REPO}"
            echo "KERNELSU_COMMIT=${ACTUAL_KSU_COMMIT}"
          } | tee \
            ../kernelsu_identity.txt

      # ============================================================
      # 10 - SUSFS
      # ============================================================

      - name: 10 - Clone and verify pinned SUSFS
        shell: bash
        working-directory: gki
        env:
          SUSFS_REF: ${{ inputs.susfs_ref }}
        run: |
          set -euxo pipefail

          rm -rf \
            susfs

          git clone \
            --no-tags \
            --filter=blob:none \
            "${SUSFS_REPO}" \
            susfs

          git -C susfs fetch \
            --no-tags \
            origin \
            "${SUSFS_REF}"

          git -C susfs checkout \
            --detach \
            "${SUSFS_REF}"

          SUSFS_COMMIT="$(
            git -C susfs rev-parse HEAD
          )"

          test \
            "${SUSFS_COMMIT}" = \
            "${SUSFS_REF}"

          test -f \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          test -f \
            susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          test -d \
            susfs/kernel_patches/fs

          test -d \
            susfs/kernel_patches/include/linux

          test -f \
            susfs/ksu_module_susfs/module.prop

          grep -Eq \
            '^version=v?2\.2\.0($|[.-])' \
            susfs/ksu_module_susfs/module.prop

          echo "=== SUSFS ==="

          git -C susfs log \
            -1 \
            --oneline \
            --decorate

          {
            echo "SUSFS_REPO=${SUSFS_REPO}"
            echo "SUSFS_COMMIT=${SUSFS_COMMIT}"
          } | tee \
            ../susfs_identity.txt

      # ============================================================
      # 11 - APPLY SUSFS
      # ============================================================

      - name: 11 - Apply SUSFS patches
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          cp \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            KernelSU/

          cp \
            susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            common/

          cp -a \
            susfs/kernel_patches/fs/. \
            common/fs/

          cp -a \
            susfs/kernel_patches/include/linux/. \
            common/include/linux/

          (
            cd KernelSU

            patch \
              --batch \
              --forward \
              -p1 \
              < 10_enable_susfs_for_ksu.patch
          )

          (
            cd common

            patch \
              --batch \
              --forward \
              -p1 \
              < 50_add_susfs_in_gki-android12-5.10.patch
          )

          echo "=== KernelSU changes ==="

          git -C KernelSU status \
            --short

          echo
          echo "=== GKI changes ==="

          git -C common status \
            --short

      # ============================================================
      # 12 - KSU INTEGRATION
      # ============================================================

      - name: 12 - Integrate KernelSU
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          test -f \
            KernelSU/kernel/Kconfig

          test -f \
            KernelSU/kernel/Kbuild

          rm -rf \
            common/drivers/kernelsu

          KSU_RELATIVE="$(
            realpath \
              --relative-to=common/drivers \
              KernelSU/kernel
          )"

          ln -s \
            "${KSU_RELATIVE}" \
            common/drivers/kernelsu

          test -L \
            common/drivers/kernelsu

          test -f \
            common/drivers/kernelsu/Kconfig

          test -f \
            common/drivers/kernelsu/Kbuild

          if ! grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            common/drivers/Makefile
          then
            printf '%s\n' \
              'obj-$(CONFIG_KSU) += kernelsu/' \
              >> common/drivers/Makefile
          fi

          if ! grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            common/drivers/Kconfig
          then

            python3 - <<'PY'
          from pathlib import Path

          p = Path("common/drivers/Kconfig")
          text = p.read_text()

          source = 'source "drivers/kernelsu/Kconfig"\n'

          if source not in text:
              pos = text.rfind("endmenu")

              if pos < 0:
                  raise SystemExit(
                      "ERROR: drivers/Kconfig has no endmenu"
                  )

              text = (
                  text[:pos]
                  + source
                  + "\n"
                  + text[pos:]
              )

              p.write_text(text)
          PY

          fi

          grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            common/drivers/Kconfig

          grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            common/drivers/Makefile

          grep -Rqs \
            '^config[[:space:]]\+KSU\([[:space:]]\|$\)' \
            common/drivers/kernelsu

          grep -Rqs \
            '^config[[:space:]]\+KSU_SUSFS\([[:space:]]\|$\)' \
            common/drivers/kernelsu

          echo "KernelSU integration OK"

      # ============================================================
      # 13 - CLEAN GENERATED CONFIG
      # ============================================================

      - name: 13 - Remove stale generated configuration
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          rm -f \
            .config \
            defconfig

          rm -rf \
            include/config \
            include/generated \
            arch/arm64/include/generated

          test ! -f \
            .config

          test ! -f \
            defconfig

      # ============================================================
      # 14 - GENERATE DEFCONFIG
      # ============================================================

      - name: 14 - Generate BG7n KSU SUSFS defconfig
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          STOCK_CONFIG="${GITHUB_WORKSPACE}/BG7n_stock_defconfig"
          GKI_BASE_CONFIG="${PWD}/arch/arm64/configs/gki_defconfig"
          CONFIG_OUT="${RUNNER_TEMP}/bg7n-kconfig"

          test -s \
            "${STOCK_CONFIG}"

          test -s \
            "${GKI_BASE_CONFIG}"

          rm -rf \
            "${CONFIG_OUT}"

          mkdir -p \
            "${CONFIG_OUT}"

          # ----------------------------------------------------------
          # Protected symbols
          # ----------------------------------------------------------

          cat > \
            "${CONFIG_OUT}/protected.symbols" \
            <<'EOF'
          CONFIG_LTO_NONE
          CONFIG_LTO_CLANG
          CONFIG_LTO_CLANG_FULL
          CONFIG_LTO_CLANG_THIN
          CONFIG_CFI_CLANG
          CONFIG_CFI_PERMISSIVE
          CONFIG_CFI_CLANG_SHADOW
          CONFIG_SHADOW_CALL_STACK
          CONFIG_KASAN
          CONFIG_KASAN_GENERIC
          CONFIG_KASAN_SW_TAGS
          CONFIG_KASAN_HW_TAGS
          CONFIG_ARM64_MTE
          CONFIG_ARM64_TAGGED_ADDR_ABI
          CONFIG_MODULES
          CONFIG_MODVERSIONS
          CONFIG_KALLSYMS
          CONFIG_KALLSYMS_ALL
          CONFIG_OVERLAY_FS
          CONFIG_GCOV_KERNEL
          CONFIG_FTRACE_MCOUNT_USE_RECORDMCOUNT
          CONFIG_TRIM_UNUSED_KSYMS
          CONFIG_UNUSED_KSYMS_WHITELIST
          EOF

          # ----------------------------------------------------------
          # Filter stock config
          # ----------------------------------------------------------

          python3 - \
            "${CONFIG_OUT}/protected.symbols" \
            "${STOCK_CONFIG}" \
            "${CONFIG_OUT}/bg7n_stock.filtered" \
            <<'PY'
          import re
          import sys
          from pathlib import Path

          protected = {
              x.strip()
              for x in Path(sys.argv[1]).read_text().splitlines()
              if x.strip()
          }

          stock = Path(sys.argv[2])
          output = Path(sys.argv[3])

          config_re = re.compile(
              r"^CONFIG_[A-Z0-9_]+="
          )

          unset_re = re.compile(
              r"^# CONFIG_[A-Z0-9_]+ is not set$"
          )

          kept = []

          for line in stock.read_text().splitlines():

              if config_re.match(line):

                  sym = line.split(
                      "=",
                      1
                  )[0]

                  if sym in protected:
                      continue

              elif unset_re.match(line):

                  sym = (
                      line[2:]
                      .split(
                          " is not set",
                          1
                      )[0]
                  )

                  if sym in protected:
                      continue

              kept.append(line)

          output.write_text(
              "\n".join(kept) + "\n"
          )

          print(
              f"Filtered stock config: {len(kept)} lines"
          )
          PY

          # ----------------------------------------------------------
          # Merge GKI base + device-specific config
          # ----------------------------------------------------------

          cp \
            "${GKI_BASE_CONFIG}" \
            "${CONFIG_OUT}/gki_base.config"

          ./scripts/kconfig/merge_config.sh \
            -m \
            -r \
            -O "${CONFIG_OUT}" \
            "${CONFIG_OUT}/gki_base.config" \
            "${CONFIG_OUT}/bg7n_stock.filtered"

          test -s \
            "${CONFIG_OUT}/.config"

          # ----------------------------------------------------------
          # Remove GKI unused-symbol trimming
          # ----------------------------------------------------------

          scripts/config \
            --file "${CONFIG_OUT}/.config" \
            -d TRIM_UNUSED_KSYMS \
            -d UNUSED_KSYMS_WHITELIST

          # ----------------------------------------------------------
          # Enable KSU + SUSFS
          # ----------------------------------------------------------

          scripts/config \
            --file "${CONFIG_OUT}/.config" \
            -e KSU \
            -e KSU_SUSFS

          # ----------------------------------------------------------
          # Resolve Kconfig
          # ----------------------------------------------------------

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            olddefconfig

          echo
          echo "=== RESOLVED CONFIG ==="

          grep -E \
            '^CONFIG_(KSU|KSU_SUSFS|TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|THREAD_INFO_IN_TASK|KPROBES|EXT4_FS)=' \
            "${CONFIG_OUT}/.config" \
            || true

          # ----------------------------------------------------------
          # Required symbols
          # ----------------------------------------------------------

          for sym in \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_MODULES \
            CONFIG_MODVERSIONS \
            CONFIG_KALLSYMS \
            CONFIG_KALLSYMS_ALL
          do
            grep -q \
              "^${sym}=y$" \
              "${CONFIG_OUT}/.config" || {
                echo "::error::Missing ${sym}"
                exit 1
            }
          done

          # ----------------------------------------------------------
          # Symbol trimming must stay disabled
          # ----------------------------------------------------------

          if grep -q \
            '^CONFIG_TRIM_UNUSED_KSYMS=y$' \
            "${CONFIG_OUT}/.config"
          then
            echo "::error::CONFIG_TRIM_UNUSED_KSYMS is enabled"
            exit 1
          fi

          if grep -q \
            '^CONFIG_UNUSED_KSYMS_WHITELIST=' \
            "${CONFIG_OUT}/.config"
          then
            echo "::error::CONFIG_UNUSED_KSYMS_WHITELIST is set"
            exit 1
          fi

          echo
          echo "=== KSU/SUSFS CONFIGURATION OK ==="

          # ----------------------------------------------------------
          # Generate canonical minimal defconfig
          # ----------------------------------------------------------

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            savedefconfig

          cp \
            "${CONFIG_OUT}/defconfig" \
            arch/arm64/configs/bg7n_defconfig

          test -s \
            arch/arm64/configs/bg7n_defconfig

          # ----------------------------------------------------------
          # Re-expand the defconfig
          # ----------------------------------------------------------

          rm -f \
            "${CONFIG_OUT}/.config"

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CONFIG_OUT}" \
            bg7n_defconfig

          cp \
            "${CONFIG_OUT}/.config" \
            "${CONFIG_OUT}/expanded.config"

          for sym in \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_MODULES \
            CONFIG_MODVERSIONS \
            CONFIG_KALLSYMS
          do
            grep -q \
              "^${sym}=y$" \
              "${CONFIG_OUT}/expanded.config" || {
                echo "::error::Missing ${sym} after defconfig expansion"
                exit 1
            }
          done

          if grep -q \
            '^CONFIG_TRIM_UNUSED_KSYMS=y$' \
            "${CONFIG_OUT}/expanded.config"
          then
            echo "::error::TRIM_UNUSED_KSYMS returned after expansion"
            exit 1
          fi

          if grep -q \
            '^CONFIG_UNUSED_KSYMS_WHITELIST=' \
            "${CONFIG_OUT}/expanded.config"
          then
            echo "::error::UNUSED_KSYMS_WHITELIST returned after expansion"
            exit 1
          fi

          echo
          echo "=== DEFCONFIG GENERATION PASSED ==="

      # ============================================================
      # 15 - SAVE FINAL DEFCONFIG
      # ============================================================

      - name: 15 - Save final BG7n defconfig
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          test -s \
            arch/arm64/configs/bg7n_defconfig

          cp \
            arch/arm64/configs/bg7n_defconfig \
            "${GITHUB_WORKSPACE}/BG7n_final_defconfig"

          sha256sum \
            "${GITHUB_WORKSPACE}/BG7n_final_defconfig"

      # ============================================================
      # 16 - BUILD CONFIG
      # ============================================================

      - name: 16 - Prepare BG7n build config
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          cat > \
            build.config.bg7n.ksu.susfs \
            <<'CFG'
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.gki.aarch64

          DEFCONFIG=bg7n_defconfig

          KMI_ENFORCED=0
          KMI_SYMBOL_LIST_STRICT_MODE=0
          TRIM_NONLISTED_KMI=0

          KMI_SYMBOL_LIST=android/abi_gki_aarch64

          POST_DEFCONFIG_CMDS="update_bg7n_config"

          function update_bg7n_config() {

              ${KERNEL_DIR}/scripts/config \
                  --file ${OUT_DIR}/.config \
                  -d TRIM_UNUSED_KSYMS \
                  -d UNUSED_KSYMS_WHITELIST \
                  -e KSU \
                  -e KSU_SUSFS

              (
                  cd ${OUT_DIR}

                  make \
                      O=${OUT_DIR} \
                      ${TOOL_ARGS} \
                      ${MAKE_ARGS} \
                      olddefconfig
              )

              echo "=== POST DEFCONFIG ==="

              grep -E \
                  '^CONFIG_(KSU|KSU_SUSFS|TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL)=' \
                  ${OUT_DIR}/.config \
                  || true

              grep -q \
                  '^CONFIG_KSU=y$' \
                  ${OUT_DIR}/.config

              grep -q \
                  '^CONFIG_KSU_SUSFS=y$' \
                  ${OUT_DIR}/.config

              grep -q \
                  '^CONFIG_MODULES=y$' \
                  ${OUT_DIR}/.config

              grep -q \
                  '^CONFIG_MODVERSIONS=y$' \
                  ${OUT_DIR}/.config

              grep -q \
                  '^CONFIG_KALLSYMS=y$' \
                  ${OUT_DIR}/.config

              if grep -q \
                  '^CONFIG_TRIM_UNUSED_KSYMS=y$' \
                  ${OUT_DIR}/.config
              then
                  echo "::error::TRIM_UNUSED_KSYMS is enabled"
                  exit 1
              fi

              if grep -q \
                  '^CONFIG_UNUSED_KSYMS_WHITELIST=' \
                  ${OUT_DIR}/.config
              then
                  echo "::error::UNUSED_KSYMS_WHITELIST is configured"
                  exit 1
              fi
          }

          MAKE_GOALS="${MAKE_GOALS}
          Image
          Image.lz4
          modules
          "
          CFG

          echo "=== BUILD CONFIG ==="

          cat \
            build.config.bg7n.ksu.susfs

      # ============================================================
      # 17 - FINAL PREBUILD CHECK
      # ============================================================

      - name: 17 - Verify final configuration before build
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          CHECK_OUT="${RUNNER_TEMP}/bg7n-final-check"

          rm -rf \
            "${CHECK_OUT}"

          mkdir -p \
            "${CHECK_OUT}"

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            AR="${GKI_CLANG_BIN}/llvm-ar" \
            NM="${GKI_CLANG_BIN}/llvm-nm" \
            ARCH=arm64 \
            O="${CHECK_OUT}" \
            bg7n_defconfig

          scripts/config \
            --file "${CHECK_OUT}/.config" \
            -d TRIM_UNUSED_KSYMS \
            -d UNUSED_KSYMS_WHITELIST \
            -e KSU \
            -e KSU_SUSFS

          (
            cd "${CHECK_OUT}"

            make \
              O="${CHECK_OUT}" \
              LLVM=1 \
              LLVM_IAS=1 \
              AR="${GKI_CLANG_BIN}/llvm-ar" \
              NM="${GKI_CLANG_BIN}/llvm-nm" \
              olddefconfig
          )

          echo "=== FINAL CONFIG ==="

          grep -E \
            '^CONFIG_(KSU|KSU_SUSFS|TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|THREAD_INFO_IN_TASK)=' \
            "${CHECK_OUT}/.config" \
            || true

          for sym in \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_MODULES \
            CONFIG_MODVERSIONS \
            CONFIG_KALLSYMS
          do
            grep -q \
              "^${sym}=y$" \
              "${CHECK_OUT}/.config"
          done

          ! grep -q \
            '^CONFIG_TRIM_UNUSED_KSYMS=y$' \
            "${CHECK_OUT}/.config"

          ! grep -q \
            '^CONFIG_UNUSED_KSYMS_WHITELIST=' \
            "${CHECK_OUT}/.config"

          echo "Pre-build configuration OK."

      # ============================================================
      # 18 - SOURCE TREE CHECK
      # ============================================================

      - name: 18 - Verify GKI source tree
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          test -L \
            drivers/kernelsu

          test -f \
            drivers/kernelsu/Kconfig

          test -f \
            drivers/kernelsu/Kbuild

          grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile

          test -s \
            arch/arm64/configs/bg7n_defconfig

      # ============================================================
      # 19 - BUILD KERNEL
      # ============================================================

      - name: 19 - Build BG7n kernel
        shell: bash
        working-directory: gki
        env:
          MAKE_JOBS: ${{ inputs.make_jobs }}
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-actions
        run: |
          set -euxo pipefail

          case "${MAKE_JOBS}" in
            ''|*[!0-9]*)
              echo "::error::make_jobs must be a positive integer"
              exit 1
              ;;
          esac

          test \
            "${MAKE_JOBS}" -ge 1

          export MAKEFLAGS="-j${MAKE_JOBS}"

          rm -rf \
            out/android12-5.10

          echo "=== BUILD CONFIG ==="

          grep -E \
            '^(DEFCONFIG|KMI_ENFORCED|KMI_SYMBOL_LIST_STRICT_MODE|TRIM_NONLISTED_KMI|KMI_SYMBOL_LIST)=' \
            common/build.config.bg7n.ksu.susfs \
            || true

          echo
          echo "=== START KERNEL BUILD ==="

          BUILD_CONFIG=common/build.config.bg7n.ksu.susfs \
            ./build/build.sh

      # ============================================================
      # 20 - VERIFY KERNEL
      # ============================================================

      - name: 20 - Verify kernel and collect evidence
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          mkdir -p \
            ../artifact/kernel \
            ../artifact/reports

          IMAGE_LZ4="$(
            find out \
              -type f \
              -path '*/dist/Image.lz4' |
            head -n1 ||
            true
          )"

          IMAGE="$(
            find out \
              -type f \
              -path '*/dist/Image' |
            head -n1 ||
            true
          )"

          test -n \
            "${IMAGE_LZ4}"

          cp \
            "${IMAGE_LZ4}" \
            ../artifact/kernel/Image.lz4

          if [ -n "${IMAGE}" ]; then

            cp \
              "${IMAGE}" \
              ../artifact/kernel/Image

          else

            lz4 \
              -d \
              -f \
              "${IMAGE_LZ4}" \
              ../artifact/kernel/Image

          fi

          test -s \
            ../artifact/kernel/Image

          test -s \
            ../artifact/kernel/Image.lz4

          CONFIG_FILE="$(
            find out \
              -type f \
              -name .config |
            head -n1 ||
            true
          )"

          test -n \
            "${CONFIG_FILE}"

          cp \
            "${CONFIG_FILE}" \
            ../artifact/kernel/.config

          MODULE_SYMVERS="$(
            find out \
              -type f \
              -name Module.symvers |
            head -n1 ||
            true
          )"

          if [ -n "${MODULE_SYMVERS}" ]; then

            cp \
              "${MODULE_SYMVERS}" \
              ../artifact/kernel/Module.symvers

          fi

          find out \
            -type f \
            -name System.map \
            -exec cp {} ../artifact/kernel/ \; \
            || true

          find out \
            -type f \
            -name modules.builtin \
            -exec cp {} ../artifact/kernel/ \; \
            || true

          find out \
            -type f \
            -name modules.builtin.modinfo \
            -exec cp {} ../artifact/kernel/ \; \
            || true

          echo
          echo "=== FINAL BUILD CONFIG ==="

          grep -E \
            '^CONFIG_(KSU|KSU_SUSFS|TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|KPROBES|EXT4_FS|THREAD_INFO_IN_TASK|LTO_NONE|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|CFI_CLANG|CFI_PERMISSIVE|SHADOW_CALL_STACK|KASAN|KASAN_GENERIC|KASAN_SW_TAGS|KASAN_HW_TAGS|ARM64_TAGGED_ADDR_ABI|ARM64_MTE|ARM64_PAN|ARM64_LSE_ATOMICS|SLUB|OVERLAY_FS)=' \
            ../artifact/kernel/.config \
            || true

          for sym in \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_MODULES \
            CONFIG_MODVERSIONS \
            CONFIG_KALLSYMS
          do
            grep -q \
              "^${sym}=y$" \
              ../artifact/kernel/.config || {
                echo "::error::Missing ${sym} in actual build .config"
                exit 1
            }
          done

          ! grep -q \
            '^CONFIG_TRIM_UNUSED_KSYMS=y$' \
            ../artifact/kernel/.config

          ! grep -q \
            '^CONFIG_UNUSED_KSYMS_WHITELIST=' \
            ../artifact/kernel/.config

          {
            echo "=== Kernel version ==="

            make \
              -s \
              -C common \
              kernelversion

            echo
            echo "=== GKI commit ==="

            git -C common \
              rev-parse HEAD

            echo
            echo "=== KernelSU commit ==="

            git -C KernelSU \
              rev-parse HEAD

            echo
            echo "=== SUSFS commit ==="

            git -C susfs \
              rev-parse HEAD

            echo
            echo "=== KMI ==="

            grep -E \
              '^(KMI_ENFORCED|KMI_SYMBOL_LIST_STRICT_MODE|TRIM_NONLISTED_KMI|KMI_SYMBOL_LIST)=' \
              common/build.config.bg7n.ksu.susfs \
              || true

            echo
            echo "=== Critical configuration ==="

            grep -E \
              '^CONFIG_(KSU|KSU_SUSFS|TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST|MODULES|MODVERSIONS|KALLSYMS|KALLSYMS_ALL|THREAD_INFO_IN_TASK)=' \
              ../artifact/kernel/.config \
              || true

          } | tee \
            ../artifact/reports/kernel_verification.txt

          file \
            ../artifact/kernel/Image

          sha256sum \
            ../artifact/kernel/Image

          sha256sum \
            ../artifact/kernel/Image.lz4

      # ============================================================
      # 21 - SUSFS USERSPACE
      # ============================================================

      - name: 21 - Build SUSFS userspace helper and module
        shell: bash
        working-directory: gki/susfs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euxo pipefail

          export PATH="${ANDROID_NDK_HOME}:${PATH}"

          chmod +x \
            build_ksu_susfs_tool.sh \
            build_ksu_module.sh

          ./build_ksu_susfs_tool.sh
          ./build_ksu_module.sh

          test -d \
            ksu_module_susfs

          mkdir -p \
            ../../artifact/susfs

          cp -a \
            ksu_module_susfs \
            ../../artifact/susfs/susfs4ksu-module

          if [ -f \
            ksu_module_susfs.zip ]
          then

            cp \
              ksu_module_susfs.zip \
              ../../artifact/susfs/susfs4ksu.zip

          fi

      # ============================================================
      # 22 - MAGISKBOOT
      # ============================================================

      - name: 22 - Prepare host MagiskBoot
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            work \
            artifact/reports

          MAGISK_API="https://api.github.com/repos/topjohnwu/Magisk/releases/latest"

          echo "=== FETCH MAGISK RELEASE ==="

          MAGISK_URL="$(
            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: github-actions-bg7n-builder" \
              "${MAGISK_API}" |
            jq -r '
              .assets[]
              | select(.name | startswith("Magisk-"))
              | select(.name | endswith(".apk"))
              | .browser_download_url
            ' |
            head -n1
          )"

          test -n \
            "${MAGISK_URL}"

          echo \
            "${MAGISK_URL}" \
            | tee \
              artifact/reports/magisk_apk_url.txt

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "${MAGISK_URL}" \
            -o magisk.apk

          test -s \
            magisk.apk

          echo
          echo "=== APK ARCHITECTURES ==="

          unzip -Z1 \
            magisk.apk |
            grep -E \
              'lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/libmagiskboot\.so'

          # --------------------------------------------------------
          # Ubuntu runner is x86_64.
          # Extract x86_64 magiskboot, NOT ARM64.
          # --------------------------------------------------------

          if ! unzip -Z1 \
              magisk.apk |
              grep -qx \
                'lib/x86_64/libmagiskboot.so'
          then

            echo "::error::Magisk APK does not contain x86_64 magiskboot."
            exit 1

          fi

          rm -f \
            work/magiskboot \
            work/libmagiskboot.so

          unzip -j -o \
            magisk.apk \
            'lib/x86_64/libmagiskboot.so' \
            -d work

          test -s \
            work/libmagiskboot.so

          mv \
            work/libmagiskboot.so \
            work/magiskboot

          chmod \
            0755 \
            work/magiskboot

          echo "=== RUNNER ==="

          uname -m
          dpkg --print-architecture

          echo
          echo "=== MAGISKBOOT FILE ==="

          file \
            work/magiskboot

          file work/magiskboot |
            grep -E \
              'ELF 64-bit.*x86-64|x86-64'

          # --------------------------------------------------------
          # IMPORTANT:
          # Do NOT use "--help" as a required execution test.
          # We test the actual unpack action in step 23.
          # --------------------------------------------------------

          sha256sum \
            work/magiskboot \
            | tee \
              artifact/reports/magiskboot.sha256

          file \
            work/magiskboot \
            > artifact/reports/magiskboot.file.txt

      # ============================================================
      # 23 - REPACK STOCK BOOT
      # ============================================================

      - name: 23 - Repack stock BG7n boot with built kernel
        shell: bash
        run: |
          set -euxo pipefail

          MAGISKBOOT="${GITHUB_WORKSPACE}/work/magiskboot"
          STOCK_BOOT="${GITHUB_WORKSPACE}/stock/boot.img"
          BUILT_KERNEL="${GITHUB_WORKSPACE}/artifact/kernel/Image"
          WORK_BOOT="${GITHUB_WORKSPACE}/work/boot"

          mkdir -p \
            "${WORK_BOOT}" \
            "${GITHUB_WORKSPACE}/artifact/boot" \
            "${GITHUB_WORKSPACE}/artifact/reports"

          test -x \
            "${MAGISKBOOT}"

          test -s \
            "${STOCK_BOOT}"

          test -s \
            "${BUILT_KERNEL}"

          rm -rf \
            "${WORK_BOOT:?}"/*

          cp \
            "${STOCK_BOOT}" \
            "${WORK_BOOT}/boot.img"

          echo "=== STOCK BOOT ==="

          file \
            "${WORK_BOOT}/boot.img"

          echo
          echo "=== UNPACK STOCK BOOT ==="

          (
            cd "${WORK_BOOT}"

            "${MAGISKBOOT}" \
              unpack \
              boot.img
          )

          test -f \
            "${WORK_BOOT}/kernel"

          test -s \
            "${WORK_BOOT}/kernel"

          echo
          echo "=== ORIGINAL BOOT KERNEL ==="

          file \
            "${WORK_BOOT}/kernel"

          strings \
            "${WORK_BOOT}/kernel" |
            grep \
              -m1 \
              'Linux version' \
              || true

          # --------------------------------------------------------
          # Confirm expected Linux version.
          # --------------------------------------------------------

          if ! strings \
              "${WORK_BOOT}/kernel" |
              grep -q \
                "Linux version ${GKI_VERSION}"
          then

            echo "::error::Stock boot kernel does not match ${GKI_VERSION}."

            strings \
              "${WORK_BOOT}/kernel" |
              grep \
                -m5 \
                'Linux version' \
                || true

            exit 1

          fi

          echo
          echo "Stock boot matches Linux ${GKI_VERSION}."

          # --------------------------------------------------------
          # Replace only the kernel.
          # --------------------------------------------------------

          cp \
            "${BUILT_KERNEL}" \
            "${WORK_BOOT}/kernel"

          test -s \
            "${WORK_BOOT}/kernel"

          echo
          echo "=== NEW KERNEL ==="

          file \
            "${WORK_BOOT}/kernel"

          sha256sum \
            "${WORK_BOOT}/kernel"

          # --------------------------------------------------------
          # Repack.
          # --------------------------------------------------------

          echo
          echo "=== REPACK STOCK BOOT ==="

          (
            cd "${WORK_BOOT}"

            "${MAGISKBOOT}" \
              repack \
              boot.img

            test -s \
              new-boot.img
          )

          test -s \
            "${WORK_BOOT}/new-boot.img"

          cp \
            "${WORK_BOOT}/new-boot.img" \
            "${GITHUB_WORKSPACE}/artifact/boot/BG7n-KSU-SUSFS-boot.img"

          test -s \
            "${GITHUB_WORKSPACE}/artifact/boot/BG7n-KSU-SUSFS-boot.img"

          echo
          echo "=== GENERATED BOOT ==="

          file \
            "${GITHUB_WORKSPACE}/artifact/boot/BG7n-KSU-SUSFS-boot.img"

          sha256sum \
            "${GITHUB_WORKSPACE}/artifact/boot/BG7n-KSU-SUSFS-boot.img" |
            tee \
              "${GITHUB_WORKSPACE}/artifact/reports/generated_boot.sha256"

          echo
          echo "=== BOOT REPACK SUCCESS ==="

      # ============================================================
      # 24 - VERIFY GENERATED BOOT
      #
      # IMPORTANT FIX:
      #
      # The previous version used:
      #
      #   cd verify/generated
      #   ../work/magiskboot ...
      #
      # which pointed to:
      #
      #   verify/work/magiskboot
      #
      # instead of:
      #
      #   work/magiskboot
      #
      # This version uses absolute paths.
      # ============================================================

      - name: 24 - Verify generated boot image
        shell: bash
        run: |
          set -euxo pipefail

          GENERATED_BOOT="${GITHUB_WORKSPACE}/artifact/boot/BG7n-KSU-SUSFS-boot.img"
          BUILT_KERNEL="${GITHUB_WORKSPACE}/artifact/kernel/Image"
          MAGISKBOOT="${GITHUB_WORKSPACE}/work/magiskboot"
          VERIFY_DIR="${GITHUB_WORKSPACE}/verify/generated"

          # --------------------------------------------------------
          # Basic validation
          # --------------------------------------------------------

          test -s \
            "${GENERATED_BOOT}"

          test -s \
            "${BUILT_KERNEL}"

          test -x \
            "${MAGISKBOOT}"

          rm -rf \
            "${GITHUB_WORKSPACE}/verify"

          mkdir -p \
            "${VERIFY_DIR}"

          cp \
            "${GENERATED_BOOT}" \
            "${VERIFY_DIR}/boot.img"

          # --------------------------------------------------------
          # Absolute-path architecture check
          # --------------------------------------------------------

          echo "=== MAGISKBOOT ==="

          file \
            "${MAGISKBOOT}"

          file "${MAGISKBOOT}" |
            grep -E \
              'ELF 64-bit.*x86-64|x86-64'

          # --------------------------------------------------------
          # REAL MAGISKBOOT EXECUTION
          # --------------------------------------------------------

          echo
          echo "=== UNPACK GENERATED BOOT ==="

          (
            cd "${VERIFY_DIR}"

            "${MAGISKBOOT}" \
              unpack \
              boot.img
          )

          test -s \
            "${VERIFY_DIR}/kernel"

          echo
          echo "=== GENERATED BOOT KERNEL ==="

          file \
            "${VERIFY_DIR}/kernel"

          sha256sum \
            "${VERIFY_DIR}/kernel"

          # --------------------------------------------------------
          # Compare kernel inside generated boot with the kernel
          # built by the workflow.
          # --------------------------------------------------------

          BUILT_SHA="$(
            sha256sum \
              "${BUILT_KERNEL}" |
            awk '{print $1}'
          )"

          EXTRACTED_SHA="$(
            sha256sum \
              "${VERIFY_DIR}/kernel" |
            awk '{print $1}'
          )"

          echo
          echo "Built kernel SHA256:"
          echo "${BUILT_SHA}"

          echo
          echo "Extracted boot kernel SHA256:"
          echo "${EXTRACTED_SHA}"

          test \
            "${BUILT_SHA}" = \
            "${EXTRACTED_SHA}"

          # --------------------------------------------------------
          # Store verification hash
          # --------------------------------------------------------

          sha256sum \
            "${GENERATED_BOOT}" |
            tee \
              "${GITHUB_WORKSPACE}/artifact/reports/generated_boot_verified.sha256"

          echo
          echo "=========================================="
          echo "GENERATED BOOT VERIFICATION PASSED"
          echo "=========================================="

      # ============================================================
      # 25 - BUILD INFO
      # ============================================================

      - name: 25 - Create build manifest and hashes
        shell: bash
        run: |
          set -euxo pipefail

          SUSFS_COMMIT="$(
            git -C gki/susfs \
              rev-parse HEAD
          )"

          KSU_ACTUAL_COMMIT="$(
            git -C gki/KernelSU \
              rev-parse HEAD
          )"

          COMMON_COMMIT="$(
            git -C gki/common \
              rev-parse HEAD
          )"

          STOCK_BOOT_SHA="$(
            cut \
              -d' ' \
              -f1 \
              stock/boot.sha256
          )"

          cat > \
            artifact/BUILD_INFO.txt \
            <<EOF
          DEVICE=${DEVICE}

          GOOGLE_GKI_MANIFEST_BRANCH=${GKI_MANIFEST_BRANCH}
          GOOGLE_GKI_COMMON_TAG=${GKI_COMMON_TAG}
          GOOGLE_GKI_VERSION=${GKI_VERSION}
          GOOGLE_GKI_SHA=${GKI_SHA}
          COMMON_COMMIT=${COMMON_COMMIT}

          KERNELSU_REPO=${KSU_REPO}
          KERNELSU_COMMIT=${KSU_ACTUAL_COMMIT}

          SUSFS_REPO=${SUSFS_REPO}
          SUSFS_REF=${{ inputs.susfs_ref }}
          SUSFS_COMMIT=${SUSFS_COMMIT}

          BOOT_RELEASE_REPO=${BOOT_REPO}
          BOOT_RELEASE_TAG=${{ inputs.boot_release_tag }}

          STOCK_BOOT_SHA256=${STOCK_BOOT_SHA}

          CUSTOM_GKI_KERNEL=1

          KMI_ENFORCED=0
          KMI_SYMBOL_LIST_STRICT_MODE=0
          TRIM_NONLISTED_KMI=0

          CONFIG_TRIM_UNUSED_KSYMS=n
          CONFIG_UNUSED_KSYMS_WHITELIST=unset

          MAGISK_HOST_ARCH=x86_64
          MAGISK_BOOT_VARIANT=lib/x86_64/libmagiskboot.so
          EOF

          cp \
            gki/manifest.lock.xml \
            artifact/manifest.lock.xml

          cp \
            stock/boot.sha256 \
            artifact/reports/stock_boot.sha256

          cp \
            BG7n_final_defconfig \
            artifact/kernel/bg7n_final_defconfig

          find artifact \
            -type f \
            ! -name SHA256SUMS.txt \
            -print0 |
            sort -z |
            xargs -0 sha256sum \
            > artifact/SHA256SUMS.txt

      # ============================================================
      # 26 - PACKAGE
      # ============================================================

      - name: 26 - Package artifacts
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf \
            artifact/package

          mkdir -p \
            artifact/package

          cp \
            artifact/BUILD_INFO.txt \
            artifact/package/

          cp \
            artifact/SHA256SUMS.txt \
            artifact/package/

          cp -a \
            artifact/kernel \
            artifact/package/kernel

          cp -a \
            artifact/susfs \
            artifact/package/susfs

          cp -a \
            artifact/reports \
            artifact/package/reports

          cp -a \
            artifact/boot \
            artifact/package/boot

          cp \
            BG7n_stock_defconfig \
            artifact/package/

          cp \
            BG7n_final_defconfig \
            artifact/package/

          cat > \
            artifact/package/README.txt \
            <<EOF
          TECNO BG7n
          ========================================

          Google GKI:
            ${GKI_COMMON_TAG}
            Linux ${GKI_VERSION}
            Commit ${GKI_SHA}

          KernelSU:
            ${KSU_REPO}
            ${KSU_ACTUAL_COMMIT}

          SUSFS:
            ${SUSFS_REPO}
            ${{ inputs.susfs_ref }}

          Required:
            CONFIG_KSU=y
            CONFIG_KSU_SUSFS=y
            CONFIG_MODULES=y
            CONFIG_MODVERSIONS=y
            CONFIG_KALLSYMS=y

          KMI:
            KMI_ENFORCED=0
            KMI_SYMBOL_LIST_STRICT_MODE=0
            TRIM_NONLISTED_KMI=0

          Symbol trimming:
            CONFIG_TRIM_UNUSED_KSYMS=n
            CONFIG_UNUSED_KSYMS_WHITELIST=unset

          MagiskBoot:
            HOST=x86_64
            VARIANT=lib/x86_64/libmagiskboot.so

          Verification:
            The generated boot image is unpacked again.
            Its embedded kernel SHA256 must exactly match
            artifact/kernel/Image.

          IMPORTANT:
            This is a custom KernelSU/SUSFS kernel.

            It is NOT an unmodified Google-certified GKI image.

            Keep the original stock boot.img as recovery backup.

          Generated boot:
            boot/BG7n-KSU-SUSFS-boot.img

          Reports:
            reports/kernel_verification.txt
            reports/generated_boot.sha256
            reports/generated_boot_verified.sha256
            reports/stock_boot.sha256
            reports/magiskboot.sha256

          Checksums:
            SHA256SUMS.txt
          EOF

          (
            cd artifact/package

            zip \
              -r \
              ../../BG7n_GKI_r3_KSU_SUSFS_artifacts.zip \
              .
          )

          test -s \
            BG7n_GKI_r3_KSU_SUSFS_artifacts.zip

      # ============================================================
      # 27 - UPLOAD
      # ============================================================

      - name: 27 - Upload complete artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-GKI-r3-KSU-SUSFS
          path: |
            BG7n_GKI_r3_KSU_SUSFS_artifacts.zip
            artifact/
          if-no-files-found: error
          retention-days: 30

name: Build BG7n SUSFS + KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libssl-dev \
            libelf-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            curl \
            xz-utils \
            zstd \
            device-tree-compiler \
            file

      - name: Fetch exact Android common kernel
        env:
          KERNEL_COMMIT: d09ef2e980e0974a0d6dfe762e29fff118db7f46
        run: |
          set -e

          git init kernel
          cd kernel

          git remote add origin \
            https://android.googlesource.com/kernel/common

          git fetch \
            --depth=1 \
            origin \
            "$KERNEL_COMMIT"

          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"

          echo "Kernel commit:"
          git rev-parse HEAD

      - name: Prepare workspace
        run: |
          set -e

          rm -rf out
          rm -rf work
          rm -rf tools
          rm -rf bootwork

          mkdir -p out
          mkdir -p work
          mkdir -p tools
          mkdir -p bootwork

      - name: Verify required project files
        run: |
          set -e

          test -s KernelSU-Next.tar.gz
          test -s susfs4ksu-gki-android12-5.10.tar.gz
          test -s stock.config
          test -s patches-susfs-bg7n-legacy-reference.patch
          test -s 50_add_susfs_in_gki-android12-5.10.patch

      - name: Extract bundled KernelSU-Next and SUSFS
        run: |
          set -e

          tar -xzf \
            KernelSU-Next.tar.gz \
            -C work

          tar -xzf \
            susfs4ksu-gki-android12-5.10.tar.gz \
            -C work

          KSU_DIR="$(
            find work \
              -maxdepth 1 \
              -type d \
              -name 'KernelSU-Next-*' \
              | head -1
          )"

          SUSFS_DIR="work/susfs4ksu-gki-android12-5.10"

          test -d "$KSU_DIR"
          test -d "$SUSFS_DIR"

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          echo "SUSFS_DIR=$SUSFS_DIR" >> "$GITHUB_ENV"

      - name: Verify bundled KernelSU-Next
        run: |
          set -euo pipefail

          test -f \
            "$KSU_DIR/kernel/setup.sh"

          test -f \
            "$KSU_DIR/kernel/Kconfig"

          test -f \
            "$KSU_DIR/kernel/Kbuild"

          for symbol in \
            KSU_SUSFS \
            KSU_SUSFS_SUS_PATH \
            KSU_SUSFS_SUS_MOUNT \
            KSU_SUSFS_SUS_KSTAT \
            KSU_SUSFS_SPOOF_UNAME \
            KSU_SUSFS_ENABLE_LOG \
            KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            KSU_SUSFS_OPEN_REDIRECT \
            KSU_SUSFS_SUS_MAP; do

            grep -Eq \
              "^config[[:space:]]+${symbol}([[:space:]]|$)" \
              "$KSU_DIR/kernel/Kconfig"

          done

          grep -q \
            'CONFIG_KSU_SUSFS' \
            "$KSU_DIR/kernel/Kbuild"

          echo "Bundled KernelSU-Next SUSFS feature set verified."

      - name: Verify SUSFS v2.2.0 source
        run: |
          set -e

          test -f \
            "$SUSFS_DIR/kernel_patches/fs/susfs.c"

          test -f \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h"

          test -f \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h"

          grep -Eq \
            '^#define SUSFS_VERSION[[:space:]]+"v2\.2\.0"' \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h"

          echo "SUSFS v2.2.0 verified."

      - name: Install bundled KernelSU-Next
        run: |
          set -e

          cd kernel

          bash \
            "$GITHUB_WORKSPACE/$KSU_DIR/kernel/setup.sh"

          test -d \
            drivers/kernelsu

          echo "KernelSU-Next installed."

      - name: Verify BG7n patch compatibility
        run: |
          set -e

          test -s \
            patches-susfs-bg7n-legacy-reference.patch

          cd kernel

          patch \
            --dry-run \
            -p1 \
            --fuzz=0 \
            < "$GITHUB_WORKSPACE/patches-susfs-bg7n-legacy-reference.patch"

          echo "BG7n patch dry-run passed."

      - name: Apply BG7n kernel patch
        run: |
          set -e

          cd kernel

          patch \
            -p1 \
            --fuzz=0 \
            < "$GITHUB_WORKSPACE/patches-susfs-bg7n-legacy-reference.patch"

          test -f \
            fs/susfs.c

          grep -q \
            'obj-$(CONFIG_KSU_SUSFS) += susfs.o' \
            fs/Makefile

          if find . \
            \( -name '*.rej' -o -name '*.orig' \) \
            -print \
            | grep -q .; then

            echo "Patch collateral files detected."
            find . \
              \( -name '*.rej' -o -name '*.orig' \) \
              -print

            exit 1
          fi

          echo "BG7n patch applied successfully."

      - name: Install SUSFS source files
        run: |
          set -e

          cp \
            "$SUSFS_DIR/kernel_patches/fs/susfs.c" \
            kernel/fs/susfs.c

          cp \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" \
            kernel/include/linux/susfs.h

          cp \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" \
            kernel/include/linux/susfs_def.h

          test -s \
            kernel/fs/susfs.c

          test -s \
            kernel/include/linux/susfs.h

          test -s \
            kernel/include/linux/susfs_def.h

          grep -Eq \
            '^#define SUSFS_VERSION[[:space:]]+"v2\.2\.0"' \
            kernel/include/linux/susfs.h

      - name: Prepare kernel config
        run: |
          set -e

          test -f \
            kernel/scripts/config

          chmod +x \
            kernel/scripts/config

          cp \
            stock.config \
            kernel/.config

          test -s \
            kernel/.config

          cd kernel

          C="$PWD/scripts/config"

          "$C" \
            --enable \
            CONFIG_THREAD_INFO_IN_TASK

          "$C" \
            --enable \
            CONFIG_KSU

          "$C" \
            --enable \
            CONFIG_KSU_SUSFS

          "$C" \
            --enable \
            CONFIG_KSU_SUSFS_SUS_PATH

          "$C" \
            --enable \
            CONFIG_KSU_SUSFS_SUS_MOUNT

          "$C" \
            --enable \
            CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_NATIVE_APP

          "$C" \
            --enable \
            CONFIG_KSU_SUSFS_SUS_KSTAT

          "$C" \
            --enable \
            CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT

          "$C" \
            --enable \
            CONFIG_KSU_SUSFS_SUS_MAP

          "$C" \
            --enable \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            || true

          "$C" \
            --enable \
            CONFIG_KSU_SUSFS_ENABLE_LOG \
            || true

          "$C" \
            --enable \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            || true

          "$C" \
            --enable \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            || true

          "$C" \
            --enable \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            || true

          "$C" \
            --disable \
            CONFIG_TRIM_UNUSED_KSYMS \
            || true

          "$C" \
            --disable \
            CONFIG_UNUSED_KSYMS \
            || true

      - name: Resolve final Kconfig
        run: |
          set -e

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            olddefconfig

          test -s \
            out/.config

      - name: Verify final config
        run: |
          set -e

          CFG="$GITHUB_WORKSPACE/out/.config"

          required_y=(
            CONFIG_THREAD_INFO_IN_TASK
            CONFIG_KSU
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          for symbol in "${required_y[@]}"; do
            grep -qx \
              "${symbol}=y" \
              "$CFG"
          done

          optional_y=(
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
          )

          for symbol in "${optional_y[@]}"; do
            grep -qx \
              "${symbol}=y" \
              "$CFG" \
              || true
          done

          cp \
            "$CFG" \
            "$GITHUB_WORKSPACE/final.config"

          echo "Final kernel configuration verified."

      - name: Build arm64 Image
        id: kernel_build
        continue-on-error: true
        run: |
          set -o pipefail

          make \
            -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=frame-larger-than" \
            -j"$(nproc)" \
            Image \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/kernel-build.log"

          STATUS=${PIPESTATUS[0]}

          echo "Kernel build status: $STATUS"

          exit "$STATUS"

      - name: Verify kernel and SUSFS
        if: steps.kernel_build.outcome == 'success'
        run: |
          set -e

          test -s \
            out/arch/arm64/boot/Image

          test -s \
            out/.config

          test -s \
            out/vmlinux

          test -s \
            out/fs/susfs.o

          grep -qx \
            'CONFIG_KSU=y' \
            out/.config

          grep -qx \
            'CONFIG_KSU_SUSFS=y' \
            out/.config

          SUSFS_SYMBOLS="$(
            llvm-nm \
              out/vmlinux \
              2>/dev/null \
              | grep -i \
              susfs \
              || true
          )"

          test -n \
            "$SUSFS_SYMBOLS"

          echo "$SUSFS_SYMBOLS" \
            | head -50

          echo "Kernel and SUSFS verification passed."

      - name: Stop if kernel failed
        if: steps.kernel_build.outcome != 'success'
        run: |
          echo "Kernel build failed."
          exit 1

      - name: Download official Magisk APK
        run: |
          set -e

          MAGISK_URL="$(
            curl \
              -fsSL \
              https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            | python3 -c '
import json
import sys

data = json.load(sys.stdin)

urls = [
    a["browser_download_url"]
    for a in data.get("assets", [])
    if a["name"].startswith("Magisk-")
    and a["name"].endswith(".apk")
    and "debug" not in a["name"].lower()
]

if not urls:
    raise SystemExit("No official Magisk APK found")

print(urls[0])
'
          )"

          test -n \
            "$MAGISK_URL"

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            -o tools/Magisk.apk \
            "$MAGISK_URL"

          test -s \
            tools/Magisk.apk

      - name: Extract magiskboot
        run: |
          set -e

          unzip -p \
            tools/Magisk.apk \
            lib/x86_64/libmagiskboot.so \
            > tools/magiskboot

          test -s \
            tools/magiskboot

          chmod +x \
            tools/magiskboot

          file \
            tools/magiskboot

      - name: Download stock boot image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: stock-boot
        run: |
          set -e

          rm -rf \
            bootwork

          mkdir -p \
            bootwork

          gh release download \
            "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "boot.img.zip" \
            --dir bootwork

          test -s \
            bootwork/boot.img.zip

          unzip \
            -o \
            bootwork/boot.img.zip \
            -d bootwork

          test -s \
            bootwork/boot.img

      - name: Unpack stock boot
        run: |
          set -e

          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            unpack boot.img

          test -s \
            kernel

          file \
            kernel

      - name: Replace kernel
        run: |
          set -e

          cp \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" \
            bootwork/kernel

          test -s \
            bootwork/kernel

      - name: Repack boot image
        run: |
          set -e

          cd bootwork

          "$GITHUB_WORKSPACE/tools/magiskboot" \
            repack boot.img

          test -s \
            new-boot.img

          mv \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

          test -s \
            "$GITHUB_WORKSPACE/boot-BG7n-SUSFS-KSU.img"

      - name: Verify repacked boot image
        run: |
          set -e

          test -s \
            boot-BG7n-SUSFS-KSU.img

          file \
            boot-BG7n-SUSFS-KSU.img

          ls -lh \
            boot-BG7n-SUSFS-KSU.img

          sha256sum \
            boot-BG7n-SUSFS-KSU.img

      - name: Package SUSFS module source
        run: |
          set -e

          cd "$SUSFS_DIR"

          tar -czf \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz" \
            ksu_module_susfs

          test -s \
            "$GITHUB_WORKSPACE/susfs-module-source.tar.gz"

      - name: Verify final files
        run: |
          set -e

          test -s \
            boot-BG7n-SUSFS-KSU.img

          test -s \
            out/arch/arm64/boot/Image

          test -s \
            final.config

          test -s \
            susfs-module-source.tar.gz

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log-${{ github.run_number }}
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-SUSFS-KSU-full-${{ github.run_number }}
          path: |
            boot-BG7n-SUSFS-KSU.img
            out/arch/arm64/boot/Image
            final.config
            susfs-module-source.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload boot image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boot-BG7n-SUSFS-KSU-${{ github.run_number }}
          path: boot-BG7n-SUSFS-KSU.img
          if-no-files-found: error
          retention-days: 14

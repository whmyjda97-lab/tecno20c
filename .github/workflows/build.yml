name: "Build BG7n GKI r3 + KernelSU + SUSFS"

"on":
  workflow_dispatch:
    inputs:
      susfs_ref:
        description: "Pinned SUSFS commit (v2.2.0)"
        required: false
        default: "be08face56c347e7ba9c4fb420c2463598a14f5d"
      make_jobs:
        description: "Kernel build jobs"
        required: false
        default: "4"
      boot_release_tag:
        description: "GitHub Release tag containing stock BG7n boot.img.zip"
        required: false
        default: "stock-boot"

permissions:
  contents: read

concurrency:
  group: bg7n-${{ github.ref }}
  cancel-in-progress: true

env:
  # The release tag exists in kernel/common, not in kernel/manifest.
  # Therefore repo-init uses the dated manifest branch, then common is pinned
  # explicitly to the exact r3 tag/commit.
  GKI_MANIFEST_BRANCH: common-android12-5.10-2025-06
  GKI_COMMON_TAG: android12-5.10-2025-06_r3
  GKI_VERSION: "5.10.237"
  GKI_SHA: d09ef2e980e0974a0d6dfe762e29fff118db7f46
  # Exact KernelSU tree whose Git blob pre-images match the SUSFS patch.
  KSU_REPO: https://github.com/5ec1cff/KernelSU.git
  KSU_COMMIT: 3be1013dbda6ebab14e7fcd231bcbae5ce6425ff
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  BOOT_REPO: whmyjda97-lab/tecno20c
  DEVICE: BG7n
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             bc bison build-essential ca-certificates ccache curl flex git             gnupg gperf libelf-dev liblz4-tool libncurses5-dev libssl-dev             lz4 openssl python3 python3-distutils rsync unzip zip             device-tree-compiler file patchelf clang llvm lld dwarves pahole             android-sdk-libsparse-utils pkg-config libdw-dev libunwind-dev jq

          clang --version
          ld.lld --version
          python3 --version

      - name: Install Android NDK for SUSFS userspace helper
        shell: bash
        run: |
          set -euxo pipefail

          # NDK 25.2.9519653 == Android NDK r25b.
          # Download the NDK archive directly so this job does not depend on
          # Java/sdkmanager compatibility.
          NDK_VERSION="25.2.9519653"
          NDK_ARCHIVE="android-ndk-r25b-linux.zip"
          SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          NDK_ROOT="${SDK_ROOT}/ndk/${NDK_VERSION}"

          rm -rf "${SDK_ROOT}"
          mkdir -p "${SDK_ROOT}"

          curl -fL \
            "https://dl.google.com/android/repository/${NDK_ARCHIVE}" \
            -o "${RUNNER_TEMP}/${NDK_ARCHIVE}"

          unzip -q \
            "${RUNNER_TEMP}/${NDK_ARCHIVE}" \
            -d "${RUNNER_TEMP}/android-ndk"

          mkdir -p "${SDK_ROOT}/ndk"
          test -d "${RUNNER_TEMP}/android-ndk/android-ndk-r25b"
          mv \
            "${RUNNER_TEMP}/android-ndk/android-ndk-r25b" \
            "${NDK_ROOT}"

          test -x "${NDK_ROOT}/ndk-build"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${NDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${NDK_ROOT}" >> "${GITHUB_PATH}"

          echo "=== Android NDK ==="
          echo "ANDROID_NDK_HOME=${NDK_ROOT}"
          "${NDK_ROOT}/ndk-build" --version

      - name: Fetch exact stock BG7n boot.img from Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOT_RELEASE_TAG: ${{ inputs.boot_release_tag }}
        run: |
          set -euo pipefail

          rm -rf stock-release stock
          mkdir -p stock-release stock

          gh release view "${BOOT_RELEASE_TAG}"             --repo "${BOOT_REPO}"             --json tagName,name,assets             --jq '.tagName + " | " + .name + " | assets=" + ((.assets|length)|tostring)'

          # Do not assume the uploaded asset filename. GitHub reports the release
          # currently has assets, and the asset name may differ from boot.img.zip.
          # Download every release asset, then select the ZIP that actually contains
          # exactly one boot.img.
          gh release download "${BOOT_RELEASE_TAG}"             --repo "${BOOT_REPO}"             --dir stock-release

          echo "=== Downloaded release assets ==="
          find stock-release -maxdepth 1 -type f -printf '%f\n' | sort

          CANDIDATES=()
          while IFS= read -r -d '' z; do
            mapfile -t ENTRIES < <(
              unzip -Z1 "$z" 2>/dev/null |
              awk 'tolower($0) ~ /(^|\/)boot\.img$/ {print}'
            )
            if [ "${#ENTRIES[@]}" -eq 1 ]; then
              CANDIDATES+=("$z")
              echo "Boot candidate: $z -> ${ENTRIES[0]}"
            fi
          done < <(find stock-release -maxdepth 1 -type f -iname '*.zip' -print0)

          test "${#CANDIDATES[@]}" -eq 1 || {
            echo "::error::Expected exactly one release ZIP containing exactly one boot.img."
            echo "Candidates found: ${#CANDIDATES[@]}"
            printf '%s\n' "${CANDIDATES[@]:-<none>}"
            echo "Release asset names:"
            find stock-release -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          }

          BOOT_ASSET="${CANDIDATES[0]}"
          mapfile -t BOOT_ENTRIES < <(
            unzip -Z1 "${BOOT_ASSET}" |
            awk 'tolower($0) ~ /(^|\/)boot\.img$/ {print}'
          )

          unzip -p "${BOOT_ASSET}" "${BOOT_ENTRIES[0]}" > stock/boot.img
          test -s stock/boot.img

          file stock/boot.img
          sha256sum stock/boot.img | tee stock/boot.sha256

      - name: Verify input config
        shell: bash
        run: |
          set -euxo pipefail
          test -s BG7n_stock_defconfig
          grep -q '^CONFIG_MODULES=y$' BG7n_stock_defconfig
          grep -q '^CONFIG_MODVERSIONS=y$' BG7n_stock_defconfig

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o repo
          chmod +x repo
          sudo install -m 0755 repo /usr/local/bin/repo
          repo --version

      - name: Sync exact Google GKI r3 source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf gki
          mkdir -p gki
          cd gki

          # IMPORTANT:
          # android12-5.10-2025-06_r3 is a tag in kernel/common, while
          # kernel/manifest exposes the dated manifest as a branch.
          repo init             -u https://android.googlesource.com/kernel/manifest             -b "${GKI_MANIFEST_BRANCH}"             --depth=1

          repo sync -c -j2 --no-tags --no-clone-bundle

          test -d common
          test -f common/Makefile

          echo "=== manifest-managed common remotes ==="
          git -C common remote -v || true

          # Pin only kernel/common to the exact r3 release tag.
          # repo's manifest-managed checkout may not expose a usable "origin"
          # remote, so fetch the tag directly from kernel/common.
          git -C common fetch --no-tags \
            https://android.googlesource.com/kernel/common.git \
            "refs/tags/${GKI_COMMON_TAG}:refs/tags/${GKI_COMMON_TAG}"

          git -C common checkout --detach "refs/tags/${GKI_COMMON_TAG}"

          COMMON_COMMIT="$(git -C common rev-parse HEAD)"
          echo "COMMON_COMMIT=${COMMON_COMMIT}"

          test "${COMMON_COMMIT}" = "${GKI_SHA}"
          test "$(make -s -C common kernelversion)" = "${GKI_VERSION}"

          repo manifest -r > manifest.lock.xml

          {
            echo "GKI_MANIFEST_BRANCH=${GKI_MANIFEST_BRANCH}"
            echo "GKI_COMMON_TAG=${GKI_COMMON_TAG}"
            echo "GKI_VERSION=${GKI_VERSION}"
            echo "GKI_SHA=${GKI_SHA}"
            echo "COMMON_COMMIT=${COMMON_COMMIT}"
          } | tee ../gki_identity.txt

      - name: Install exact KernelSU patch-base tree
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          rm -rf KernelSU
          git clone --no-tags --filter=blob:none "${KSU_REPO}" KernelSU
          git -C KernelSU fetch --no-tags origin "${KSU_COMMIT}"
          git -C KernelSU checkout --detach "${KSU_COMMIT}"

          ACTUAL_KSU_COMMIT="$(git -C KernelSU rev-parse HEAD)"
          test "${ACTUAL_KSU_COMMIT}" = "${KSU_COMMIT}"

          echo "KERNELSU_REPO=${KSU_REPO}" | tee ../kernelsu_identity.txt
          echo "KERNELSU_COMMIT=${ACTUAL_KSU_COMMIT}" | tee -a ../kernelsu_identity.txt

          # Exact Git blob pre-images from SUSFS 10_enable_susfs_for_ksu.patch.
          test "$(git -C KernelSU hash-object kernel/Kbuild | cut -c1-8)" = "cc3610a8"
          test "$(git -C KernelSU hash-object kernel/Kconfig | cut -c1-8)" = "88e22811"
          test "$(git -C KernelSU hash-object kernel/core/init.c | cut -c1-8)" = "09b290a9"

          echo "Exact KernelSU/SUSFS patch-base verified."
      - name: Clone and verify pinned SUSFS
        shell: bash
        working-directory: gki
        env:
          SUSFS_REF: ${{ inputs.susfs_ref }}
        run: |
          set -euxo pipefail

          git clone --no-tags --filter=blob:none "${SUSFS_REPO}" susfs
          git -C susfs fetch --no-tags origin "${SUSFS_REF}"
          git -C susfs checkout --detach "${SUSFS_REF}"

          SUSFS_COMMIT="$(git -C susfs rev-parse HEAD)"
          test "${SUSFS_COMMIT}" = "${SUSFS_REF}"
          echo "SUSFS_COMMIT=${SUSFS_COMMIT}" | tee ../susfs_identity.txt

          test -f susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          test -f susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch
          test -d susfs/kernel_patches/fs
          test -d susfs/kernel_patches/include/linux
          test -f susfs/ksu_module_susfs/module.prop

          cat susfs/ksu_module_susfs/module.prop
          grep -Eq '^version=v?2\.2\.0($|[.-])' susfs/ksu_module_susfs/module.prop || {
            echo "::error::Pinned SUSFS ref is not v2.2.0."
            exit 1
          }

      - name: Apply SUSFS patches on exact matching base
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cp susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch common/
          cp -a susfs/kernel_patches/fs/. common/fs/
          cp -a susfs/kernel_patches/include/linux/. common/include/linux/

          echo "=== KernelSU SUSFS patch ==="
          (
            cd KernelSU
            patch --batch --forward -p1 < 10_enable_susfs_for_ksu.patch
          )

          # Do not use `git diff --check` here: the upstream SUSFS patch
          # intentionally carries a few whitespace changes.  A whitespace
          # warning is not a patch-application conflict.
          test -z "$(git -C KernelSU status --porcelain | grep '^UU ' || true)"

          echo "=== GKI SUSFS patch ==="
          (
            cd common
            patch --batch --forward -p1 < 50_add_susfs_in_gki-android12-5.10.patch
          )

          # Same rule for the GKI patch: validate application/conflicts,
          # not cosmetic whitespace warnings.
          test -z "$(git -C common status --porcelain | grep '^UU ' || true)"

          echo "SUSFS patches applied without merge conflicts."
          echo "KernelSU changed files:"
          git -C KernelSU status --short
          echo "GKI changed files:"
          git -C common status --short
      - name: Generate BG7n KSU + SUSFS defconfig
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          cp arch/arm64/configs/bg7n_stock_defconfig arch/arm64/configs/bg7n_defconfig

          cat >> arch/arm64/configs/bg7n_defconfig <<'CFG'

          # KernelSU / SUSFS
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y

          # Required module/KMI baseline
          CONFIG_MODULES=y
          CONFIG_MODVERSIONS=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_OVERLAY_FS=y
          CFG

          while read -r sym; do
            case "${sym}" in
              KSU_SUSFS*)
                echo "CONFIG_${sym}=y" >> arch/arm64/configs/bg7n_defconfig
                ;;
            esac
          done < <(
            grep -RhoE '^config[[:space:]]+KSU_SUSFS[A-Z0-9_]*'               ../../KernelSU/kernel ../../common/fs ../../common/include/linux               2>/dev/null |
            awk '{print $2}' |
            sort -u
          )

          tac arch/arm64/configs/bg7n_defconfig |
            awk '!seen[$0]++' |
            tac > /tmp/bg7n_defconfig.clean
          mv /tmp/bg7n_defconfig.clean arch/arm64/configs/bg7n_defconfig

          grep -RhsE '^config[[:space:]]+KSU(_SUSFS)?'             ../../KernelSU/kernel ../../common/fs ../../common/include/linux             2>/dev/null | head -100 || true

      - name: Prepare GKI build config
        shell: bash
        working-directory: gki/common
        run: |
          set -euxo pipefail

          cat > build.config.bg7n.ksu.susfs <<'CFG'
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.gki.aarch64

          DEFCONFIG=bg7n_defconfig

          # Keep Google's GKI/KMI machinery enabled.
          KMI_ENFORCED=1
          KMI_SYMBOL_LIST_STRICT_MODE=1
          TRIM_NONLISTED_KMI=1

          MAKE_GOALS="${MAKE_GOALS}
          modules
          "
          CFG

          cat build.config.bg7n.ksu.susfs

      - name: Build kernel with GKI KMI enforcement
        shell: bash
        working-directory: gki
        env:
          MAKE_JOBS: ${{ inputs.make_jobs }}
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-actions
        run: |
          set -euxo pipefail
          export MAKEFLAGS="-j${MAKE_JOBS}"

          BUILD_CONFIG=common/build.config.bg7n.ksu.susfs             LTO=full             ./build/build.sh

      - name: Verify kernel and collect ABI/KMI evidence
        shell: bash
        working-directory: gki
        run: |
          set -euxo pipefail

          mkdir -p ../artifact/kernel ../artifact/reports

          IMAGE_LZ4="$(find out -type f -path '*/dist/Image.lz4' | head -n1 || true)"
          IMAGE="$(find out -type f -path '*/dist/Image' | head -n1 || true)"

          test -n "${IMAGE_LZ4}" || {
            echo "::error::Image.lz4 missing"
            exit 1
          }

          cp "${IMAGE_LZ4}" ../artifact/kernel/Image.lz4

          if [ -n "${IMAGE}" ]; then
            cp "${IMAGE}" ../artifact/kernel/Image
          else
            lz4 -d -f "${IMAGE_LZ4}" ../artifact/kernel/Image
          fi

          CONFIG_FILE="$(find out -type f -name .config | head -n1 || true)"
          test -n "${CONFIG_FILE}"
          cp "${CONFIG_FILE}" ../artifact/kernel/.config

          find out -type f -name System.map -exec cp {} ../artifact/kernel/ \; || true
          find out -type f -name modules.builtin -exec cp {} ../artifact/kernel/ \; || true
          find out -type f -name modules.builtin.modinfo -exec cp {} ../artifact/kernel/ \; || true

          if [ -f Module.symvers ]; then
            cp Module.symvers ../artifact/kernel/Module.symvers
          else
            find out -type f -name Module.symvers -exec cp {} ../artifact/kernel/Module.symvers \; || true
          fi

          file ../artifact/kernel/Image

          {
            echo "=== Kernel version ==="
            make -s -C common kernelversion
            echo
            echo "=== Required config ==="
            for s in CONFIG_ARM64 CONFIG_MODULES CONFIG_MODVERSIONS CONFIG_KALLSYMS CONFIG_KSU CONFIG_KSU_SUSFS; do
              grep "^${s}=" ../artifact/kernel/.config || true
            done
            echo
            echo "=== KSU/SUSFS config ==="
            grep '^CONFIG_KSU' ../artifact/kernel/.config || true
            echo
            echo "=== KMI enforcement ==="
            grep -E '^(KMI_ENFORCED|KMI_SYMBOL_LIST_STRICT_MODE|TRIM_NONLISTED_KMI)='               common/build.config.bg7n.ksu.susfs || true
            echo
            echo "=== Module symbol count ==="
            [ -f ../artifact/kernel/Module.symvers ] && wc -l ../artifact/kernel/Module.symvers || true
            echo
            echo "=== Commits ==="
            echo "GKI=$(git -C common rev-parse HEAD)"
            echo "KernelSU=$(git -C KernelSU rev-parse HEAD)"
            echo "SUSFS=$(git -C susfs rev-parse HEAD)"
          } | tee ../artifact/reports/kernel_verification.txt

          grep -q '^CONFIG_KSU=y$' ../artifact/kernel/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' ../artifact/kernel/.config
          grep -q '^CONFIG_MODULES=y$' ../artifact/kernel/.config
          grep -q '^CONFIG_MODVERSIONS=y$' ../artifact/kernel/.config

      - name: Build SUSFS userspace helper and KernelSU module
        shell: bash
        working-directory: gki/susfs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euxo pipefail

          export PATH="${ANDROID_NDK_HOME}:${PATH}"

          chmod +x build_ksu_susfs_tool.sh build_ksu_module.sh

          ./build_ksu_susfs_tool.sh
          ./build_ksu_module.sh

          test -d ksu_module_susfs

          mkdir -p ../../artifact/susfs
          cp -a ksu_module_susfs ../../artifact/susfs/susfs4ksu-module

          if [ -f ksu_module_susfs.zip ]; then
            cp ksu_module_susfs.zip ../../artifact/susfs/susfs4ksu.zip
          fi

      - name: Repack stock boot.img with built kernel
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p work/boot artifact/boot
          cp stock/boot.img work/boot/boot.img

          MAGISK_API="https://api.github.com/repos/topjohnwu/Magisk/releases/latest"
          MAGISK_URL="$(
            curl -fsSL               -H "Accept: application/vnd.github+json"               "${MAGISK_API}" |
            jq -r '
              .assets[]
              | select(.name | startswith("Magisk-"))
              | select(.name | endswith(".apk"))
              | .browser_download_url
            ' |
            head -n1
          )"

          test -n "${MAGISK_URL}"
          echo "Magisk URL: ${MAGISK_URL}"
          curl -fL "${MAGISK_URL}" -o magisk.apk

          unzip -j -o magisk.apk             'lib/arm64-v8a/libmagiskboot.so'             -d work

          mv work/libmagiskboot.so work/magiskboot
          chmod +x work/magiskboot

          (
            cd work/boot
            ../magiskboot unpack boot.img
            test -f kernel
            test -f ../../artifact/kernel/Image
            cp ../../artifact/kernel/Image kernel
            ../magiskboot repack boot.img
            test -s new-boot.img
          )

          cp work/boot/new-boot.img artifact/boot/BG7n-KSU-SUSFS-boot.img
          file artifact/boot/BG7n-KSU-SUSFS-boot.img
          sha256sum artifact/boot/BG7n-KSU-SUSFS-boot.img             | tee artifact/reports/generated_boot.sha256

      - name: Create build manifest and hashes
        shell: bash
        run: |
          set -euxo pipefail

          SUSFS_COMMIT="$(git -C gki/susfs rev-parse HEAD)"
          KSU_COMMIT="$(git -C gki/KernelSU rev-parse HEAD)"
          COMMON_COMMIT="$(git -C gki/common rev-parse HEAD)"

          cat > artifact/BUILD_INFO.txt <<EOF
          DEVICE=${DEVICE}
          GOOGLE_GKI_MANIFEST_BRANCH=${GKI_MANIFEST_BRANCH}
          GOOGLE_GKI_COMMON_TAG=${GKI_COMMON_TAG}
          GOOGLE_GKI_VERSION=${GKI_VERSION}
          GOOGLE_GKI_SHA=${GKI_SHA}
          COMMON_COMMIT=${COMMON_COMMIT}
          KERNELSU_REPO=${KSU_REPO}
          KERNELSU_COMMIT=${KSU_COMMIT}
          KERNELSU_COMMIT=${KSU_COMMIT}
          SUSFS_REF=${{ inputs.susfs_ref }}
          SUSFS_COMMIT=${SUSFS_COMMIT}
          BOOT_RELEASE_REPO=${BOOT_REPO}
          BOOT_RELEASE_TAG=${{ inputs.boot_release_tag }}
          STOCK_BOOT_SHA256=$(cut -d' ' -f1 stock/boot.sha256)
          EOF

          cp gki/manifest.lock.xml artifact/manifest.lock.xml
          cp stock/boot.sha256 artifact/reports/stock_boot.sha256

          find artifact -type f ! -name SHA256SUMS.txt -print0 |
            sort -z |
            xargs -0 sha256sum > artifact/SHA256SUMS.txt

      - name: Package artifacts
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf artifact/package
          mkdir -p artifact/package

          cp artifact/BUILD_INFO.txt artifact/package/
          cp artifact/SHA256SUMS.txt artifact/package/
          cp -a artifact/kernel artifact/package/kernel
          cp -a artifact/susfs artifact/package/susfs
          cp -a artifact/reports artifact/package/reports

          if [ -d artifact/boot ]; then
            cp -a artifact/boot artifact/package/boot
          fi

          cp BG7n_stock_defconfig artifact/package/

          cat > artifact/package/README.txt <<EOF
          TECNO BG7n / MT6765

          Google GKI:
            manifest branch ${GKI_MANIFEST_BRANCH}
            common tag ${GKI_COMMON_TAG}
            Linux ${GKI_VERSION}
            Commit ${GKI_SHA}

          KernelSU:
            exact commit ${KSU_COMMIT}

          SUSFS:
            pinned commit ${{ inputs.susfs_ref }}

          Stock boot:
            ${BOOT_REPO}
            Release tag ${{ inputs.boot_release_tag }}

          IMPORTANT:
            Review kernel_verification.txt and ABI/KMI evidence before flashing.
            Keep the original stock boot.img as the recovery path.
          EOF

          (
            cd artifact/package
            zip -r ../../BG7n_GKI_r3_KSU_SUSFS_artifacts.zip .
          )

      - name: Upload complete artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-GKI-r3-KSU-v3.2.5-SUSFS
          path: |
            BG7n_GKI_r3_KSU_SUSFS_artifacts.zip
            artifact/
          if-no-files-found: error
          retention-days: 30
